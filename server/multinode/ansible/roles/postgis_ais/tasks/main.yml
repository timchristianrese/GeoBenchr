# FIX: MobilityDB's read queries (countActiveCrossingsNearIsland, crossingsAroundHarbour,
# CrossingsActiveAtGivenHourOfDay, HarbourActivityInPeriod, islandOrCoastLineCrossingsInPeriod --
# see benchmark/configuration/ais/config/combinedBenchConf.yaml) all read from "crossings", a
# one-row-per-vessel trajectory table (trip tgeompoint) -- nothing built it, so every one of
# those queries failed with "relation crossings does not exist". Materialized (not a plain view)
# for the same reason as postgis_aviation's "flights": avoids recomputing the trajectory
# aggregation on every read. Same two data workarounds as flights, and for the same underlying
# reasons: `AT TIME ZONE 'UTC'` avoids a DST-crossing reorder from this session's Europe/Berlin
# default (it stores the naive wall-clock digits as UTC instants, so MobilityDB queries read them
# back with an explicit AT TIME ZONE 'UTC' in the query itself), and dedup on
# (id, timestamp) -- ~5.4M groups here, a genuine trait of the real AISdk dataset: multiple
# coastal base stations independently log the same vessel broadcast (confirmed identical lat/lon
# across duplicates), not something specific to this subset.
- name: Build MobilityDB crossings trajectory view
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      DROP MATERIALIZED VIEW IF EXISTS crossings;
      CREATE MATERIALIZED VIEW crossings AS
      WITH deduped AS (
        SELECT DISTINCT ON (id, timestamp) id, geom, timestamp AT TIME ZONE 'UTC' AS ts
        FROM crossing_points
        ORDER BY id, timestamp
      )
      SELECT id,
             tgeompointseq(array_agg(tgeompoint(geom, ts) ORDER BY ts)) AS trip
      FROM deduped
      GROUP BY id;
  when: inventory_hostname in groups['masters']

# FIX: see postgis_aviation/postgis_cycling's matching FIX comment -- confirmed live on "rides"
# (50M rows, no index) that an eintersects(r.trip, d.geom) spatial join took 10+ minutes doing a
# full sequential scan. "crossings" is bigger still, so it needs this even more. MobilityDB
# supports a plain GiST index on a tgeompoint column.
- name: Build spatiotemporal index on crossings trajectory view
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      CREATE INDEX IF NOT EXISTS crossings_trip_gist_idx ON crossings USING gist (trip);
  when: inventory_hostname in groups['masters']

- name: Swap python interpreter back to system Python
  ansible.builtin.set_fact:
    ansible_python_interpreter: /usr/bin/python3
  when: inventory_hostname in groups['masters']
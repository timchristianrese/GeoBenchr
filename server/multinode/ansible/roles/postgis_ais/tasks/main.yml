# ---------------------------------------
# 3. Ensure table exists
# ---------------------------------------
- name: Drop staging PostGIS table
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      DROP TABLE IF EXISTS crossing_points_raw;
  when: inventory_hostname in groups['masters']

# FIX: must run before "Drop final PostGIS table" -- the materialized view built at the end of
# this role depends on crossing_points, so Postgres refuses to drop the table on a re-run until
# the view is gone too (same fix as postgis_aviation's "flights").
- name: Drop MobilityDB crossings trajectory view
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      DROP MATERIALIZED VIEW IF EXISTS crossings;
  when: inventory_hostname in groups['masters']

- name: Drop final PostGIS table
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      DROP TABLE IF EXISTS crossing_points;
  when: inventory_hostname in groups['masters']

# FIX: id was "varchar" -- the only one of the 4 scenarios' point tables not using bigint like
# ride_points/flight_points/geolife_points, even though the source data (see
# server/multinode/data_processing/csv_to_parquet.py) generates crossing_id as UInt64 from the
# start. CREATE TABLE IF NOT EXISTS is a no-op against an already-provisioned cluster, so this
# only matters for a fresh deploy -- the existing nst-1 cluster needs
# benchmark/configuration/scripts/migrate_crossing_points_id_to_integer.sql run separately
# (crossing_points is also Citus-distributed ON the id column -- see create_distributed_table
# below -- so that migration isn't a plain ALTER COLUMN TYPE, see the script for why).
- name: Create final PostGIS table
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      CREATE TABLE IF NOT EXISTS crossing_points (
        id bigint,
        timestamp timestamp,
        lat DOUBLE PRECISION,
        lon DOUBLE PRECISION,
        geom geometry(Point, 3857)
      )
      PARTITION BY RANGE (timestamp);      ;
  when: inventory_hostname in groups['masters']

- name: Distribute final PostGIS table
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      Select create_distributed_table('crossing_points', 'id');

      SELECT create_time_partitions(
        table_name := 'crossing_points',
        partition_interval := '1 Month',
        start_from := '2024-01-01 00:00:00',
        end_at:= '2025-07-10 23:59:59'
      );
  when: inventory_hostname in groups['masters']
    
- name: Create staging table and loop
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      CREATE TABLE IF NOT EXISTS crossing_points_raw (
          id bigint,
          timestamp timestamp,
          lat DOUBLE PRECISION,
          lon DOUBLE PRECISION
      );
  when: inventory_hostname in groups['masters']
  
- name: Process parquet files
  ansible.builtin.include_tasks: process_parquet.yml
  when: inventory_hostname in groups['masters']
  loop: "{{ parquet_files.files }}"
  loop_control:
    label: "{{ item.path }}"
# ---------------------------------------
# 4. Run high-performance loader (venv)
# ---------------------------------------

- name: Create line_geom column in crossing_points from point data
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      ALTER TABLE crossing_points
      ADD COLUMN IF NOT EXISTS line_geom geometry(LineString, 3857);
  when: inventory_hostname in groups['masters']

# FIX: crossing_points' identifier column used to be named crossing_id, unlike
# flight_points/ride_points/geolife_points which all use "id" -- every hand-written query in
# benchmark/configuration/ais/config/combinedBenchConf.yaml (across all 6 dialects) was written
# assuming "id" like the other three scenarios, so every one of them failed against the real
# column name. Renamed crossing_id -> id here (and in clickhouse_ais, process_parquet.yml) to
# match the convention instead of hand-editing that much SQL across 6 dialects.
- name: Update line_geom column in crossing_points from point data
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      UPDATE crossing_points t
      SET line_geom = sub.line_geom
      FROM (
      SELECT
      id,
      ST_MakeLine(
      geom,
      LEAD(geom) OVER (
      PARTITION BY id
      ORDER BY timestamp
      )
      ) AS line_geom
      FROM crossing_points
      ) sub
      WHERE t.id = sub.id;


# FIX: crossing_points is a Citus-distributed table -- DDL propagated to worker shards goes over
# a prepared statement, which can only ever hold a single SQL command ("cannot insert multiple
# commands into a prepared statement"). Splitting the old semicolon-joined multi-statement query
# into one statement per loop iteration avoids that entirely (same fix as postgis_aviation).
- name: Create final PostGIS table index
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: "{{ item }}"
  loop:
    - "CREATE INDEX IF NOT EXISTS crossing_points_geom_idx ON crossing_points USING GIST (geom);"
    - "CREATE INDEX IF NOT EXISTS crossing_points_timestamp_idx ON crossing_points (timestamp);"
    - "CREATE INDEX IF NOT EXISTS crossing_points_id_idx ON crossing_points (id);"
    - "CREATE INDEX IF NOT EXISTS crossing_points_line_geom_idx ON crossing_points USING GIST (line_geom);"
  when: inventory_hostname in groups['masters']


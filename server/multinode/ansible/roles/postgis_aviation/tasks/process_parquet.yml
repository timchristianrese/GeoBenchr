# FIX: two bugs --
# 1. {{ ansible_env.HOME }} resolves to /root here (this play's become: true at the play level
#    also applies to Ansible's implicit fact-gathering), but the duckdb CLI this role installs
#    (main.yml's "Install DuckDB CLI" task, same fix applied there) lands under
#    /home/{{ ansible_user }} -- so this was about to redundantly re-download and install a whole
#    separate copy under /root instead of reusing the one already there.
# 2. The real parquet files (data_generator_aviation/parquet_flights) name their flight-id column
#    "flight_id", not "id" -- this SELECT referenced a column that doesn't exist.
- name: Load parquet into staging (DuckDB → Postgres)
  ansible.builtin.shell: |
    set -euo pipefail

    /home/{{ ansible_user }}/.duckdb/cli/latest/duckdb <<EOF
    LOAD postgres;

    ATTACH
      'host={{ db_host }}
       dbname={{ db_name }}
       user={{ db_user }}
       port={{ db_port }}
       password={{ db_password }}'
    AS pg (TYPE postgres);

    INSERT INTO pg.public.flight_points_raw
    SELECT
        flight_id AS id,
        lat,
        lon,
        timestamp,
        altitude
    FROM read_parquet('{{ item.path }}');
    EOF
  args:
    executable: /bin/bash

- name: Move staging data into production table
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      INSERT INTO flight_points (
          id,
          timestamp,
          geom,
          altitude
      )
      SELECT
          id,
          timestamp,
          ST_Transform(ST_SetSRID(ST_MakePoint(lon, lat), 4326), 3857),
          altitude
      FROM flight_points_raw;

      TRUNCATE TABLE flight_points_raw;
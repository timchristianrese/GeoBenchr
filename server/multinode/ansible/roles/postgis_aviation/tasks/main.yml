# FIX: MobilityDB's read queries (countFlightsInCounties, CityActivityAtInstant,
# flightClosestToPoint, FlightsAtLowAltitudeInPeriod/FlightsAtNightInPeriod,
# flightsInCountyInPeriod -- see benchmark/configuration/aviation/config/combinedBenchConf.yaml)
# all read from "flights", a one-row-per-trajectory table (trip tgeompoint, altitude tfloat) --
# nothing built it, so every one of those queries failed with "relation flights does not exist".
# A plain VIEW would recompute this aggregation (tens of millions of rows) on every single read
# query, so this is a MATERIALIZED VIEW instead, rebuilt once per data load.
# Two real data issues had to be worked around to get here:
#  1. flight_points.timestamp is a naive `timestamp` column; casting it to timestamptz through
#     this session's Europe/Berlin default silently reorders values across a DST transition
#     (2024-03-31), which MobilityDB's sequence constructor rejects ("Timestamps ... must be
#     increasing"). `AT TIME ZONE 'UTC'` treats the naive value as already being UTC, which has
#     no DST and is always order-preserving. NOTE (2026-10-01): this stores the naive wall-clock
#     digits as UTC instants, so MobilityDB queries read them back with AT TIME ZONE 'UTC' (in
#     the query itself -- Citus evaluates on the workers, so a session SET TIME ZONE can't) to
#     compare like-for-like with flight_points. Converting via Europe/Berlin instead is lossy:
#     the data has points inside the spring-forward gap.
#  2. A handful of (id, timestamp) pairs repeat with identical geom/altitude (a small, apparently
#     natural amount of noise in the synthetic data, ~110 groups out of ~80M rows) -- MobilityDB
#     requires strictly increasing timestamps per trajectory, so these are deduplicated first.
#     Some points also have a NULL altitude (left by the benchmark's own write-queries, which
#     insert id/geom/timestamp only) -- excluded from the altitude sequence specifically via
#     FILTER, since a NULL element isn't valid inside a temporal sequence either.
- name: Build MobilityDB flights trajectory view
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      DROP MATERIALIZED VIEW IF EXISTS flights;
      CREATE MATERIALIZED VIEW flights AS
      WITH deduped AS (
        SELECT DISTINCT ON (id, timestamp) id, geom, timestamp AT TIME ZONE 'UTC' AS ts, altitude
        FROM flight_points
        ORDER BY id, timestamp
      )
      SELECT id,
             tgeompointseq(array_agg(tgeompoint(geom, ts) ORDER BY ts)) AS trip,
             tfloatseq(array_agg(tfloat(altitude, ts) ORDER BY ts) FILTER (WHERE altitude IS NOT NULL)) AS altitude
      FROM deduped
      GROUP BY id;
  when: inventory_hostname in groups['masters']

# FIX: confirmed live -- a functionality test's eintersects(r.trip, d.geom)-style spatial join
# against "flights"/"rides" (the same pattern countyFlightsAggregation, flightsNearAirport etc.
# use) sequentially scanned the whole trajectory table with no index at all, taking 10+ minutes
# on "rides" alone (50M rows) where an indexed lookup should take well under a second. MobilityDB
# supports a plain GiST index on a tgeompoint column exactly like PostGIS does on geometry.
- name: Build spatiotemporal index on flights trajectory view
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      CREATE INDEX IF NOT EXISTS flights_trip_gist_idx ON flights USING gist (trip);
  when: inventory_hostname in groups['masters']

- name: Swap python interpreter back to system Python
  ansible.builtin.set_fact:
    ansible_python_interpreter: /usr/bin/python3
  when: inventory_hostname in groups['masters']
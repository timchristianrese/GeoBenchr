- name: Ensure python venv package is installed (Debian/Ubuntu)
  become: true
  ansible.builtin.apt:
    name: "python3-venv"
    state: present
    update_cache: true
  when: inventory_hostname in groups['masters']

# ---------------------------------------
# 1. Sync data
# ---------------------------------------
# FIX: this was commented out (and, even uncommented, used local_parquet_dir -- the cycling data
# generator's own output directory, not aviation's) so nothing ever actually put a parquet file on
# the target machine; "Find parquet files" below always found zero, silently no-opping the rest of
# this role. Syncing aviation_sample_file_count real files (sorted by filename, so a rerun with a
# larger count is additive) rather than the whole data_generators/aviation/parquet_flights
# directory (~676 files, ~70GB) -- see those variables' comments in group_vars/all/all.yml.
- name: Enumerate aviation sample parquet files on the control machine
  ansible.builtin.find:
    paths: "{{ aviation_sample_parquet_dir }}"
    patterns: "*.parquet"
  delegate_to: localhost
  connection: local
  become: false
  run_once: true
  register: aviation_local_parquet_files
  when: inventory_hostname in groups['masters']

- name: Sync sample aviation parquet files to target machine
  ansible.posix.synchronize:
    src: "{{ item.path }}"
    dest: "{{ aviation_data_dir }}/"
  loop: "{{ (aviation_local_parquet_files.files | sort(attribute='path'))[:aviation_sample_file_count] }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: inventory_hostname in groups['masters']

- name: Install build dependencies for pg_parquet
  become: true
  ansible.builtin.apt:
    name:
      - git
      - curl
      - build-essential
      - clang
      - pkg-config
      - libssl-dev
      - libpq-dev
      - postgresql-server-dev-all
    state: present
    update_cache: true
  when: inventory_hostname in groups['masters']
- name: Install prerequisites
  become: true
  ansible.builtin.apt:
    name:
      - unzip
      - curl
    state: present
    update_cache: true
  when: inventory_hostname in groups['masters']

# FIX: this play's become: true (play level) also applies to fact-gathering, so
# ansible_env.HOME resolved to /root -- redundantly installing (and only this role ever using) a
# second DuckDB CLI copy there, separate from the one every other role reading DuckDB installs
# under /home/{{ ansible_user }} (see roles/duckdb's own matching fix). become: false + the real
# path reuses whichever one's already there instead.
- name: Check whether DuckDB is installed
  become: false
  ansible.builtin.stat:
    path: "/home/{{ ansible_user }}/.duckdb/cli/latest/duckdb"
  register: duckdb_installed
  when: inventory_hostname in groups['masters']
- name: Install DuckDB CLI
  become: false
  ansible.builtin.shell: |
    curl -fsSL https://install.duckdb.org | sh
  args:
    creates: "/home/{{ ansible_user }}/.duckdb/cli/latest/duckdb"
  when: not duckdb_installed.stat.exists and inventory_hostname in groups['masters']

# FIX: process_parquet.yml's "LOAD postgres;" expects DuckDB's Postgres scanner extension under
# its old name -- the version install.duckdb.org ships now calls it "postgres_scanner" (renamed
# upstream; the on-disk/LOAD name and the extension repository's filename diverged). Worse, even
# the correct name auto-installs over the network on first LOAD, which hangs indefinitely on
# nst-cluster hardware specifically (DNS for extensions.duckdb.org returns a working IPv4 address
# alongside an IPv6 one whose route is black-holed there -- SYNs vanish instead of being rejected;
# DuckDB's installer, unlike curl, never falls back to IPv4). Pre-fetch it explicitly over IPv4
# into the exact cache path DuckDB's own INSTALL would use, matching roles/duckdb's identical fix
# for the quack extension -- harmless/no-op anywhere this network problem doesn't exist.
- name: Determine installed DuckDB CLI version (extension cache path is versioned by it)
  become: false
  ansible.builtin.command: "/home/{{ ansible_user }}/.duckdb/cli/latest/duckdb --version"
  register: duckdb_cli_version_output
  changed_when: false
  when: inventory_hostname in groups['masters']

- name: Check whether the postgres_scanner extension is already cached locally
  become: false
  ansible.builtin.stat:
    path: "/home/{{ ansible_user }}/.duckdb/extensions/{{ duckdb_cli_version_output.stdout.split()[0] }}/linux_amd64/postgres_scanner.duckdb_extension"
  register: postgres_scanner_extension_cached
  when: inventory_hostname in groups['masters']

- name: Ensure the DuckDB extension cache directory exists
  become: false
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.duckdb/extensions/{{ duckdb_cli_version_output.stdout.split()[0] }}/linux_amd64"
    state: directory
    mode: '0755'
  when: inventory_hostname in groups['masters'] and not postgres_scanner_extension_cached.stat.exists

- name: Fetch the postgres_scanner extension over IPv4 into the local DuckDB extension cache
  become: false
  ansible.builtin.shell: >-
    curl -4 -fsSL "http://extensions.duckdb.org/{{ duckdb_cli_version_output.stdout.split()[0] }}/linux_amd64/postgres_scanner.duckdb_extension.gz"
    | gunzip > "/home/{{ ansible_user }}/.duckdb/extensions/{{ duckdb_cli_version_output.stdout.split()[0] }}/linux_amd64/postgres_scanner.duckdb_extension"
  when: inventory_hostname in groups['masters'] and not postgres_scanner_extension_cached.stat.exists

- name: Ensure duckdb is in PATH by checking if it already is, and if not, adding it to .bashrc
  become: false
  ansible.builtin.shell: |
    if ! echo $PATH | grep -q "/home/{{ ansible_user }}/.duckdb/cli/latest"; then
      echo 'export PATH="/home/{{ ansible_user }}/.duckdb/cli/latest:$PATH"' >> ~/.bashrc
    fi
  args:
    executable: /bin/bash
  when: inventory_hostname in groups['masters']
  
- name: Resource .bashrc to update PATH for current session
  ansible.builtin.shell: |
    source ~/.bashrc
  args:
    executable: /bin/bash
  when: inventory_hostname in groups['masters']

- name: Find parquet files
  ansible.builtin.find:
    paths: "{{ aviation_data_dir }}"
    patterns: "*.parquet"
  register: parquet_files
  when: inventory_hostname in groups['masters']

# ---------------------------------------
# 2. Create virtualenv
# ---------------------------------------
- name: Create Python virtual environment
  ansible.builtin.command: "python3 -m venv {{ venv_dir }}"
  args:
    creates: "{{ venv_dir }}/bin/activate"
  when: inventory_hostname in groups['masters']
# FIX: plain "psycopg2" has no prebuilt wheel matching this venv's Python and falls back to
# compiling from source, which fails outright without python3-dev installed ("fatal error:
# Python.h: No such file or directory") -- psycopg2-binary ships prebuilt wheels and needs no
# compiler/headers at all (the upstream-recommended alternative for exactly this situation).
- name: Install deps with bash
  ansible.builtin.shell: |
    source {{ venv_dir }}/bin/activate
    pip install pandas pyarrow psycopg2-binary
  args:
    executable: /bin/bash
  when: inventory_hostname in groups['masters']

- name: Switch Ansible to venv Python
  ansible.builtin.set_fact:
    ansible_python_interpreter: "{{ venv_dir }}/bin/python"
  when: inventory_hostname in groups['masters']


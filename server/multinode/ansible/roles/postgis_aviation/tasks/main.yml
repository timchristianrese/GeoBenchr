# ---------------------------------------
# 3. Ensure table exists
# ---------------------------------------
- name: Drop final PostGIS table
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      DROP TABLE IF EXISTS flight_points;
  when: inventory_hostname in groups['masters']

- name: Create final PostGIS table
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      CREATE TABLE IF NOT EXISTS flight_points (
        id BIGINT,
        timestamp timestamp,
        geom geometry(Point, 3857),
        altitude BIGINT
      )
      PARTITION BY RANGE (timestamp);

  when: inventory_hostname in groups['masters']

- name: Distribute final PostGIS table
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      Select create_distributed_table('flight_points', 'id');

      SELECT create_time_partitions(
        table_name := 'flight_points',
        partition_interval := '1 Month',
        start_from := '2024-01-01 00:00:00',
        end_at:= '2025-01-02 23:59:59'
      );

  when: inventory_hostname in groups['masters']
    
- name: Create staging table and loop
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      CREATE TABLE IF NOT EXISTS flight_points_raw (
          id BIGINT,
          lat DOUBLE PRECISION,
          lon DOUBLE PRECISION,
          timestamp timestamp,
          altitude BIGINT
      );
  when: inventory_hostname in groups['masters']
  
- name: Process parquet files
  ansible.builtin.include_tasks: process_parquet.yml
  when: inventory_hostname in groups['masters']
  loop: "{{ parquet_files.files }}"
  loop_control:
    label: "{{ item.path }}"
# ---------------------------------------
# 4. Run high-performance loader (venv)
# ---------------------------------------

- name: Create line_geom column in flight_points from point data
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      ALTER TABLE flight_points
      ADD COLUMN IF NOT EXISTS line_geom geometry(LineString, 3857);
  when: inventory_hostname in groups['masters']

- name: Update line_geom column in flight_points from point data
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      UPDATE flight_points t                                                           
      SET line_geom = sub.line_geom
      FROM (
      SELECT
      id,
      ST_MakeLine(
      geom,
      LEAD(geom) OVER (
      PARTITION BY id
      ORDER BY timestamp
      )
      ) AS line_geom
      FROM flight_points
      ) sub
      WHERE t.id = sub.id;


# FIX: this used to be one query string with all 5 CREATE INDEX statements semicolon-joined.
# flight_points is a Citus-distributed table, and Citus propagates DDL to worker shards over a
# prepared statement -- which, unlike a plain query, can only ever hold a single SQL command
# ("cannot insert multiple commands into a prepared statement"). Splitting into one statement per
# loop iteration (matching the working pattern already used by add_supporting_datasets'
# "Add geom indexes" task) avoids that entirely.
- name: Create final PostGIS table index
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: "{{ item }}"
  loop:
    - "CREATE INDEX IF NOT EXISTS flight_points_geom_idx ON flight_points USING GIST (geom);"
    - "CREATE INDEX IF NOT EXISTS flight_points_timestamp_idx ON flight_points (timestamp);"
    - "CREATE INDEX IF NOT EXISTS flight_points_flightid_idx ON flight_points (id);"
    - "CREATE INDEX IF NOT EXISTS flight_points_altitude_idx ON flight_points (altitude);"
    - "CREATE INDEX IF NOT EXISTS flight_points_line_geom_idx ON flight_points USING GIST (line_geom);"
  when: inventory_hostname in groups['masters']



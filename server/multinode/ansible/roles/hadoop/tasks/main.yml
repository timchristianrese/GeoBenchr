- name: Install Hadoop prerequisites
  apt:
    name:
      - ssh
      - rsync
      - pdsh
    state: present
    update_cache: yes

- name: Ensure sshd is running
  service:
    name: ssh
    state: started
    enabled: yes

# -------------------------
# INSTALL CUSTOM JDK
# -------------------------
- name: Create Java directory
  file:
    path: /opt/java
    state: directory
    mode: '0755'

# - name: Instead of uploading, download JDK directly on the server (if not already present)
#   get_url:
#     url: https://github.com/adoptium/temurin11-binaries/releases/download/jdk-11.0.30%2B7/OpenJDK11U-jdk_x64_linux_hotspot_11.0.30_7.tar.gz
#     dest: /opt/java/OpenJDK11U-jdk_x64_linux_hotspot_11.0.30_7.tar.gz
#     mode: '0644'
# # - name: Upload OpenJDK tarball
# #   copy:
# #     src: OpenJDK11U-jdk_x64_linux_hotspot_11.0.30_7.tar.gz
# #     dest: /opt/java/

# - name: Extract OpenJDK
#   unarchive:
#     src: /opt/java/OpenJDK11U-jdk_x64_linux_hotspot_11.0.30_7.tar.gz
#     dest: /opt/java/
#     remote_src: yes

- name: Instead of uploading, download JDK directly on the server (if not already present)
  get_url:
    url: https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.18%2B8/OpenJDK17U-jdk_x64_linux_hotspot_17.0.18_8.tar.gz
    dest: /opt/java/OpenJDK17U-jdk_x64_linux_hotspot_17.0.18_8.tar.gz
    mode: '0644'
    # FIX: get_url's default timeout (10s) is a connect+read timeout on the whole transfer, not
    # just connection setup -- easily exceeded by a ~180MB download when 5 nodes pull large
    # binaries concurrently over one shared NAT'd uplink (confirmed: a plain `curl` from the same
    # guest, run alone, fetched a byte range instantly -- the *server* side isn't the bottleneck).
    timeout: 180

# - name: Upload OpenJDK 17 tarball
#   copy:
#     src: OpenJDK17U-jdk_x64_linux_hotspot_17.0.18_8.tar.gz
#     dest: /opt/java/

- name: Extract OpenJDK 17
  unarchive:
    src: /opt/java/OpenJDK17U-jdk_x64_linux_hotspot_17.0.18_8.tar.gz
    dest: /opt/java/
    remote_src: yes

- name: Create Java symlink
  file:
    src: /opt/java/jdk-17.0.18+8
    dest: /opt/java/latest
    state: link

# -------------------------
# SSH SETUP (CRITICAL)
# -------------------------
- name: Generate SSH key (if not exists)
  openssh_keypair:
    path: "/home/{{ ansible_user }}/.ssh/id_rsa"
    type: rsa
    size: 2048
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'
  become: no

- name: Collect public keys
  fetch:
    src: "/home/{{ ansible_user }}/.ssh/id_rsa.pub"
    dest: "tmp/keys/{{ inventory_hostname }}.pub"
    flat: yes

- name: Distribute authorized_keys
  authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ lookup('file', 'tmp/keys/' + item + '.pub') }}"
  loop: "{{ groups['all'] }}"

- name: Disable strict host key checking for cluster nodes
  copy:
    dest: "/home/{{ ansible_user }}/.ssh/config"
    content: |
      Host *
        StrictHostKeyChecking no
        UserKnownHostsFile=/dev/null
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'


# FIX: archive.apache.org deliberately throttles bandwidth on older releases (its responses carry
# a literal "Vary: Slow,Glacial" header) -- downloading a ~700MB tarball on 5 nodes at once over
# that stalled for over 50 minutes with no progress. The same file is on dlcdn.apache.org (the
# CDN-backed mirror network, already used by the spark role's own get_url below) at full speed.
- name: Download Hadoop tarball directly on the server (if not already present)
  get_url:
    url: https://dlcdn.apache.org/hadoop/common/hadoop-{{ hadoop_version }}/hadoop-{{ hadoop_version }}.tar.gz
    dest: /opt/hadoop-{{ hadoop_version }}.tar.gz
    mode: '0644'
    # FIX: see the matching FIX comment on the OpenJDK get_url above -- same cause, bigger file
    # (~400MB), so an even larger margin over the 10s default.
    timeout: 300

# - name: Copy Hadoop to all nodes
#   copy:
#     src: hadoop-{{ hadoop_version }}.tar.gz
#     dest: /opt/
#     mode: '0644'

- name: Extract Hadoop
  unarchive:
    src: "/opt/hadoop-{{ hadoop_version }}.tar.gz"
    dest: /opt/
    remote_src: yes
    creates: /opt/hadoop-{{ hadoop_version }}

- name: Fix ownership of Hadoop installation
  file:
    path: /opt/hadoop-{{ hadoop_version }}
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    recurse: yes

- name: Remove existing Hadoop directory if not a symlink
  file:
    path: /opt/hadoop
    state: absent

- name: Symlink Hadoop
  file:
    src: /opt/hadoop-{{ hadoop_version }}
    dest: /opt/hadoop
    state: link

- name: Set Hadoop environment variables
  copy:
    dest: /etc/profile.d/hadoop.sh
    content: |
      export JAVA_HOME=/opt/java/latest
      export HADOOP_HOME=/opt/hadoop
      export HADOOP_CONF_DIR=$HADOOP_HOME/etc/hadoop
      export PATH=$PATH:$JAVA_HOME/bin:$HADOOP_HOME/bin:$HADOOP_HOME/sbin

- name: Source environment (for current session)
  shell: source /etc/profile.d/hadoop.sh
  args:
    executable: /bin/bash

- name: Set JAVA_HOME in hadoop-env.sh
  lineinfile:
    path: /opt/hadoop/etc/hadoop/hadoop-env.sh
    regexp: '^export JAVA_HOME='
    line: 'export JAVA_HOME=/opt/java/latest'

# -------------------------
# CONFIG FILES
# -------------------------
- name: Configure core-site.xml
  template:
    src: core-site.xml.j2
    dest: /opt/hadoop/etc/hadoop/core-site.xml

- name: Configure hdfs-site.xml
  template:
    src: hdfs-site.xml.j2
    dest: /opt/hadoop/etc/hadoop/hdfs-site.xml

- name: Configure yarn-site.xml
  template:
    src: yarn-site.xml.j2
    dest: /opt/hadoop/etc/hadoop/yarn-site.xml

- name: Configure mapred-site.xml
  template:
    src: mapred-site.xml.j2
    dest: /opt/hadoop/etc/hadoop/mapred-site.xml

- name: Set JAVA_HOME for YARN
  lineinfile:
    path: /opt/hadoop/etc/hadoop/yarn-env.sh
    line: 'export JAVA_HOME=/opt/java/latest'

# -------------------------
# WORKERS FILE
# -------------------------
- name: Configure workers file
  template:
    src: workers.j2
    dest: /opt/hadoop/etc/hadoop/workers



# -------------------------
# FORMAT HDFS (ONLY ON MASTER)
# -------------------------

- name: Ensure Hadoop directories exist with correct ownership
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
    recurse: yes
  loop:
    - /opt/hadoop
    - /opt/hadoop/logs
    - /opt/hadoop/data

# FIX: "Format HDFS namenode" below used to run unconditionally on every play, which wipes the
# namenode's metadata every single time -- fine for a first install, but silently destroys any
# real data ever loaded into HDFS on every subsequent rerun (e.g. re-running hadoop.yml, or the
# "install everything" playbooks/all.yml, after this cluster has real data on it). A fresh
# namenode format also requires a matching DataNode storage wipe (mismatched cluster IDs would
# otherwise make every DataNode refuse to join), so this check gates both together: only wipe/
# reformat when there's no existing namenode metadata to lose in the first place.
- name: Check whether HDFS namenode is already formatted
  ansible.builtin.stat:
    path: /opt/hadoop/data/namenode/current/VERSION
  register: hdfs_namenode_formatted
  when: inventory_hostname in groups['masters']

- name: Clean DataNode storage (safe cluster reset)
  file:
    path: /opt/hadoop/data/datanode
    state: absent
  when: not hostvars[groups['masters'][0]].hdfs_namenode_formatted.stat.exists
# -------------------------
# START HDFS + YARN
# -------------------------

# FIX: start-dfs.sh/start-yarn.sh (and their stop-* counterparts) launch each daemon across the
# cluster via `pdsh`, which defaults to the legacy "rsh" rcmd module -- that needs a privileged
# source port and failed here with "pdsh@...: rcmd: socket: Permission denied" on every node,
# silently leaving only the single local ResourceManager up (it doesn't go through pdsh) while
# NameNode/DataNodes/SecondaryNameNode never started at all (no log files, nothing on port 9000).
# PDSH_RCMD_TYPE=ssh is the standard fix -- tells pdsh to dispatch over plain SSH instead.
- name: Stop HDFS and YARN if running (only on master)
  shell: |
    /opt/hadoop/sbin/stop-yarn.sh
    /opt/hadoop/sbin/stop-dfs.sh
    /opt/hadoop/sbin/stop-all.sh
  when: inventory_hostname in groups['masters']
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    PDSH_RCMD_TYPE: ssh

- name: Format HDFS namenode
  command: /opt/hadoop/bin/hdfs namenode -format -force
  when:
    - inventory_hostname in groups['masters']
    - not hdfs_namenode_formatted.stat.exists
  become_user: "{{ ansible_user }}"
  become: true

# FIX: confirmed live -- start-dfs.sh starts NameNode (and SecondaryNameNode) locally on master,
# exactly like start-yarn.sh's local ResourceManager (see that task's own FIX comment below for
# the full story: remote daemons spawned over their own separate SSH/pdsh session survive fine,
# but a *local* daemon stays a member of whichever session launched it and gets SIGHUP'd whenever
# that session's connection eventually tears down -- not necessarily right away, so this can look
# fine for a while, running the same as always, and only die a good deal later). Caught this
# directly: NameNode and ResourceManager both received "SIGNAL 15: SIGTERM" and shut down cleanly
# within the same few seconds, over an hour after this task had returned "changed" -- consistent
# with an ansible SSH connection torn down elsewhere in a much later, unrelated play (a different
# playbook run entirely) rather than anything actually going wrong with HDFS/YARN themselves.
# Same setsid fix as start-yarn.sh below detaches it into its own session so it doesn't matter
# when this task's own SSH connection eventually closes.
- name: Start HDFS
  shell: setsid /opt/hadoop/sbin/start-dfs.sh > /tmp/start-dfs.log 2>&1 < /dev/null &
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    PDSH_RCMD_TYPE: ssh
  when:
    - inventory_hostname in groups['masters']

# FIX: the local ResourceManager JVM (unlike the *remote* NodeManagers, spawned via pdsh over
# their own separate SSH sessions and confirmed to survive fine) installs its own SIGHUP handler
# and treats SIGHUP as a shutdown signal (confirmed in its log: "RECEIVED SIGNAL 1: SIGHUP",
# immediately followed by a graceful-shutdown sequence) -- and it's still a member of this task's
# own SSH session when that session's teardown delivers SIGHUP to it. A trailing `sleep` just
# delays that teardown, it doesn't prevent it (verified: the RM survived exactly as long as an
# added `sleep 5`, then died the instant that finished) -- what's actually needed is detaching the
# whole start-yarn.sh process tree into its own session via `setsid`, so it's no longer a member of
# this SSH session at all by the time it closes.
- name: Start YARN
  shell: setsid /opt/hadoop/sbin/start-yarn.sh > /tmp/start-yarn.log 2>&1 < /dev/null &
  become: true
  become_user: "{{ ansible_user }}"
  environment:
    PDSH_RCMD_TYPE: ssh
  when:
    - inventory_hostname in groups['masters']

# retries/delay: the NameNode JVM takes a few seconds to finish binding its RPC port after
# start-dfs.sh (run on masters, above) returns -- workers reaching this same task moments later
# would otherwise race it with "Connection refused".
- name: Check HDFS
  command: /opt/hadoop/bin/hdfs dfs -ls /
  become_user: "{{ ansible_user }}"
  register: hdfs_check
  retries: 6
  delay: 5
  until: hdfs_check.rc == 0

# -------------------------
# RE-REGISTER SPARK'S SHUFFLE SERVICE, IF ALREADY INSTALLED (SELF-HEAL)
# -------------------------
# "Configure yarn-site.xml" above regenerates this file from scratch from this role's own
# template on every run -- silently wiping out the spark_shuffle aux-service registration that
# roles/spark's own tasks patch into this same file, if Spark was already installed by a
# previous, separate playbook run. Hit for real: an unrelated HDFS namenode-format fix re-ran
# hadoop.yml standalone on an already-provisioned cluster, and that alone was enough to break
# every Spark/Sedona job on YARN for the rest of the day (spark-defaults.conf turns on
# spark.shuffle.service.enabled and dynamic allocation by default, both of which need this
# aux-service; without it every executor container gets allocated by YARN and then silently
# released again within seconds, with no error anywhere -- see benchmark_client's
# docs/sample-queries.md for the full debugging trail). Detecting via the shuffle jar's presence
# (rather than referencing spark_version, a roles/spark-only default) keeps hadoop.yml fully
# standalone-safe: on a node where Spark was never installed, this block is a no-op.
- name: Check whether Spark's YARN shuffle service jar is already installed (roles/spark ran previously)
  ansible.builtin.find:
    paths: "{{ hadoop_home }}/share/hadoop/yarn/lib"
    patterns: "spark-*-yarn-shuffle.jar"
  register: spark_shuffle_jar_present

- name: Re-apply the Spark shuffle service registration in yarn-site.xml
  when: spark_shuffle_jar_present.matched > 0
  become: true
  block:
    - name: Add spark_shuffle to yarn.nodemanager.aux-services
      ansible.builtin.lineinfile:
        path: "{{ hadoop_home }}/etc/hadoop/yarn-site.xml"
        regexp: '^\s*<value>mapreduce_shuffle</value>\s*$'
        line: "    <value>mapreduce_shuffle,spark_shuffle</value>"
      register: spark_shuffle_aux_services_patched

    - name: Register the Spark shuffle service's implementation class in yarn-site.xml
      ansible.builtin.blockinfile:
        path: "{{ hadoop_home }}/etc/hadoop/yarn-site.xml"
        marker: "  <!-- {mark} SPARK SHUFFLE SERVICE -->"
        insertbefore: '</configuration>'
        block: |
          <property>
            <name>yarn.nodemanager.aux-services.spark_shuffle.class</name>
            <value>org.apache.spark.network.yarn.YarnShuffleService</value>
          </property>
      register: spark_shuffle_class_patched

    # aux-services are only loaded at NodeManager startup, so this only matters (and only needs
    # to pay for a YARN bounce) when one of the two patches above actually changed something --
    # i.e. the config really had been wiped, not just re-run against an already-correct file.
    #
    # FIX: confirmed live -- this block's become: true with no become_user runs this task as
    # root, and start-yarn.sh/stop-yarn.sh both refuse that outright ("Attempting to operate on
    # yarn nodemanager as root but there is no YARN_NODEMANAGER_USER defined. Aborting
    # operation.") -- exactly the reason every *other* YARN start/stop task in this file already
    # sets become_user: "{{ ansible_user }}" (and the matching handler in roles/spark/handlers).
    # Worse, that failure was invisible: stop-yarn.sh's synchronous half still exits 0 despite
    # printing those errors to stderr, so Ansible reported "changed": true with no indication
    # anything was wrong, while YARN silently never actually restarted -- the re-patched
    # yarn-site.xml sat on disk unused, and NodeManagers kept running (or came back up, on a
    # separate unrelated restart) with the *previous*, un-patched config. Caught this because a
    # Spark job's executors then failed to launch with "InvalidAuxServiceException: The
    # auxService:spark_shuffle does not exist" on the specific node this had actually happened on.
    - name: Restart YARN to pick up the re-applied shuffle service registration
      delegate_to: "{{ groups['masters'][0] }}"
      run_once: true
      become_user: "{{ ansible_user }}"
      environment:
        PDSH_RCMD_TYPE: ssh
      ansible.builtin.shell: |
        {{ hadoop_home }}/sbin/stop-yarn.sh
        setsid {{ hadoop_home }}/sbin/start-yarn.sh > /tmp/start-yarn.log 2>&1 < /dev/null &
      when: spark_shuffle_aux_services_patched.changed or spark_shuffle_class_patched.changed
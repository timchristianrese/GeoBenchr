- name: Install Hadoop prerequisites
  apt:
    name:
      - ssh
      - rsync
      - pdsh
    state: present
    update_cache: yes

- name: Ensure sshd is running
  service:
    name: ssh
    state: started
    enabled: yes

# -------------------------
# INSTALL CUSTOM JDK
# -------------------------
- name: Create Java directory
  file:
    path: /opt/java
    state: directory
    mode: '0755'


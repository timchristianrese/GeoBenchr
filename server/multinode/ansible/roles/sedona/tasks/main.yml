- name: Install uv
  shell: |
    curl -Ls https://astral.sh/uv/install.sh | sh
  args:
    creates: /root/.local/bin/uv

- name: Create Python environment with uv
  shell: |
    /root/.local/bin/uv venv /opt/venvs/sedona
  args:
    creates: /opt/venvs/sedona

- name: Install Sedona + PySpark via uv
  shell: |
    /root/.local/bin/uv pip install \
      apache-sedona[spark]==1.8.1 \
      shapely geopandas attrs
  args:
    chdir: /opt/venvs/sedona

- name: Ensure Spark jars directory exists
  file:
    path: "{{ spark_home }}/jars"
    state: directory
    mode: '0755'

- name: Upload Sedona shaded jar
  copy:
    src: "{{ sedona_jar }}"
    dest: "{{ spark_home }}/jars/{{ sedona_jar }}"
    mode: '0644'

- name: Upload GeoTools wrapper jar
  copy:
    src: "{{ geotools_jar }}"
    dest: "{{ spark_home }}/jars/{{ geotools_jar }}"
    mode: '0644'
  
- name: Download Sedona shaded jar instead
  get_url:
    url: "https://repo.maven.apache.org/maven2/org/apache/sedona/sedona-spark-shaded-{{spark_version}}_{{scala_version}}/{{sedona_version}}/sedona-spark-shaded-{{spark_version}}_{{scala_version}}-{{sedona_version}}.jar"
    dest: "{{ spark_home }}/jars/{{ sedona_jar }}"
    mode: '0644'
    creates: "{{ spark_home }}/jars/{{ sedona_jar }}"

- name: Download GeoTools wrapper jar instead
  get_url:
    url: "https://repo.maven.apache.org/maven2/org/datasyslab/geotools-wrapper/{{ sedona_version }}-{{ geotools_version }}/geotools-wrapper-{{ sedona_version }}-{{ geotools_version }}.jar"
    dest: "{{ spark_home }}/jars/{{ geotools_jar }}"
    mode: '0644'
    creates: "{{ spark_home }}/jars/{{ geotools_jar }}"
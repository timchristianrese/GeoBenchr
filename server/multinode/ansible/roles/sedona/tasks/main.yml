- name: Install uv
  shell: |
    curl -Ls https://astral.sh/uv/install.sh | sh
  args:
    creates: /root/.local/bin/uv

- name: Create Python environment with uv
  shell: |
    /root/.local/bin/uv venv /opt/venvs/sedona
  args:
    creates: /opt/venvs/sedona

- name: Install Sedona + PySpark via uv
  shell: |
    /root/.local/bin/uv pip install \
      apache-sedona[spark]==1.8.1 \
      shapely geopandas attrs
  args:
    chdir: /opt/venvs/sedona

- name: Ensure Spark jars directory exists
  file:
    path: "{{ spark_home }}/jars"
    state: directory
    mode: '0755'


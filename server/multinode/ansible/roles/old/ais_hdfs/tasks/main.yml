- name: Disable safe mode so that we can create a directory
  become_user: debian
  command: >
    {{ hadoop_home }}/bin/hdfs dfsadmin -safemode leave
  when: inventory_hostname in groups['masters']

- name: Create HDFS directory
  command: >
    {{ hadoop_home }}/bin/hdfs dfs -mkdir -p {{ hdfs_target_dir }}
  when: inventory_hostname in groups['masters']

- name: Create the local data directory
  ansible.builtin.file:
    path: "{{ local_data_path }}"
    state: directory
  when:
    - inventory_hostname in groups['masters']

- name: Get file listing
  uri:
    url: "http://aisdata.ais.dk/?prefix=2024/"
    return_content: yes
  register: ais_page
  when:
  - inventory_hostname in groups['masters']

- name: Extract zip filenames
  set_fact:
    ais_files: "{{ ais_page.content | regex_findall('href=\"[^\"]*/([^\"/]+\\.zip)\"') }}"
  when:
    - inventory_hostname in groups['masters']


- name: Find downloaded zip files
  find:
    paths: "{{ local_data_path }}"
    patterns: "*.zip"
  register: zip_files
  when:
    - inventory_hostname in groups['masters']

- name: Extract AIS zip files (idempotent)
  unarchive:
    src: "{{ item.path }}"
    dest: "{{ local_data_path }}"
    remote_src: yes
    creates: "{{ item.path | regex_replace('\\.zip$', '.csv') }}"
  loop: "{{ zip_files.files }}"
  when:
    - inventory_hostname in groups['masters']

- name: List local AIS files
  find:
    paths: "{{ local_data_path }}"
    patterns: "*.csv"
  register: local_files
  when:
    - inventory_hostname in groups['masters']


- name: Upload files to HDFS (idempotent)
  become_user: debian
  command: >
    {{ hadoop_home }}/bin/hdfs dfs -put -f {{ item.path }} {{ hdfs_target_dir }}/
  loop: "{{ local_files.files }}"
  register: upload_results
  retries: 3
  delay: 5
  until: upload_results is succeeded
  when:
  - inventory_hostname in groups['masters']

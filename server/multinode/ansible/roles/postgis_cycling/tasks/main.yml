# ---------------------------------------
# 3. Ensure table exists
# ---------------------------------------
# FIX: must run before "Drop final PostGIS table" -- the materialized view built at the end of
# this role depends on ride_points, so Postgres refuses to drop the table on a re-run until the
# view is gone too (same fix as postgis_aviation's "flights").
- name: Drop MobilityDB rides trajectory view
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      DROP MATERIALIZED VIEW IF EXISTS rides;
  when: inventory_hostname in groups['masters']

- name: Drop final PostGIS table
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      DROP TABLE IF EXISTS ride_points;
  when: inventory_hostname in groups['masters']

- name: Create final PostGIS table
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      CREATE TABLE IF NOT EXISTS ride_points (
          id BIGINT,
          rider_id BIGINT,
          timestamp TIMESTAMPTZ,
          geom geometry(Point,3857)
      )
      PARTITION BY RANGE (timestamp);
  when: inventory_hostname in groups['masters']
- name: Distribute final PostGIS table
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      Select create_distributed_table('ride_points', 'id');

      Select create_time_partitions(
        table_name := 'ride_points',
        partition_interval:= '8 hours',
        start_from := '2026-06-01 00:00:00',
        end_at:= '2026-06-04 23:59:59'
      );

  when: inventory_hostname in groups['masters']
    
- name: Create staging table and loop
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      CREATE TABLE IF NOT EXISTS trip_points_raw (
          trip_id BIGINT,
          rider_id BIGINT,
          lat DOUBLE PRECISION,
          lon DOUBLE PRECISION,
          timestamp BIGINT
      );
  when: inventory_hostname in groups['masters']
- name: Process parquet files
  ansible.builtin.include_tasks: process_parquet.yml
  when: inventory_hostname in groups['masters']
  loop: "{{ parquet_files.files }}"
  loop_control:
    label: "{{ item.path }}"
# ---------------------------------------
# 4. Run high-performance loader (venv)
# ---------------------------------------

- name: Create line_geom column in ride_points from point data
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      ALTER TABLE ride_points
      ADD COLUMN IF NOT EXISTS line_geom geometry(LineString, 3857);
  when: inventory_hostname in groups['masters']

- name: Update line_geom column in ride_points from point data
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      UPDATE ride_points t                                                           
      SET line_geom = sub.line_geom
      FROM (
      SELECT
      id,
      ST_MakeLine(
      geom,
      LEAD(geom) OVER (
      PARTITION BY id
      ORDER BY timestamp
      )
      ) AS line_geom
      FROM ride_points
      ) sub
      WHERE t.id = sub.id;


# FIX: ride_points is a Citus-distributed table -- DDL propagated to worker shards goes over a
# prepared statement, which can only ever hold a single SQL command ("cannot insert multiple
# commands into a prepared statement"). Splitting the old semicolon-joined multi-statement query
# into one statement per loop iteration avoids that entirely (same fix as postgis_aviation).
- name: Create final PostGIS table index
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: "{{ item }}"
  loop:
    - "CREATE INDEX IF NOT EXISTS ride_points_geom_idx ON ride_points USING GIST (geom);"
    - "CREATE INDEX IF NOT EXISTS ride_points_timestamp_idx ON ride_points (timestamp);"
    - "CREATE INDEX IF NOT EXISTS ride_points_rideid_idx ON ride_points (id);"
    - "CREATE INDEX IF NOT EXISTS ride_points_riderid_idx ON ride_points (rider_id);"
    - "CREATE INDEX IF NOT EXISTS ride_points_line_geom_idx ON ride_points USING GIST (line_geom);"
  when: inventory_hostname in groups['masters']



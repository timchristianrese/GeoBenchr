
- name: Ensure data directory exists
  ansible.builtin.file:
    path: "{{ cycling_data_dir }}"
    state: directory

- name: Ensure venv directory parent exists
  ansible.builtin.file:
    path: "{{ venv_dir | dirname }}"
    state: directory




- name: Ensure python venv package is installed (Debian/Ubuntu)
  become: true
  ansible.builtin.apt:
    name: "python3-venv"
    state: present
    update_cache: true
  when: inventory_hostname in groups['masters']

# ---------------------------------------
# 1. Sync data
# ---------------------------------------
# FIX: was commented out, so "Find parquet files" below always found zero and everything after it
# silently no-op'd. data_generators/cycling/output/parquet exists but is empty locally, so this
# syncs a small dummy file matching the pipeline's expected schema instead of real data.
- name: Sync sample cycling parquet file to target machine
  ansible.posix.synchronize:
    src: "{{ cycling_sample_parquet_file }}"
    dest: "{{ cycling_data_dir }}/"
  when: inventory_hostname in groups['masters']

- name: Install build dependencies for pg_parquet
  become: true
  ansible.builtin.apt:
    name:
      - git
      - curl
      - build-essential
      - clang
      - pkg-config
      - libssl-dev
      - libpq-dev
      - postgresql-server-dev-all
    state: present
    update_cache: true
  when: inventory_hostname in groups['masters']
- name: Install prerequisites
  become: true
  ansible.builtin.apt:
    name:
      - unzip
      - curl
    state: present
    update_cache: true
  when: inventory_hostname in groups['masters']
# FIX: this play's become: true (play level) also applies to fact-gathering, so ansible_env.HOME
# resolved to /root -- redundantly installing a second DuckDB CLI copy there, separate from the
# one every other role reading DuckDB installs under /home/{{ ansible_user }} (see roles/duckdb's
# own matching fix). Also fixed: two "when:" keys on the same task is valid YAML but the second
# silently overwrites the first, so "not duckdb_installed.stat.exists" was never actually checked
# (harmless here only because `creates:` independently guards against re-running the install).
- name: Check whether DuckDB is installed
  become: false
  ansible.builtin.stat:
    path: "/home/{{ ansible_user }}/.duckdb/cli/latest/duckdb"
  register: duckdb_installed
  when: inventory_hostname in groups['masters']
- name: Install DuckDB CLI
  become: false
  ansible.builtin.shell: |
    curl -fsSL https://install.duckdb.org | sh
  args:
    creates: "/home/{{ ansible_user }}/.duckdb/cli/latest/duckdb"
  when: not duckdb_installed.stat.exists and inventory_hostname in groups['masters']

- name: Ensure duckdb is in PATH by checking if it already is, and if not, adding it to .bashrc
  become: false
  ansible.builtin.shell: |
    if ! echo $PATH | grep -q "/home/{{ ansible_user }}/.duckdb/cli/latest"; then
      echo 'export PATH="/home/{{ ansible_user }}/.duckdb/cli/latest:$PATH"' >> ~/.bashrc
    fi
  args:
    executable: /bin/bash
  when: inventory_hostname in groups['masters']
  
- name: Resource .bashrc to update PATH for current session
  ansible.builtin.shell: |
    source ~/.bashrc
  args:
    executable: /bin/bash
  when: inventory_hostname in groups['masters']

- name: Find parquet files
  ansible.builtin.find:
    paths: "{{ cycling_data_dir }}"
    patterns: "*.parquet"
  register: parquet_files
  when: inventory_hostname in groups['masters']

# ---------------------------------------
# 2. Create virtualenv
# ---------------------------------------
- name: Create Python virtual environment
  ansible.builtin.command: "python3 -m venv {{ venv_dir }}"
  args:
    creates: "{{ venv_dir }}/bin/activate"
  when: inventory_hostname in groups['masters']
# FIX: plain "psycopg2" has no prebuilt wheel matching this venv's Python and falls back to
# compiling from source, which fails outright without python3-dev installed ("fatal error:
# Python.h: No such file or directory") -- psycopg2-binary ships prebuilt wheels and needs no
# compiler/headers at all (the upstream-recommended alternative for exactly this situation).
- name: Install deps with bash
  ansible.builtin.shell: |
    source {{ venv_dir }}/bin/activate
    pip install pandas pyarrow psycopg2-binary
  args:
    executable: /bin/bash
  when: inventory_hostname in groups['masters']

- name: Switch Ansible to venv Python
  ansible.builtin.set_fact:
    ansible_python_interpreter: "{{ venv_dir }}/bin/python"
  when: inventory_hostname in groups['masters']


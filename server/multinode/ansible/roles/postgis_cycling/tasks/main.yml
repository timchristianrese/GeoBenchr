# FIX: MobilityDB's read queries (countRideInDistrict, CountRidesFullyInDistrictRadius,
# RidesAcrossMultipleHours, RidesDuringRushHourInPeriod, RidesPastOrToUniversityInPeriod -- see
# benchmark/configuration/cycling/config/combinedBenchConf.yaml) all read from "rides", a
# one-row-per-ride trajectory table (trip tgeompoint) -- nothing built it, so every one of those
# queries failed with "relation rides does not exist". Materialized (not a plain view) for the
# same reason as postgis_aviation's "flights" -- ride_points is ~915M rows, so recomputing this
# aggregation per query is not an option. ride_points.timestamp is already timestamptz, so it is
# used as-is (an earlier `AT TIME ZONE 'UTC'` here turned it into naive UTC wall-clock that
# tgeompoint() then re-read as Berlin time, shifting every trajectory -2h -- fixed 2026-10-01).
# Dedup on (id, timestamp) -- a small ~0.13%-of-rows amount
# here, consistent with GPS sampling noise rather than a loading bug.
- name: Build MobilityDB rides trajectory view
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      DROP MATERIALIZED VIEW IF EXISTS rides;
      CREATE MATERIALIZED VIEW rides AS
      WITH deduped AS (
        SELECT DISTINCT ON (id, timestamp) id, geom, timestamp AS ts
        FROM ride_points
        ORDER BY id, timestamp
      )
      SELECT id,
             tgeompointseq(array_agg(tgeompoint(geom, ts) ORDER BY ts)) AS trip
      FROM deduped
      GROUP BY id;
  when: inventory_hostname in groups['masters']

# FIX: see postgis_aviation's matching FIX comment -- confirmed live, an eintersects(r.trip,
# d.geom) spatial join against "rides" (50M rows) with no index took 10+ minutes doing a full
# sequential scan. MobilityDB supports a plain GiST index on a tgeompoint column.
- name: Build spatiotemporal index on rides trajectory view
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      CREATE INDEX IF NOT EXISTS rides_trip_gist_idx ON rides USING gist (trip);
  when: inventory_hostname in groups['masters']

- name: Swap python interpreter back to system Python
  ansible.builtin.set_fact:
    ansible_python_interpreter: /usr/bin/python3
  when: inventory_hostname in groups['masters']
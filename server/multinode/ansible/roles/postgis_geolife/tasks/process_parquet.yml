# FIX: ansible_env.HOME resolves to /root under this play's become: true, but the duckdb CLI
# this role installs (main.yml's "Install DuckDB CLI", same fix applied there) lands under
# /home/{{ ansible_user }}.
- name: Load parquet into staging (DuckDB → Postgres)
  ansible.builtin.shell: |
    set -euo pipefail

    /home/{{ ansible_user }}/.duckdb/cli/latest/duckdb <<EOF
    LOAD postgres;

    ATTACH
      'host={{ db_host }}
       dbname={{ db_name }}
       user={{ db_user }}
       port={{ db_port }}
       password={{ db_password }}'
    AS pg (TYPE postgres);

    INSERT INTO pg.public.geolife_points_raw
    SELECT
        UserId,
        CheckinTime,
        VenueId,
        VenueType,
        Latitude,
        Longitude
    FROM read_parquet('{{ item.path }}');
    EOF
  args:
    executable: /bin/bash

- name: Move staging data into production table
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      INSERT INTO geolife_points (
          id,
          timestamp,
          venue_id,
          venue_type,
          lat,
          lon,
          geom
      )
      SELECT
          id,
          timestamp,
          venue_id,
          venue_type,
          lat,
          lon,
          ST_Transform(ST_SetSRID(ST_MakePoint(lon, lat), 4326), 3857)
      FROM geolife_points_raw;

      TRUNCATE TABLE geolife_points_raw;
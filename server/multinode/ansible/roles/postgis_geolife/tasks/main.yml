
- name: Ensure data directory exists
  ansible.builtin.file:
    path: "{{ geolife_data_dir }}"
    state: directory

- name: Ensure venv directory parent exists
  ansible.builtin.file:
    path: "{{ venv_dir | dirname }}"
    state: directory




- name: Ensure python venv package is installed (Debian/Ubuntu)
  become: true
  ansible.builtin.apt:
    name: "python3-venv"
    state: present
    update_cache: true
  when: inventory_hostname in groups['masters']

# ---------------------------------------
# 1. Sync data
# ---------------------------------------
# FIX: no sync task existed at all here (not even a commented-out one, unlike the other
# postgis_* roles) -- "Find parquet files" below always found zero and everything after it
# silently no-op'd. data_generator_geolife/synthetic_output exists but is empty locally, so this
# syncs a small dummy file matching the pipeline's expected schema instead of real data.
- name: Sync sample geolife parquet file to target machine
  ansible.posix.synchronize:
    src: "{{ geolife_sample_parquet_file }}"
    dest: "{{ geolife_data_dir }}/"
  when: inventory_hostname in groups['masters']

- name: Install build dependencies for pg_parquet
  become: true
  ansible.builtin.apt:
    name:
      - git
      - curl
      - build-essential
      - clang
      - pkg-config
      - libssl-dev
      - libpq-dev
      - postgresql-server-dev-all
    state: present
    update_cache: true
  when: inventory_hostname in groups['masters']
- name: Install prerequisites
  become: true
  ansible.builtin.apt:
    name:
      - unzip
      - curl
    state: present
    update_cache: true
  when: inventory_hostname in groups['masters']
# FIX: this play's become: true (play level) also applies to fact-gathering, so ansible_env.HOME
# resolved to /root -- redundantly installing a second DuckDB CLI copy there, separate from the
# one every other role reading DuckDB installs under /home/{{ ansible_user }} (see roles/duckdb's
# own matching fix). Also fixed: two "when:" keys on the same task is valid YAML but the second
# silently overwrites the first, so "not duckdb_installed.stat.exists" was never actually checked
# (harmless here only because `creates:` independently guards against re-running the install).
- name: Check whether DuckDB is installed
  become: false
  ansible.builtin.stat:
    path: "/home/{{ ansible_user }}/.duckdb/cli/latest/duckdb"
  register: duckdb_installed
  when: inventory_hostname in groups['masters']
- name: Install DuckDB CLI
  become: false
  ansible.builtin.shell: |
    curl -fsSL https://install.duckdb.org | sh
  args:
    creates: "/home/{{ ansible_user }}/.duckdb/cli/latest/duckdb"
  when: not duckdb_installed.stat.exists and inventory_hostname in groups['masters']

- name: Ensure duckdb is in PATH by checking if it already is, and if not, adding it to .bashrc
  become: false
  ansible.builtin.shell: |
    if ! echo $PATH | grep -q "/home/{{ ansible_user }}/.duckdb/cli/latest"; then
      echo 'export PATH="/home/{{ ansible_user }}/.duckdb/cli/latest:$PATH"' >> ~/.bashrc
    fi
  args:
    executable: /bin/bash
  when: inventory_hostname in groups['masters']
  
- name: Resource .bashrc to update PATH for current session
  ansible.builtin.shell: |
    source ~/.bashrc
  args:
    executable: /bin/bash
  when: inventory_hostname in groups['masters']
# ------------------------------------
# 2. Create virtualenv
# ---------------------------------------
- name: Create Python virtual environment
  ansible.builtin.command: "python3 -m venv {{ venv_dir }}"
  args:
    creates: "{{ venv_dir }}/bin/activate"
  when: inventory_hostname in groups['masters']
- name: Install deps with bash
  ansible.builtin.shell: |
    source {{ venv_dir }}/bin/activate
    pip install pandas pyarrow psycopg2
  args:
    executable: /bin/bash
  when: inventory_hostname in groups['masters']

- name: Switch Ansible to venv Python
  ansible.builtin.set_fact:
    ansible_python_interpreter: "{{ venv_dir }}/bin/python"
  when: inventory_hostname in groups['masters']

- name: Drop final PostGIS table
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      DROP TABLE IF EXISTS geolife_points;
  when: inventory_hostname in groups['masters']

- name: Drop staging PostGIS table
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      DROP TABLE IF EXISTS geolife_points_raw;
  when: inventory_hostname in groups['masters']

- name: Create staging PostGIS table
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      CREATE TABLE IF NOT EXISTS geolife_points_raw (
          id BIGINT,
          timestamp TIMESTAMP,
          venue_id BIGINT,
          venue_type TEXT,
          lat DOUBLE PRECISION,
          lon DOUBLE PRECISION
      );
  when: inventory_hostname in groups['masters']

- name: Create final PostGIS table
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      CREATE TABLE IF NOT EXISTS geolife_points (
          id BIGINT,
          timestamp TIMESTAMP,
          venue_id BIGINT,
          venue_type TEXT,
          lat DOUBLE PRECISION,
          lon DOUBLE PRECISION,
          geom geometry(Point, 3857)
      )
      PARTITION BY RANGE (timestamp)
      ;
  when: inventory_hostname in groups['masters']

- name: Distribute final PostGIS table
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}" 
    login_db: "{{ db_name }}"
    query: |
      Select create_distributed_table('geolife_points', 'id');

      SELECT create_time_partitions(
        table_name := 'geolife_points',
        partition_interval := '2 hours',
        start_from := '2019-07-01 00:00:00',
        end_at:= '2019-07-31 23:59:59'
      );
  when: inventory_hostname in groups['masters']

- name: Find parquet files
  ansible.builtin.find:
    paths: "{{ geolife_data_dir }}"
    patterns: "*.parquet"
  register: parquet_files
  when: inventory_hostname in groups['masters']

- name: Process parquet files
  ansible.builtin.include_tasks: process_parquet.yml
  when: inventory_hostname in groups['masters']
  loop: "{{ parquet_files.files }}"
  loop_control:
    label: "{{ item.path }}"




# ---------------------------------------
# 4. Run high-performance loader (venv)
# ---------------------------------------

# FIX: geolife_points is a Citus-distributed table -- DDL propagated to worker shards goes over a
# prepared statement, which can only ever hold a single SQL command ("cannot insert multiple
# commands into a prepared statement"). Splitting the old semicolon-joined multi-statement query
# into one statement per loop iteration avoids that entirely (same fix as postgis_aviation).
- name: Create final PostGIS table index
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: "{{ item }}"
  loop:
    - "CREATE INDEX IF NOT EXISTS geolife_points_geom_idx ON geolife_points USING GIST (geom);"
    - "CREATE INDEX IF NOT EXISTS geolife_points_timestmp_idx ON geolife_points (timestamp);"
    - "CREATE INDEX IF NOT EXISTS geolife_points_userid_idx ON geolife_points (id);"
    - "CREATE INDEX IF NOT EXISTS geolife_points_venueid_idx ON geolife_points (venue_id);"
  when: inventory_hostname in groups['masters']



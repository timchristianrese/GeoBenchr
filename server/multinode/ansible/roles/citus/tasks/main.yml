#     sudo apt update
- name: Add PG server dev
  ansible.builtin.apt:
    name: postgresql-server-dev-{{ postgres_version }}
    state: present
  become: true

- name: Add libpq-dev
  ansible.builtin.apt:
    name: libpq-dev
    state: present
  become: true

- name: Add libsafec-dev
  ansible.builtin.apt:
    name: libsafec-dev
    state: present
  become: true

- name: Download Citus repo script
  ansible.builtin.get_url:
    url: https://install.citusdata.com/community/deb.sh
    dest: /tmp/deb_citus.sh
    mode: '0755'

- name: Add Citus repository (runs once)
  ansible.builtin.shell: bash /tmp/deb_citus.sh
  args:
    creates: /etc/apt/sources.list.d/citusdata.list


- name: Update apt cache after adding repos
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  become: true

- name: Install Citus
  ansible.builtin.apt:
    name: postgresql-{{ postgres_version }}-citus-{{ citus_version }}
    state: present
  become: true



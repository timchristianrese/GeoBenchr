- name: Configure PostgreSQL to load Citus extension
  ansible.builtin.command: "sudo pg_conftool {{ postgres_version }} main set shared_preload_libraries citus"

- name: Restart PostgreSQL to apply changes
  ansible.builtin.service:
    name: postgresql
    state: restarted
  become: true
  
- name: Ensure Citus extension is installed in the database
  ansible.builtin.shell: |
    sudo -u postgres psql -c "CREATE EXTENSION IF NOT EXISTS citus;"

- name: Register workers with Citus coordinator
  become: true
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
  vars:
    worker_nodes: "{{ groups['workers'] }}"
  loop: "{{ worker_nodes }}"
  loop_control:
    loop_var: worker
  shell: |
    sudo -u postgres psql -tAc "
    SELECT * FROM citus_add_node('{{ worker }}', 5433);"
  
- name: Run verification to see if all workers are registered
  become: true
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
  shell: |
    sudo -u postgres psql -c "SELECT * FROM citus_get_active_worker_nodes();"
- name: Ensure /tmp exists for repo scripts
  file:
    path: /tmp
    state: directory
- name: Clean any apt lists to avoid conflicts
  ansible.builtin.shell: | 
   sudo apt clean
    sudo rm -rf /var/lib/apt/lists/*
    sudo apt update

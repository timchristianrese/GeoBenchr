# -------------------------
# INSTALL SPARK
# -------------------------
- name: Create Spark directory
  file:
    path: /opt/spark
    state: directory

- name: Instead of uploading, download Spark tarball directly on the server (if not already present)
  get_url:
    url: "https://dlcdn.apache.org/spark/spark-{{ spark_version }}/spark-{{ spark_version }}-bin-hadoop3.tgz"
    dest: /opt/spark-{{ spark_version }}-bin-hadoop3.tgz
    mode: '0644'
    # FIX: see roles/hadoop's matching FIX comment -- get_url's default 10s timeout covers the
    # whole transfer, not just connection setup, and 5 nodes downloading a ~400MB tarball at once
    # over one shared NAT'd uplink routinely exceeds it even though the server itself responds
    # instantly to a single uncontended request.
    timeout: 300

# - name: Upload Spark tarball
#   copy:
#     src: spark-{{ spark_version }}-bin-hadoop3.tgz
#     dest: /opt/

- name: Extract Spark
  unarchive:
    src: /opt/spark-{{ spark_version }}-bin-hadoop3.tgz
    dest: /opt/
    remote_src: yes
    creates: /opt/spark-{{ spark_version }}-bin-hadoop3



- name: Fix ownership
  file:
    path: /opt/spark-{{ spark_version }}-bin-hadoop3
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    recurse: yes

- name: Create Spark symlink
  file:
    src: /opt/spark-{{ spark_version }}-bin-hadoop3
    dest: /opt/spark
    state: link
    force: yes

# -------------------------
# ENVIRONMENT VARIABLES
# -------------------------
- name: Set Spark environment variables
  copy:
    dest: /etc/profile.d/spark.sh
    content: |
      export SPARK_HOME=/opt/spark
      export PATH=$PATH:$SPARK_HOME/bin:$SPARK_HOME/sbin
      export HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
      export YARN_CONF_DIR=/opt/hadoop/etc/hadoop

# -------------------------
# CONFIGURATION FILES
# -------------------------
- name: Configure spark-env.sh
  template:
    src: spark-env.sh.j2
    dest: /opt/spark/conf/spark-env.sh
    mode: '0755'

- name: Configure spark-defaults.conf
  template:
    src: spark-defaults.conf.j2
    dest: /opt/spark/conf/spark-defaults.conf

- name: Configure Spark to use uv Python env
  blockinfile:
    path: /opt/spark/conf/spark-defaults.conf
    block: |
      spark.pyspark.python /opt/venvs/sedona/bin/python
      spark.pyspark.driver.python /opt/venvs/sedona/bin/python
      spark.executorEnv.PYSPARK_PYTHON=/opt/venvs/sedona/bin/python

- name: Set Python env for YARN containers
  blockinfile:
    path: /opt/spark/conf/spark-defaults.conf
    block: |
      spark.yarn.appMasterEnv.PYSPARK_PYTHON=/opt/venvs/sedona/bin/python

# -------------------------
# CREATE LOG DIR
# -------------------------
- name: Ensure Spark log directory exists
  file:
    path: /opt/spark/logs
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Create Spark log dir in HDFS
  command: /opt/hadoop/bin/hdfs dfs -mkdir -p /spark-logs
  become_user: "{{ ansible_user }}"
  run_once: true

- name: Set permissions for Spark logs
  command: /opt/hadoop/bin/hdfs dfs -chmod 777 /spark-logs
  become_user: "{{ ansible_user }}"
  run_once: true

- name: Download Postgres JDBC driver to Spark jars directory (if not already present)
  get_url:
    url: "https://jdbc.postgresql.org/download/{{ postgres_jdbc_jar }}"
    dest: "{{ spark_home }}/jars/{{ postgres_jdbc_jar }}"
    mode: '0644'

- name: Test Spark installation
  command: /opt/spark/bin/spark-submit --version
  become_user: "{{ ansible_user }}"

# -------------------------
# EXTERNAL SHUFFLE SERVICE (dynamic allocation's hard requirement)
# -------------------------
# NEW: spark.dynamicAllocation.enabled (set below in spark-defaults.conf) needs every NodeManager
# running Spark's external shuffle service as a YARN aux-service -- without it, releasing an idle
# executor would lose any shuffle data it was still serving, so Spark refuses to enable dynamic
# allocation at all without this in place first. The shuffle jar only exists once Spark itself is
# installed (above), so this can't live in roles/hadoop -- that role runs, and starts YARN, before
# Spark is ever installed, and hadoop.yml needs to keep working fine on its own with no Spark role
# involved at all.
- name: Copy Spark's YARN shuffle service jar onto the Hadoop NodeManager classpath
  become: true
  ansible.builtin.copy:
    src: "{{ spark_home }}/yarn/spark-{{ spark_version }}-yarn-shuffle.jar"
    dest: "{{ hadoop_home }}/share/hadoop/yarn/lib/spark-{{ spark_version }}-yarn-shuffle.jar"
    remote_src: true
    mode: '0644'
  notify: restart yarn nodemanagers

- name: Register the Spark shuffle service in yarn-site.xml's aux-services list
  become: true
  ansible.builtin.lineinfile:
    path: "{{ hadoop_home }}/etc/hadoop/yarn-site.xml"
    regexp: '^\s*<value>mapreduce_shuffle</value>\s*$'
    line: "    <value>mapreduce_shuffle,spark_shuffle</value>"
  notify: restart yarn nodemanagers

- name: Register the Spark shuffle service's implementation class in yarn-site.xml
  become: true
  ansible.builtin.blockinfile:
    path: "{{ hadoop_home }}/etc/hadoop/yarn-site.xml"
    marker: "  <!-- {mark} SPARK SHUFFLE SERVICE -->"
    insertbefore: '</configuration>'
    block: |
      <property>
        <name>yarn.nodemanager.aux-services.spark_shuffle.class</name>
        <value>org.apache.spark.network.yarn.YarnShuffleService</value>
      </property>
  notify: restart yarn nodemanagers
- name: Synchronize supporting datasets to the target node, found in supporting_dataset_path
  ansible.builtin.synchronize:
    src: "{{ local_supporting_dataset_path }}/"
    dest: "{{ supporting_dataset_path }}"
    recursive: yes
    delete: no
  when: inventory_hostname in groups['masters']

# FIX: process_parquet.yml below (islands loading) uses the DuckDB CLI, but this role -- unlike
# postgis_aviation/postgis_ais/postgis_cycling/postgis_geolife -- never actually installed it
# itself, only ever working by accident when one of those roles happened to run first on the same
# node in the same playbook (e.g. playbooks/all.yml). Running sync_supporting_datasets.yml on its
# own against a fresh node failed outright. Installing it here too (become: false, matching every
# other role's fix for the same become:true-leaks-into-fact-gathering issue) makes this role
# self-sufficient.
- name: Check whether DuckDB is installed
  become: false
  ansible.builtin.stat:
    path: "/home/{{ ansible_user }}/.duckdb/cli/latest/duckdb"
  register: duckdb_installed
  when: inventory_hostname in groups['masters']

- name: Install DuckDB CLI
  become: false
  ansible.builtin.shell: |
    curl -fsSL https://install.duckdb.org | sh
  args:
    creates: "/home/{{ ansible_user }}/.duckdb/cli/latest/duckdb"
  when: inventory_hostname in groups['masters'] and not duckdb_installed.stat.exists

# FIX: process_parquet.yml's "LOAD postgres;"/"LOAD spatial;" expect these extensions available
# without ever touching the network -- DuckDB's Postgres scanner is now named "postgres_scanner"
# (renamed upstream; process_parquet.yml still used the old "postgres" LOAD name), and even the
# correct name auto-installs over the network on first LOAD, which hangs indefinitely on
# nst-cluster hardware specifically (DNS for extensions.duckdb.org returns a working IPv4 address
# alongside an IPv6 one whose route is black-holed there -- SYNs vanish instead of being rejected;
# DuckDB's installer, unlike curl, never falls back to IPv4). Pre-fetch both explicitly over IPv4
# into the exact cache path DuckDB's own INSTALL would use, matching roles/duckdb's identical fix
# for the quack extension -- harmless/no-op anywhere this network problem doesn't exist.
- name: Determine installed DuckDB CLI version (extension cache path is versioned by it)
  become: false
  ansible.builtin.command: "/home/{{ ansible_user }}/.duckdb/cli/latest/duckdb --version"
  register: duckdb_cli_version_output
  changed_when: false
  when: inventory_hostname in groups['masters']

- name: Ensure the DuckDB extension cache directory exists
  become: false
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.duckdb/extensions/{{ duckdb_cli_version_output.stdout.split()[0] }}/linux_amd64"
    state: directory
    mode: '0755'
  when: inventory_hostname in groups['masters']

- name: Pre-fetch DuckDB extensions this role needs, over IPv4
  become: false
  ansible.builtin.shell: >-
    test -f "/home/{{ ansible_user }}/.duckdb/extensions/{{ duckdb_cli_version_output.stdout.split()[0] }}/linux_amd64/{{ item.load_name }}.duckdb_extension"
    || curl -4 -fsSL "http://extensions.duckdb.org/{{ duckdb_cli_version_output.stdout.split()[0] }}/linux_amd64/{{ item.fetch_name }}.duckdb_extension.gz"
    | gunzip > "/home/{{ ansible_user }}/.duckdb/extensions/{{ duckdb_cli_version_output.stdout.split()[0] }}/linux_amd64/{{ item.load_name }}.duckdb_extension"
  loop:
    - { load_name: postgres_scanner, fetch_name: postgres_scanner }
    - { load_name: spatial, fetch_name: spatial }
  loop_control:
    label: "{{ item.load_name }}"
  when: inventory_hostname in groups['masters']

# FIX: this role assumed venv_dir already existed -- it's only ever created by postgis_aviation/
# postgis_cycling's "Create Python virtual environment" task. Running this role on its own (e.g.
# via playbooks/sync_supporting_datasets.yml without first running one of those) had no venv to
# activate, so "source {{ venv_dir }}/bin/activate" failed with "No such file or directory".
- name: Ensure python venv package is installed (Debian/Ubuntu)
  become: true
  ansible.builtin.apt:
    name: "python3-venv"
    state: present
    update_cache: true
  when: inventory_hostname in groups['masters']

- name: Create Python virtual environment
  ansible.builtin.command: "python3 -m venv {{ venv_dir }}"
  args:
    creates: "{{ venv_dir }}/bin/activate"
  when: inventory_hostname in groups['masters']

# FIX: plain "psycopg2" has no prebuilt wheel matching this venv's Python and falls back to
# compiling from source, which fails outright without python3-dev installed ("fatal error:
# Python.h: No such file or directory") -- psycopg2-binary ships prebuilt wheels and needs no
# compiler/headers at all (the upstream-recommended alternative for exactly this situation).
- name: Install deps with bash
  ansible.builtin.shell: |
    source {{ venv_dir }}/bin/activate
    pip install pandas pyarrow psycopg2-binary
  args:
    executable: /bin/bash
  when: inventory_hostname in groups['masters']

- name: Switch Ansible to venv Python
  ansible.builtin.set_fact:
    ansible_python_interpreter: "{{ venv_dir }}/bin/python"
  when: inventory_hostname in groups['masters']

- name: Create supporting dataset tables in Postgres
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      DROP TABLE IF EXISTS universities_staging;
      DROP TABLE IF EXISTS berlin_districts_staging;
      DROP TABLE IF EXISTS counties_staging;
      DROP TABLE IF EXISTS islands_staging;

      DROP TABLE IF EXISTS universities CASCADE;
      DROP TABLE IF EXISTS berlin_districts;
      DROP TABLE IF EXISTS counties;
      DROP TABLE IF EXISTS cities;
      DROP TABLE IF EXISTS harbours;
      DROP TABLE IF EXISTS islands;
      
      CREATE TABLE IF NOT EXISTS universities_staging (
        name TEXT,
        geom TEXT
      );
      CREATE TABLE IF NOT EXISTS berlin_districts_staging (
        name TEXT,
        geom TEXT
      );
      CREATE TABLE IF NOT EXISTS counties_staging (
        name TEXT,
        geom TEXT
      );


      CREATE TABLE IF NOT EXISTS islands_staging (
        id INT,
        name TEXT,
        geom geometry(Geometry, 4326)
      );

      CREATE TABLE IF NOT EXISTS universities (
        name TEXT,
        geom Geometry(MultiPolygon, 3857)
      );
      CREATE TABLE IF NOT EXISTS berlin_districts (
        name TEXT,
        geom Geometry(Polygon, 3857)
      );
      CREATE TABLE IF NOT EXISTS counties (
        name TEXT,
        geom Geometry(Polygon, 3857)
      );
      CREATE TABLE IF NOT EXISTS cities (
          area DOUBLE PRECISION,
          lat DOUBLE PRECISION,
          lon DOUBLE PRECISION,
          geom geometry(Point, 3857)
              GENERATED ALWAYS AS (
                  ST_Transform(ST_SetSRID(ST_MakePoint(lon, lat), 4326), 3857)
              ) STORED,
          district TEXT,
          name TEXT,
          population INTEGER
      );
      CREATE TABLE IF NOT EXISTS harbours (
        country TEXT,
        location TEXT,
        name TEXT,
        lat DOUBLE PRECISION,
        lon DOUBLE PRECISION,
        geom geometry(Point, 3857)
            GENERATED ALWAYS AS (
                ST_Transform(ST_SetSRID(ST_MakePoint(lon, lat), 4326), 3857)
            ) STORED
      );
      CREATE TABLE islands (
          id INT,
          name TEXT,
          geom Geometry(Geometry, 3857)
      );

      SELECT create_reference_table('universities');
      SELECT create_reference_table('berlin_districts');
      SELECT create_reference_table('counties');
      SELECT create_reference_table('cities');
      SELECT create_reference_table('harbours');
      SELECT create_reference_table('islands');
  
  when: inventory_hostname in groups['masters']

- name: Load supporting datasets into Postgres
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: |
      COPY universities_staging(name, geom)
      FROM '{{ supporting_dataset_path }}/universities-wkt-simplified.csv'
      DELIMITER ';'
      CSV HEADER; 

      COPY berlin_districts_staging(name, geom)
      FROM '{{ supporting_dataset_path }}/berlin-districts-wkt-simplified.csv'
      DELIMITER ';'
      CSV HEADER;

      COPY counties_staging(name, geom)
      FROM '{{ supporting_dataset_path }}/counties-wkt-simplified.csv'
      DELIMITER ';'
      CSV HEADER;

      INSERT INTO universities(name, geom)
      SELECT name, ST_Transform(ST_SetSRID(ST_GeomFromText(geom), 4326), 3857) FROM universities_staging;

      INSERT INTO berlin_districts(name, geom)
      SELECT name, ST_Transform(ST_SetSRID(ST_GeomFromText(geom), 4326), 3857) FROM berlin_districts_staging;

      INSERT INTO counties(name, geom)
      SELECT name, ST_Transform(ST_SetSRID(ST_GeomFromText(geom), 4326), 3857) FROM counties_staging;

      COPY cities(area, lat, lon, district, name, population)
      FROM '{{ supporting_dataset_path }}/cities.csv'
      DELIMITER ','
      CSV HEADER;

      COPY harbours(country, location, name, lat, lon)
      FROM '{{ supporting_dataset_path }}/filtered_ports.csv'
      DELIMITER ','
      CSV HEADER;
  when: inventory_hostname in groups['masters']

- name: Load combined parquet into Postgres using DuckDB
  ansible.builtin.include_tasks: process_parquet.yml
  when: inventory_hostname in groups['masters']

- name: Add geom indexes to Postgres supporting dataset tables
  community.postgresql.postgresql_query:
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_port: "{{ db_port }}"
    login_password: "{{ db_password }}"
    login_db: "{{ db_name }}"
    query: "CREATE INDEX IF NOT EXISTS {{ item.name }}_geom_idx ON {{ item.table }} USING GIST (geom);"
  loop:
    - { table: universities, name: universities }
    - { table: berlin_districts, name: berlin_districts }
    - { table: counties, name: counties }
    - { table: cities, name: cities }
    - { table: harbours, name: harbours }
    - { table: islands, name: islands }
  when: inventory_hostname in groups['masters']


- name: Swap python interpreter back to system Python
  ansible.builtin.set_fact:
    ansible_python_interpreter: /usr/bin/python3
  when: inventory_hostname in groups['masters']

- name: Drop local and distributed tables in ClickHouse if they exist
  shell: >
    clickhouse-client --port {{ ch_port }} --query 'DROP TABLE IF EXISTS universities_local ON CLUSTER cluster_1'

    clickhouse-client --port {{ ch_port }} --query 'DROP TABLE IF EXISTS berlin_districts_local ON CLUSTER cluster_1'

    clickhouse-client --port {{ ch_port }} --query 'DROP TABLE IF EXISTS counties_local ON CLUSTER cluster_1'

    clickhouse-client --port {{ ch_port }} --query 'DROP TABLE IF EXISTS cities_local ON CLUSTER cluster_1'

    clickhouse-client --port {{ ch_port }} --query 'DROP TABLE IF EXISTS harbours_local ON CLUSTER cluster_1'

    clickhouse-client --port {{ ch_port }} --query 'DROP TABLE IF EXISTS islands_local ON CLUSTER cluster_1'

    clickhouse-client --port {{ ch_port }} --query 'DROP TABLE IF EXISTS universities ON CLUSTER cluster_1'

    clickhouse-client --port {{ ch_port }} --query 'DROP TABLE IF EXISTS berlin_districts ON CLUSTER cluster_1'

    clickhouse-client --port {{ ch_port }} --query 'DROP TABLE IF EXISTS counties ON CLUSTER cluster_1'

    clickhouse-client --port {{ ch_port }} --query 'DROP TABLE IF EXISTS cities ON CLUSTER cluster_1'

    clickhouse-client --port {{ ch_port }} --query 'DROP TABLE IF EXISTS harbours ON CLUSTER cluster_1'

    clickhouse-client --port {{ ch_port }} --query 'DROP TABLE IF EXISTS islands ON CLUSTER cluster_1'
    
  when: inventory_hostname in groups['masters']
  become_user: "{{ ansible_user }}"


- name: Create local tables in ClickHouse
  command:
    argv:
      - clickhouse-client
      - --port
      - "{{ ch_port }}"
      - --query
      - "{{ item }}"
  loop:
    - |
      CREATE TABLE IF NOT EXISTS universities_local ON CLUSTER cluster_1 (
          name String,
          geom Geometry
      )
      ENGINE = MergeTree()
      PARTITION BY tuple()
      ORDER BY name;
    - |
      CREATE TABLE IF NOT EXISTS berlin_districts_local ON CLUSTER cluster_1 (
          name String,
          geom Geometry
      )
      ENGINE = MergeTree()
      PARTITION BY tuple()
      ORDER BY name;
    - |
      CREATE TABLE IF NOT EXISTS counties_local ON CLUSTER cluster_1 (
          name String,
          geom Geometry
      )
      ENGINE = MergeTree()
      PARTITION BY tuple()
      ORDER BY name;
    - |
      CREATE TABLE IF NOT EXISTS cities_local ON CLUSTER cluster_1 (
          area Float64,
          lat Float64,
          lon Float64,
          geom Point MATERIALIZED (lon, lat),
          district String,
          name String,
          population UInt64
      )
      ENGINE = MergeTree()
      PARTITION BY tuple()
      ORDER BY name;
    - |
      CREATE TABLE IF NOT EXISTS harbours_local ON CLUSTER cluster_1 (
          country String,
          location String,
          name String,
          lat Float64,
          lon Float64,
          geom Point MATERIALIZED (lon, lat)
      )
      ENGINE = MergeTree()
      PARTITION BY tuple()
      ORDER BY name;
    - |
      CREATE TABLE IF NOT EXISTS islands_local ON CLUSTER cluster_1 (
          id Int32,
          name String,
          geom Geometry
      )
      ENGINE = MergeTree()
      PARTITION BY tuple()
      ORDER BY name;

  when: inventory_hostname in groups['masters']


- name: Create the distributed tables in ClickHouse
  shell: >
    clickhouse-client --port {{ ch_port }} --query '
    CREATE TABLE IF NOT EXISTS universities ON CLUSTER cluster_1 AS universities_local
    ENGINE = Distributed(cluster_1, default, universities_local, rand());
    '

    clickhouse-client --port {{ ch_port }} --query '
    CREATE TABLE IF NOT EXISTS berlin_districts ON CLUSTER cluster_1 as berlin_districts_local
    ENGINE = Distributed(cluster_1, default, berlin_districts_local, rand());
    '

    clickhouse-client --port {{ ch_port }} --query '
    CREATE TABLE IF NOT EXISTS counties ON CLUSTER cluster_1 AS counties_local
    ENGINE = Distributed(cluster_1, default, counties_local, rand());
    '

    clickhouse-client --port {{ ch_port }} --query '
    CREATE TABLE IF NOT EXISTS cities ON CLUSTER cluster_1 AS cities_local
    ENGINE = Distributed(cluster_1, default, cities_local, rand());
    '

    clickhouse-client --port {{ ch_port }} --query '
    CREATE TABLE IF NOT EXISTS harbours ON CLUSTER cluster_1 AS harbours_local
    ENGINE = Distributed(cluster_1, default, harbours_local, rand());
    '

    clickhouse-client --port {{ ch_port }} --query '
    CREATE TABLE IF NOT EXISTS islands ON CLUSTER cluster_1 AS islands_local
    ENGINE = Distributed(cluster_1, default, islands_local, rand());
    '
  when: inventory_hostname in groups['masters']
  become_user: "{{ ansible_user }}"

- name: Load supporting datasets into ClickHouse using clickhouse-client CSV import
  shell: 
    clickhouse-client --input_format_csv_skip_first_lines 1 --format-csv-delimiter=',' --port {{ ch_port }} --query "
    INSERT INTO cities 
    FROM INFILE '{{ supporting_dataset_path }}/cities.csv'
    FORMAT CSV
    "

    clickhouse-client --input_format_csv_skip_first_lines 1 --format-csv-delimiter=',' --port {{ ch_port }} --query "
    INSERT INTO harbours 
    FROM INFILE '{{ supporting_dataset_path }}/filtered_ports.csv'
    FORMAT CSV
    "

    clickhouse-client --port {{ ch_port }} --query "
    INSERT INTO islands 
    SELECT 
      id as id,
      featurecla as name,
      geometry as geom
    FROM file('{{ supporting_dataset_path }}/islands_coastlines.parquet', Parquet)
    "

    clickhouse-client --port {{ ch_port }} --query "
    INSERT INTO berlin_districts
    SELECT 
      name,
      geometry as geom
    FROM file('{{ supporting_dataset_path }}/berlin_districts.parquet', Parquet)
    "

    clickhouse-client --port {{ ch_port }} --query "
    INSERT INTO counties
    SELECT 
      name,
      geometry as geom
    FROM file('{{ supporting_dataset_path }}/counties.parquet', Parquet)
    "

    clickhouse-client --port {{ ch_port }} --query "
    INSERT INTO universities
    SELECT 
      name,
      geometry as geom
    FROM file('{{ supporting_dataset_path }}/universities.parquet', Parquet)
    "


    
    # clickhouse-client --input_format_csv_skip_first_lines 1 --format-csv-delimiter=';' --port {{ ch_port }} --query "
    # INSERT INTO universities 
    # FROM INFILE '{{ supporting_dataset_path }}/universities-wkt-simplified.csv'
    # FORMAT CSV
    # "
  when: inventory_hostname in groups['masters']
  become_user: "{{ ansible_user }}"
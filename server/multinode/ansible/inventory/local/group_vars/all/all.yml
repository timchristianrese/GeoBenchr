# group_vars/all.yml

ansible_user: debian
# ansible_ssh_common_args: >-
#       -o ProxyJump=debian@141.23.28.216
ansible_python_interpreter: /usr/bin/python3

postgres_version: 17
mbdb_db_name: postgres
mbdb_db_user: postgres
mbdb_db_password: postgres
citus_version: 14.1

spark_home: /opt/spark

sedona_jar: sedona-spark-shaded-4.0_2.13-1.8.1.jar
geotools_jar: geotools-wrapper-1.8.1-33.1.jar

postgres_host: "{{ groups['masters'][0] }}"
db_name: postgres
db_user: postgres
db_password: postgres

postgres_jdbc_jar: postgresql-42.7.9.jar

pg_hba_conf_path: /etc/postgresql/{{ postgres_version }}/main/pg_hba.conf

cycling_data_dir: "{{ ansible_env.HOME }}/data/cycling"
aviation_data_dir: "/var/lib/data/aviation"
ais_data_dir: "/var/lib/data/ais"


geolife_data_dir: /var/lib/data/geolife


clickhouse_data_dir: /var/lib/data
clickhouse_cycling_data_dir: /var/lib/data/cycling
clickhouse_aviation_data_dir: /var/lib/data/aviation

# FIX: was a hardcoded absolute macOS path -- ansible-playbook must be run from wherever this repo
# is actually checked out (a different control machine every time this project's been moved to
# one, per this session's own experience), and this is the only variable in this file that was
# still hardcoded that way. playbook_dir (an Ansible "magic variable" -- always the directory of
# whichever playbook is currently running, every playbook here lives in .../ansible/playbooks) is
# stable across machines since it's relative to the repo checkout itself, so this now needs no
# editing no matter which machine ansible-playbook runs from.
local_parquet_dir: "{{ playbook_dir }}/../../../../data_generator_cycling/output/parquet"
venv_dir: "/var/lib/data/venv"

# One real sample file (out of ~676 in data_generator_aviation/parquet_flights, ~70GB total) --
# postgis_aviation/clickhouse_aviation sync just this one file rather than the whole directory.
# Same playbook_dir-relative reasoning as local_parquet_dir/local_supporting_dataset_path above.
aviation_sample_parquet_file: "{{ playbook_dir }}/../../../../data_generator_aviation/parquet_flights/flights_000000.parquet"

# Small synthetic sample files for the other three insertion pipelines. Unlike aviation, the real
# generators for these either produce nothing checked in locally (cycling/geolife -- their output
# directories exist but are empty) or are far too large to use here (ais: real files are
# ~300M rows/~5GB each) -- so these are small dummy datasets matching each pipeline's exact
# expected schema and configured partition-time-range instead of real data.
ais_sample_parquet_file: "{{ playbook_dir }}/../../../../data_generator_ais/output_data/crossing_points/dummy_sample.parquet"
cycling_sample_parquet_file: "{{ playbook_dir }}/../../../../data_generator_cycling/output/parquet/dummy_sample.parquet"
geolife_sample_parquet_file: "{{ playbook_dir }}/../../../../data_generator_geolife/synthetic_output/dummy_sample.parquet"

db_host: "127.0.0.1"
db_port: 5433
ch_host: "127.0.0.1"
ch_port: 9500
ch_keeper_port: 9444
ch_user: "default"
ch_password: "default"

hdfs_target_dir: /data/ais/raw
local_data_path: /data/ais
hadoop_home: /opt/hadoop
# FIX: same as local_parquet_dir above -- was a hardcoded absolute macOS path.
local_supporting_dataset_path: "{{ playbook_dir }}/../../supporting_datasets"
supporting_dataset_path: /var/lib/data/supporting_datasets/

# DuckDB (via the "quack" server extension, so the benchmark_client's JDBC driver can reach it
# remotely) -- port and token here must match benchmark/client/benchmark_client's
# DialectRegistry.java ("jdbc:quack://<SUT_HOST>:9494/", token "my-secret-token").
duckdb_data_dir: /var/lib/duckdb
duckdb_db_file: "{{ duckdb_data_dir }}/geobenchr.duckdb"
duckdb_quack_port: 9494
duckdb_quack_token: my-secret-token
# Production 5-node SpaceTime cluster (nst-1..nst-5), provided by our partner (Ceperic/Nikša,
# TU Berlin). Direct public IPs (`ansible_host`) for SSH, default port -- unlike
# inventory/local/hosts.yml there is no jump host here, so no ansible_port override is needed.
#
# `ip:` is used by other roles for node-to-node traffic (Citus, ClickHouse cluster/keeper, Hadoop
# workers) and does not have to match `ansible_host` -- see inventory/local/hosts.yml's comment/
# README. Confirmed live on each node (`ip -4 addr show`, interface enp130s0.4000): all five sit
# on a private VLAN at 10.1.0.11-15 (nst-1..nst-5), the same network nst-1 uses for SpaceTime's
# own traffic with nst-inserter (see ../../../client/benchmark_client/docs/
# spacetime-cluster-access.md, gitignored) -- so cluster-internal traffic for our own stack stays
# off the public internet too. Note this is a separate, closed network: it did NOT get our own
# stack's traffic to nst-1's DuckDB Quack server (port 9494) reaching from the other four nodes
# over their *public* IPs during testing (connection timed out) -- if benchmark_client runs from
# outside this private network, confirm with Nikša what's actually reachable from there.
all:
  children:
    masters:
      hosts:
        nst-1:
          ansible_host: 5.9.87.117
          ip: 10.1.0.11
          hostname: nst-1
          num_id: 1
    workers:
      hosts:
        nst-2:
          ansible_host: 5.9.87.153
          ip: 10.1.0.12
          hostname: nst-2
          num_id: 2
        nst-3:
          ansible_host: 5.9.87.152
          ip: 10.1.0.13
          hostname: nst-3
          num_id: 3
        nst-4:
          ansible_host: 5.9.88.105
          ip: 10.1.0.14
          hostname: nst-4
          num_id: 4
        nst-5:
          ansible_host: 5.9.87.205
          ip: 10.1.0.15
          hostname: nst-5
          num_id: 5
    clickhouse:
      children:
        masters:
        workers:

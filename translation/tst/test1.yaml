#equality filter + two-field sort
- name: test1

  source: users

  select:
    - id
    - firstname
    - lastname
    - age
    - country
    - date

  filter:
    - field: country
      operator: eq
      value: France
      type: str

  order_by:
    - field: lastname
      direction: asc
    - field: firstname
      direction: asc
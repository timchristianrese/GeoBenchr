- name: ClosestRestaurantToPoint
  type: spatial
  sql: |
    SELECT *
    FROM geolife_points
    WHERE venue_type = 'Restaurant' AND ST_DWithin(geom, ST_Transform(ST_SetSRID(ST_Point(116.52415814692183, 39.816789985129965), 4326), 3857), 5000)
    ORDER BY ST_Distance(geom, ST_Transform(ST_SetSRID(ST_Point(116.52415814692183, 39.816789985129965), 4326), 3857))
    LIMIT 1;
  params:
  - ST_Transform(ST_SetSRID(ST_Point(116.52415814692183, 39.816789985129965), 4326),
    3857)
- name: SlidingWindowActivityInRegionPerMinuteWithNonZeroID
  type: spatiotemporal
  sql: |
    WITH minute_activity AS (
     SELECT
         date_trunc('minute', timestamp) AS minute,
         COUNT(*) FILTER (WHERE venue_id <> 0) AS venue_updates
     FROM geolife_points
     WHERE timestamp BETWEEN '2019-07-21 10:16:05' AND '2019-07-21 21:54:45'
       AND ST_Intersects(geom, ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.5041169205436, 39.90839807322859, 116.60771282808577, 39.96538136682634), 4326), 3857))
     GROUP BY date_trunc('minute', timestamp)
     ),
     minute_windows AS (
         SELECT
             minute,
             minute - INTERVAL '10 minutes' AS window_start,
             minute + INTERVAL '10 minutes' AS window_end
         FROM minute_activity
     )
     SELECT
         w.minute,
         SUM(m.venue_updates) AS updates_in_window
     FROM minute_windows w
     JOIN minute_activity m
         ON m.minute BETWEEN w.window_start AND w.window_end
     GROUP BY w.minute
     ORDER BY w.minute;
  params:
  - '''2019-07-21 10:16:05'' AND ''2019-07-21 21:54:45'''
  - ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.5041169205436, 39.90839807322859,
    116.60771282808577, 39.96538136682634), 4326), 3857)

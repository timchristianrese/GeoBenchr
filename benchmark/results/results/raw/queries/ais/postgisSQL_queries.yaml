  type: temporal
  sql: |
    SELECT COUNT(*) FROM (
      SELECT GREATEST(s.start_time, TIMESTAMP '2024-05-16 03:48:07') AS lo,
             LEAST(s.end_time, TIMESTAMP '2024-05-24 00:50:45') AS hi
      FROM crossings_summary s
      WHERE s.id > 0 AND s.id < 1000000000000
        AND s.start_time <= TIMESTAMP '2024-05-24 00:50:45' AND s.end_time >= TIMESTAMP '2024-05-16 03:48:07'
    ) w
    WHERE hi - lo >= INTERVAL '24 hours'
       OR (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (18 + 1) AND hi - date_trunc('day', hi) >= INTERVAL '1 hour' * 18)
       OR (date_trunc('day', lo) <> date_trunc('day', hi)
           AND (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (18 + 1) OR hi - date_trunc('day', hi) >= INTERVAL '1 hour' * 18));
  params:
  - 18

- name: CrossingsActiveAtGivenHourOfDay
  type: temporal
  sql: |
    SELECT count() FROM (
      SELECT greatest(s.start_time, toDateTime('2024-05-16 03:48:07', 'UTC')) AS lo,
             least(s.end_time, toDateTime('2024-05-24 00:50:45', 'UTC')) AS hi
      FROM crossings_summary s
      WHERE s.id > 0 AND s.id < 1000000000000
        AND s.start_time <= toDateTime('2024-05-24 00:50:45', 'UTC') AND s.end_time >= toDateTime('2024-05-16 03:48:07', 'UTC')
    ) w
    WHERE dateDiff('second', lo, hi) >= 86400
       OR (dateDiff('second', toStartOfDay(lo), lo) < 3600 * (18 + 1) AND dateDiff('second', toStartOfDay(hi), hi) >= 3600 * 18)
       OR (toStartOfDay(lo) != toStartOfDay(hi)
           AND (dateDiff('second', toStartOfDay(lo), lo) < 3600 * (18 + 1) OR dateDiff('second', toStartOfDay(hi), hi) >= 3600 * 18));
  params:
  - 18
  - - '2024-05-16 03:48:07'
    - '2024-05-24 00:50:45'

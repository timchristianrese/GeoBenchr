- name: CrossingsActiveAtGivenHourOfDay
  type: temporal
  sql: |
    SELECT COUNT(*) FROM (
      SELECT
        GREATEST(c.t[0], (EPOCHRANGE '[2024-05-16 03:48:07, 2024-05-24 00:50:45]')[0]) AS lo,
        LEAST   (c.t[1], (EPOCHRANGE '[2024-05-16 03:48:07, 2024-05-24 00:50:45]')[1]) AS hi
      FROM crossings c
      WHERE c.t && EPOCHRANGE '[2024-05-16 03:48:07, 2024-05-24 00:50:45]'
    ) w
    WHERE hi - lo >= TP '24h'
      OR ( TS_TIMEOFDAY(lo) <  TP '1h' * (18 + 1)
        AND TS_TIMEOFDAY(hi) >= TP '1h' *  18 )
      OR ( TS_DAYSTART(lo) <> TS_DAYSTART(hi)
        AND ( TS_TIMEOFDAY(lo) <  TP '1h' * (18 + 1)
              OR TS_TIMEOFDAY(hi) >= TP '1h' *  18 ));
  params:
  - 18

- name: CrossingsActiveAtGivenHourOfDay
  type: temporal
  sql: |
    SELECT COUNT(*) FROM (
      SELECT GREATEST(s.start_time, TIMESTAMP '2024-07-09 18:57:54') AS lo,
             LEAST(s.end_time, TIMESTAMP '2024-07-14 11:44:26') AS hi
      FROM crossings_summary s
      WHERE s.id > 0 AND s.id < 1000000000000
        AND s.start_time <= TIMESTAMP '2024-07-14 11:44:26' AND s.end_time >= TIMESTAMP '2024-07-09 18:57:54'
    ) w
    WHERE hi - lo >= INTERVAL '24 hours'
       OR (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (15 + 1) AND hi - date_trunc('day', hi) >= INTERVAL '1 hour' * 15)
       OR (date_trunc('day', lo) <> date_trunc('day', hi)
           AND (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (15 + 1) OR hi - date_trunc('day', hi) >= INTERVAL '1 hour' * 15));
  params:
  - 15
  - - '2024-07-09 18:57:54'
    - '2024-07-14 11:44:26'

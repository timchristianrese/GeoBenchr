- name: CityActivityAtInstant
  type: spatiotemporal
  sql: |
    WITH filtered_flights AS (
      SELECT f.id, f.x, f.y
      FROM flight_points f
      WHERE f.h3 GLOBAL IN (SELECT arrayJoin(h3CoverPoint(lon, lat, 4010)) FROM cities WHERE name = 'Rietberg')
        AND f.timestamp BETWEEN toDateTime('2024-09-14 23:14:30', 'UTC') - INTERVAL 10 SECOND AND toDateTime('2024-09-14 23:14:30', 'UTC') + INTERVAL 10 SECOND)
    SELECT COUNT(DISTINCT ff.id) AS flight_count
    FROM filtered_flights ff
    JOIN cities c ON sqrt(pow(ff.x - c.x, 2) + pow(ff.y - c.y, 2)) <= 4010
    WHERE c.name = 'Rietberg';
  params:
  - Rietberg
  - '2024-09-14 23:14:30'
  - 4010

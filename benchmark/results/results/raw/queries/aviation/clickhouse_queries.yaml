- name: flightClosestToPoint
  type: spatial
  sql: |
    SELECT f.id, sqrt(pow(f.x - 6378137. * radians(8.760157602157348), 2) + pow(f.y - 6378137. * log(tan(pi() / 4 + radians(50.904198308012916) / 2)), 2)) AS min_distance
    FROM flight_points f
    WHERE f.h3 GLOBAL IN (SELECT arrayJoin(h3CoverPoint(8.760157602157348, 50.904198308012916, 2846)))
      AND sqrt(pow(f.x - 6378137. * radians(8.760157602157348), 2) + pow(f.y - 6378137. * log(tan(pi() / 4 + radians(50.904198308012916) / 2)), 2)) <= 2846
    ORDER BY min_distance ASC
    LIMIT 1;
  params:
  - ST_SetSRID(ST_Point(975176.2835409803, 6604364.9761168845), 3857)
  - 2846

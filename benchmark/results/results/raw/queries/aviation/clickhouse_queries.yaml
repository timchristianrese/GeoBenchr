- name: CityActivityAtInstant
  type: spatiotemporal
  sql: |
    WITH filtered_flights AS (
      SELECT f.id, f.x, f.y
      FROM flight_points f
      WHERE f.h3 GLOBAL IN (SELECT arrayJoin(h3CoverPoint(lon, lat, 2743)) FROM cities WHERE name = 'Monheim am Rhein')
        AND f.timestamp BETWEEN toDateTime('2024-03-06 05:33:55', 'UTC') - INTERVAL 10 SECOND AND toDateTime('2024-03-06 05:33:55', 'UTC') + INTERVAL 10 SECOND)
    SELECT COUNT(DISTINCT ff.id) AS flight_count
    FROM filtered_flights ff
    JOIN cities c ON sqrt(pow(ff.x - c.x, 2) + pow(ff.y - c.y, 2)) <= 2743
    WHERE c.name = 'Monheim am Rhein';

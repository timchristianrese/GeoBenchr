- name: AverageUpdatesPerRideInDistrictInPeriod
  type: spatiotemporal
  sql: |
    WITH d AS (
      SELECT geom
      FROM berlin_districts
      WHERE name = 'Reinickendorf'
    )
    SELECT 'Reinickendorf' AS name, AVG(num_updates) AS avg_updates
    FROM (
      SELECT COUNT(*) AS num_updates
      FROM ride_points r, d
      WHERE EPOCHRANGE '[2026-06-02 17:45:41, 2026-06-02 19:43:42]' @> r.t
        AND ST_Intersects(ST_Point(r.x, r.y), ST_ToGeom(d.geom::gpolygon))
      GROUP BY r.trip_id
    )
  params:
  - Reinickendorf
  - '''2026-06-02 17:45:41'' AND ''2026-06-02 19:43:42'''

- name: CountRidesFullyInDistrictRadius
  type: spatial
  sql: |
    WITH d AS (
      SELECT geom
      FROM berlin_districts
      WHERE name = 'Spandau'
    ),
    candidates AS (
      SELECT DISTINCT r.trip_id
      FROM ride_points r, d
      WHERE ST_DWithin(ST_Point(r.x, r.y), ST_ToGeom(d.geom::gpolygon), 433 * 0.607452)
    )
    SELECT r.trip_id AS id
    FROM ride_points r
    STRAIGHT JOIN candidates c ON r.trip_id = c.trip_id
    CROSS JOIN d
    GROUP BY r.trip_id
    HAVING BOOL_AND(ST_DWithin(ST_Point(r.x, r.y), ST_ToGeom(d.geom::gpolygon), 433 * 0.607452));
  params:
  - Spandau
  - 433

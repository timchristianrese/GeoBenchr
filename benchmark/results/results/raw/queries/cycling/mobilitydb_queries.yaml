- name: AverageUpdatesPerRideInDistrictInPeriod
  type: spatiotemporal
  sql: |
    WITH ts_table AS (
      SELECT r.id, unnest(instants(atTime(r.trip, tstzspan '[2026-06-02 14:12:02, 2026-06-02 14:51:21]'))) AS inst
      FROM rides r
      WHERE r.trip && tstzspan '[2026-06-02 14:12:02, 2026-06-02 14:51:21]'
    ),
    filtered AS (
      SELECT ts_table.id
      FROM ts_table
      JOIN berlin_districts d ON d.name = 'Pankow'
      WHERE ST_Intersects(getValue(inst)::geometry, d.geom)
    )
    SELECT 'Pankow' AS name, AVG(num_updates) AS avg_updates
    FROM (

- name: AverageUpdatesPerRideInDistrictInPeriod
  type: spatiotemporal
  sql: |
    SELECT 'Reinickendorf' AS name, AVG(num_updates) AS avg_updates
    FROM (
      SELECT r.id, COUNT(*) AS num_updates
      FROM tsdb_ride_points r
      JOIN berlin_districts d ON ST_Intersects(r.geom, d.geom)
      WHERE d.name = 'Reinickendorf'
        AND r.timestamp BETWEEN '2026-06-02 17:45:41' AND '2026-06-02 19:43:42'
      GROUP BY r.id
    ) AS ri;
  params:
  - Reinickendorf
  - '''2026-06-02 17:45:41'' AND ''2026-06-02 19:43:42'''
- name: countRideInDistrict
  type: spatial
  sql: |

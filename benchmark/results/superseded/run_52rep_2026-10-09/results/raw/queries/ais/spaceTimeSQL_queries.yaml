- name: CrossingsActiveAtGivenHourOfDay
  type: temporal
  sql: |
    SELECT COUNT(*) FROM (
      SELECT
        GREATEST(c.t[0], (EPOCHRANGE '[2024-07-09 18:57:54, 2024-07-14 11:44:26]')[0]) AS lo,
        LEAST   (c.t[1], (EPOCHRANGE '[2024-07-09 18:57:54, 2024-07-14 11:44:26]')[1]) AS hi
      FROM crossings c
      WHERE c.t && EPOCHRANGE '[2024-07-09 18:57:54, 2024-07-14 11:44:26]'
    ) w
    WHERE hi - lo >= TP '24h'
      OR ( TS_TIMEOFDAY(lo) <  TP '1h' * (15 + 1)
        AND TS_TIMEOFDAY(hi) >= TP '1h' *  15 )
      OR ( TS_DAYSTART(lo) <> TS_DAYSTART(hi)
        AND ( TS_TIMEOFDAY(lo) <  TP '1h' * (15 + 1)
              OR TS_TIMEOFDAY(hi) >= TP '1h' *  15 ));
  params:
  - 15
  - - '2024-07-09 18:57:54'
    - '2024-07-14 11:44:26'

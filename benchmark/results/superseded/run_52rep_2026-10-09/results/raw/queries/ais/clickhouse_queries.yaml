- name: CrossingsActiveAtGivenHourOfDay
  type: temporal
  sql: |
    SELECT count() FROM (
      SELECT greatest(s.start_time, toDateTime('2024-09-29 21:39:02', 'UTC')) AS lo,
             least(s.end_time, toDateTime('2024-10-12 09:09:11', 'UTC')) AS hi
      FROM crossings_summary s
      WHERE s.id > 0 AND s.id < 1000000000000
        AND s.start_time <= toDateTime('2024-10-12 09:09:11', 'UTC') AND s.end_time >= toDateTime('2024-09-29 21:39:02', 'UTC')
    ) w
    WHERE dateDiff('second', lo, hi) >= 86400
       OR (dateDiff('second', toStartOfDay(lo), lo) < 3600 * (7 + 1) AND dateDiff('second', toStartOfDay(hi), hi) >= 3600 * 7)
       OR (toStartOfDay(lo) != toStartOfDay(hi)
           AND (dateDiff('second', toStartOfDay(lo), lo) < 3600 * (7 + 1) OR dateDiff('second', toStartOfDay(hi), hi) >= 3600 * 7));
  params:
  - 7
  - - '2024-09-29 21:39:02'
    - '2024-10-12 09:09:11'

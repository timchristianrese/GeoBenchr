- name: busiestDayInWeekPeriod
  type: temporal
  sql: |
    SELECT toDate(day) AS day, count() AS unique_crossings
    FROM crossings_summary s
    ARRAY JOIN arrayMap(i -> toStartOfDay(toDateTime('2024-04-26 07:45:51', 'UTC')) + toIntervalDay(i),
                        range(toUInt32(dateDiff('day', toStartOfDay(toDateTime('2024-04-26 07:45:51', 'UTC')), toDateTime('2024-05-04 10:47:17', 'UTC')) + 1))) AS day
    WHERE s.id > 0 AND s.id < 1000000000000
      AND s.start_time <= toDateTime('2024-05-04 10:47:17', 'UTC') AND s.end_time >= toDateTime('2024-04-26 07:45:51', 'UTC')
      AND s.start_time < day + toIntervalDay(1) AND s.end_time >= day
    GROUP BY day
    ORDER BY unique_crossings DESC
    LIMIT 1;
  params:
  - - '2024-04-26 07:45:51'
    - '2024-05-04 10:47:17'

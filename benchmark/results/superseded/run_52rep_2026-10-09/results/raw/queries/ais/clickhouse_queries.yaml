  sql: |
    SELECT h.name AS harbour_name, COUNT(DISTINCT c.id) AS unique_crossings_near_harbour
    FROM crossing_points c
    GLOBAL JOIN harbours h ON h.name = 'Mandal'
    WHERE c.h3 GLOBAL IN (SELECT arrayJoin(h3CoverPoint(lon, lat, 1880)) FROM harbours WHERE name = 'Mandal')
      AND sqrt(pow(c.x - h.x, 2) + pow(c.y - h.y, 2)) <= 1880
      AND c.timestamp BETWEEN '2024-02-18 11:19:48' AND '2024-02-29 21:00:38'
      AND c.id > 0 AND c.id < 1000000000000
    GROUP BY h.name;
  params:
  - - '2024-02-18 11:19:48'
    - '2024-02-29 21:00:38'
  - 1880
  - Mandal
- name: countActiveCrossingsNearIsland
  type: spatial
  sql: |
    SELECT COUNT(DISTINCT c.id) AS crossing_count

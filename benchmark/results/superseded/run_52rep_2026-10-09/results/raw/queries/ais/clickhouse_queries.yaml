- name: busiestDayInWeekPeriod
  type: temporal
  sql: |
    SELECT toDate(day) AS day, count() AS unique_crossings
    FROM crossings_summary s
    ARRAY JOIN arrayMap(i -> toStartOfDay(toDateTime('2025-04-13 14:22:03', 'UTC')) + toIntervalDay(i),
                        range(toUInt32(dateDiff('day', toStartOfDay(toDateTime('2025-04-13 14:22:03', 'UTC')), toDateTime('2025-04-22 05:38:48', 'UTC')) + 1))) AS day
    WHERE s.id > 0 AND s.id < 1000000000000
      AND s.start_time <= toDateTime('2025-04-22 05:38:48', 'UTC') AND s.end_time >= toDateTime('2025-04-13 14:22:03', 'UTC')
      AND s.start_time < day + toIntervalDay(1) AND s.end_time >= day
    GROUP BY day
    ORDER BY unique_crossings DESC
    LIMIT 1;
  params:
  - - '2025-04-13 14:22:03'
    - '2025-04-22 05:38:48'
- name: CrossingsActiveAtGivenHourOfDay
  type: temporal
  sql: |
    SELECT count() FROM (
      SELECT greatest(s.start_time, toDateTime('2024-02-01 18:53:33', 'UTC')) AS lo,
             least(s.end_time, toDateTime('2024-02-16 17:58:39', 'UTC')) AS hi
      FROM crossings_summary s
      WHERE s.id > 0 AND s.id < 1000000000000
        AND s.start_time <= toDateTime('2024-02-16 17:58:39', 'UTC') AND s.end_time >= toDateTime('2024-02-01 18:53:33', 'UTC')
    ) w
    WHERE dateDiff('second', lo, hi) >= 86400
       OR (dateDiff('second', toStartOfDay(lo), lo) < 3600 * (4 + 1) AND dateDiff('second', toStartOfDay(hi), hi) >= 3600 * 4)
       OR (toStartOfDay(lo) != toStartOfDay(hi)
           AND (dateDiff('second', toStartOfDay(lo), lo) < 3600 * (4 + 1) OR dateDiff('second', toStartOfDay(hi), hi) >= 3600 * 4));
  params:
  - 4
  - - '2024-02-01 18:53:33'
    - '2024-02-16 17:58:39'

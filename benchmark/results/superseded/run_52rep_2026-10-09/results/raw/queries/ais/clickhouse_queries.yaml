- name: CrossingsActiveAtGivenHourOfDay
  type: temporal
  sql: |
    SELECT count() FROM (
      SELECT greatest(s.start_time, toDateTime('2024-07-09 18:57:54', 'UTC')) AS lo,
             least(s.end_time, toDateTime('2024-07-14 11:44:26', 'UTC')) AS hi
      FROM crossings_summary s
      WHERE s.id > 0 AND s.id < 1000000000000
        AND s.start_time <= toDateTime('2024-07-14 11:44:26', 'UTC') AND s.end_time >= toDateTime('2024-07-09 18:57:54', 'UTC')
    ) w
    WHERE dateDiff('second', lo, hi) >= 86400
       OR (dateDiff('second', toStartOfDay(lo), lo) < 3600 * (15 + 1) AND dateDiff('second', toStartOfDay(hi), hi) >= 3600 * 15)
       OR (toStartOfDay(lo) != toStartOfDay(hi)
           AND (dateDiff('second', toStartOfDay(lo), lo) < 3600 * (15 + 1) OR dateDiff('second', toStartOfDay(hi), hi) >= 3600 * 15));
  params:
  - 15
  - - '2024-07-09 18:57:54'
    - '2024-07-14 11:44:26'

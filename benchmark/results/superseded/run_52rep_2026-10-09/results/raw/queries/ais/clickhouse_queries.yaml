- name: busiestDayInWeekPeriod
  type: temporal
  sql: |
    SELECT toDate(day) AS day, count() AS unique_crossings
    FROM crossings_summary s
    ARRAY JOIN arrayMap(i -> toStartOfDay(toDateTime('2025-02-16 18:23:34', 'UTC')) + toIntervalDay(i),
                        range(toUInt32(dateDiff('day', toStartOfDay(toDateTime('2025-02-16 18:23:34', 'UTC')), toDateTime('2025-02-28 23:07:40', 'UTC')) + 1))) AS day
    WHERE s.id > 0 AND s.id < 1000000000000
      AND s.start_time <= toDateTime('2025-02-28 23:07:40', 'UTC') AND s.end_time >= toDateTime('2025-02-16 18:23:34', 'UTC')
      AND s.start_time < day + toIntervalDay(1) AND s.end_time >= day
    GROUP BY day
    ORDER BY unique_crossings DESC
    LIMIT 1;
  params:
  - - '2025-02-16 18:23:34'
    - '2025-02-28 23:07:40'

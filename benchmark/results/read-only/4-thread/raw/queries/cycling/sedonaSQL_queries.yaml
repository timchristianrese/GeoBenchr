- name: CountRidesFullyInDistrictRadius
  type: spatial
  sql: |
    WITH d AS (
      SELECT geom
      FROM berlin_districts
      WHERE name = 'Lichtenberg'
    ),
    candidates AS (
      SELECT s.id
      FROM rides_summary s, d
      WHERE ST_DWithin(s.start_location, d.geom, 874)
        AND ST_DWithin(s.end_location, d.geom, 874)
    )
    SELECT r.id
    FROM ride_points r
    JOIN candidates c ON r.id = c.id
    CROSS JOIN d
    GROUP BY r.id
    HAVING BOOL_AND(ST_DWithin(r.geom, d.geom, 874));
  params:
  - Lichtenberg
  - 874

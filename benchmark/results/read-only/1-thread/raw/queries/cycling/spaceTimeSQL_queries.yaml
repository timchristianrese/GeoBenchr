- name: CountRidesFullyInDistrictRadius
  type: spatial
  sql: |
    WITH d AS (
      SELECT geom
      FROM berlin_districts
      WHERE name = 'Friedrichshain-Kreuzberg'
    ),
    candidates AS (
      SELECT r.trip_id
      FROM rides r, d
      WHERE ST_DWithin(ST_Point(r.x0, r.y0), ST_ToGeom(d.geom::gpolygon), 562 * 0.607766)
        AND ST_DWithin(ST_Point(r.x1, r.y1), ST_ToGeom(d.geom::gpolygon), 562 * 0.607766)
    )
    SELECT r.trip_id AS id
    FROM ride_points r
    JOIN candidates c ON r.trip_id = c.trip_id
    CROSS JOIN d
    GROUP BY r.trip_id
    HAVING BOOL_AND(ST_DWithin(ST_Point(r.x, r.y), ST_ToGeom(d.geom::gpolygon), 562 * 0.607766));
  params:
  - Friedrichshain-Kreuzberg
  - 562

- name: busiestDayInWeekPeriod
  type: temporal
  sql: |
    SELECT d.day::date AS day, COUNT(*) AS unique_crossings
    FROM generate_series(date_trunc('day', TIMESTAMP '2024-01-30 21:55:56'), TIMESTAMP '2024-02-12 01:50:00', INTERVAL '1 day') AS d(day)
    JOIN crossings_summary s ON s.start_time < d.day + INTERVAL '1 day' AND s.end_time >= d.day
    WHERE s.id > 0 AND s.id < 1000000000000
      AND s.start_time <= TIMESTAMP '2024-02-12 01:50:00' AND s.end_time >= TIMESTAMP '2024-01-30 21:55:56'
    GROUP BY d.day
    ORDER BY unique_crossings DESC
    LIMIT 1;
  params:
  - - '2024-01-30 21:55:56'
    - '2024-02-12 01:50:00'

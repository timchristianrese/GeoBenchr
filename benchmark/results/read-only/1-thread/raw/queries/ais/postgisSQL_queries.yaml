- name: CrossingsActiveAtGivenHourOfDay
  type: temporal
  sql: |
    SELECT COUNT(*) FROM (
      SELECT GREATEST(s.start_time, TIMESTAMP '2024-02-11 17:33:24') AS lo,
             LEAST(s.end_time, TIMESTAMP '2024-02-22 01:15:50') AS hi
      FROM crossings_summary s
      WHERE s.id > 0 AND s.id < 1000000000000
        AND s.start_time <= TIMESTAMP '2024-02-22 01:15:50' AND s.end_time >= TIMESTAMP '2024-02-11 17:33:24'
    ) w
    WHERE hi - lo >= INTERVAL '24 hours'
       OR (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (1 + 1) AND hi - date_trunc('day', hi) >= INTERVAL '1 hour' * 1)
       OR (date_trunc('day', lo) <> date_trunc('day', hi)
           AND (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (1 + 1) OR hi - date_trunc('day', hi) >= INTERVAL '1 hour' * 1));
  params:
  - 1
  - - '2024-02-11 17:33:24'
    - '2024-02-22 01:15:50'

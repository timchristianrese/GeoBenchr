- name: CrossingsActiveAtGivenHourOfDay
  type: temporal
  sql: |
    SELECT COUNT(*) FROM (
      SELECT GREATEST(s.start_time, TIMESTAMP '2024-03-27 05:23:37') AS lo,
             LEAST(s.end_time, TIMESTAMP '2024-04-02 18:17:19') AS hi
      FROM crossings_summary s
      WHERE s.id > 0 AND s.id < 1000000000000
        AND s.start_time <= TIMESTAMP '2024-04-02 18:17:19' AND s.end_time >= TIMESTAMP '2024-03-27 05:23:37'
    ) w
    WHERE hi - lo >= INTERVAL '24 hours'
       OR (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (23 + 1) AND hi - date_trunc('day', hi) >= INTERVAL '1 hour' * 23)
       OR (date_trunc('day', lo) <> date_trunc('day', hi)
           AND (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (23 + 1) OR hi - date_trunc('day', hi) >= INTERVAL '1 hour' * 23));
  params:
  - 23
  - - '2024-03-27 05:23:37'
    - '2024-04-02 18:17:19'

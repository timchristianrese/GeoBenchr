      AND ST_Intersects(geom, ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.29157449730995, 39.933000026970056, 116.39517040485212, 39.98998332056781), 4326), 'EPSG:3857'))
    GROUP BY date_trunc('minute', timestamp)
    ),
    minute_windows AS (
        SELECT
            minute,
            minute - INTERVAL '10 minutes' AS window_start,
            minute + INTERVAL '10 minutes' AS window_end
        FROM minute_activity

- name: UniqueUsersPerHourInRegionInPeriod
  type: spatiotemporal
  sql: |
    SELECT date_trunc('hour', timestamp) AS hour,
       COUNT(DISTINCT id) AS users
    FROM geolife_points
    WHERE ST_Intersects(geom, ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.19486846743224, 39.951522164648445, 116.29846437497442, 40.0085054582462), 4326), 'EPSG:3857'))
      AND timestamp BETWEEN '2019-07-13 00:04:28' AND '2019-07-15 18:10:54'
    GROUP BY hour
    ORDER BY hour;

  type: spatiotemporal
  sql: |
    WITH minute_activity AS (
    SELECT
        date_trunc('minute', timestamp) AS minute,
        COUNT(*) FILTER (WHERE venue_id <> 0) AS venue_updates
    FROM geolife_points
    WHERE timestamp BETWEEN '2019-07-27 04:33:59' AND '2019-07-27 18:43:10'
      AND ST_Intersects(geom, ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.18381588896841, 39.92982254093456, 116.28741179651058, 39.98680583453231), 4326), 'EPSG:3857'))
    GROUP BY date_trunc('minute', timestamp)
    ),
    minute_windows AS (
        SELECT
            minute,
            minute - INTERVAL '10 minutes' AS window_start,
            minute + INTERVAL '10 minutes' AS window_end
        FROM minute_activity

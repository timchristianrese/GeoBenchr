    FROM (SELECT explode(sequence(date_trunc('DAY', to_timestamp('2024-09-19 18:35:40')), to_timestamp('2024-10-01 23:20:48'), interval 1 day)) AS day) d
    JOIN crossings_summary s ON s.start_time < d.day + interval 1 day AND s.end_time >= d.day

- name: CrossingsActiveAtGivenHourOfDay
  type: temporal
  sql: |
    SELECT COUNT(*) FROM (
      SELECT greatest(s.start_time, to_timestamp('2024-12-14 15:14:42')) AS lo,
             least(s.end_time, to_timestamp('2024-12-26 03:24:27')) AS hi
      FROM crossings_summary s
      WHERE s.id > 0 AND s.id < 1000000000000
        AND s.start_time <= to_timestamp('2024-12-26 03:24:27') AND s.end_time >= to_timestamp('2024-12-14 15:14:42')
    ) w
    WHERE unix_timestamp(hi) - unix_timestamp(lo) >= 86400
       OR (unix_timestamp(lo) - unix_timestamp(date_trunc('DAY', lo)) < 3600 * (21 + 1) AND unix_timestamp(hi) - unix_timestamp(date_trunc('DAY', hi)) >= 3600 * 21)
       OR (date_trunc('DAY', lo) <> date_trunc('DAY', hi)
           AND (unix_timestamp(lo) - unix_timestamp(date_trunc('DAY', lo)) < 3600 * (21 + 1) OR unix_timestamp(hi) - unix_timestamp(date_trunc('DAY', hi)) >= 3600 * 21));
  params:
  - 21
  - - '2024-12-14 15:14:42'
    - '2024-12-26 03:24:27'

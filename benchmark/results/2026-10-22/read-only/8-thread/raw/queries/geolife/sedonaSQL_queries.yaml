- name: SlidingWindowActivityInRegionPerMinuteWithNonZeroID
  type: spatiotemporal
  sql: |
    WITH minute_activity AS (
    SELECT
        date_trunc('minute', timestamp) AS minute,
        COUNT(*) FILTER (WHERE venue_id <> 0) AS venue_updates
    FROM geolife_points
    WHERE timestamp BETWEEN '2019-07-19 16:44:35' AND '2019-07-21 11:45:10'
      AND ST_Intersects(geom, ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.44386934682957, 39.88006041653684, 116.54746525437174, 39.937043710134596), 4326), 'EPSG:3857'))
    GROUP BY date_trunc('minute', timestamp)
    ),
    minute_windows AS (
        SELECT
            minute,
            minute - INTERVAL '10 minutes' AS window_start,
            minute + INTERVAL '10 minutes' AS window_end
        FROM minute_activity
    )
    SELECT
        w.minute,
        SUM(m.venue_updates) AS updates_in_window
    FROM minute_windows w
    JOIN minute_activity m
        ON m.minute BETWEEN w.window_start AND w.window_end
    GROUP BY w.minute
    ORDER BY w.minute;
  params:
  - '''2019-07-19 16:44:35'' AND ''2019-07-21 11:45:10'''
  - ST_Transform(ST_MakeEnvelope(116.44386934682957, 39.88006041653684, 116.54746525437174,
    39.937043710134596), 'EPSG:4326', 'EPSG:3857')

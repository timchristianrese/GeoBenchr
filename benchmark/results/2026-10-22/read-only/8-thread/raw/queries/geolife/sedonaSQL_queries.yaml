    SELECT
        date_trunc('minute', timestamp) AS minute,
        COUNT(*) FILTER (WHERE venue_id <> 0) AS venue_updates
    FROM geolife_points
    WHERE timestamp BETWEEN '2019-07-09 04:36:35' AND '2019-07-10 21:29:00'
      AND ST_Intersects(geom, ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.2636729197503, 39.80062358676392, 116.36726882729248, 39.85760688036167), 4326), 'EPSG:3857'))
    GROUP BY date_trunc('minute', timestamp)

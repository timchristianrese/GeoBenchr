- name: RidesAcrossMultipleHours
  type: temporal
  sql: |
    WITH ts_table AS (
      SELECT r.id, unnest(timestamps(atTime(r.trip, tstzspan '[2026-06-04 11:32:52, 2026-06-04 13:07:10]'))) AS ts
      FROM rides r
      WHERE r.trip && tstzspan '[2026-06-04 11:32:52, 2026-06-04 13:07:10]'
    )
    SELECT id
    FROM ts_table
    GROUP BY id
    HAVING COUNT(DISTINCT EXTRACT(HOUR FROM ts)) > 1;
  params:
  - '''2026-06-04 11:32:52'' AND ''2026-06-04 13:07:10'''

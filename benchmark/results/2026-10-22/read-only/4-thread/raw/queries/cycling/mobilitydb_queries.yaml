- name: AverageUpdatesPerRideInDistrictInPeriod
  type: spatiotemporal
  sql: |
    WITH ts_table AS (
      SELECT r.id, unnest(instants(atTime(r.trip, tstzspan '[2026-06-03 07:34:27, 2026-06-03 08:38:34]'))) AS inst
      FROM rides r
      WHERE r.trip && tstzspan '[2026-06-03 07:34:27, 2026-06-03 08:38:34]'
    ),
    filtered AS (
      SELECT ts_table.id
      FROM ts_table
      JOIN berlin_districts d ON d.name = 'Neukölln'
      WHERE ST_Intersects(getValue(inst)::geometry, d.geom)
    )
    SELECT 'Neukölln' AS name, AVG(num_updates) AS avg_updates
    FROM (
      SELECT id, COUNT(*) AS num_updates
      FROM filtered
      GROUP BY id
    ) AS ri;
  params:
  - Neukölln
  - '''2026-06-03 07:34:27'' AND ''2026-06-03 08:38:34'''

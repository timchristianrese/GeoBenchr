- name: countRideInDistrict
  type: spatial
  sql: |
    SELECT d.name, COUNT(DISTINCT r.id) AS ride_count FROM berlin_districts d JOIN rides r ON eintersects(r.trip, d.geom) WHERE d.name = 'Treptow-Köpenick' GROUP BY d.name;
  params:
  - Treptow-Köpenick

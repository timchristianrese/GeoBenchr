- name: AverageUpdatesPerRideInDistrictInPeriod
  type: spatiotemporal
  sql: |
    WITH ts_table AS (
      SELECT r.id, unnest(instants(atTime(r.trip, tstzspan '[2026-06-02 14:58:49, 2026-06-02 17:42:07]'))) AS inst
      FROM rides r
      WHERE r.trip && tstzspan '[2026-06-02 14:58:49, 2026-06-02 17:42:07]'
    ),
    filtered AS (
      SELECT ts_table.id
      FROM ts_table
      JOIN berlin_districts d ON d.name = 'Tempelhof-Schöneberg'
      WHERE ST_Intersects(getValue(inst)::geometry, d.geom)
    )
    SELECT 'Tempelhof-Schöneberg' AS name, AVG(num_updates) AS avg_updates
    FROM (
      SELECT id, COUNT(*) AS num_updates
      FROM filtered
      GROUP BY id
    ) AS ri;
  params:
  - Tempelhof-Schöneberg
  - '''2026-06-02 14:58:49'' AND ''2026-06-02 17:42:07'''

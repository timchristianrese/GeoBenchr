- name: CountRidesFullyInDistrictRadius
  type: spatial
  sql: |
    SELECT r.id
    FROM rides r
    JOIN berlin_districts d ON d.name = 'Steglitz-Zehlendorf'
    WHERE r.id IN (
      SELECT s.id
      FROM rides_summary s
      JOIN berlin_districts d2 ON d2.name = 'Steglitz-Zehlendorf'
      WHERE ST_DWithin(s.start_location, d2.geom, 459)
        AND ST_DWithin(s.end_location, d2.geom, 459)
    )
    GROUP BY r.id
    HAVING BOOL_AND(adwithin(r.trip, d.geom, 459));
  params:
  - Steglitz-Zehlendorf
  - 459

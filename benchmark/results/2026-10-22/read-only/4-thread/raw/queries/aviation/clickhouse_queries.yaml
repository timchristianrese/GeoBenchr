  sql: |
    WITH filtered_flights AS (
      SELECT f.id, f.x, f.y
      FROM flight_points f
      WHERE f.h3 GLOBAL IN (SELECT arrayJoin(h3CoverPoint(lon, lat, 3712)) FROM cities WHERE name = 'Willebadessen')
        AND f.timestamp BETWEEN toDateTime('2024-03-17 21:44:04', 'UTC') - INTERVAL 10 SECOND AND toDateTime('2024-03-17 21:44:04', 'UTC') + INTERVAL 10 SECOND)
    SELECT COUNT(DISTINCT ff.id) AS flight_count
    FROM filtered_flights ff
    JOIN cities c ON sqrt(pow(ff.x - c.x, 2) + pow(ff.y - c.y, 2)) <= 3712
    WHERE c.name = 'Willebadessen';
  params:
  - Willebadessen
  - '2024-03-17 21:44:04'
  - 3712
- name: flightClosestToPoint
  type: spatial
  sql: |
    SELECT f.id, sqrt(pow(f.x - 6378137. * radians(6.686627290869101), 2) + pow(f.y - 6378137. * log(tan(pi() / 4 + radians(51.726029212139196) / 2)), 2)) AS min_distance
    FROM flight_points f
    WHERE f.h3 GLOBAL IN (SELECT arrayJoin(h3CoverPoint(6.686627290869101, 51.726029212139196, 2440)))
      AND sqrt(pow(f.x - 6378137. * radians(6.686627290869101), 2) + pow(f.y - 6378137. * log(tan(pi() / 4 + radians(51.726029212139196) / 2)), 2)) <= 2440
    ORDER BY min_distance ASC
    LIMIT 1;
  params:
  - ST_SetSRID(ST_Point(744351.9451439547, 6750738.810802162), 3857)
  - 2440

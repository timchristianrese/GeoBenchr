- name: CityActivityAtInstant
  type: spatiotemporal
  sql: |
    WITH filtered_flights AS (
      SELECT f.id, f.x, f.y
      FROM flight_points f
      WHERE f.h3 GLOBAL IN (SELECT arrayJoin(h3CoverPoint(lon, lat, 4308)) FROM cities WHERE name = 'Meschede')
        AND f.timestamp BETWEEN toDateTime('2024-04-11 17:05:42', 'UTC') - INTERVAL 10 SECOND AND toDateTime('2024-04-11 17:05:42', 'UTC') + INTERVAL 10 SECOND)
    SELECT COUNT(DISTINCT ff.id) AS flight_count
    FROM filtered_flights ff
    JOIN cities c ON sqrt(pow(ff.x - c.x, 2) + pow(ff.y - c.y, 2)) <= 4308
    WHERE c.name = 'Meschede';
  params:
  - Meschede
  - '2024-04-11 17:05:42'
  - 4308

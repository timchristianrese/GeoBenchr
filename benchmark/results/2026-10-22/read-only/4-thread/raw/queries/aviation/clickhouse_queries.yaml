- name: flightClosestToPoint
  type: spatial
  sql: |
    SELECT f.id, sqrt(pow(f.x - 6378137. * radians(7.558281062114991), 2) + pow(f.y - 6378137. * log(tan(pi() / 4 + radians(50.85652315416293) / 2)), 2)) AS min_distance
    FROM flight_points f
    WHERE f.h3 GLOBAL IN (SELECT arrayJoin(h3CoverPoint(7.558281062114991, 50.85652315416293, 1642)))
      AND sqrt(pow(f.x - 6378137. * radians(7.558281062114991), 2) + pow(f.y - 6378137. * log(tan(pi() / 4 + radians(50.85652315416293) / 2)), 2)) <= 1642
    ORDER BY min_distance ASC
    LIMIT 1;
  params:
  - ST_SetSRID(ST_Point(841383.9991070838, 6595953.463881812), 3857)
  - 1642

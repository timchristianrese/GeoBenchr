benchmark:
  sut: 
    mobilitydb: true
    postgis: true
    sedona: true
    spacetime: true
    clickhouse: true
  mixed: false
  nodes:
  - ''
  threads: 16
  test: false
  random_seed: 1500
queryConfigs:

#USE
- name: RidesDuringRushHourInPeriod #temporal
  use: true
  description: "Find rides that occur during rush hours (7-10 AM and 4-7 PM) within a specified time period."
  type: temporal
  mobilitydb: |

  postgis: |
    SELECT COUNT(DISTINCT r.id) AS ride_count
    FROM ride_points r
    WHERE r.timestamp BETWEEN :period_short
      AND (EXTRACT(HOUR FROM r.timestamp) BETWEEN 7 AND 9 OR EXTRACT(HOUR FROM r.timestamp) BETWEEN 16 AND 18);
  sample_postgis: |
    SELECT COUNT(DISTINCT r.id) AS ride_count
    FROM ride_points r
    WHERE r.timestamp BETWEEN '2026-06-01 08:00:00' AND '2026-06-01 10:00:00'
    AND (EXTRACT(HOUR FROM r.timestamp) BETWEEN 7 AND 9 OR EXTRACT(HOUR FROM r.timestamp) BETWEEN 16 AND 18);
  sedona: |
    SELECT COUNT(DISTINCT r.id) AS ride_count
    FROM ride_points r
    WHERE r.timestamp BETWEEN :period_short
      AND (EXTRACT(HOUR FROM r.timestamp) BETWEEN 7 AND 9 OR EXTRACT(HOUR FROM r.timestamp) BETWEEN 16 AND 18);
  spacetime: |

  clickhouse: |
    SELECT COUNT(DISTINCT r.id) AS ride_count
    FROM ride_points r
    WHERE r.timestamp BETWEEN :period_short
      AND (toHour(r.timestamp) BETWEEN 7 AND 9 OR toHour(r.timestamp) BETWEEN 16 AND 18);

  repetition: 1 
  parameters:
    - period_short
- name: RidesAcrossMultipleHours #temporal
  use: true
  description: "Find rides that span across multiple hours within a specified time period, i.e have ride points in more than one hour of the day."
  type: temporal
  mobilitydb: |

  postgis: |
    SELECT r.id
    FROM ride_points r
    WHERE r.timestamp BETWEEN :period_short
    GROUP BY r.id
    HAVING COUNT(DISTINCT EXTRACT(HOUR FROM r.timestamp)) > 1;
  sample_postgis: |
    SELECT r.id
    FROM ride_points r
    WHERE r.timestamp BETWEEN '2026-06-01 08:00:00' AND '2026-06-01 10:00:00'
    GROUP BY r.id
    HAVING COUNT(DISTINCT EXTRACT(HOUR FROM r.timestamp)) > 1;
  sedona: |
    SELECT r.id
    FROM ride_points r
    WHERE r.timestamp BETWEEN :period_short
    GROUP BY r.id
    HAVING COUNT(DISTINCT EXTRACT(HOUR FROM r.timestamp)) > 1;
  spacetime: |

  clickhouse: |
    SELECT r.id
    FROM ride_points r
    WHERE r.timestamp BETWEEN :period_short
    GROUP BY r.id
    HAVING COUNT(DISTINCT toHour(r.timestamp)) > 1;
  repetition: 1 
  parameters:
    - period_short

- name: CountRidesFullyInDistrictRadius #spatial
  use: true
  description: "Find rides that are fully contained within a specified distance of the district's geometry."
  type: spatial
  mobilitydb: |
    WITH d AS (
      SELECT geom
      FROM berlin_districts
      WHERE name = :district
    )
    SELECT r.id
    FROM rides r
    JOIN d ON true
    GROUP BY r.id
    HAVING BOOL_AND(edwithin(r.trip, d.geom, :radius));
  postgis: |
    WITH d AS (
      SELECT geom
      FROM berlin_districts
      WHERE name = :district
    )
    SELECT r.id
    FROM ride_points r
    JOIN d ON true
    GROUP BY r.id
    HAVING BOOL_AND(ST_DWithin(r.geom, d.geom, :radius));
  sample_postgis: |
    WITH d AS (
      SELECT geom
      FROM berlin_districts
      WHERE name = 'Reinickendorf'
    )
    SELECT r.id
    FROM ride_points r
    JOIN d ON true
    GROUP BY r.id
    HAVING BOOL_AND(ST_DWithin(r.geom, d.geom, 500));
  sedona: |
    SELECT r.id
    FROM ride_points r
    JOIN berlin_districts d
      ON d.name = :district
    GROUP BY r.id
    HAVING BOOL_AND(ST_DWithin(r.geom, d.geom, :radius));
  spacetime: |

  clickhouse: | #as of now, I can not find a direct translation to Clickhouse for this query|

  repetition: 1 
  parameters:
  - district
  - radius
- name: countRideInDistrict #spatial
  use: true
  description: "Counts the number of rides within a specified district."
  type: spatial
  mobilitydb: |
    SELECT d.name, COUNT(*) AS ride_count FROM berlin_districts d JOIN rides r ON eintersects(r.trip, d.geom) WHERE d.name = :district GROUP BY d.name;
  postgis: |
    SELECT d.name, COUNT(DISTINCT r.id) AS ride_count FROM berlin_districts d JOIN ride_points r ON ST_Intersects(r.geom, d.geom) WHERE d.name = :district GROUP BY d.name;
  sample_postgis: |
    SELECT d.name, COUNT(DISTINCT r.id) AS ride_count FROM berlin_districts d JOIN ride_points r ON ST_Intersects(r.geom, d.geom) WHERE d.name = 'Reinickendorf' GROUP BY d.name;
  sedona: |
    SELECT d.name, COUNT(DISTINCT r.id) AS ride_count FROM berlin_districts d JOIN ride_points r ON ST_Intersects(r.geom, d.geom) WHERE d.name = :district GROUP BY d.name;
  spacetime: |
   SELECT COUNT(*) FROM ( SELECT DISTINCT trip_id FROM berlin_districts d JOIN ride_points p ON ST_Contains(ST_ToGeom(d.geom::gpolygon), ST_Point(p.x, p.y)) WHERE d.name = :district);
  clickhouse: |
    SELECT d.name, COUNT(DISTINCT r.id) AS ride_count
    FROM berlin_districts d
    JOIN ride_points r ON pointInPolygon((r.lon, r.lat), d.polygon)
    WHERE d.name = :district
    GROUP BY d.name;
  repetition: 1 
  parameters:
  - district


- name: AverageUpdatesPerRideInDistrictInPeriod #spatiotemporal
  use: true
  description: "Calculates the average number of updates (ride points) within a specified district and time period. Only the points within the district are counted, and only the rides that have at least one point in the district during the specified time period are considered."
  type: 
  mobilitydb: |

  postgis: >
    SELECT :district AS name, AVG(num_updates) AS avg_updates
    FROM (
      SELECT r.id, COUNT(*) AS num_updates
      FROM ride_points r
      JOIN berlin_districts d ON ST_Intersects(r.geom, d.geom)
      WHERE d.name = :district
        AND r.timestamp BETWEEN :period_short
      GROUP BY r.id
    ) AS ri;
  sample_postgis: >
    SELECT 'Reinickendorf', AVG(num_updates) AS avg_updates
    FROM (
      SELECT r.id, COUNT(*) AS num_updates
      FROM ride_points r
      JOIN berlin_districts d ON ST_Intersects(r.geom, d.geom)
      WHERE r.timestamp BETWEEN '2026-06-01 08:00:00' AND '2026-06-01 10:00:00'
        AND 
       d.name = 'Reinickendorf'
      GROUP BY r.id
    ) AS ri;
  sedona: |

  spacetime: |

  clickhouse: |
    SELECT :district AS name, AVG(num_updates) AS avg_updates
    FROM (
        SELECT r.id, COUNT(*) AS num_updates
        FROM ride_points r
        JOIN berlin_districts d ON pointInPolygon((r.lon, r.lat), d.polygon)
        WHERE d.name = :district
          AND r.timestamp BETWEEN :period_short
        GROUP BY r.id
    ) AS ri;

  repetition: 1 
  parameters:
    - district
    - period_short
- name: RidesPastOrToUniversityInPeriod #spatiotemporal
  use: true
  description: "Find rides that pass by or go to a specified university within a certain distance and time period. Different to the RidesPastOrToUniversity query, this one also considers the time period and intermittent points instead of just the start and end points of the ride."
  type: 
  mobilitydb: |

  postgis: |
    SELECT DISTINCT r.id
    from ride_points r
    JOIN universities u
      ON ST_DWithin(r.geom, u.geom, :distance)
    WHERE u.name = :university
      AND :period_short @> r.timestamp::timestamp;
  sample_postgis: |
    SELECT DISTINCT r.id
    from ride_points r
    JOIN universities u
      ON ST_DWithin(r.geom, u.geom, 200)
    WHERE u.name = 'Humboldt-Universität-zu-Berlin'
      AND r.timestamp BETWEEN '2026-06-01 08:00:00' AND '2026-06-01 10:00:00';
  sedona: |
    SELECT DISTINCT r.id
    from ride_points r
    JOIN universities u
      ON ST_DWithin(r.geom, u.geom, :distance)
    WHERE u.name = :university
      AND r.timestamp BETWEEN :period_short;
  spacetime: |

  clickhouse: | #also semantically not the same, will likely be excluded from results
    SELECT DISTINCT r.id
    FROM ride_points r
    JOIN universities u ON u.name = :university
    WHERE greatCircleDistance(r.lon, r.lat, u.lon, u.lat) <= :distance
      AND r.timestamp BETWEEN :period_short;


  repetition: 1 
  parameters:
    - university
    - distance
    - period_short

# Trip Summary Table
- name: averageRideDurationToGoAtUniversityInPeriod #spatialtemporal
  use: false
  description: "Calculates the average duration of rides that go to a specified university within a certain distance (of the university) and time period (ride overlaps with the time period is enough as the criteria)"
  type: spatiotemporal
  mobilitydb: |
    SELECT AVG(endTimestamp(r.trip) - startTimestamp(r.trip)) AS avg_duration FROM rides r JOIN universities u ON ST_DWithin(endValue(r.trip), u.geom::geometry, :distance) WHERE startTimestamp(r.trip) && :period_short AND u.name = :university;
  postgis: |
    SELECT
      AVG(r.end_time - r.start_time) AS avg_duration
    FROM ride_trajectories r
    JOIN universities u
      ON ST_DWithin(r.destination_geom, u.geom, :distance)
    WHERE
      :period_short @> r.start_time::timestamp
      AND u.name = :university;
  sedona: |
    SELECT
      AVG(re.end_time - rs.start_time) AS avg_duration
    FROM ride_trajectories_start rs JOIN ride_trajectories_end re ON re.id = rs.id
    JOIN universities u
      ON ST_DWithin(re.destination_geom, u.geom, :distance)
    WHERE
      rs.start_time BETWEEN :period_short
      AND u.name = :university;
  spacetime: |
    SELECT AVG(@t)
    FROM berlin_universities u
    JOIN rides r ON ST_DWithin(ST_Point(r.x1, r.y1), ST_ToGeom(u.geom::gmpolygon), :distance)
    WHERE t[1] <@ EPOCHRANGE :period_short AND u.name = :university
  clickhouse: | #again, not semantically the same, will likely be excluded from results
    SELECT AVG(r.end_time - r.start_time) AS avg_duration
    FROM ride_trajectories r
    JOIN universities u ON u.name = :university
    WHERE greatCircleDistance(r.end_lon, r.end_lat, u.lon, u.lat) <= :distance
      AND r.start_time BETWEEN :period_short;
  repetition: 1 
  parameters:
  - period_short
  - university
  - distance

- name: averageRideDurationDuringDay #temporal
  use: false
  description: "Calculates the average duration of rides that occur (at least partially) during a specific day."
  type: temporal
  mobilitydb: |
    SELECT AVG(endTimestamp(trip)-startTimestamp(trip)) AS avg_duration FROM rides r WHERE r.trip && span(DATE :day::timestamp, DATE :day + INTERVAL '1 day' - INTERVAL '1 second');
  postgis: |
    SELECT
      AVG(r.end_time - r.start_time) AS avg_duration
    FROM ride_trajectories r
    WHERE (r.start_time, r.end_time)
          OVERLAPS (:day::timestamp, :day::timestamp + INTERVAL '1 day');
  sedona: |
    SELECT AVG(re.end_time - rs.start_time) AS avg_duration FROM ride_trajectories_start rs JOIN ride_trajectories_end re ON re.id = rs.id WHERE (rs.start_time, re.end_time) OVERLAPS (:day::timestamp, :day::timestamp + INTERVAL '1 day');
  spacetime: |
    SELECT AVG(@t) FROM rides WHERE t <@ RANGE(EPOCH :day, (EPOCH :day) + tp '1d')
  clickhouse: |
    SELECT AVG(r.end_time - r.start_time) AS avg_duration
    FROM ride_trajectories r
    WHERE (r.start_time, r.end_time)
          OVERLAPS (:day::timestamp, :day::timestamp + INTERVAL '1 day');
  repetition: 1 
  parameters:
  - day


# Write Operations


- name: insertSingleridePoint
  use: true
  description: "Insert a single ride point"
  type: insert
  mobilitydb : |
  postgis: |
    INSERT INTO ride_points (id, geom, timestamp)
    VALUES (:id, :point, :instant);
  sedona: |
  spacetime: |
  
  clickhouse: |
    INSERT INTO ride_points (id, geom, timestamp)
    VALUES (:id, :point, :instant);

  repetition: 600
  parameters:
  - id
  - point
  - instant

- name: updateridePoint
  use: true
  description: "Update location of a ride point"
  type: update
  mobilitydb: |
  postgis: |
    UPDATE ride_points
    SET geom = :point
    WHERE id = :id;
  sedona: |
  spacetime: |
  clickhouse: |
    UPDATE ride_points
    SET geom = :point
    WHERE id = :id;
  repetition: 100
  parameters:
  - id
  - point

- name: deleteridePoint
  use: true
  description: "Delete a ride point"
  type: delete
  mobilitydb: |
  postgis: |
    DELETE FROM ride_points
    WHERE id = :id;
  sedona: |
  spacetime: |
  clickhouse: |
 
  repetition: 100
  parameters:
  - id

- name: bulkInsertridePoints
  use: true
  description: "Insert multiple points in one statement"
  type: bulk_insert
  mobilitydb: |
  postgis: |
    INSERT INTO ride_points (id, geom, timestamp)
    VALUES :bulk_values;
  sedona: |
  spacetime: |
  clickhouse: |
    INSERT INTO ride_points (id, geom, timestamp)
    VALUES :bulk_values;
  repetition: 200
  parameters:
  - bulk_values



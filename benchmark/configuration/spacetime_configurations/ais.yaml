benchmark:
  sut: MobilityDB
  mixed: false
  nodes:
  - ''
  threads: 16
  test: false
  random_seed: 1500
queryConfigs:
- name: CrossingsActiveAtGivenHourOfDay #temporal
  use: true
  description: "Counts the number of active crossings at a given hour of the day within a time period"
  type: temporal
  mobilitydb: |
    WITH ts_table AS (SELECT c.id,unnest(timestamps(atTime(trip,:period_medium))) AS ts FROM crossings c WHERE c.trip && :period_medium) SELECT COUNT(DISTINCT id) FROM ts_table WHERE EXTRACT(HOUR FROM ts) = :hour and ts BETWEEN :period_medium;
  postgis: |
    SELECT COUNT(DISTINCT c.id) from crossing_points c WHERE EXTRACT(HOUR FROM c.timestamp) = :hour AND c.timestamp BETWEEN :period_medium;
  sedona: |
    SELECT COUNT(DISTINCT c.id) from crossing_points c WHERE EXTRACT(HOUR FROM c.timestamp) = :hour AND c.timestamp BETWEEN :period_medium;
  spacetime: |
    SELECT COUNT(*) FROM ( SELECT DISTINCT id FROM crossing_points c WHERE HOUR(c.t) = :hour and c.t && EPOCHRANGE :period_medium);
  clickhouse: |
    SELECT COUNT(DISTINCT id) FROM crossing_points c WHERE toHour(c.timestamp) = :hour AND c.timestamp BETWEEN :period_medium;
  repetition: 52 
  parameters:
  - hour
  - period_medium
- name: busiestDayInWeekPeriod #temporal
  use: true
  description: "Find the day with the highest number of unique crossings within a specified week period."
  type: temporal
  mobilitydb: |
    
  postgis: |
    SELECT date_trunc('day', c.timestamp) AS day, COUNT(DISTINCT c.id) AS unique_crossings FROM crossing_points c WHERE c.timestamp BETWEEN :period_week GROUP BY day ORDER BY unique_crossings DESC LIMIT 1;
  sample_postgis: |
    SELECT date_trunc('day', c.timestamp) AS day, COUNT(DISTINCT c.id) AS unique_crossings FROM crossing_points c WHERE c.timestamp BETWEEN '2023-01-01' AND '2023-01-07' GROUP BY day ORDER BY unique_crossings DESC LIMIT 1; 
  sedona: |
    SELECT date_trunc('day', c.timestamp) AS day, COUNT(DISTINCT c.id) AS unique_crossings FROM crossing_points c WHERE c.timestamp BETWEEN :period_week GROUP BY day ORDER BY unique_crossings DESC LIMIT 1;
  spacetime: |
    SELECT day, COUNT(*) AS unique_crossings FROM ( SELECT DISTINCT id, DATE_TRUNC('day', c.t) AS day FROM crossing_points c WHERE c.t && EPOCHRANGE :period_week) GROUP BY day ORDER BY unique_crossings DESC LIMIT 1;
  clickhouse: |
    SELECT toStartOfDay(c.timestamp) AS day, COUNT(DISTINCT c.id) AS unique_crossings
    FROM crossing_points c
    WHERE c.timestamp BETWEEN :period_week
    GROUP BY day
    ORDER BY unique_crossings DESC
    LIMIT 1;

  repetition: 52 
  parameters:
  - period_week

- name: countActiveCrossingsNearIsland #spatial
  use: true
  description: "Counts the number of active crossings near a given island within a certain distance."
  type: spatial
  mobilitydb: |
   SELECT COUNT(DISTINCT c.id) FROM crossings c JOIN islands i ON edwithin(c.trip, i.geom, :distance) WHERE i.id = :island;
  postgis: |
    SELECT COUNT(DISTINCT c.id) FROM crossing_points c JOIN islands i ON ST_DWithin(c.geom, i.geom, :distance) WHERE i.id = :island GROUP BY i.id;
  sedona: |
    SELECT COUNT(DISTINCT c.id) FROM crossing_points c JOIN islands i ON ST_DWithin(c.geom, i.geom, :distance) WHERE i.id = :island GROUP BY i.id;
  spacetime: |
    SELECT COUNT(*) FROM (
    SELECT DISTINCT id
    FROM crossing_points c
    JOIN islands i ON ST_DWithin(ST_Point(c.x, c.y), ST_ToGeom(i.geom::gmpolygon), :distance)
    WHERE i.id = :island
    );
  clickhouse: | #same problem, not semantically the same, will likely be excluded from results
    SELECT COUNT(DISTINCT c.id) AS crossing_count
    FROM crossing_points c
    JOIN islands i ON i.id = :island
    WHERE greatCircleDistance(c.lon, c.lat, i.lon, i.lat) <= :distance;


  repetition: 52 
  parameters:
  - island
  - distance
- name: crossingsAroundHarbour #spatial
  use: true
  description: "Finds the crossings that are within a certain distance of a specified harbour."
  type: spatial
  mobilitydb: |
    SELECT DISTINCT c.id FROM crossings c JOIN harbours h ON edwithin(c.trip, h.geom, :radius) WHERE h.name = :harbour;
  postgis: |
    SELECT DISTINCT c.id FROM crossing_points c JOIN harbours h ON ST_DWithin(c.geom, h.geom, :radius) WHERE h.name = :harbour;
  sedona: |
    SELECT DISTINCT c.id FROM crossing_points c JOIN harbours h ON ST_DWithin(c.geom, h.geom, :radius) WHERE h.name = :harbour;
  spacetime: |
    SELECT DISTINCT id FROM crossing_points c JOIN harbours h ON ST_DWithin(ST_Point(c.x, c.y), ST_ToGeom(h.geom::gpoint), :radius) WHERE h.name = :harbour;
  clickhouse: |
    SELECT DISTINCT c.id
    FROM crossing_points c
    JOIN harbours h ON h.name = :harbour
    WHERE greatCircleDistance(c.lon, c.lat, h.lon, h.lat) <= :radius;

  repetition: 52 
  parameters:
  - harbour
  - radius

- name: HarbourActivityInPeriod #spatiotemporal
  use: true
  description: "Finds the number of crossings near a specified harbour within a certain distance during a given time period."
  type: spatiotemporal
  mobilitydb: |
    SELECT h.name as harbour_name, COUNT(DISTINCT c.id) AS unique_crossings_near_harbour FROM harbours h JOIN crossings c ON c.trip && :period_medium AND edwithin(attime(c.trip,:period_medium), h.geom, :radius) WHERE h.name = :harbour GROUP BY h.name;
  postgis: |
    SELECT h.name AS harbour_name, COUNT(DISTINCT c.id) AS unique_crossings_near_harbour FROM harbours h JOIN crossing_points c ON ST_DWithin(c.geom, h.geom, :radius) WHERE c.timestamp BETWEEN :period_medium AND h.name = :harbour GROUP BY h.name;
  sedona: |
    SELECT h.name AS harbour_name, COUNT(DISTINCT c.id) AS unique_crossings_near_harbour FROM harbours h JOIN crossing_points c ON ST_DWithin(c.geom, h.geom, :radius) WHERE c.timestamp BETWEEN :period_medium AND h.name = :harbour GROUP BY h.name;
  spacetime: |
    SELECT h.name, COUNT(*) AS unique_crossings_near_harbour from harbours h JOIN crossing_points c ON ST_DWithin(ST_Point(c.x, c.y), ST_ToGeom(h.geom::gpoint), :radius) WHERE c.t && EPOCHRANGE :period_medium AND h.name = :harbour GROUP BY h.name;
  clickhouse: |
    SELECT h.name AS harbour_name, COUNT(DISTINCT c.id) AS unique_crossings_near_harbour
    FROM harbours h
    JOIN crossing_points c ON h.name = :harbour
    WHERE greatCircleDistance(c.lon, c.lat, h.lon, h.lat) <= :radius
      AND c.timestamp BETWEEN :period_medium
    GROUP BY h.name;
  repetition: 52 
  parameters:
  - period_medium
  - radius
  - harbour
- name: islandOrCoastLineCrossingsInPeriod #spatiotemporal
  use: true
  description: "For an island, find the number of crossings that are within a certain distance of the island during a specified time period."
  type: spatiotemporal
  mobilitydb: |
    SELECT COUNT(DISTINCT c.id) FROM crossings c JOIN islands i ON edwithin(attime(c.trip,:period_medium), i.geom, :distance) WHERE c.trip && :period_medium AND i.id = :island;
  postgis: |
    SELECT COUNT(DISTINCT c.id) FROM crossing_points c JOIN islands i ON ST_DWithin(c.geom, i.geom, :distance) WHERE c.timestamp BETWEEN :period_medium AND i.id = :island;
  sedona: |
    SELECT COUNT(DISTINCT c.id) FROM crossing_points c JOIN islands i ON ST_DWithin(c.geom, i.geom, :distance) WHERE c.timestamp BETWEEN :period_medium AND i.id = :island;
  spacetime: |
  clickhouse: | #again, not semantically the same, will likely be excluded from results
    SELECT COUNT(DISTINCT c.id)
    FROM crossing_points c
    JOIN islands i ON i.id = :island
    WHERE greatCircleDistance(c.lon, c.lat, i.lon, i.lat) <= :distance
      AND c.timestamp BETWEEN :period_medium;
  repetition: 52 
  parameters:
  - distance
  - island
  - period_medium

# Trip Summary Table

- name: countActiveCrossingsInPeriod #temporal
  use: false
  description: "Counts the number of active crossings in a given time period."
  type: temporal
  mobilitydb: |
    SELECT COUNT(*) FROM crossings c WHERE c.trip && :period_medium;
  postgis: |
    SELECT COUNT(DISTINCT c.id)
    FROM crossing_trajectories c
    WHERE (c.start_time, c.end_time) OVERLAPS :period_medium;
  sedona: |
    SELECT COUNT(DISTINCT s.id)
    FROM crossing_trajectories_start s
    JOIN crossing_trajectories_end e
      ON e.id = s.id
    WHERE (s.start_time, e.end_time) OVERLAPS :period_medium;
  spacetime: |
    SELECT COUNT(*) FROM crossings c WHERE c.t && EPOCHRANGE :period_medium;
  clickhouse: |
    SELECT COUNT(DISTINCT c.id)
    FROM crossing_trajectories c
    WHERE (c.start_time, c.end_time) OVERLAPS :period_medium;
  repetition: 52 
  parameters:
  - period_medium

- name: averageDurationCrossingStartAtHarbourInPeriod #spatiotemporal
  use: false
  description: "Calculates the average duration of crossings that start at a given harbour within a certain distance and time period."
  type: spatiotemporal
  mobilitydb: |
    SELECT AVG(endTimestamp(c.trip)-startTimestamp(c.trip)) as avg_duration FROM crossings c JOIN harbours h ON ST_DWithin(startValue(c.trip), h.geom, :radius) WHERE :period_medium @> startTimestamp(c.trip) AND h.name = :harbour;
  postgis: |
    SELECT
      AVG(c.end_time - c.start_time) AS avg_duration
    FROM crossing_trajectories c
    JOIN harbours h
      ON ST_DWithin(c.origin_geom::geometry, h.geom::geometry, :radius)
    WHERE h.name = :harbour
      AND :period_medium @> c.start_time::timestamp;
  sedona: |
    SELECT
    AVG(e.end_time - s.start_time) AS avg_duration
    FROM crossing_trajectories_start s
    JOIN crossing_trajectories_end e
        ON e.id = s.id
    JOIN harbours h
        ON h.name = :harbour
        AND ST_DWithin(s.origin_geom, h.geom, :radius)
    WHERE s.start_time BETWEEN :period_medium;
  spacetime: |
    SELECT AVG(@t)
    FROM harbours h
    JOIN crossings ON ST_DWithin(ST_Point(x0, y0), ST_ToGeom(h.geom::gpoint), :radius)
    WHERE h.name = :harbour AND t[0] <@ EPOCHRANGE :period_medium;
  clickhouse: |
    SELECT AVG(c.end_time - c.start_time) AS avg_duration
    FROM crossing_trajectories c
    JOIN harbours h ON h.name = :harbour
    WHERE greatCircleDistance(c.start_lon, c.start_lat, h.lon, h.lat) <= :radius
      AND c.start_time BETWEEN :period_medium;
  repetition: 52 
  parameters:
  - harbour
  - period_medium
  - radius

- name: crossingsConnectTwoGivenHarbours #spatial
  use: false
  description: "Finds crossings that connect two given harbours (i.e are within a specific distance of both harbours.)"
  type: spatial
  mobilitydb: |
    SELECT c.id FROM crossings c JOIN harbours h_start ON ST_DWithin(startValue(c.trip), h_start.geom, :distance) JOIN harbours h_end ON ST_DWithin(endValue(c.trip), h_end.geom, :distance) WHERE h_start.name = :harbour AND h_end.name = :port;
  postgis: |
    SELECT DISTINCT c.id FROM crossing_trajectories c JOIN harbours h_start ON h_start.name = :harbour AND ST_DWithin(c.origin_geom::geometry, h_start.geom::geometry, :distance) JOIN harbours h_end ON h_end.name = :port AND ST_DWithin(c.destination_geom::geometry, h_end.geom::geometry, :distance);
  sedona: |
    SELECT DISTINCT s.id FROM crossing_trajectories_start s JOIN harbours h_start ON h_start.name = :harbour AND ST_DWithin(s.origin_geom, h_start.geom, :distance) JOIN crossing_trajectories_end e ON e.id = s.id JOIN harbours h_end ON h_end.name = :port AND ST_DWithin(e.destination_geom, h_end.geom, :distance);
  spacetime: |
    SELECT id
    FROM harbours h1, harbours h2
    JOIN crossings c ON ST_DWithin(ST_Point(x0, y0), ST_ToGeom(h1.geom::gpoint), :distance)
    AND ST_DWithin(ST_Point(x1, y1), ST_ToGeom(h2.geom::gpoint), :distance)
    WHERE h1.name = :harbour AND h2.name = :port;
  clickhouse: |
    SELECT DISTINCT c.id
    FROM crossing_trajectories c
    JOIN harbours h_start ON h_start.name = :harbour
    JOIN harbours h_end ON h_end.name = :port
    WHERE greatCircleDistance(c.start_lon, c.start_lat, h_start.lon, h_start.lat) <= :distance
      AND greatCircleDistance(c.end_lon, c.end_lat, h_end.lon, h_end.lat) <= :distance;
  repetition: 52 
  parameters:
  - harbour
  - port
  - distance

# Write Operations
#live updates not supported in sedona, so this is not possible
- name: insertSingleCrossingPoint
  use: true
  description: "Insert a single crossing point"
  type: insert
  mobilitydb: |
    INSERT INTO crossing_points (id, trip, timestamp)
    VALUES (:id, :trip, :instant);
  postgis: |
    INSERT INTO crossing_points (id, geom, timestamp)
    VALUES (:id, :point, :instant);
  sedona: |
  spacetime: |
    
  clickhouse: |
    INSERT INTO crossing_points (id, geom, timestamp)
    VALUES (:id, :point, :instant);

  repetition: 600
  parameters:
  - id
  - point
  - instant

- name: updateCrossingPoint
  use: true
  description: "Update location of a crossing point"
  type: update
  mobilitydb: |
    UPDATE crossing_points
    SET trip = :trip
    WHERE id = :id;
  postgis: |
    UPDATE crossing_points
    SET geom = :point
    WHERE id = :id;
  sedona: |
  spacetime: |
  clickhouse: |
    UPDATE crossing_points
    SET geom = :point
    WHERE id = :id;
  repetition: 100
  parameters:
  - id
  - point

- name: deleteCrossingPoint
  use: true
  description: "Delete a crossing point"
  type: delete
  mobilitydb: |
    DELETE FROM crossing_points
    WHERE id = :id;
  postgis: |
    DELETE FROM crossing_points
    WHERE id = :id;
  sedona: |
  spacetime: |
  clickhouse: |
    DELETE FROM crossing_points
    WHERE id = :id;
  repetition: 100
  parameters:
  - id

- name: bulkInsertCrossingPoints
  use: true
  description: "Insert multiple points in one statement"
  type: bulk_insert
  mobilitydb: |
    INSERT INTO crossing_points (id, trip, timestamp)
    VALUES :bulk_values;
  postgis: |
    INSERT INTO crossing_points (id, geom, timestamp)
    VALUES :bulk_values;
  sedona: | 
  spacetime: |
  clickhouse: |
    INSERT INTO crossing_points (id, geom, timestamp)
    VALUES :bulk_values;
  repetition: 200
  parameters:
  - bulk_values







benchmark:
  sut: MobilityDB
  mixed: false
  nodes:
  - ''
  threads: 16
  test: false
  random_seed: 1500

# DuckDB dialect notes (added when a "duckdb:" query block was introduced below -- see the fuller
# research write-up in crossings_benchmark.yaml; summarized here, and see the duckdb-cluster/
# README.md bundle for the concrete 5-node setup):
#   - "Distributed DuckDB" means DuckLake (Postgres-backed catalog + Parquet on shared object
#     storage) attached by multiple independent DuckDB engines. ATTACH is a one-time setup step,
#     not part of each query -- duckdb: blocks below are plain DuckDB SQL. This is shared storage
#     queried by independent single-node engines, not shared-nothing parallel query execution
#     (no cross-node shuffle/parallel join, unlike Sedona/Spark).
#   - GEOMETRY is a core DuckDB type (since 1.5.0); the "spatial" extension supplies
#     ST_Distance/ST_DWithin/ST_Intersects etc. generically over geometry type, including
#     point-to-polygon distance.
#   - EXTRACT/date_trunc/INTERVAL/CTEs/joins/subqueries/GROUP BY-HAVING/COUNT(DISTINCT ...)/
#     standard DML all supported with Postgres-compatible syntax -- most read queries below port
#     over from the postgis translation essentially unchanged.
#   - Write consistency for the DuckLake configuration above is snapshot-isolated with a
#     documented (but still-maturing) retry-on-conflict mechanism for concurrent writers --
#     different from a single Postgres instance's immediate read-after-write.

queryConfigs:

- name: FlightsAtNightInPeriod #temporal
  use: true
  description: "Find Flights that occur during nighttime hours (e.g., 10 PM to 7 AM) within a specified time period."
  type: temporal
  # FIX: unnest(attime(...)) AS u(value, time) fails outright ("The temporal value cannot have
  # linear interpolation") -- flights.trip uses linear interpolation between GPS fixes, and you
  # can't pair a continuum of interpolated values with discrete instants via unnest. The query
  # never actually reads u.value (only u.time, for the hour-of-day filter), so unnesting just the
  # timestamps -- same pattern the AIS benchmark's CrossingsActiveAtGivenHourOfDay already uses
  # successfully -- sidesteps the interpolation restriction entirely.
  mobilitydb: |
    -- (2026-10-02) trip-span version on the trip summary table, same question as SpaceTime's
    -- (whose rides/flights/crossings are trip summaries, one row per trip with its time range)
    SELECT s.id FROM flights_summary s
    WHERE s.start_time >= TIMESTAMP :period_medium_start AND s.end_time <= TIMESTAMP :period_medium_end
      AND (date_trunc('day', s.start_time) <> date_trunc('day', s.end_time)
           OR s.start_time - date_trunc('day', s.start_time) < INTERVAL '7 hours'
           OR s.end_time - date_trunc('day', s.end_time) >= INTERVAL '22 hours');
  postgis: |
    -- (2026-10-02) trip-span version on the trip summary table, same question as SpaceTime's
    -- (whose rides/flights/crossings are trip summaries, one row per trip with its time range)
    SELECT s.id FROM flights_summary s
    WHERE s.start_time >= TIMESTAMP :period_medium_start AND s.end_time <= TIMESTAMP :period_medium_end
      AND (date_trunc('day', s.start_time) <> date_trunc('day', s.end_time)
           OR s.start_time - date_trunc('day', s.start_time) < INTERVAL '7 hours'
           OR s.end_time - date_trunc('day', s.end_time) >= INTERVAL '22 hours');
  sample_postgis: |
    SELECT DISTINCT f.id FROM flight_points f WHERE (EXTRACT(HOUR FROM f.timestamp) BETWEEN 22 AND 23 OR EXTRACT(HOUR FROM f.timestamp) BETWEEN 0 AND 6) AND '2024-01-01 00:00:00'::timestamp <= f.timestamp AND f.timestamp <= '2024-01-05 23:59:59'::timestamp;
  sedona: |
    -- (2026-10-02) trip-span version on the trip summary table, same question as SpaceTime's
    -- (whose rides/flights/crossings are trip summaries, one row per trip with its time range)
    SELECT s.id FROM flights_summary s
    WHERE s.start_time >= to_timestamp(:period_medium_start) AND s.end_time <= to_timestamp(:period_medium_end)
      AND (date_trunc('DAY', s.start_time) <> date_trunc('DAY', s.end_time) OR hour(s.start_time) < 7 OR hour(s.end_time) >= 22);
  spacetime: |
    SELECT f.flight_id AS id
      FROM flights f
      WHERE f.t <@ EPOCHRANGE :period_medium
      AND (TS_DAYSTART(f.t[0]) <> TS_DAYSTART(f.t[1])
      OR TS_TIMEOFDAY(f.t[0]) <  TP '7h'
      OR TS_TIMEOFDAY(f.t[1]) >= TP '22h');
  clickhouse: |
    -- (2026-10-02) trip-span version on the trip summary table, same question as SpaceTime's
    -- (whose rides/flights/crossings are trip summaries, one row per trip with its time range)
    SELECT s.id FROM flights_summary s
    WHERE s.start_time >= toDateTime(:period_medium_start, 'UTC') AND s.end_time <= toDateTime(:period_medium_end, 'UTC')
      AND (toStartOfDay(s.start_time) != toStartOfDay(s.end_time) OR toHour(s.start_time) < 7 OR toHour(s.end_time) >= 22);
  duckdb: |
    -- (2026-10-02) trip-span version on the trip summary table, same question as SpaceTime's
    -- (whose rides/flights/crossings are trip summaries, one row per trip with its time range)
    SELECT s.id FROM flights_summary s
    WHERE s.start_time >= TIMESTAMP :period_medium_start AND s.end_time <= TIMESTAMP :period_medium_end
      AND (date_trunc('day', s.start_time) <> date_trunc('day', s.end_time)
           OR s.start_time - date_trunc('day', s.start_time) < INTERVAL '7 hours'
           OR s.end_time - date_trunc('day', s.end_time) >= INTERVAL '22 hours');
  repetition: 50
  parameters:
  - period_medium

- name: FlightsAtLowAltitudeInPeriod #temporal
  use: true
  description: "Find flights that fly within a specified altitude band (between a low and a high threshold) within a time period."
  type: temporal
  mobilitydb: |
    -- FIX: MobilityDB has no direct "ever between" comparison operator (only ?=, ?<, ?<=, ?>, ?>=
    -- against a scalar), and combining two independent "ever" checks (?>= low AND ?<= high) is NOT
    -- equivalent to "ever within the band" -- a flight can satisfy each ever-check at a *different*
    -- instant (e.g. two separate legs within the same :period_medium) without ever actually being
    -- inside [low, high] at once. atSpan(temp, span) -- named atRange() in MobilityDB < 1.1 --
    -- restricts the temporal value to the instants where it falls inside the given span; a non-null
    -- result means the altitude really was inside the band at least once during the period, the
    -- true analogue of the single-threshold version's "?<" ever-check.
    -- FIX: two problems, both this MobilityDB version renaming things out from under the query
    -- (confirmed live against the actual instance): (1) floatspan(a, b) doesn't exist as a
    -- two-value constructor (only floatspan(intspan)/floatspan(tbox) single-arg overloads) --
    -- like tstzspan/period earlier, the two-value constructor is the generic span(lo, hi), which
    -- also needs explicit float casts since :low_altitude/:high_altitude substitute as bare
    -- integers and span() has no (integer, integer) -> floatspan overload. (2) atSpan(tfloat,
    -- floatspan) doesn't exist either -- the value-restriction function is atvalues(tfloat,
    -- floatspan).
    SELECT DISTINCT f.id FROM flights f WHERE atvalues(attime(f.altitude, :period_medium), span(:low_altitude::float, :high_altitude::float)) IS NOT NULL AND f.trip && :period_medium;
  postgis: |
    SELECT DISTINCT f.id FROM flight_points f
    WHERE f.altitude BETWEEN :low_altitude AND :high_altitude AND f.timestamp BETWEEN :period_medium;
  sample_postgis: |
    -- Sample bounds [9300, 10300]: chosen from the actual altitude distribution in
    -- data_generators/aviation/parquet_flights (sampled 2 of 676 files, ~8M points, altitude range
    -- 1000-10500) -- altitude is ~uniform from 1000-9075 (climb/descent) but over half of all points
    -- sit in [9550, 10500] (cruise), so [9300, 10300] lands right on that transition and splits the
    -- sampled data almost exactly in half (~51% inside), unlike a low/generic band which would
    -- either match nearly everything or next to nothing.
    SELECT DISTINCT f.id FROM flight_points f
    WHERE f.altitude BETWEEN 9300 AND 10300 AND f.timestamp BETWEEN '2024-01-01 00:00:00'::timestamp AND '2024-01-05 23:59:59'::timestamp;
  sedona: |
    SELECT DISTINCT f.id FROM flight_points f
    WHERE f.altitude BETWEEN :low_altitude AND :high_altitude AND f.timestamp BETWEEN :period_medium;
  # FIX: nst's translation predates the low/high_altitude band split (their comment marks it a
  # placeholder pending T21540) and only compared against a single :low_altitude bound. Rewritten
  # to the two-bound BETWEEN, which the SpaceTime dialect already uses elsewhere for non-time
  # ranges (e.g. cycling's RidesDuringRushHourInPeriod), to match every other engine's query above.
  spacetime: |
    SELECT DISTINCT f.flight_id AS id FROM flight_points f
    WHERE f.altitude BETWEEN :low_altitude AND :high_altitude AND f.t <@ EPOCHRANGE :period_medium;
  clickhouse: |
    SELECT DISTINCT f.id FROM flight_points f
    WHERE f.altitude BETWEEN :low_altitude AND :high_altitude AND f.timestamp BETWEEN :period_medium;
  duckdb: |
    SELECT DISTINCT f.id FROM flight_points f
    WHERE f.altitude BETWEEN :low_altitude AND :high_altitude AND f.timestamp BETWEEN :period_medium;
  repetition: 50
  parameters:
    - period_medium
    - low_altitude
    - high_altitude

- name: countFlightsInCounties #spatial
  use: true
  description: "Counts the number of distinct flights that have flown through a given county."
  type: spatial
  mobilitydb: |
    SELECT k.name, COUNT(DISTINCT f.id) as flight_count FROM counties k JOIN flights f ON f.trip && stbox(k.geom) AND eintersects(f.trip, k.geom) WHERE k.name = :county GROUP BY k.name;
  postgis: |
    SELECT k.name, COUNT(DISTINCT f.id) as flight_count FROM counties k JOIN flight_points f ON ST_Intersects(f.geom, k.geom) WHERE k.name = :county GROUP BY k.name;
  sample_postgis: |
    SELECT k.name, COUNT(DISTINCT f.id) as flight_count FROM counties k JOIN flight_points f ON ST_Intersects(f.geom, k.geom) WHERE k.name = 'Krs Paderborn' GROUP BY k.name;
  sedona: |
    SELECT k.name, COUNT(DISTINCT f.id) as flight_count FROM counties k JOIN flight_points f ON ST_Intersects(f.geom, k.geom) WHERE k.name = :county GROUP BY k.name;
  spacetime: |
    SELECT :county as name, COUNT(DISTINCT f.flight_id) AS flight_count
    FROM counties k
    JOIN flight_points f ON ST_Point(f.x, f.y) <@ ST_ToGeom(k.geom::gpolygon)
    WHERE k.name = :county;
  # FIX: joining two Distributed-engine tables (counties, flight_points) fails outright --
  # confirmed live ("Double-distributed IN/JOIN subqueries is denied"). GLOBAL JOIN broadcasts
  # counties (small, one row per name filter) to every node instead of attempting a
  # distributed-to-distributed join.
  clickhouse: |
    -- (2026-10-07) H3: the h3 GLOBAL IN (...) condition lets ClickHouse use the table's H3 primary
    -- key (h3, timestamp, id) and read only the cells that can contain a match -- a superset built
    -- by the h3Cover* functions (scripts/clickhouse_functions.sql). The exact predicate below is
    -- unchanged and decides the result. The scan-only version is kept as clickhouse_scan (not run).
    -- FIX: GLOBAL JOIN broadcasts whichever table is on the JOIN's right-hand side -- this had it
    -- backwards, broadcasting the 2.7B-row flight_points fact table to every node instead of the
    -- 53-row counties table (confirmed live: Code 241 MEMORY_LIMIT_EXCEEDED, would use 9.32GiB).
    -- Swapped so flight_points is FROM/left and the small counties table is the GLOBAL/right side.
    SELECT k.name, COUNT(DISTINCT f.id) as flight_count
    FROM flight_points f
    GLOBAL JOIN counties k ON pointInPolygon((f.lon, f.lat), k.geom)
    WHERE k.name = :county
      AND f.h3 GLOBAL IN (SELECT arrayJoin(h3CoverRing(arrayElement(geom.Polygon, 1), 0)) FROM counties WHERE name = :county)
    GROUP BY k.name;
  clickhouse_scan: |
    -- FIX: GLOBAL JOIN broadcasts whichever table is on the JOIN's right-hand side -- this had it
    -- backwards, broadcasting the 2.7B-row flight_points fact table to every node instead of the
    -- 53-row counties table (confirmed live: Code 241 MEMORY_LIMIT_EXCEEDED, would use 9.32GiB).
    -- Swapped so flight_points is FROM/left and the small counties table is the GLOBAL/right side.
    SELECT k.name, COUNT(DISTINCT f.id) as flight_count
    FROM flight_points f
    GLOBAL JOIN counties k ON pointInPolygon((f.lon, f.lat), k.geom)
    WHERE k.name = :county
    GROUP BY k.name;
  duckdb: |
    -- (2026-10-08) ST_Intersects_Extent(geom, <area's bounding box>) in front of the exact predicate: the point
    -- tables are stored in Hilbert order with a bounding box per row group, and this cheap box test lets
    -- DuckDB skip the row groups outside the area. The exact predicate is unchanged and decides the result.
    -- The previous version is kept as duckdb_scan (not run).
    SELECT k.name, COUNT(DISTINCT f.id) as flight_count FROM counties k JOIN flight_points f ON ST_Intersects(f.geom, k.geom) WHERE k.name = :county AND ST_Intersects_Extent(f.geom, (SELECT ST_MakeEnvelope(ST_XMin(geom) - 0, ST_YMin(geom) - 0, ST_XMax(geom) + 0, ST_YMax(geom) + 0) FROM counties WHERE name = :county)) GROUP BY k.name;
  duckdb_scan: |
    SELECT k.name, COUNT(DISTINCT f.id) as flight_count FROM counties k JOIN flight_points f ON ST_Intersects(f.geom, k.geom) WHERE k.name = :county GROUP BY k.name;
  repetition: 50
  parameters:
  - county

- name: flightClosestToPoint #spatial
  use: true
  description: "Finds the flight that comes closest to a given point within a certain distance."
  type: spatial
  # FIX (2026-09-30): the great-circle-vs-planar mismatch previously noted here (clickhouse's
  # greatCircleDistance vs. the other dialects' planar EPSG:3857 <->/ST_Distance/ST_DWithin) is
  # fixed below via webMercatorDistance -- see the clickhouse block's comment.
  mobilitydb: |
    -- FIX (2026-10-01): "trip <-> point" is MobilityDB's *temporal* distance (a tfloat over time),
    -- not a scalar, so this returned a whole distance series and ordered by it. |=| is the
    -- nearest-approach distance -- the scalar min over the trajectory, matching postgis's
    -- per-point ST_Distance + ORDER BY ... LIMIT 1.
    SELECT f.id, f.trip |=| :point AS min_distance FROM flights f WHERE edwithin(f.trip, :point, :distance) ORDER BY min_distance ASC LIMIT 1;
  postgis: |
    SELECT f.id, ST_Distance(f.geom, :point) AS min_distance FROM flight_points f WHERE ST_DWithin(f.geom, :point, :distance) ORDER BY min_distance ASC LIMIT 1;
  sample_postgis: |
    SELECT f.id, ST_Distance(f.geom, ST_Transform(ST_SetSRID(ST_Point(9.292273413065667, 52.066008011258475),4326), 3857)) AS min_distance FROM flight_points f WHERE ST_DWithin(f.geom, ST_Transform(ST_SetSRID(ST_Point(9.292273413065667, 52.066008011258475),4326), 3857), 10000) ORDER BY min_distance ASC LIMIT 1;
  sedona: |
    SELECT f.id, ST_Distance(f.geom, :point) AS min_distance FROM flight_points f WHERE ST_DWithin(f.geom, :point, :distance) ORDER BY min_distance ASC LIMIT 1;
  spacetime: |
    -- (2026-10-02) radius in EPSG:3857 units like every other dialect, converted to SpaceTime's
    -- local meters by :st_scale = cos(lat) * 0.99842 (see scripts/spacetime_units.py)
    SELECT f.flight_id AS id, ST_Distance(ST_ToGeom(:point::gpoint), ST_Point(f.x, f.y)) / :st_scale as min_distance
    FROM flight_points f
    WHERE ST_DWithin(ST_Point(f.x, f.y), ST_ToGeom(:point::gpoint), :distance * :st_scale)
    ORDER BY min_distance ASC
    LIMIT 1;
  clickhouse: |
    -- (2026-10-07) H3: the h3 GLOBAL IN (...) condition lets ClickHouse use the table's H3 primary
    -- key (h3, timestamp, id) and read only the cells that can contain a match -- a superset built
    -- by the h3Cover* functions (scripts/clickhouse_functions.sql). The exact predicate below is
    -- unchanged and decides the result. The scan-only version is kept as clickhouse_scan (not run).
    -- FIX: greatCircleDistance needs 4 scalar args (lon1, lat1, lon2, lat2). The original passed
    -- :point (a single packed geometry parameter, the same shape postgis/sedona use above) as if
    -- it were one scalar -- wrong arity, would not run. Fixed assuming decomposed :point_lon /
    -- :point_lat parameters, which are NOT currently in this query's shared `parameters:` list
    -- below -- the harness needs to supply them for ClickHouse specifically (same treatment as
    -- ClosestRestaurantToPoint in geolife_benchmark.yaml).
    -- FIX (2026-09-30, metric parity): greatCircleDistance -> webMercatorDistance, a SQL UDF
    -- (created ON CLUSTER cluster_1 -- see scripts/clickhouse_functions.sql) that projects both points into Web
    -- Mercator (EPSG:3857) and takes the planar Euclidean distance, matching ST_DWithin/<->'s
    -- metric exactly rather than approximately -- see ais/config/combinedBenchConf.yaml's
    -- crossingsAroundHarbour clickhouse block for the formula derivation and live verification
    -- (exact row-set match against postgis/mobilitydb/sedona for a real harbour query).
    SELECT f.id, sqrt(pow(f.x - 6378137. * radians(:point_lon), 2) + pow(f.y - 6378137. * log(tan(pi() / 4 + radians(:point_lat) / 2)), 2)) AS min_distance
    FROM flight_points f
    WHERE f.h3 GLOBAL IN (SELECT arrayJoin(h3CoverPoint(:point_lon, :point_lat, :distance)))
      AND sqrt(pow(f.x - 6378137. * radians(:point_lon), 2) + pow(f.y - 6378137. * log(tan(pi() / 4 + radians(:point_lat) / 2)), 2)) <= :distance
    ORDER BY min_distance ASC
    LIMIT 1;
  clickhouse_scan: |
    -- FIX: greatCircleDistance needs 4 scalar args (lon1, lat1, lon2, lat2). The original passed
    -- :point (a single packed geometry parameter, the same shape postgis/sedona use above) as if
    -- it were one scalar -- wrong arity, would not run. Fixed assuming decomposed :point_lon /
    -- :point_lat parameters, which are NOT currently in this query's shared `parameters:` list
    -- below -- the harness needs to supply them for ClickHouse specifically (same treatment as
    -- ClosestRestaurantToPoint in geolife_benchmark.yaml).
    -- FIX (2026-09-30, metric parity): greatCircleDistance -> webMercatorDistance, a SQL UDF
    -- (created ON CLUSTER cluster_1 -- see scripts/clickhouse_functions.sql) that projects both points into Web
    -- Mercator (EPSG:3857) and takes the planar Euclidean distance, matching ST_DWithin/<->'s
    -- metric exactly rather than approximately -- see ais/config/combinedBenchConf.yaml's
    -- crossingsAroundHarbour clickhouse block for the formula derivation and live verification
    -- (exact row-set match against postgis/mobilitydb/sedona for a real harbour query).
    SELECT f.id, sqrt(pow(f.x - 6378137. * radians(:point_lon), 2) + pow(f.y - 6378137. * log(tan(pi() / 4 + radians(:point_lat) / 2)), 2)) AS min_distance
    FROM flight_points f
    WHERE sqrt(pow(f.x - 6378137. * radians(:point_lon), 2) + pow(f.y - 6378137. * log(tan(pi() / 4 + radians(:point_lat) / 2)), 2)) <= :distance
    ORDER BY min_distance ASC
    LIMIT 1;
  duckdb: |
    -- (2026-10-08) ST_Intersects_Extent(geom, <area's bounding box>) in front of the exact predicate: the point
    -- tables are stored in Hilbert order with a bounding box per row group, and this cheap box test lets
    -- DuckDB skip the row groups outside the area. The exact predicate is unchanged and decides the result.
    -- The previous version is kept as duckdb_scan (not run).
    SELECT f.id, ST_Distance(f.geom, :point) AS min_distance FROM flight_points f WHERE ST_Intersects_Extent(f.geom, ST_MakeEnvelope(ST_XMin(:point) - :distance, ST_YMin(:point) - :distance, ST_XMax(:point) + :distance, ST_YMax(:point) + :distance)) AND ST_DWithin(f.geom, :point, :distance) ORDER BY min_distance ASC LIMIT 1;
  duckdb_scan: |
    SELECT f.id, ST_Distance(f.geom, :point) AS min_distance FROM flight_points f WHERE ST_DWithin(f.geom, :point, :distance) ORDER BY min_distance ASC LIMIT 1;
  repetition: 50
  parameters:
  - point
  - distance

- name: flightsInCountyInPeriod #spatiotemporal
  use: true
  description: "Finds distinct flights that have flown through a given county within a certain time period."
  type: spatiotemporal
  mobilitydb: |
    SELECT DISTINCT f.id FROM flights f, counties k WHERE k.name = :county AND f.trip && stbox(k.geom, :period_medium) AND eintersects(attime(f.trip, :period_medium), k.geom);
  postgis: |
    SELECT DISTINCT f.id FROM flight_points f, counties k WHERE k.name = :county AND ST_Intersects(f.geom,k.geom) AND f.timestamp BETWEEN :period_medium;
  sample_postgis: |
    SELECT DISTINCT f.id FROM flight_points f, counties k WHERE k.name = 'Krs Paderborn' AND ST_Intersects(f.geom,k.geom) AND f.timestamp BETWEEN '2024-01-01 00:00:00'::timestamp AND '2024-01-05 23:59:59'::timestamp;
  sedona: |
    SELECT DISTINCT f.id FROM flight_points f, counties k WHERE k.name = :county AND ST_Intersects(f.geom,k.geom) AND f.timestamp BETWEEN :period_medium;
  spacetime: |
    SELECT DISTINCT f.flight_id AS id
    FROM flight_points f
    JOIN counties k ON ST_Point(f.x, f.y) <@ ST_ToGeom(k.geom::gpolygon)
    WHERE k.name = :county AND f.t <@ EPOCHRANGE :period_medium;
  # FIX: same "Double-distributed IN/JOIN subqueries is denied" issue as countFlightsInCounties
  # above -- GLOBAL JOIN broadcasts counties instead of attempting a distributed-to-distributed
  # join.
  clickhouse: |
    -- (2026-10-07) H3: the h3 GLOBAL IN (...) condition lets ClickHouse use the table's H3 primary
    -- key (h3, timestamp, id) and read only the cells that can contain a match -- a superset built
    -- by the h3Cover* functions (scripts/clickhouse_functions.sql). The exact predicate below is
    -- unchanged and decides the result. The scan-only version is kept as clickhouse_scan (not run).
    SELECT DISTINCT f.id
    FROM flight_points f
    GLOBAL JOIN counties k ON pointInPolygon((f.lon, f.lat), k.geom)
    WHERE k.name = :county AND f.timestamp BETWEEN :period_medium
      AND f.h3 GLOBAL IN (SELECT arrayJoin(h3CoverRing(arrayElement(geom.Polygon, 1), 0)) FROM counties WHERE name = :county);
  clickhouse_scan: |
    SELECT DISTINCT f.id
    FROM flight_points f
    GLOBAL JOIN counties k ON pointInPolygon((f.lon, f.lat), k.geom)
    WHERE k.name = :county AND f.timestamp BETWEEN :period_medium;
  duckdb: |
    -- (2026-10-08) ST_Intersects_Extent(geom, <area's bounding box>) in front of the exact predicate: the point
    -- tables are stored in Hilbert order with a bounding box per row group, and this cheap box test lets
    -- DuckDB skip the row groups outside the area. The exact predicate is unchanged and decides the result.
    -- The previous version is kept as duckdb_scan (not run).
    SELECT DISTINCT f.id FROM flight_points f, counties k WHERE k.name = :county AND ST_Intersects_Extent(f.geom, (SELECT ST_MakeEnvelope(ST_XMin(geom) - 0, ST_YMin(geom) - 0, ST_XMax(geom) + 0, ST_YMax(geom) + 0) FROM counties WHERE name = :county)) AND ST_Intersects(f.geom,k.geom) AND f.timestamp BETWEEN :period_medium;
  duckdb_scan: |
    SELECT DISTINCT f.id FROM flight_points f, counties k WHERE k.name = :county AND ST_Intersects(f.geom,k.geom) AND f.timestamp BETWEEN :period_medium;
  repetition: 50
  parameters:
  - period_medium
  - county
- name: CityActivityAtInstant #spatiotemporal
  use: true
  description: "Find the number of distinct flights that were active in a specific city (+ radius) at a given instant in time, +- 10 seconds."
  type: spatiotemporal
  # FIX (2026-09-30): the great-circle-vs-planar mismatch previously noted here is fixed below
  # via webMercatorDistance -- see flightClosestToPoint's clickhouse block above.
  # FIX: two problems. (1) the CTE's closing ")" was replaced with a "," in the source, leaving
  # the CTE unterminated and the main SELECT dangling after it -- invalid syntax (a CTE body must
  # be closed with ")" before the query that uses it begins). Closed the CTE properly.
  # (2) period(ts1, ts2) doesn't exist in MobilityDB 1.1+ -- the type itself was renamed
  # period -> tstzspan, and its two-timestamptz constructor is the generic span(ts1, ts2), not a
  # type-named function (confirmed live: \df period/tstzspan on the actual instance).
  mobilitydb: |
    WITH filtered_flights AS (
      SELECT f.id, f.trip
      FROM flights f
      WHERE f.trip && span(:instant - INTERVAL '10 seconds', :instant + INTERVAL '10 seconds')
    )
    SELECT COUNT(DISTINCT ff.id) AS flight_count
    FROM filtered_flights ff
    JOIN cities c ON edwithin(attime(ff.trip, span(:instant - INTERVAL '10 seconds', :instant + INTERVAL '10 seconds')), c.geom, :radius)
    WHERE c.name = :city;
  # FIX: ":instant" substitutes as a bare quoted string -- "unknown_literal - INTERVAL" resolves
  # the literal's type to match the interval operator overload rather than inferring timestamp
  # from the surrounding BETWEEN context, so Postgres tried to parse the date string itself AS an
  # interval ("invalid input syntax for type interval") before ever reaching the comparison.
  # Explicit ::timestamp cast confirmed live.
  postgis: |
   WITH filtered_flights AS (
      SELECT f.id, f.geom
      FROM flight_points f
      WHERE f.timestamp BETWEEN :instant::timestamp - INTERVAL '10 seconds' AND :instant::timestamp + INTERVAL '10 seconds')
    SELECT COUNT(DISTINCT ff.id) AS flight_count
    FROM filtered_flights ff
    JOIN cities c ON ST_DWithin(ff.geom, c.geom, :radius)
    WHERE c.name = :city;
  sample_postgis: |
    WITH filtered_flights AS (
      SELECT f.id, f.geom
      FROM flight_points f
      WHERE f.timestamp BETWEEN '2024-01-03 12:00:00'::timestamp - INTERVAL '10 seconds' AND '2024-01-03 12:00:00'::timestamp + INTERVAL '10 seconds')
    SELECT COUNT(DISTINCT ff.id) AS flight_count
    FROM filtered_flights ff
    JOIN cities c ON ST_DWithin(ff.geom, c.geom, 10000)
    WHERE c.name = 'Aachen';
  sedona: |
    WITH filtered_flights AS (
      SELECT f.id, f.geom
      FROM flight_points f
      WHERE f.timestamp BETWEEN :instant - INTERVAL '10 seconds' AND :instant + INTERVAL '10 seconds')
    SELECT COUNT(DISTINCT ff.id) AS flight_count
    FROM filtered_flights ff
    JOIN cities c ON ST_DWithin(ff.geom, c.geom, :radius)
    WHERE c.name = :city;
  spacetime: |
    -- (2026-10-02) radius in EPSG:3857 units like every other dialect, converted to SpaceTime's
    -- local meters by :st_scale = cos(lat) * 0.99842 (see scripts/spacetime_units.py)
    SELECT COUNT(DISTINCT f.flight_id) as flight_count
    FROM flight_points f
    JOIN cities c ON ST_DWithin(ST_Point(f.x, f.y), ST_ToGeom(c.geom::gpoint), :radius * :st_scale)
    WHERE c.name = :city
      AND f.t <@ RANGE ((:instant - TP '10s')::epoch, (:instant + TP '10s')::epoch);
  clickhouse: |
    -- (2026-10-07) H3: the h3 GLOBAL IN (...) condition lets ClickHouse use the table's H3 primary
    -- key (h3, timestamp, id) and read only the cells that can contain a match -- a superset built
    -- by the h3Cover* functions (scripts/clickhouse_functions.sql). The exact predicate below is
    -- unchanged and decides the result. The scan-only version is kept as clickhouse_scan (not run).
    -- FIX (2026-09-30, metric parity): greatCircleDistance -> webMercatorDistance -- see
    -- ais/config/combinedBenchConf.yaml's crossingsAroundHarbour clickhouse block for the
    -- formula derivation and live verification.
    WITH filtered_flights AS (
      SELECT f.id, f.x, f.y
      FROM flight_points f
      WHERE f.h3 GLOBAL IN (SELECT arrayJoin(h3CoverPoint(lon, lat, :radius)) FROM cities WHERE name = :city)
        AND f.timestamp BETWEEN toDateTime(:instant, 'UTC') - INTERVAL 10 SECOND AND toDateTime(:instant, 'UTC') + INTERVAL 10 SECOND)
    SELECT COUNT(DISTINCT ff.id) AS flight_count
    FROM filtered_flights ff
    JOIN cities c ON sqrt(pow(ff.x - c.x, 2) + pow(ff.y - c.y, 2)) <= :radius
    WHERE c.name = :city;
  clickhouse_scan: |
    -- FIX (2026-09-30, metric parity): greatCircleDistance -> webMercatorDistance -- see
    -- ais/config/combinedBenchConf.yaml's crossingsAroundHarbour clickhouse block for the
    -- formula derivation and live verification.
    WITH filtered_flights AS (
      SELECT f.id, f.x, f.y
      FROM flight_points f
      WHERE f.timestamp BETWEEN toDateTime(:instant, 'UTC') - INTERVAL 10 SECOND AND toDateTime(:instant, 'UTC') + INTERVAL 10 SECOND)
    SELECT COUNT(DISTINCT ff.id) AS flight_count
    FROM filtered_flights ff
    JOIN cities c ON sqrt(pow(ff.x - c.x, 2) + pow(ff.y - c.y, 2)) <= :radius
    WHERE c.name = :city;
  duckdb: |
    -- (2026-10-08) ST_Intersects_Extent(geom, <area's bounding box>) in front of the exact predicate: the point
    -- tables are stored in Hilbert order with a bounding box per row group, and this cheap box test lets
    -- DuckDB skip the row groups outside the area. The exact predicate is unchanged and decides the result.
    -- The previous version is kept as duckdb_scan (not run).
    -- FIX (2026-10-01): DuckDB can't resolve "'<literal>' - INTERVAL" (ambiguous overload) -- cast first.
    WITH filtered_flights AS (
      SELECT f.id, f.geom
      FROM flight_points f
      WHERE ST_Intersects_Extent(f.geom, (SELECT ST_MakeEnvelope(ST_XMin(geom) - :radius, ST_YMin(geom) - :radius, ST_XMax(geom) + :radius, ST_YMax(geom) + :radius) FROM cities WHERE name = :city)) AND f.timestamp BETWEEN CAST(:instant AS TIMESTAMP) - INTERVAL '10 seconds' AND CAST(:instant AS TIMESTAMP) + INTERVAL '10 seconds')
    SELECT COUNT(DISTINCT ff.id) AS flight_count
    FROM filtered_flights ff
    JOIN cities c ON ST_DWithin(ff.geom, c.geom, :radius)
    WHERE c.name = :city;
  duckdb_scan: |
    -- FIX (2026-10-01): DuckDB can't resolve "'<literal>' - INTERVAL" (ambiguous overload) -- cast first.
    WITH filtered_flights AS (
      SELECT f.id, f.geom
      FROM flight_points f
      WHERE f.timestamp BETWEEN CAST(:instant AS TIMESTAMP) - INTERVAL '10 seconds' AND CAST(:instant AS TIMESTAMP) + INTERVAL '10 seconds')
    SELECT COUNT(DISTINCT ff.id) AS flight_count
    FROM filtered_flights ff
    JOIN cities c ON ST_DWithin(ff.geom, c.geom, :radius)
    WHERE c.name = :city;
  repetition: 50
  parameters:
  - city
  - instant
  - radius

# Trajectory Table Usage
- name: inCityRadiusInPeriod #spatiotemporal
  use: false
  description: "Finds distinct flights that have flown within a certain radius of a given city during a specified time period."
  type: spatiotemporal
  # FIX (2026-09-30): the great-circle-vs-planar mismatch previously noted here is fixed below
  # via webMercatorDistance -- see flightClosestToPoint's clickhouse block above.
  mobilitydb: |
    SELECT DISTINCT f.id FROM cities AS c JOIN flights AS f ON eDwithin(attime(f.trip, :period_medium), c.geom, :radius) WHERE c.name = :city AND f.trip && :period_medium;
  postgis: |
    -- FIX: was "... WHERE :period_medium @> f.timestamp" -- inconsistent with the BETWEEN-shaped
    -- :period_medium substitution this file uses everywhere else in the active postgis/sedona
    -- queries (FlightsAtNightInPeriod, FlightsAtLowAltitudeInPeriod, flightsInCountyInPeriod all
    -- use "BETWEEN :period_medium"); standardized to match, same fix already applied to the
    -- analogous query in crossings_benchmark.yaml.
    SELECT DISTINCT f.id
    FROM (SELECT name, geom FROM cities WHERE name = :city) AS c
    JOIN flight_points AS f ON ST_DWithin(f.geom, c.geom, :radius)
    WHERE f.timestamp BETWEEN :period_medium;
  sample_postgis: |
    SELECT DISTINCT f.id
    FROM (SELECT name, geom FROM cities WHERE name = 'Aachen') AS c
    JOIN flight_points AS f ON ST_DWithin(f.geom, c.geom, 10000)
    WHERE '2024-01-01 00:00:00'::timestamp <= f.timestamp AND f.timestamp <= '2024-01-05 23:59:59'::timestamp;
  sedona: |
    -- FIX: same "@>" vs BETWEEN inconsistency as postgis above -- standardized to match.
    SELECT DISTINCT f.id
    FROM (SELECT name, geom FROM cities WHERE name = :city) AS c
    JOIN flight_points AS f ON ST_DWithin(f.geom, c.geom, :radius)
    WHERE f.timestamp BETWEEN :period_medium;

  spacetime: |
    SELECT DISTINCT f.flight_id AS id
    FROM flight_points f
    JOIN cities c ON ST_DWithin(ST_Point(f.x, f.y), ST_ToGeom(c.geom::gpoint), :radius)
    WHERE c.name = :city
      AND f.t <@ EPOCHRANGE :period_medium;
  clickhouse: |
    -- FIX: the "c" subquery only projected name/geom, but the WHERE clause below reads c.lon/
    -- c.lat -- neither is in that subquery's column list ("column c.lon does not exist"). cities
    -- has real lon/lat columns in ClickHouse (unlike universities/islands/berlin_districts/
    -- counties, which only have geom) -- the subquery now projects lon/lat directly instead of
    -- the unused geom.
    -- FIX (2026-09-30, metric parity): greatCircleDistance -> webMercatorDistance. This query is
    -- use: false (dormant); correct if ever enabled.
    SELECT DISTINCT f.id
    FROM (SELECT name, lon, lat FROM cities WHERE name = :city) AS c
    JOIN flight_points AS f ON sqrt(pow(f.x - c.x, 2) + pow(f.y - c.y, 2)) <= :radius
    WHERE f.timestamp BETWEEN :period_medium;

  duckdb: |
    SELECT DISTINCT f.id
    FROM (SELECT name, geom FROM cities WHERE name = :city) AS c
    JOIN flight_points AS f ON ST_DWithin(f.geom, c.geom, :radius)
    WHERE f.timestamp BETWEEN :period_medium;

  repetition: 50
  parameters:
  - period_medium
  - city
  - radius


# Write Operations


- name: insertSingleflightPoint
  use: true
  description: "Insert a single flight point"
  type: insert
  # (2026-10-24) MobilityDB writes go to its trajectory table (scratch trajectories with negative ids), which its reads use;
  # the table is distributed by tile_key (a spatial tile of real trips): scratch trajectories get id % 64, spread over the shards
  mobilitydb: |
    INSERT INTO flights (id, tile_key, trip, altitude)
    VALUES (:id, (:id % 64)::int, tgeompoint(:point, TIMESTAMP :instant AT TIME ZONE 'UTC'), tfloat(:altitude, TIMESTAMP :instant AT TIME ZONE 'UTC'));
  postgis: |
    -- FIX: didn't write "altitude" -- see mobilitydb FIX note above.
    INSERT INTO flight_points (id, geom, timestamp, altitude)
    VALUES (:id, :point, :instant, :altitude);
  sedona: |
  spacetime: |

  # FIX: flight_points has no "geom" column in ClickHouse (it stores lat/lon directly, with
  # Point/h3 as MATERIALIZED derivatives) -- reuses the same :point_lon/:point_lat decomposition
  # generateParameterVariations.py already does for other ClickHouse queries.
  # FIX: didn't write "altitude" -- see mobilitydb FIX note above.
  clickhouse: |
    INSERT INTO flight_points (id, timestamp, lat, lon, altitude)
    VALUES (:id, :instant, :point_lat, :point_lon, :altitude);
  duckdb: |
    -- FIX: didn't write "altitude" -- see mobilitydb FIX note above.
    INSERT INTO flight_points (id, geom, timestamp, altitude)
    VALUES (:id, :point, :instant, :altitude);

  repetition: 23
  parameters:
  - id
  - point
  - instant
  - altitude

# NOTE: "id" is not unique in flight_points -- it's the flight's id, shared by every point of
# that flight, not a per-row key. updateflightPoint/deleteflightPoint (WHERE id = :id alone) were
# ambiguously named for an operation that (outside the benchmark's own scratch-id bookkeeping)
# touches every point of the flight, not "a flight point" as the name implied. Split into an
# explicit "Mass" variant (unchanged: every point sharing :id) and a "Single" variant that also
# pins :instant (the exact timestamp of one specific point) so it targets exactly one row.
- name: updateflightPointMass
  use: true
  description: "Update location of every point belonging to a flight id"
  type: update
  # EQUIVALENCE NOTE: write immediacy differs by system -- clickhouse's UPDATE is an async
  # background mutation (ALTER TABLE ... UPDATE, not guaranteed visible immediately after the call
  # returns); duckdb's write goes through DuckLake's snapshot-commit-with-possible-retry path (see
  # header note); sedona doesn't support live updates at all. A latency/throughput comparison
  # across these isn't purely a syntax difference.
  # FIX: two problems. (1) the query referenced ":instant", which is NOT declared in this
  # query's parameters list below (only "id" and "point" are) -- :instant was never going to
  # bind. (2) appendInstant(...) *appends* a new observation to the flight's trajectory rather
  # than overwriting an existing point's location -- a different operation than "update this
  # point's location" (which is what postgis/clickhouse below actually do against the flat
  # flight_points table). Rewritten to match the flat-table update every other dialect uses for
  # this query, consistent with the equivalent update queries in the other three benchmark
  # files, and it no longer needs the undeclared :instant parameter.
  # (2026-10-24) MobilityDB writes go to its trajectory table (scratch trajectories with negative ids), which its reads use;
  # the table is distributed by tile_key (a spatial tile of real trips): scratch trajectories get id % 64, spread over the shards
  mobilitydb: |
    UPDATE flights
    SET trip = tgeompoint(:point, getTime(trip))
    WHERE id = :id;
  postgis: |
    UPDATE flight_points
    SET geom = :point
    WHERE id = :id;
  sedona: |

  spacetime: |
  # FIX: ALTER TABLE ... UPDATE fails outright against flight_points -- confirmed live
  # (CANNOT_UPDATE_COLUMN): lat/lon feed the MATERIALIZED h3 column, which is part of the
  # ORDER BY key, and ClickHouse forbids updating any column a key column derives from. There's
  # no single-statement way to "move" a point in a MergeTree table like this, so it's a re-INSERT
  # (using a self-referencing SELECT to keep each row's own timestamp/altitude) followed by a
  # DELETE of the old rows -- disambiguated from the just-inserted ones by lat, since :point_lat
  # is a freshly generated coordinate that won't collide with an existing point's latitude.
  # ClickHouseExecutor.java now splits on ";" and runs each statement in turn to support this.
  clickhouse: |
    INSERT INTO flight_points (id, timestamp, lat, lon, altitude)
    SELECT id, timestamp, :point_lat, :point_lon, altitude FROM flight_points WHERE id = :id;
    DELETE FROM flight_points_local ON CLUSTER cluster_1 WHERE id = :id AND lat != :point_lat SETTINGS lightweight_delete_mode = 'lightweight_update';
  duckdb: |
    UPDATE flight_points
    SET geom = :point
    WHERE id = :id;
  repetition: 10
  parameters:
  - id
  - point

- name: updateflightPointSingle
  use: true
  description: "Update location of exactly one flight point, identified by id and timestamp"
  type: update_single
  # Same EQUIVALENCE NOTE as updateflightPointMass above.
  # (2026-10-24) MobilityDB writes go to its trajectory table (scratch trajectories with negative ids), which its reads use;
  # the table is distributed by tile_key (a spatial tile of real trips): scratch trajectories get id % 64, spread over the shards
  mobilitydb: |
    UPDATE flights
    SET trip = update(trip, tgeompoint(:point, TIMESTAMP :instant AT TIME ZONE 'UTC'))
    WHERE id = :id AND (TIMESTAMP :instant AT TIME ZONE 'UTC') <@ getTime(trip);
  postgis: |
    UPDATE flight_points
    SET geom = :point
    WHERE id = :id AND timestamp = :instant;
  sedona: |
  spacetime: |
  # Same re-INSERT + DELETE workaround as updateflightPointMass (see its FIX note), scoped down
  # to the one point via "AND timestamp = :instant" on both statements.
  clickhouse: |
    INSERT INTO flight_points (id, timestamp, lat, lon, altitude)
    SELECT id, timestamp, :point_lat, :point_lon, altitude FROM flight_points WHERE id = :id AND timestamp = :instant;
    DELETE FROM flight_points_local ON CLUSTER cluster_1 WHERE id = :id AND timestamp = :instant AND lat != :point_lat SETTINGS lightweight_delete_mode = 'lightweight_update';
  duckdb: |
    UPDATE flight_points
    SET geom = :point
    WHERE id = :id AND timestamp = :instant;
  repetition: 10
  parameters:
  - id
  - point
  - instant

- name: deleteflightPointMass
  use: false  # (2026-10-02) delete queries retired: benchmark writes are insert/update only, reset after each run
  description: "Delete every point belonging to a flight id"
  type: delete
  mobilitydb: |
    -- FIX: was "DELETE FROM flights WHERE id = :id" -- "flights" is the one-row-per-trajectory
    -- table used by the read queries above (see countFlightsInCounties/flightsInCountyInPeriod),
    -- so this would delete an entire flight's trajectory rather than a single point -- a coarser
    -- operation than "delete a flight point" (the query's own name/description) and than what
    -- postgis/clickhouse actually do below against flight_points. Corrected to match.
    DELETE FROM flight_points
    WHERE id = :id;
  postgis: |
    DELETE FROM flight_points
    WHERE id = :id;
  sedona: |
  spacetime: |
  # FIX: plain DELETE fails outright against flight_points -- confirmed live ("DELETE query is
  # not supported for table default.flight_points", a Distributed engine table). Mutations have
  # to target the underlying _local table, on every shard (ON CLUSTER), same as updateflightPointMass.
  clickhouse: |
    ALTER TABLE flight_points_local ON CLUSTER cluster_1 DELETE WHERE id = :id;
  duckdb: |
    DELETE FROM flight_points
    WHERE id = :id;
  repetition: 5
  parameters:
  - id

- name: deleteflightPointSingle
  use: false  # (2026-10-02) delete queries retired: benchmark writes are insert/update only, reset after each run
  description: "Delete exactly one flight point, identified by id and timestamp"
  type: delete_single
  mobilitydb: |
    DELETE FROM flight_points
    WHERE id = :id AND timestamp = :instant;
  postgis: |
    DELETE FROM flight_points
    WHERE id = :id AND timestamp = :instant;
  sedona: |
  spacetime: |
  clickhouse: |
    ALTER TABLE flight_points_local ON CLUSTER cluster_1 DELETE WHERE id = :id AND timestamp = :instant;
  duckdb: |
    DELETE FROM flight_points
    WHERE id = :id AND timestamp = :instant;
  repetition: 5
  parameters:
  - id
  - instant

- name: bulkInsertflightPoints
  use: true
  description: "Insert multiple points in one statement"
  type: bulk_insert
  # (2026-10-24) MobilityDB writes go to its trajectory table (scratch trajectories with negative ids), which its reads use;
  # the table is distributed by tile_key (a spatial tile of real trips): scratch trajectories get id % 64, spread over the shards
  mobilitydb: |
    INSERT INTO flights (id, tile_key, trip, altitude)
    SELECT v.id, (v.id % 64)::int, tgeompoint(v.geom, v.ts AT TIME ZONE 'UTC'), tfloat(v.altitude, v.ts AT TIME ZONE 'UTC')
    FROM (VALUES :bulk_values) AS v(id, geom, ts, altitude);
  postgis: |
    -- FIX: didn't write "altitude" -- see insertSingleflightPoint's FIX note.
    INSERT INTO flight_points (id, geom, timestamp, altitude)
    VALUES :bulk_values;
  sedona: |
  spacetime: |
  # FIX: same "no geom column" problem as insertSingleflightPoint above -- :bulk_values_clickhouse
  # is a ClickHouse-specific rebuild of the shared :bulk_values tuples (see
  # generateParameterVariations.py) as (id, timestamp, lat, lon, altitude), matching the real
  # columns. FIX: also didn't write "altitude" -- see insertSingleflightPoint's FIX note.
  clickhouse: |
    INSERT INTO flight_points (id, timestamp, lat, lon, altitude)
    VALUES :bulk_values_clickhouse;
  duckdb: |
    -- FIX: didn't write "altitude" -- see insertSingleflightPoint's FIX note.
    INSERT INTO flight_points (id, geom, timestamp, altitude)
    VALUES :bulk_values;
  repetition: 12
  parameters:
  - bulk_values



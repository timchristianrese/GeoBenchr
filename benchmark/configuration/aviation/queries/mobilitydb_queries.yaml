- name: timeAggregation
  type: temporal
  sql: |
    WITH ts_table AS (
      SELECT id, unnest(timestamps(atTime(trip, tstzspan '[2024-10-31 08:25:01+00, 2024-11-04 00:17:10+00]'))) AS ts
      FROM flights
      WHERE trip && tstzspan '[2024-10-31 08:25:01+00, 2024-11-04 00:17:10+00]'
    )
    SELECT COUNT(*) AS hour_id_groups, SUM(cnt) AS points, MAX(cnt) AS max_group FROM (
      SELECT date_trunc('hour', ts AT TIME ZONE 'UTC') AS hour, id, COUNT(*) AS cnt
      FROM ts_table
      GROUP BY hour, id
    ) g;

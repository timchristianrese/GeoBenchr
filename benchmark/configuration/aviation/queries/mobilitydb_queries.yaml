  sql: |
    WITH ts_table AS (
      SELECT id, unnest(instants(atTime(trip, tstzspan '[2024-01-12 15:28:30+00, 2024-01-16 07:20:39+00]'))) AS inst
      FROM flights
      WHERE trip && tstzspan '[2024-01-12 15:28:30+00, 2024-01-16 07:20:39+00]'
    )
    SELECT COUNT(DISTINCT id) AS id_count
    FROM ts_table
    WHERE ST_Intersects(getValue(inst)::geometry, ST_Transform(ST_SetSRID(ST_MakeEnvelope(7.288873332244642, 52.342536701363116, 7.688873294279035, 52.57253666187428), 4326), 3857));
  params:

  sql: |
    WITH filtered_flights AS (
      SELECT f.id, f.trip
      FROM flights f
      WHERE f.trip && span(timestamptz '[2024-12-30 22:17:52+00]' - INTERVAL '10 seconds', timestamptz '[2024-12-30 22:17:52+00]' + INTERVAL '10 seconds')
    )
    SELECT COUNT(DISTINCT ff.id) AS flight_count
    FROM filtered_flights ff
    JOIN cities c ON edwithin(attime(ff.trip, span(timestamptz '[2024-12-30 22:17:52+00]' - INTERVAL '10 seconds', timestamptz '[2024-12-30 22:17:52+00]' + INTERVAL '10 seconds')), c.geom, 2407)
    WHERE c.name = 'Baesweiler';
  params:
  - Baesweiler
  - '2024-12-30 22:17:52'
  - 2407

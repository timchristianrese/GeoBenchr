- name: CityActivityAtInstant
  type: spatiotemporal
  sql: |
    WITH filtered_flights_adapttimegrid AS (
      SELECT f.id, f.trip
      FROM flights_adapttimegrid f
      WHERE f.trip && period(timestamptz '[2024-03-15 05:40:03]' - INTERVAL '10 seconds', timestamptz '[2024-03-15 05:40:03]' + INTERVAL '10 seconds')
    )
    SELECT COUNT(DISTINCT ff.id) AS flight_count
    FROM filtered_flights_adapttimegrid ff
    JOIN cities c ON edwithin(attime(ff.trip, timestamptz '[2024-03-15 05:40:03]'), c.geom, 4431)
    WHERE c.name = 'Oer-Erkenschwick';
  params:
  - Oer-Erkenschwick
  - '2024-03-15 05:40:03'
  - 4431
- name: countFlightsInCounties

  sql: |
    SELECT id, geom, timestamp
    FROM flight_points
    WHERE ST_DWithin(geom, ST_Transform(ST_SetSRID(ST_Point(51.05974971711294, 8.35100422418123), 4326), 3857), 4306.347316616851)
    ORDER BY geom <-> ST_Transform(ST_SetSRID(ST_Point(51.05974971711294, 8.35100422418123), 4326), 3857)
    LIMIT 10;
  params:
  - ST_Transform(ST_SetSRID(ST_Point(51.05974971711294, 8.35100422418123), 4326),
    3857)
  - 10
  - 4306.347316616851

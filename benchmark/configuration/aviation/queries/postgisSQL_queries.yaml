- name: CityActivityAtInstant
  type: spatiotemporal
  sql: |
    WITH filtered_flights AS (
       SELECT f.id, f.geom
       FROM flight_points f
       WHERE f.timestamp BETWEEN '2024-03-15 05:40:03' - INTERVAL '10 seconds' AND '2024-03-15 05:40:03' + INTERVAL '10 seconds')
     SELECT COUNT(DISTINCT ff.id) AS flight_count
     FROM filtered_flights ff
     JOIN cities c ON ST_DWithin(ff.geom, c.geom, 4431)
     WHERE c.name = 'Oer-Erkenschwick';
  params:
  - Oer-Erkenschwick
  - '2024-03-15 05:40:03'
  - 4431
- name: countFlightsInCounties

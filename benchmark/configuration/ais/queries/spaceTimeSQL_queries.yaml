- name: CrossingsActiveAtGivenHourOfDay
  type: temporal
  sql: |
    SELECT COUNT(*) FROM (
      SELECT
        GREATEST(c.t[0], (EPOCHRANGE '[2024-04-13 05:40:38, 2024-04-20 13:31:42]')[0]) AS lo,
        LEAST   (c.t[1], (EPOCHRANGE '[2024-04-13 05:40:38, 2024-04-20 13:31:42]')[1]) AS hi
      FROM crossings c
      WHERE c.t && EPOCHRANGE '[2024-04-13 05:40:38, 2024-04-20 13:31:42]'
    ) w
    WHERE hi - lo >= TP '24h'
      OR ( TS_TIMEOFDAY(lo) <  TP '1h' * (13 + 1)
        AND TS_TIMEOFDAY(hi) >= TP '1h' *  13 )
      OR ( TS_DAYSTART(lo) <> TS_DAYSTART(hi)
        AND ( TS_TIMEOFDAY(lo) <  TP '1h' * (13 + 1)
              OR TS_TIMEOFDAY(hi) >= TP '1h' *  13 ));
  params:

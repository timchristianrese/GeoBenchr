- name: CrossingsActiveAtGivenHourOfDay
  type: temporal
  sql: |
    SELECT COUNT(*) FROM (
      SELECT
        GREATEST(c.t[0], (EPOCHRANGE '[2024-10-07 12:45:48, 2024-10-22 09:24:00]')[0]) AS lo,
        LEAST   (c.t[1], (EPOCHRANGE '[2024-10-07 12:45:48, 2024-10-22 09:24:00]')[1]) AS hi
      FROM crossings c
      WHERE c.t && EPOCHRANGE '[2024-10-07 12:45:48, 2024-10-22 09:24:00]'
    ) w
    WHERE hi - lo >= TP '24h'
      OR ( TS_TIMEOFDAY(lo) <  TP '1h' * (11 + 1)
        AND TS_TIMEOFDAY(hi) >= TP '1h' *  11 )
      OR ( TS_DAYSTART(lo) <> TS_DAYSTART(hi)
        AND ( TS_TIMEOFDAY(lo) <  TP '1h' * (11 + 1)
              OR TS_TIMEOFDAY(hi) >= TP '1h' *  11 ));
  params:
  - 11
  - - '2024-10-07 12:45:48'
    - '2024-10-22 09:24:00'

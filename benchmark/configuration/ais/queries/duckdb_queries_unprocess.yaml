- name: CrossingsActiveAtGivenHourOfDay
  type: temporal
  sql: |
    SELECT COUNT(*) FROM (
      SELECT GREATEST(s.start_time, TIMESTAMP '2025-04-29 07:16:49') AS lo,
             LEAST(s.end_time, TIMESTAMP '2025-05-06 02:15:33') AS hi
      FROM crossings_summary s
      WHERE s.id > 0 AND s.id < 1000000000000
        AND s.start_time <= TIMESTAMP '2025-05-06 02:15:33' AND s.end_time >= TIMESTAMP '2025-04-29 07:16:49'
    ) w
    WHERE hi - lo >= INTERVAL '24 hours'
       OR (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (4 + 1) AND hi - date_trunc('day', hi) >= INTERVAL '1 hour' * 4)
       OR (date_trunc('day', lo) <> date_trunc('day', hi)
           AND (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (4 + 1) OR hi - date_trunc('day', hi) >= INTERVAL '1 hour' * 4));
  params:
  - 4
  - - '2025-04-29 07:16:49'
    - '2025-05-06 02:15:33'

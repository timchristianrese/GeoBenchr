- name: CrossingsActiveAtGivenHourOfDay
  type: temporal
  sql: |
    SELECT COUNT(*) FROM (
      SELECT GREATEST(s.start_time, TIMESTAMP '2024-10-07 12:45:48') AS lo,
             LEAST(s.end_time, TIMESTAMP '2024-10-22 09:24:00') AS hi
      FROM crossings_summary s
      WHERE s.id > 0 AND s.id < 1000000000000
        AND s.start_time <= TIMESTAMP '2024-10-22 09:24:00' AND s.end_time >= TIMESTAMP '2024-10-07 12:45:48'
    ) w
    WHERE hi - lo >= INTERVAL '24 hours'
       OR (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (11 + 1) AND hi - date_trunc('day', hi) >= INTERVAL '1 hour' * 11)
       OR (date_trunc('day', lo) <> date_trunc('day', hi)
           AND (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (11 + 1) OR hi - date_trunc('day', hi) >= INTERVAL '1 hour' * 11));
  params:
  - 11
  - - '2024-10-07 12:45:48'
    - '2024-10-22 09:24:00'

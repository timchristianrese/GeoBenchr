- name: CrossingsActiveAtGivenHourOfDay
  type: temporal
  sql: |
    SELECT COUNT(*) FROM (
      SELECT GREATEST(s.start_time, TIMESTAMP '2024-04-13 05:40:38') AS lo,
             LEAST(s.end_time, TIMESTAMP '2024-04-20 13:31:42') AS hi
      FROM crossings_summary s
      WHERE s.id > 0 AND s.id < 1000000000000
        AND s.start_time <= TIMESTAMP '2024-04-20 13:31:42' AND s.end_time >= TIMESTAMP '2024-04-13 05:40:38'
    ) w
    WHERE hi - lo >= INTERVAL '24 hours'
       OR (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (13 + 1) AND hi - date_trunc('day', hi) >= INTERVAL '1 hour' * 13)
       OR (date_trunc('day', lo) <> date_trunc('day', hi)
           AND (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (13 + 1) OR hi - date_trunc('day', hi) >= INTERVAL '1 hour' * 13));
  params:
  - 13
  - - '2024-04-13 05:40:38'
    - '2024-04-20 13:31:42'
- name: busiestDayInWeekPeriod
  type: temporal
  sql: |

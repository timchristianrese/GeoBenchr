benchmark:
  sut: MobilityDB
  mixed: false
  nodes:
  - ''
  threads: 16
  test: false
  random_seed: 1500

# DuckDB dialect notes (added when a "duckdb:" query block was introduced below; the "cratedb:"
# column that used to be here has been removed from this file entirely):
#   - "Distributed DuckDB" in this benchmark means DuckLake: a Postgres-backed catalog plus
#     Parquet files on shared object storage, attached by multiple independent DuckDB engine
#     processes (e.g. ATTACH 'ducklake:postgres:dbname=catalog host=...' AS crossings
#     (DATA_PATH 's3://.../crossings/');). ATTACH is a one-time setup step, not part of each
#     query, so every duckdb: block below is plain DuckDB SQL run against the attached catalog --
#     no ATTACH/ducklake syntax appears per query.
#   - Read this as "shared storage queried by independent single-node engines," not "shared-nothing
#     parallel query execution": DuckDB (with or without DuckLake) has no cross-node
#     shuffle/parallel join today, unlike Sedona (Spark) or a ClickHouse cluster. Each query below
#     still runs single-node once it reaches a DuckDB engine; what DuckLake distributes is the
#     data/catalog, not the execution of any one query. Worth stating explicitly in the write-up so
#     "distributed" here isn't read as apples-to-apples with Sedona's execution model.
#   - Point/polygon geometries -> DuckDB's GEOMETRY type (core since DuckDB 1.5.0; the "spatial"
#     extension supplies the function library: INSTALL spatial; LOAD spatial;). Unlike CrateDB,
#     DuckDB's ST_Distance/ST_DWithin are generic over geometry type, so point-to-polygon distance
#     and ST_Buffer both work directly -- the two queries that had to be marked NOT SUPPORTED for
#     CrateDB (countActiveCrossingsNearIsland, islandOrCoastLineCrossingsInPeriod) translate to
#     DuckDB cleanly, mirroring the postgis versions.
#   - EXTRACT(...), date_trunc(...), INTERVAL arithmetic, CTEs, joins, subqueries, GROUP BY /
#     HAVING (including GROUP BY on a SELECT alias), COUNT(DISTINCT ...), BOOL_AND(...) /
#     BOOL_OR(...), and standard INSERT / UPDATE / DELETE / multi-row INSERT are all supported
#     with Postgres-compatible syntax -- most read queries below port over from the postgis
#     translation essentially unchanged.
#   - The SQL:1999 OVERLAPS predicate ("(start1,end1) OVERLAPS (start2,end2)") used by several
#     postgis/sedona queries elsewhere in this file has no confirmed DuckDB documentation as of
#     this writing. Queries below that would otherwise need OVERLAPS are rewritten as explicit
#     start/end comparisons instead of assuming it works -- flagged inline per query, the same
#     treatment already given to the OVERLAPS gap flagged for clickhouse.
#   - Write consistency: a single local DuckDB file is single-writer/multi-reader. The
#     "distributed" configuration above relies on DuckLake's Postgres-backed catalog to let
#     multiple engines write concurrently, via snapshot-isolated commits with a documented
#     retry-on-conflict mechanism -- real, but reported (DuckLake's issue tracker) to still surface
#     commit failures under heavy concurrent write load as of this writing. That is a materially
#     different consistency model from a single MobilityDB/PostGIS Postgres instance's immediate
#     read-after-write -- flagged on the write queries below.

queryConfigs:

- name: CrossingsActiveAtGivenHourOfDay #temporal
  use: true
  description: "Counts the number of active crossings at a given hour of the day within a time period"
  type: temporal
  mobilitydb: |
    -- (2026-10-02) trip-span version on the trip summary table, same question as SpaceTime's
    -- (whose rides/flights/crossings are trip summaries, one row per trip with its time range)
    SELECT COUNT(*) FROM (
      SELECT GREATEST(s.start_time, TIMESTAMP :period_medium_start) AS lo,
             LEAST(s.end_time, TIMESTAMP :period_medium_end) AS hi
      FROM crossings_summary s
      WHERE s.id > 0 AND s.id < 1000000000000
        AND s.start_time <= TIMESTAMP :period_medium_end AND s.end_time >= TIMESTAMP :period_medium_start
    ) w
    WHERE hi - lo >= INTERVAL '24 hours'
       OR (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (:hour + 1) AND hi - date_trunc('day', hi) >= INTERVAL '1 hour' * :hour)
       OR (date_trunc('day', lo) <> date_trunc('day', hi)
           AND (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (:hour + 1) OR hi - date_trunc('day', hi) >= INTERVAL '1 hour' * :hour));
  postgis: |
    -- (2026-10-02) trip-span version on the trip summary table, same question as SpaceTime's
    -- (whose rides/flights/crossings are trip summaries, one row per trip with its time range)
    SELECT COUNT(*) FROM (
      SELECT GREATEST(s.start_time, TIMESTAMP :period_medium_start) AS lo,
             LEAST(s.end_time, TIMESTAMP :period_medium_end) AS hi
      FROM crossings_summary s
      WHERE s.id > 0 AND s.id < 1000000000000
        AND s.start_time <= TIMESTAMP :period_medium_end AND s.end_time >= TIMESTAMP :period_medium_start
    ) w
    WHERE hi - lo >= INTERVAL '24 hours'
       OR (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (:hour + 1) AND hi - date_trunc('day', hi) >= INTERVAL '1 hour' * :hour)
       OR (date_trunc('day', lo) <> date_trunc('day', hi)
           AND (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (:hour + 1) OR hi - date_trunc('day', hi) >= INTERVAL '1 hour' * :hour));
  sedona: |
    -- (2026-10-02) trip-span version on the trip summary table, same question as SpaceTime's
    -- (whose rides/flights/crossings are trip summaries, one row per trip with its time range)
    SELECT COUNT(*) FROM (
      SELECT greatest(s.start_time, to_timestamp(:period_medium_start)) AS lo,
             least(s.end_time, to_timestamp(:period_medium_end)) AS hi
      FROM crossings_summary s
      WHERE s.id > 0 AND s.id < 1000000000000
        AND s.start_time <= to_timestamp(:period_medium_end) AND s.end_time >= to_timestamp(:period_medium_start)
    ) w
    WHERE unix_timestamp(hi) - unix_timestamp(lo) >= 86400
       OR (unix_timestamp(lo) - unix_timestamp(date_trunc('DAY', lo)) < 3600 * (:hour + 1) AND unix_timestamp(hi) - unix_timestamp(date_trunc('DAY', hi)) >= 3600 * :hour)
       OR (date_trunc('DAY', lo) <> date_trunc('DAY', hi)
           AND (unix_timestamp(lo) - unix_timestamp(date_trunc('DAY', lo)) < 3600 * (:hour + 1) OR unix_timestamp(hi) - unix_timestamp(date_trunc('DAY', hi)) >= 3600 * :hour));
  spacetime: |
    SELECT COUNT(*) FROM (
      SELECT
        GREATEST(c.t[0], (EPOCHRANGE :period_medium)[0]) AS lo,
        LEAST   (c.t[1], (EPOCHRANGE :period_medium)[1]) AS hi
      FROM crossings c
      WHERE c.t && EPOCHRANGE :period_medium
    ) w
    WHERE hi - lo >= TP '24h'
      OR ( TS_TIMEOFDAY(lo) <  TP '1h' * (:hour + 1)
        AND TS_TIMEOFDAY(hi) >= TP '1h' *  :hour )
      OR ( TS_DAYSTART(lo) <> TS_DAYSTART(hi)
        AND ( TS_TIMEOFDAY(lo) <  TP '1h' * (:hour + 1)
              OR TS_TIMEOFDAY(hi) >= TP '1h' *  :hour ));
  clickhouse: |
    -- (2026-10-02) trip-span version on the trip summary table, same question as SpaceTime's
    -- (whose rides/flights/crossings are trip summaries, one row per trip with its time range)
    SELECT count() FROM (
      SELECT greatest(s.start_time, toDateTime(:period_medium_start, 'UTC')) AS lo,
             least(s.end_time, toDateTime(:period_medium_end, 'UTC')) AS hi
      FROM crossings_summary s
      WHERE s.id > 0 AND s.id < 1000000000000
        AND s.start_time <= toDateTime(:period_medium_end, 'UTC') AND s.end_time >= toDateTime(:period_medium_start, 'UTC')
    ) w
    WHERE dateDiff('second', lo, hi) >= 86400
       OR (dateDiff('second', toStartOfDay(lo), lo) < 3600 * (:hour + 1) AND dateDiff('second', toStartOfDay(hi), hi) >= 3600 * :hour)
       OR (toStartOfDay(lo) != toStartOfDay(hi)
           AND (dateDiff('second', toStartOfDay(lo), lo) < 3600 * (:hour + 1) OR dateDiff('second', toStartOfDay(hi), hi) >= 3600 * :hour));
  duckdb: |
    -- (2026-10-02) trip-span version on the trip summary table, same question as SpaceTime's
    -- (whose rides/flights/crossings are trip summaries, one row per trip with its time range)
    SELECT COUNT(*) FROM (
      SELECT GREATEST(s.start_time, TIMESTAMP :period_medium_start) AS lo,
             LEAST(s.end_time, TIMESTAMP :period_medium_end) AS hi
      FROM crossings_summary s
      WHERE s.id > 0 AND s.id < 1000000000000
        AND s.start_time <= TIMESTAMP :period_medium_end AND s.end_time >= TIMESTAMP :period_medium_start
    ) w
    WHERE hi - lo >= INTERVAL '24 hours'
       OR (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (:hour + 1) AND hi - date_trunc('day', hi) >= INTERVAL '1 hour' * :hour)
       OR (date_trunc('day', lo) <> date_trunc('day', hi)
           AND (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (:hour + 1) OR hi - date_trunc('day', hi) >= INTERVAL '1 hour' * :hour));
  repetition: 50
  parameters:
  - hour
  - period_medium

- name: busiestDayInWeekPeriod #temporal
  use: true
  description: "Find the day with the highest number of unique crossings within a specified week period."
  type: temporal
  mobilitydb: |
    -- (2026-10-02) trip-span version on the trip summary table, same question as SpaceTime's
    -- (whose rides/flights/crossings are trip summaries, one row per trip with its time range)
    SELECT d.day::date AS day, COUNT(*) AS unique_crossings
    FROM generate_series(date_trunc('day', TIMESTAMP :period_week_start), TIMESTAMP :period_week_end, INTERVAL '1 day') AS d(day)
    JOIN crossings_summary s ON s.start_time < d.day + INTERVAL '1 day' AND s.end_time >= d.day
    WHERE s.id > 0 AND s.id < 1000000000000
      AND s.start_time <= TIMESTAMP :period_week_end AND s.end_time >= TIMESTAMP :period_week_start
    GROUP BY d.day
    ORDER BY unique_crossings DESC
    LIMIT 1;
  postgis: |
    -- (2026-10-02) trip-span version on the trip summary table, same question as SpaceTime's
    -- (whose rides/flights/crossings are trip summaries, one row per trip with its time range)
    SELECT d.day::date AS day, COUNT(*) AS unique_crossings
    FROM generate_series(date_trunc('day', TIMESTAMP :period_week_start), TIMESTAMP :period_week_end, INTERVAL '1 day') AS d(day)
    JOIN crossings_summary s ON s.start_time < d.day + INTERVAL '1 day' AND s.end_time >= d.day
    WHERE s.id > 0 AND s.id < 1000000000000
      AND s.start_time <= TIMESTAMP :period_week_end AND s.end_time >= TIMESTAMP :period_week_start
    GROUP BY d.day
    ORDER BY unique_crossings DESC
    LIMIT 1;
  sample_postgis: |
    SELECT date_trunc('day', c.timestamp) AS day, COUNT(DISTINCT c.id) AS unique_crossings FROM crossing_points c WHERE c.timestamp BETWEEN '2023-01-01' AND '2023-01-07' AND c.id < 1000000000000 GROUP BY day ORDER BY unique_crossings DESC LIMIT 1;
  sedona: |
    -- (2026-10-02) trip-span version on the trip summary table, same question as SpaceTime's
    -- (whose rides/flights/crossings are trip summaries, one row per trip with its time range)
    SELECT to_date(d.day) AS day, COUNT(*) AS unique_crossings
    FROM (SELECT explode(sequence(date_trunc('DAY', to_timestamp(:period_week_start)), to_timestamp(:period_week_end), interval 1 day)) AS day) d
    JOIN crossings_summary s ON s.start_time < d.day + interval 1 day AND s.end_time >= d.day
    WHERE s.id > 0 AND s.id < 1000000000000
      AND s.start_time <= to_timestamp(:period_week_end) AND s.end_time >= to_timestamp(:period_week_start)
    GROUP BY d.day
    ORDER BY unique_crossings DESC
    LIMIT 1;
  spacetime: |
    WITH p AS (SELECT EPOCHRANGE :period_week AS r)
    SELECT TO_CHAR(d.day::ts, '%Y-%m-%d') AS day, COUNT(*) AS unique_crossings
    FROM crossings c
    JOIN (
      SELECT
        (TS_DAYSTART(p.r[0]) + TP '1d' *  s.num)      ::epoch AS day,
        (TS_DAYSTART(p.r[0]) + TP '1d' * (s.num + 1)) ::epoch AS next_day
    FROM p, const.sequence(0, 32) s
    WHERE (TS_DAYSTART(p.r[0]) + TP '1d' *  s.num)      ::epoch < p.r[1]
      AND (TS_DAYSTART(p.r[0]) + TP '1d' * (s.num + 1)) ::epoch > p.r[0]
    ) d ON c.t && RANGE(d.day, d.next_day)
    WHERE c.t && EPOCHRANGE :period_week
    GROUP BY d.day
    ORDER BY unique_crossings DESC
    LIMIT 1;
  clickhouse: |
    -- (2026-10-02) trip-span version on the trip summary table, same question as SpaceTime's
    -- (whose rides/flights/crossings are trip summaries, one row per trip with its time range)
    SELECT toDate(day) AS day, count() AS unique_crossings
    FROM crossings_summary s
    ARRAY JOIN arrayMap(i -> toStartOfDay(toDateTime(:period_week_start, 'UTC')) + toIntervalDay(i),
                        range(toUInt32(dateDiff('day', toStartOfDay(toDateTime(:period_week_start, 'UTC')), toDateTime(:period_week_end, 'UTC')) + 1))) AS day
    WHERE s.id > 0 AND s.id < 1000000000000
      AND s.start_time <= toDateTime(:period_week_end, 'UTC') AND s.end_time >= toDateTime(:period_week_start, 'UTC')
      AND s.start_time < day + toIntervalDay(1) AND s.end_time >= day
    GROUP BY day
    ORDER BY unique_crossings DESC
    LIMIT 1;
  duckdb: |
    -- (2026-10-02) trip-span version on the trip summary table, same question as SpaceTime's
    -- (whose rides/flights/crossings are trip summaries, one row per trip with its time range)
    SELECT d.day::date AS day, COUNT(*) AS unique_crossings
    FROM generate_series(date_trunc('day', TIMESTAMP :period_week_start), TIMESTAMP :period_week_end, INTERVAL '1 day') AS d(day)
    JOIN crossings_summary s ON s.start_time < d.day + INTERVAL '1 day' AND s.end_time >= d.day
    WHERE s.id > 0 AND s.id < 1000000000000
      AND s.start_time <= TIMESTAMP :period_week_end AND s.end_time >= TIMESTAMP :period_week_start
    GROUP BY d.day
    ORDER BY unique_crossings DESC
    LIMIT 1;

  repetition: 50
  parameters:
  - period_week

- name: countActiveCrossingsNearIsland #spatial
  use: true
  description: "Counts the number of active crossings near a given island within a certain distance."
  type: spatial
  # FIX (2026-09-30): previously noted here -- clickhouse computed true great-circle distance
  # while mobilitydb/postgis/sedona/duckdb compute planar ST_DWithin/edwithin distance in
  # EPSG:3857 (a latitude-distorted "meter"), so the same :distance meant different real-world
  # radii. Fixed via polygonsDistanceCartesian + Web Mercator reprojection (webMercatorX/Y UDFs)
  # in the clickhouse block below -- same metric as the other dialects now, verified to
  # sub-millimeter precision against real islands rows. See that block's own comment.
  # FIX: added "AND c.id < 1000000000000" -- crossingsAroundHarbour's mobilitydb query in this same file
  # applies this filter on the same "crossings" table, this one was missing it.
  mobilitydb: |
    SELECT COUNT(DISTINCT c.id) FROM crossings c JOIN islands i ON edwithin(c.trip, i.geom, :distance) WHERE i.id = :island AND c.id < 1000000000000;
  postgis: |
    SELECT COUNT(DISTINCT c.id) FROM crossing_points c JOIN islands i ON ST_DWithin(c.geom, i.geom, :distance) WHERE i.id = :island AND c.id < 1000000000000 GROUP BY i.id;
  sedona: |
    SELECT COUNT(DISTINCT c.id) FROM crossing_points c JOIN islands i ON ST_DWithin(c.geom, i.geom, :distance) WHERE i.id = :island AND c.id > 0 AND c.id < 1000000000000 GROUP BY i.id;
  spacetime: |
    -- (2026-10-02) radius in EPSG:3857 units like every other dialect, converted to SpaceTime's
    -- local meters by :st_scale = cos(lat) * 0.99842 (see scripts/spacetime_units.py)
    SELECT COUNT(DISTINCT c.crossing_id)
    FROM crossing_points c
    JOIN islands i ON ST_DWithin(ST_Point(c.x, c.y), ST_ToGeom(i.geom::gpolygon), :distance * :st_scale)
    WHERE i.id = :island and c.crossing_id > 0;
  clickhouse: |
    -- (2026-10-07) H3: the h3 GLOBAL IN (...) condition lets ClickHouse use the table's H3 primary
    -- key (h3, timestamp, id) and read only the cells that can contain a match -- a superset built
    -- by the h3Cover* functions (scripts/clickhouse_functions.sql). The exact predicate below is
    -- unchanged and decides the result. The scan-only version is kept as clickhouse_scan (not run).
    -- FIX (2026-09-30, metric parity): previously used polygonsDistanceSpherical (a true
    -- great-circle metric), which still had the same EQUIVALENCE NOTE mismatch as every
    -- greatCircleDistance query -- now fixed the same way crossingsAroundHarbour's
    -- greatCircleDistance was: project both operands into Web Mercator (EPSG:3857) and use
    -- polygonsDistanceCartesian, so the metric genuinely matches postgis/sedona/duckdb's
    -- ST_DWithin now, not just approximately. Verified live against real islands rows: matches
    -- postgis's ST_Distance(EPSG:3857) to sub-millimeter precision for both a Minor-island
    -- Polygon (id=33: 1,161,979.0793 vs postgis's 1,161,979.0803) and a Coastline LineString
    -- (id=43: 929,323.9104 vs postgis's 929,323.9120).
    -- islands.geom mixes real Polygon and LineString shapes under one Geometry (Variant) column
    -- -- arrayMap can't operate on the bare Variant, so each shape needs its own subcolumn
    -- extraction (geom.Polygon / geom.LineString, dot-notation), dispatched via
    -- variantType(geom); the final multiIf branch is unreachable for islands' actual data (no
    -- other shape exists here) and only exists so the expression type-checks.
    -- webMercatorX/webMercatorY/webMercatorDistance are SQL UDFs created ON CLUSTER cluster_1
    -- (see scripts/clickhouse_functions.sql) -- same projection used by crossingsAroundHarbour's point-to-point
    -- fix, reused here for the point operand and inlined into the polygon reprojection.
    -- Written as array(array(tuple(...))) rather than the equivalent [[(...)]] literal syntax on
    -- purpose: this file's own process_file() (generateParameterVariations.py) does a blanket
    -- line.replace("[", "tsrange(").replace("]", ")") meant to mop up leftover Postgres-style
    -- bracketed date-list literals -- it doesn't distinguish those from a genuine ClickHouse
    -- array literal, so [[(...)]]  here would come out the other side as mangled
    -- "tsrange(tsrange((...)))" garbage (confirmed live). The function-call form has no square
    -- brackets, so it passes through untouched.
    -- FIX: crossing_points and islands are both ClickHouse Distributed tables -- added GLOBAL
    -- (crossing_points already the FROM/left table, no swap needed).
    -- id/crossing_id migration is done -- see CrossingsActiveAtGivenHourOfDay's clickhouse block
    -- for the full note; id=0 placeholders are remapped to >= 1,000,000,000,000 on load, so
    -- "c.id > 0" below is the "real trip" filter.
    SELECT COUNT(DISTINCT c.id) AS crossing_count
    FROM crossing_points c
    GLOBAL JOIN islands i ON i.id = :island
    WHERE c.h3 GLOBAL IN (SELECT arrayJoin(h3CoverRing(arrayElement(geom.Polygon, 1), :distance)) FROM islands WHERE id = :island AND variantType(geom) = 'Polygon' UNION ALL SELECT arrayJoin(h3CoverLine(geom.LineString, :distance)) FROM islands WHERE id = :island AND variantType(geom) = 'LineString')
      AND if(variantType(i.geom) = 'LineString',
             -- (2026-10-08) coastline: minimum distance to the line's segments. Wrapping the line into a
             -- polygon for polygonsDistanceCartesian closed it into an area, so points inside that area
             -- counted as distance 0 (one crossing too many vs PostGIS on coastline 45).
             arrayMin(arrayMap((a, b) -> sqrt(pow(c.x - (a.1 + (b.1 - a.1) * greatest(0., least(1., ((c.x - a.1) * (b.1 - a.1) + (c.y - a.2) * (b.2 - a.2)) / greatest(pow(b.1 - a.1, 2) + pow(b.2 - a.2, 2), 1e-9)))), 2)
                                            + pow(c.y - (a.2 + (b.2 - a.2) * greatest(0., least(1., ((c.x - a.1) * (b.1 - a.1) + (c.y - a.2) * (b.2 - a.2)) / greatest(pow(b.1 - a.1, 2) + pow(b.2 - a.2, 2), 1e-9)))), 2)),
                               arrayPopBack(arrayMap(pt -> tuple(6378137. * radians(pt.1), 6378137. * log(tan(pi() / 4 + radians(pt.2) / 2))), i.geom.LineString)), arrayPopFront(arrayMap(pt -> tuple(6378137. * radians(pt.1), 6378137. * log(tan(pi() / 4 + radians(pt.2) / 2))), i.geom.LineString)))),
             polygonsDistanceCartesian(array(array(tuple(c.x, c.y))),
               arrayMap(ring -> arrayMap(pt -> tuple(6378137. * radians(pt.1), 6378137. * log(tan(pi() / 4 + radians(pt.2) / 2))), ring), i.geom.Polygon))
         ) <= :distance
      AND c.id > 0 AND c.id < 1000000000000;
  clickhouse_scan: |
    -- FIX (2026-09-30, metric parity): previously used polygonsDistanceSpherical (a true
    -- great-circle metric), which still had the same EQUIVALENCE NOTE mismatch as every
    -- greatCircleDistance query -- now fixed the same way crossingsAroundHarbour's
    -- greatCircleDistance was: project both operands into Web Mercator (EPSG:3857) and use
    -- polygonsDistanceCartesian, so the metric genuinely matches postgis/sedona/duckdb's
    -- ST_DWithin now, not just approximately. Verified live against real islands rows: matches
    -- postgis's ST_Distance(EPSG:3857) to sub-millimeter precision for both a Minor-island
    -- Polygon (id=33: 1,161,979.0793 vs postgis's 1,161,979.0803) and a Coastline LineString
    -- (id=43: 929,323.9104 vs postgis's 929,323.9120).
    -- islands.geom mixes real Polygon and LineString shapes under one Geometry (Variant) column
    -- -- arrayMap can't operate on the bare Variant, so each shape needs its own subcolumn
    -- extraction (geom.Polygon / geom.LineString, dot-notation), dispatched via
    -- variantType(geom); the final multiIf branch is unreachable for islands' actual data (no
    -- other shape exists here) and only exists so the expression type-checks.
    -- webMercatorX/webMercatorY/webMercatorDistance are SQL UDFs created ON CLUSTER cluster_1
    -- (see scripts/clickhouse_functions.sql) -- same projection used by crossingsAroundHarbour's point-to-point
    -- fix, reused here for the point operand and inlined into the polygon reprojection.
    -- Written as array(array(tuple(...))) rather than the equivalent [[(...)]] literal syntax on
    -- purpose: this file's own process_file() (generateParameterVariations.py) does a blanket
    -- line.replace("[", "tsrange(").replace("]", ")") meant to mop up leftover Postgres-style
    -- bracketed date-list literals -- it doesn't distinguish those from a genuine ClickHouse
    -- array literal, so [[(...)]]  here would come out the other side as mangled
    -- "tsrange(tsrange((...)))" garbage (confirmed live). The function-call form has no square
    -- brackets, so it passes through untouched.
    -- FIX: crossing_points and islands are both ClickHouse Distributed tables -- added GLOBAL
    -- (crossing_points already the FROM/left table, no swap needed).
    -- id/crossing_id migration is done -- see CrossingsActiveAtGivenHourOfDay's clickhouse block
    -- for the full note; id=0 placeholders are remapped to >= 1,000,000,000,000 on load, so
    -- "c.id > 0" below is the "real trip" filter.
    SELECT COUNT(DISTINCT c.id) AS crossing_count
    FROM crossing_points c
    GLOBAL JOIN islands i ON i.id = :island
    WHERE polygonsDistanceCartesian(
            array(array(tuple(c.x, c.y))),
            multiIf(
              variantType(i.geom) = 'Polygon',
                arrayMap(ring -> arrayMap(pt -> tuple(6378137. * radians(pt.1), 6378137. * log(tan(pi() / 4 + radians(pt.2) / 2))), ring), i.geom.Polygon),
              variantType(i.geom) = 'LineString',
                array(arrayMap(pt -> tuple(6378137. * radians(pt.1), 6378137. * log(tan(pi() / 4 + radians(pt.2) / 2))), i.geom.LineString)),
              array(array(tuple(0.0, 0.0)))
            )
          ) <= :distance
      AND c.id > 0 AND c.id < 1000000000000;
  duckdb: |
    -- (2026-10-08) ST_Intersects_Extent(geom, <area's bounding box>) in front of the exact predicate: the point
    -- tables are stored in Hilbert order with a bounding box per row group, and this cheap box test lets
    -- DuckDB skip the row groups outside the area. The exact predicate is unchanged and decides the result.
    -- The previous version is kept as duckdb_scan (not run).
    -- Point-to-polygon ST_DWithin works directly here (unlike CrateDB's point-only distance()) --
    -- see the header note above. Mirrors the postgis/sedona translation, planar EPSG:3857 metric.
    SELECT COUNT(DISTINCT c.id) FROM crossing_points c JOIN islands i ON ST_DWithin(c.geom, i.geom, :distance) WHERE i.id = :island AND ST_Intersects_Extent(c.geom, (SELECT ST_MakeEnvelope(ST_XMin(geom) - :distance, ST_YMin(geom) - :distance, ST_XMax(geom) + :distance, ST_YMax(geom) + :distance) FROM islands WHERE id = :island)) AND c.id > 0 AND c.id < 1000000000000 GROUP BY i.id;
  duckdb_scan: |
    -- Point-to-polygon ST_DWithin works directly here (unlike CrateDB's point-only distance()) --
    -- see the header note above. Mirrors the postgis/sedona translation, planar EPSG:3857 metric.
    SELECT COUNT(DISTINCT c.id) FROM crossing_points c JOIN islands i ON ST_DWithin(c.geom, i.geom, :distance) WHERE i.id = :island AND c.id > 0 AND c.id < 1000000000000 GROUP BY i.id;


  repetition: 50
  parameters:
  - island
  - distance

- name: crossingsAroundHarbour #spatial
  use: true
  description: "Finds the crossings that are within a certain distance of a specified harbour."
  type: spatial
  # FIX (2026-09-30): the great-circle-vs-planar distance mismatch previously flagged here is
  # fixed below via webMercatorDistance (see that clickhouse block's comment for the derivation
  # and live verification: exact id-set match against postgis/mobilitydb/sedona).
  mobilitydb: |
    SELECT DISTINCT c.id FROM crossings c JOIN harbours h ON edwithin(c.trip, h.geom, :radius) WHERE h.name = :harbour AND c.id < 1000000000000;
  postgis: |
    SELECT DISTINCT c.id FROM crossing_points c JOIN harbours h ON ST_DWithin(c.geom, h.geom, :radius) WHERE h.name = :harbour AND c.id < 1000000000000;
  sedona: |
    SELECT DISTINCT c.id FROM crossing_points c JOIN harbours h ON ST_DWithin(c.geom, h.geom, :radius) WHERE h.name = :harbour AND c.id > 0 AND c.id < 1000000000000;
  spacetime: |
    -- (2026-10-02) radius in EPSG:3857 units like every other dialect, converted to SpaceTime's
    -- local meters by :st_scale = cos(lat) * 0.99842 (see scripts/spacetime_units.py)
    SELECT DISTINCT c.crossing_id AS id FROM crossing_points c JOIN harbours h ON ST_DWithin(ST_Point(c.x, c.y), ST_ToGeom(h.geom::gpoint), :radius * :st_scale) WHERE crossing_id > 0 AND h.name = :harbour;
  clickhouse: |
    -- (2026-10-07) H3: the h3 GLOBAL IN (...) condition lets ClickHouse use the table's H3 primary
    -- key (h3, timestamp, id) and read only the cells that can contain a match -- a superset built
    -- by the h3Cover* functions (scripts/clickhouse_functions.sql). The exact predicate below is
    -- unchanged and decides the result. The scan-only version is kept as clickhouse_scan (not run).
    -- FIX (2026-09-30, metric parity): replaced greatCircleDistance (true great-circle metric)
    -- with webMercatorDistance, a SQL UDF (created ON CLUSTER cluster_1 -- see scripts/clickhouse_functions.sql)
    -- that projects both points into Web Mercator (EPSG:3857) and takes the planar Euclidean
    -- distance -- the same metric ST_DWithin/edwithin use, not just the same units. Verified
    -- live against real data: harbour='Tjerkwerd', radius=20000 returns the exact same 299-row
    -- id set as postgis/mobilitydb/sedona (row-for-row diff, not just a matching count); radius=
    -- 50000 also matches exactly (2049). Formula: webMercatorDistance(lon1,lat1,lon2,lat2) =
    -- sqrt((6378137*radians(lon1) - 6378137*radians(lon2))^2 +
    --      (6378137*ln(tan(pi/4+radians(lat1)/2)) - 6378137*ln(tan(pi/4+radians(lat2)/2)))^2),
    -- the standard spherical-Mercator forward projection PostGIS/Sedona's ST_Transform(...,3857)
    -- also uses.
    -- FIX: added GLOBAL (Distributed-JOIN denial, same as elsewhere in this file).
    -- id/crossing_id migration is done -- see CrossingsActiveAtGivenHourOfDay's clickhouse block
    -- for the full note. No id remap needed here either (rand()-sharded, not id-sharded), so
    -- "c.id > 0" stays as-is, unlike postgis/mobilitydb's "c.id < 1000000000000".
    SELECT DISTINCT c.id
    FROM crossing_points c
    GLOBAL JOIN harbours h ON h.name = :harbour
    WHERE c.h3 GLOBAL IN (SELECT arrayJoin(h3CoverPoint(lon, lat, :radius)) FROM harbours WHERE name = :harbour)
      AND sqrt(pow(c.x - h.x, 2) + pow(c.y - h.y, 2)) <= :radius
      AND c.id > 0 AND c.id < 1000000000000;
  clickhouse_scan: |
    -- FIX (2026-09-30, metric parity): replaced greatCircleDistance (true great-circle metric)
    -- with webMercatorDistance, a SQL UDF (created ON CLUSTER cluster_1 -- see scripts/clickhouse_functions.sql)
    -- that projects both points into Web Mercator (EPSG:3857) and takes the planar Euclidean
    -- distance -- the same metric ST_DWithin/edwithin use, not just the same units. Verified
    -- live against real data: harbour='Tjerkwerd', radius=20000 returns the exact same 299-row
    -- id set as postgis/mobilitydb/sedona (row-for-row diff, not just a matching count); radius=
    -- 50000 also matches exactly (2049). Formula: webMercatorDistance(lon1,lat1,lon2,lat2) =
    -- sqrt((6378137*radians(lon1) - 6378137*radians(lon2))^2 +
    --      (6378137*ln(tan(pi/4+radians(lat1)/2)) - 6378137*ln(tan(pi/4+radians(lat2)/2)))^2),
    -- the standard spherical-Mercator forward projection PostGIS/Sedona's ST_Transform(...,3857)
    -- also uses.
    -- FIX: added GLOBAL (Distributed-JOIN denial, same as elsewhere in this file).
    -- id/crossing_id migration is done -- see CrossingsActiveAtGivenHourOfDay's clickhouse block
    -- for the full note. No id remap needed here either (rand()-sharded, not id-sharded), so
    -- "c.id > 0" stays as-is, unlike postgis/mobilitydb's "c.id < 1000000000000".
    SELECT DISTINCT c.id
    FROM crossing_points c
    GLOBAL JOIN harbours h ON h.name = :harbour
    WHERE sqrt(pow(c.x - h.x, 2) + pow(c.y - h.y, 2)) <= :radius
      AND c.id > 0 AND c.id < 1000000000000;
  duckdb: |
    -- (2026-10-08) ST_Intersects_Extent(geom, <area's bounding box>) in front of the exact predicate: the point
    -- tables are stored in Hilbert order with a bounding box per row group, and this cheap box test lets
    -- DuckDB skip the row groups outside the area. The exact predicate is unchanged and decides the result.
    -- The previous version is kept as duckdb_scan (not run).
    SELECT DISTINCT c.id FROM crossing_points c JOIN harbours h ON ST_DWithin(c.geom, h.geom, :radius) WHERE h.name = :harbour AND ST_Intersects_Extent(c.geom, (SELECT ST_MakeEnvelope(ST_XMin(geom) - :radius, ST_YMin(geom) - :radius, ST_XMax(geom) + :radius, ST_YMax(geom) + :radius) FROM harbours WHERE name = :harbour)) AND c.id > 0 AND c.id < 1000000000000;
  duckdb_scan: |
    SELECT DISTINCT c.id FROM crossing_points c JOIN harbours h ON ST_DWithin(c.geom, h.geom, :radius) WHERE h.name = :harbour AND c.id > 0 AND c.id < 1000000000000;

  repetition: 50
  parameters:
  - harbour
  - radius


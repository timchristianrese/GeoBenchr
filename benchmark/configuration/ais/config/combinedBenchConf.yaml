- name: islandOrCoastLineCrossingsInPeriod #spatiotemporal
  use: true
  description: "For an island, find the number of crossings that are within a certain distance of the island during a specified time period."
  type: spatiotemporal
  # FIX (2026-09-30): the great-circle-vs-planar distance mismatch previously flagged here is
  # fixed below (greatCircleDistance -> webMercatorDistance / polygonsDistanceCartesian, matching
  # the planar EPSG:3857 metric the other dialects use) -- see crossingsAroundHarbour's clickhouse
  # block for the full verification.
  mobilitydb: |
    SELECT COUNT(DISTINCT c.id) FROM crossings c JOIN islands i ON edwithin(attime(c.trip,:period_medium), i.geom, :distance) WHERE c.trip && :period_medium AND i.id = :island AND c.id < 1000000000000;
  postgis: |
    SELECT COUNT(DISTINCT c.id) FROM crossing_points c JOIN islands i ON ST_DWithin(c.geom, i.geom, :distance) WHERE c.timestamp BETWEEN :period_medium AND i.id = :island AND c.id < 1000000000000;
  sedona: |
    SELECT COUNT(DISTINCT c.id) FROM crossing_points c JOIN islands i ON ST_DWithin(c.geom, i.geom, :distance) WHERE c.timestamp BETWEEN :period_medium AND i.id = :island AND c.id > 0 AND c.id < 1000000000000;
  spacetime: |
    -- (2026-10-02) radius in EPSG:3857 units like every other dialect, converted to SpaceTime's
    -- local meters by :st_scale = cos(lat) * 0.99842 (see scripts/spacetime_units.py)
    SELECT COUNT(DISTINCT c.crossing_id)
    FROM crossing_points c
    JOIN islands i ON ST_DWithin(ST_Point(c.x, c.y), ST_ToGeom(i.geom::gpolygon), :distance * :st_scale)
    WHERE i.id = :island and c.crossing_id > 0
      AND c.t && EPOCHRANGE :period_medium;
  clickhouse: |
    -- (2026-10-07) H3: the h3 GLOBAL IN (...) condition lets ClickHouse use the table's H3 primary
    -- key (h3, timestamp, id) and read only the cells that can contain a match -- a superset built
    -- by the h3Cover* functions (scripts/clickhouse_functions.sql). The exact predicate below is
    -- unchanged and decides the result. The scan-only version is kept as clickhouse_scan (not run).
    -- FIX (2026-09-30, metric parity): see countActiveCrossingsNearIsland's clickhouse block
    -- above for the full explanation -- same polygonsDistanceSpherical -> polygonsDistanceCartesian
    -- + Web Mercator reprojection fix, same Polygon/LineString variantType dispatch.
    -- FIX: added GLOBAL (Distributed-JOIN denial).
    -- id/crossing_id migration is done -- see CrossingsActiveAtGivenHourOfDay's clickhouse block
    -- for the full note. No id remap needed here either (rand()-sharded, not id-sharded), so
    -- "c.id > 0" stays as-is, unlike postgis/mobilitydb's "c.id < 1000000000000".
    SELECT COUNT(DISTINCT c.id)
    FROM crossing_points c
    GLOBAL JOIN islands i ON i.id = :island
    WHERE c.h3 GLOBAL IN (SELECT arrayJoin(h3CoverRing(arrayElement(geom.Polygon, 1), :distance)) FROM islands WHERE id = :island AND variantType(geom) = 'Polygon' UNION ALL SELECT arrayJoin(h3CoverLine(geom.LineString, :distance)) FROM islands WHERE id = :island AND variantType(geom) = 'LineString')
      AND if(variantType(i.geom) = 'LineString',
             -- (2026-10-08) coastline: minimum distance to the line's segments. Wrapping the line into a
             -- polygon for polygonsDistanceCartesian closed it into an area, so points inside that area
             -- counted as distance 0 (one crossing too many vs PostGIS on coastline 45).
             arrayMin(arrayMap((a, b) -> sqrt(pow(c.x - (a.1 + (b.1 - a.1) * greatest(0., least(1., ((c.x - a.1) * (b.1 - a.1) + (c.y - a.2) * (b.2 - a.2)) / greatest(pow(b.1 - a.1, 2) + pow(b.2 - a.2, 2), 1e-9)))), 2)
                                            + pow(c.y - (a.2 + (b.2 - a.2) * greatest(0., least(1., ((c.x - a.1) * (b.1 - a.1) + (c.y - a.2) * (b.2 - a.2)) / greatest(pow(b.1 - a.1, 2) + pow(b.2 - a.2, 2), 1e-9)))), 2)),
                               arrayPopBack(arrayMap(pt -> tuple(6378137. * radians(pt.1), 6378137. * log(tan(pi() / 4 + radians(pt.2) / 2))), i.geom.LineString)), arrayPopFront(arrayMap(pt -> tuple(6378137. * radians(pt.1), 6378137. * log(tan(pi() / 4 + radians(pt.2) / 2))), i.geom.LineString)))),
             polygonsDistanceCartesian(array(array(tuple(c.x, c.y))),
               arrayMap(ring -> arrayMap(pt -> tuple(6378137. * radians(pt.1), 6378137. * log(tan(pi() / 4 + radians(pt.2) / 2))), ring), i.geom.Polygon))
         ) <= :distance
      AND c.timestamp BETWEEN :period_medium
      AND c.id > 0 AND c.id < 1000000000000;
  clickhouse_scan: |
    -- FIX (2026-09-30, metric parity): see countActiveCrossingsNearIsland's clickhouse block
    -- above for the full explanation -- same polygonsDistanceSpherical -> polygonsDistanceCartesian
    -- + Web Mercator reprojection fix, same Polygon/LineString variantType dispatch.
    -- FIX: added GLOBAL (Distributed-JOIN denial).
    -- id/crossing_id migration is done -- see CrossingsActiveAtGivenHourOfDay's clickhouse block
    -- for the full note. No id remap needed here either (rand()-sharded, not id-sharded), so
    -- "c.id > 0" stays as-is, unlike postgis/mobilitydb's "c.id < 1000000000000".
    SELECT COUNT(DISTINCT c.id)
    FROM crossing_points c
    GLOBAL JOIN islands i ON i.id = :island
    WHERE polygonsDistanceCartesian(
            array(array(tuple(c.x, c.y))),
            multiIf(
              variantType(i.geom) = 'Polygon',
                arrayMap(ring -> arrayMap(pt -> tuple(6378137. * radians(pt.1), 6378137. * log(tan(pi() / 4 + radians(pt.2) / 2))), ring), i.geom.Polygon),
              variantType(i.geom) = 'LineString',
                array(arrayMap(pt -> tuple(6378137. * radians(pt.1), 6378137. * log(tan(pi() / 4 + radians(pt.2) / 2))), i.geom.LineString)),
              array(array(tuple(0.0, 0.0)))
            )
          ) <= :distance
      AND c.timestamp BETWEEN :period_medium
      AND c.id > 0 AND c.id < 1000000000000;
  duckdb: |
    -- (2026-10-08) ST_Intersects_Extent(geom, <area's bounding box>) in front of the exact predicate: the point
    -- tables are stored in Hilbert order with a bounding box per row group, and this cheap box test lets
    -- DuckDB skip the row groups outside the area. The exact predicate is unchanged and decides the result.
    -- The previous version is kept as duckdb_scan (not run).
    -- Point-to-polygon ST_DWithin works directly here (unlike CrateDB's point-only distance()) --
    -- see the header note above. Mirrors the postgis/sedona translation.
    SELECT COUNT(DISTINCT c.id) FROM crossing_points c JOIN islands i ON ST_DWithin(c.geom, i.geom, :distance) WHERE c.timestamp BETWEEN :period_medium AND i.id = :island AND ST_Intersects_Extent(c.geom, (SELECT ST_MakeEnvelope(ST_XMin(geom) - :distance, ST_YMin(geom) - :distance, ST_XMax(geom) + :distance, ST_YMax(geom) + :distance) FROM islands WHERE id = :island)) AND c.id > 0 AND c.id < 1000000000000;
  duckdb_scan: |
    -- Point-to-polygon ST_DWithin works directly here (unlike CrateDB's point-only distance()) --
    -- see the header note above. Mirrors the postgis/sedona translation.
    SELECT COUNT(DISTINCT c.id) FROM crossing_points c JOIN islands i ON ST_DWithin(c.geom, i.geom, :distance) WHERE c.timestamp BETWEEN :period_medium AND i.id = :island AND c.id > 0 AND c.id < 1000000000000;
  repetition: 50
  parameters:
  - distance
  - island
  - period_medium

# Trip Summary Table

- name: countActiveCrossingsInPeriod #temporal
  use: false
  description: "Counts the number of active crossings in a given time period."
  type: temporal
  # EQUIVALENCE NOTE: postgis/sedona use the OVERLAPS predicate directly against the packed
  # :period_medium parameter; clickhouse/duckdb have no OVERLAPS operator (duckdb's is
  # unconfirmed at best, see header note) -- both FIXED 2026-09-30 by decomposing
  # :period_medium into :period_medium_start/:period_medium_end in generateParameterVariations.py
  # and rewriting those two blocks as the explicit boolean form -- see their FIX comments below.
  mobilitydb: |
    SELECT COUNT(*) FROM crossings c WHERE c.trip && :period_medium;
  postgis: |
    -- FIX (naming): was "crossing_trajectories" -- the real generic trip-summary table is
    -- "crossings_summary" (see roles/duckdb+sedona/defaults/main.yml).
    SELECT COUNT(DISTINCT c.id)
    FROM crossings_summary c
    WHERE (c.start_time, c.end_time) OVERLAPS :period_medium;
  sedona: |
    -- FIX (naming): was a JOIN across "crossing_trajectories_start"/"crossing_trajectories_end"
    -- -- those split tables don't exist; the real export is a single "crossings_summary" table,
    -- no JOIN needed.
    SELECT COUNT(DISTINCT c.id)
    FROM crossings_summary c
    WHERE (c.start_time, c.end_time) OVERLAPS :period_medium;
  spacetime: |
    SELECT COUNT(*) FROM crossings c WHERE c.t && EPOCHRANGE :period_medium;
  clickhouse: |
    -- FIX (2026-09-30): ClickHouse has no OVERLAPS operator -- generateParameterVariations.py
    -- now decomposes :period_medium into :period_medium_start/:period_medium_end scalars (the
    -- harness change this NOTE used to say was needed), so this can be rewritten as the
    -- standard interval-overlap boolean: [c.start_time, c.end_time] overlaps
    -- [period_medium_start, period_medium_end] iff c.start_time < period_medium_end AND
    -- period_medium_start < c.end_time. Matches the duckdb block below, which already
    -- anticipated these exact token names.
    SELECT COUNT(DISTINCT c.id)
    FROM crossings_summary c
    WHERE c.start_time < :period_medium_end AND :period_medium_start < c.end_time;
  duckdb: |
    -- FIX (2026-09-30): same OVERLAPS-support gap as clickhouse above (see header note), and
    -- this query already anticipated the :period_medium_start/:period_medium_end tokens the
    -- generator now actually supplies (see the clickhouse block's FIX comment above) -- unlike
    -- the OVERLAPS-shaped queries elsewhere in this file, this one no longer depends on
    -- DuckDB's unconfirmed OVERLAPS support at all, since it never used it.
    -- FIX (naming): was "crossing_trajectories" -- see postgis block above.
    SELECT COUNT(DISTINCT c.id)
    FROM crossings_summary c
    WHERE c.start_time < :period_medium_end AND :period_medium_start < c.end_time;
  repetition: 50
  parameters:
  - period_medium

- name: averageDurationCrossingStartAtHarbourInPeriod #spatiotemporal
  use: false
  description: "Calculates the average duration of crossings that start at a given harbour within a certain distance and time period."
  type: spatiotemporal
  # FIX (2026-09-30): the great-circle-vs-planar distance mismatch previously flagged here is
  # fixed below (greatCircleDistance -> webMercatorDistance / polygonsDistanceCartesian, matching
  # the planar EPSG:3857 metric the other dialects use) -- see crossingsAroundHarbour's clickhouse
  # block for the full verification.
  mobilitydb: |
    SELECT AVG(endTimestamp(c.trip)-startTimestamp(c.trip)) as avg_duration FROM crossings c JOIN harbours h ON ST_DWithin(startValue(c.trip), h.geom, :radius) WHERE :period_medium @> startTimestamp(c.trip) AND h.name = :harbour;
  postgis: |
    -- FIX: was "... AND :period_medium @> c.start_time::timestamp" -- inconsistent with the
    -- BETWEEN-shaped :period_medium substitution this file uses everywhere else in the active
    -- (postgis/sedona/clickhouse) queries; sedona/clickhouse below already use BETWEEN for this
    -- exact query, so standardized postgis to match.
    -- FIX (naming): was "crossing_trajectories"/"c.origin_geom" -- real table is
    -- "crossings_summary", whose start-of-trip geometry column is "start_location".
    SELECT
      AVG(c.end_time - c.start_time) AS avg_duration
    FROM crossings_summary c
    JOIN harbours h
      ON ST_DWithin(c.start_location::geometry, h.geom::geometry, :radius)
    WHERE h.name = :harbour
      AND c.start_time::timestamp BETWEEN :period_medium;
  sedona: |
    -- FIX (naming): was a JOIN across "crossing_trajectories_start"/"crossing_trajectories_end"
    -- -- single "crossings_summary" table, no JOIN needed; "s.origin_geom" -> "c.start_location".
    SELECT
    AVG(c.end_time - c.start_time) AS avg_duration
    FROM crossings_summary c
    JOIN harbours h
        ON h.name = :harbour
        AND ST_DWithin(c.start_location, h.geom, :radius)
    WHERE c.start_time BETWEEN :period_medium;
  spacetime: |
    SELECT AVG(@c.t)
      FROM crossings c
      JOIN harbours h ON ST_DWithin(ST_Point(c.x0, c.y0), ST_ToGeom(h.geom::gpoint), :radius)
    WHERE h.name = :harbour AND c.t[0] <@ EPOCHRANGE :period_medium;
  clickhouse: |
    -- FIX (naming): was "crossing_trajectories" -- see postgis block above.
    -- FIX (2026-09-30, metric parity): greatCircleDistance -> webMercatorDistance, same fix as
    -- crossingsAroundHarbour's clickhouse block (see its FIX comment for the full verification).
    -- This query is use: false (dormant); correct if ever enabled.
    SELECT AVG(c.end_time - c.start_time) AS avg_duration
    FROM crossings_summary c
    JOIN harbours h ON h.name = :harbour
    WHERE webMercatorDistance(c.start_lon, c.start_lat, h.lon, h.lat) <= :radius
      AND c.start_time BETWEEN :period_medium;
  duckdb: |
    -- FIX (naming): was "crossing_trajectories"/"c.origin_geom" -- see postgis block above.
    SELECT
      AVG(c.end_time - c.start_time) AS avg_duration
    FROM crossings_summary c
    JOIN harbours h
      ON ST_DWithin(c.start_location, h.geom, :radius)
    WHERE h.name = :harbour
      AND c.start_time BETWEEN :period_medium;
  repetition: 50
  parameters:
  - harbour
  - period_medium
  - radius

- name: crossingsConnectTwoGivenHarbours #spatial
  use: false
  description: "Finds crossings that connect two given harbours (i.e are within a specific distance of both harbours.)"
  type: spatial
  # FIX (2026-09-30): the great-circle-vs-planar distance mismatch previously flagged here is
  # fixed below (greatCircleDistance -> webMercatorDistance / polygonsDistanceCartesian, matching
  # the planar EPSG:3857 metric the other dialects use) -- see crossingsAroundHarbour's clickhouse
  # block for the full verification.
  mobilitydb: |
    SELECT c.id FROM crossings c JOIN harbours h_start ON ST_DWithin(startValue(c.trip), h_start.geom, :distance) JOIN harbours h_end ON ST_DWithin(endValue(c.trip), h_end.geom, :distance) WHERE h_start.name = :harbour AND h_end.name = :port;
  postgis: |
    -- FIX (naming): was "crossing_trajectories"/"origin_geom"/"destination_geom" -- real table
    -- is "crossings_summary" with "start_location"/"end_location".
    SELECT DISTINCT c.id FROM crossings_summary c JOIN harbours h_start ON h_start.name = :harbour AND ST_DWithin(c.start_location::geometry, h_start.geom::geometry, :distance) JOIN harbours h_end ON h_end.name = :port AND ST_DWithin(c.end_location::geometry, h_end.geom::geometry, :distance);
  sedona: |
    -- FIX (naming): was a JOIN across "crossing_trajectories_start"/"crossing_trajectories_end"
    -- -- single "crossings_summary" table, no JOIN needed.
    SELECT DISTINCT c.id FROM crossings_summary c JOIN harbours h_start ON h_start.name = :harbour AND ST_DWithin(c.start_location, h_start.geom, :distance) JOIN harbours h_end ON h_end.name = :port AND ST_DWithin(c.end_location, h_end.geom, :distance);
  spacetime: |
    SELECT c.crossing_id AS id
    FROM crossings c, harbours h1, harbours h2
    WHERE h1.name = :harbour AND h2.name = :port
    AND ST_DWithin(ST_Point(c.x0, c.y0), ST_ToGeom(h1.geom::gpoint), :distance)
    AND ST_DWithin(ST_Point(c.x1, c.y1), ST_ToGeom(h2.geom::gpoint), :distance);
  clickhouse: |
    -- FIX (naming): was "crossing_trajectories" -- see postgis block above.
    -- FIX (2026-09-30, metric parity): greatCircleDistance -> webMercatorDistance, same fix as
    -- crossingsAroundHarbour's clickhouse block (see its FIX comment for the full verification).
    -- This query is use: false (dormant); correct if ever enabled.
    SELECT DISTINCT c.id
    FROM crossings_summary c
    JOIN harbours h_start ON h_start.name = :harbour
    JOIN harbours h_end ON h_end.name = :port
    WHERE webMercatorDistance(c.start_lon, c.start_lat, h_start.lon, h_start.lat) <= :distance
      AND webMercatorDistance(c.end_lon, c.end_lat, h_end.lon, h_end.lat) <= :distance;
  duckdb: |
    -- FIX (naming): was "crossing_trajectories"/"origin_geom"/"destination_geom" -- see postgis
    -- block above.
    SELECT DISTINCT c.id
    FROM crossings_summary c
    JOIN harbours h_start ON h_start.name = :harbour AND ST_DWithin(c.start_location, h_start.geom, :distance)
    JOIN harbours h_end ON h_end.name = :port AND ST_DWithin(c.end_location, h_end.geom, :distance);
  repetition: 50
  parameters:
  - harbour
  - port
  - distance

# Write Operations
#live updates not supported in sedona, so this is not possible
- name: insertSingleCrossingPoint
  use: true
  description: "Insert a single crossing point"
  type: insert
  # (2026-10-24) MobilityDB writes go to its trajectory table (scratch trajectories with negative ids), which its reads use
  mobilitydb: |
    INSERT INTO crossings (id, trip)
    VALUES (:id, tgeompoint(:point, TIMESTAMP :instant AT TIME ZONE 'UTC'));
  postgis: |
    INSERT INTO crossing_points (id, geom, timestamp)
    VALUES (:id, :point, :instant);
  sedona: |
  spacetime: |

  # FIX: crossing_points has no "geom" column in ClickHouse (it stores lat/lon directly, with
  # Point/h3 as MATERIALIZED derivatives, same shape as flight_points -- see
  # insertSingleflightPoint's FIX note in aviation/config/combinedBenchConf.yaml) -- this would
  # have errored outright on an unknown column. Rewritten with the same :point_lon/:point_lat
  # decomposition generateParameterVariations.py already builds for other ClickHouse queries.
  clickhouse: |
    INSERT INTO crossing_points (id, timestamp, lat, lon)
    VALUES (:id, :instant, :point_lat, :point_lon);
  duckdb: |
    INSERT INTO crossing_points (id, geom, timestamp)
    VALUES (:id, :point, :instant);

  repetition: 23
  parameters:
  - id
  - point
  - instant

# NOTE: "id" is not unique in crossing_points -- it's the crossing's id, shared by every point of
# that crossing, not a per-row key. updateCrossingPoint/deleteCrossingPoint (WHERE id = :id alone)
# were ambiguously named for an operation that (outside the benchmark's own scratch-id
# bookkeeping) touches every point of the crossing, not "a crossing point" as the name implied.
# Split into an explicit "Mass" variant (unchanged: every point sharing :id) and a "Single"
# variant that also pins :instant (the exact timestamp of one specific point) so it targets
# exactly one row -- same split as aviation/config/combinedBenchConf.yaml's flight_points queries.
- name: updateCrossingPointMass
  use: true
  description: "Update location of every point belonging to a crossing id"
  type: update
  # EQUIVALENCE NOTE: write immediacy differs by system here -- mobilitydb/postgis apply this
  # UPDATE synchronously; clickhouse's UPDATE is an async background mutation (ALTER TABLE ...
  # UPDATE, not guaranteed visible immediately after the call returns, see below); duckdb's write
  # goes through DuckLake's snapshot-commit-with-possible-retry path (see header note); sedona
  # doesn't support live updates at all (see the file comment above this section). A latency/
  # throughput comparison across these isn't purely a syntax difference.
  # FIX: same "trip"/":trip" mistake as insertSingleCrossingPoint above -- corrected to the
  # "geom" column and the declared ":point" parameter.
  # (2026-10-24) MobilityDB writes go to its trajectory table (scratch trajectories with negative ids), which its reads use
  mobilitydb: |
    UPDATE crossings
    SET trip = tgeompoint(:point, getTime(trip))
    WHERE id = :id;
  postgis: |
    UPDATE crossing_points
    SET geom = :point
    WHERE id = :id;
  sedona: |
  spacetime: |
  # FIX: two more problems on top of the "trip" mistake above. (1) "geom" isn't a ClickHouse
  # column (see insertSingleCrossingPoint's FIX note); (2) even against the real lat/lon columns,
  # ALTER TABLE ... UPDATE against crossing_points (the Distributed table) fails outright the same
  # way flight_points' did -- lat/lon feed the MATERIALIZED h3 column, which is part of the
  # ORDER BY key, and ClickHouse forbids updating any column a key column derives from, on top of
  # Distributed tables not accepting mutations directly. Same re-INSERT (self-referencing SELECT
  # to keep each row's own timestamp) + DELETE workaround as updateflightPointMass, targeting the
  # underlying _local table on every shard (ON CLUSTER). ClickHouseExecutor.java splits on ";" and
  # runs each statement in turn to support this.
  clickhouse: |
    INSERT INTO crossing_points (id, timestamp, lat, lon)
    SELECT id, timestamp, :point_lat, :point_lon FROM crossing_points WHERE id = :id;
    DELETE FROM crossing_points_local ON CLUSTER cluster_1 WHERE id = :id AND lat != :point_lat SETTINGS lightweight_delete_mode = 'lightweight_update';
  duckdb: |
    -- Runs as a normal UPDATE against the DuckLake-attached table; each commit becomes a new
    -- snapshot with the retry-on-conflict behavior noted in the header above -- a different
    -- consistency model from a single-instance Postgres backend, not just different syntax.
    UPDATE crossing_points
    SET geom = :point
    WHERE id = :id;
  repetition: 10
  parameters:
  - id
  - point

- name: updateCrossingPointSingle
  use: true
  description: "Update location of exactly one crossing point, identified by id and timestamp"
  type: update_single
  # Same EQUIVALENCE NOTE as updateCrossingPointMass above.
  # (2026-10-24) MobilityDB writes go to its trajectory table (scratch trajectories with negative ids), which its reads use
  mobilitydb: |
    UPDATE crossings
    SET trip = update(trip, tgeompoint(:point, TIMESTAMP :instant AT TIME ZONE 'UTC'))
    WHERE id = :id AND (TIMESTAMP :instant AT TIME ZONE 'UTC') <@ getTime(trip);
  postgis: |
    UPDATE crossing_points
    SET geom = :point
    WHERE id = :id AND timestamp = :instant;
  sedona: |
  spacetime: |
  # Same re-INSERT + DELETE workaround as updateCrossingPointMass (see its FIX note), scoped down
  # to the one point via "AND timestamp = :instant" on both statements.
  clickhouse: |
    INSERT INTO crossing_points (id, timestamp, lat, lon)
    SELECT id, timestamp, :point_lat, :point_lon FROM crossing_points WHERE id = :id AND timestamp = :instant;
    DELETE FROM crossing_points_local ON CLUSTER cluster_1 WHERE id = :id AND timestamp = :instant AND lat != :point_lat SETTINGS lightweight_delete_mode = 'lightweight_update';
  duckdb: |
    UPDATE crossing_points
    SET geom = :point
    WHERE id = :id AND timestamp = :instant;
  repetition: 10
  parameters:
  - id
  - point
  - instant

- name: deleteCrossingPointMass
  use: false  # (2026-10-02) delete queries retired: benchmark writes are insert/update only, reset after each run
  description: "Delete every point belonging to a crossing id"
  type: delete
  mobilitydb: |
    DELETE FROM crossing_points
    WHERE id = :id;
  postgis: |
    DELETE FROM crossing_points
    WHERE id = :id;
  sedona: |
  spacetime: |
  # FIX: this "lightweight delete" syntax fails outright against crossing_points -- confirmed
  # live for the equivalent flight_points query ("DELETE query is not supported for table
  # default.flight_points", a Distributed engine table; crossing_points is built the same way --
  # see insertSingleCrossingPoint's FIX note). Mutations have to target the underlying _local
  # table, on every shard (ON CLUSTER), same as updateCrossingPointMass.
  clickhouse: |
    ALTER TABLE crossing_points_local ON CLUSTER cluster_1 DELETE WHERE id = :id;
  duckdb: |
    DELETE FROM crossing_points
    WHERE id = :id;
  repetition: 5
  parameters:
  - id

- name: deleteCrossingPointSingle
  use: false  # (2026-10-02) delete queries retired: benchmark writes are insert/update only, reset after each run
  description: "Delete exactly one crossing point, identified by id and timestamp"
  type: delete_single
  mobilitydb: |
    DELETE FROM crossing_points
    WHERE id = :id AND timestamp = :instant;
  postgis: |
    DELETE FROM crossing_points
    WHERE id = :id AND timestamp = :instant;
  sedona: |
  spacetime: |
  clickhouse: |
    ALTER TABLE crossing_points_local ON CLUSTER cluster_1 DELETE WHERE id = :id AND timestamp = :instant;
  duckdb: |
    DELETE FROM crossing_points
    WHERE id = :id AND timestamp = :instant;
  repetition: 5
  parameters:
  - id
  - instant

- name: bulkInsertCrossingPoints
  use: true
  description: "Insert multiple points in one statement"
  type: bulk_insert
  # (2026-10-24) MobilityDB writes go to its trajectory table (scratch trajectories with negative ids), which its reads use
  mobilitydb: |
    INSERT INTO crossings (id, trip)
    SELECT v.id, tgeompoint(v.geom, v.ts AT TIME ZONE 'UTC')
    FROM (VALUES :bulk_values) AS v(id, geom, ts);
  postgis: |
    INSERT INTO crossing_points (id, geom, timestamp)
    VALUES :bulk_values;
  sedona: |
  spacetime: |
  # FIX: same "no geom column" problem as insertSingleCrossingPoint above -- :bulk_values_clickhouse
  # is a ClickHouse-specific rebuild of the shared :bulk_values tuples (see
  # generateParameterVariations.py) as (id, timestamp, lat, lon), matching the real columns.
  clickhouse: |
    INSERT INTO crossing_points (id, timestamp, lat, lon)
    VALUES :bulk_values_clickhouse;
  duckdb: |
    INSERT INTO crossing_points (id, geom, timestamp)
    VALUES :bulk_values;
  repetition: 12
  parameters:
  - bulk_values






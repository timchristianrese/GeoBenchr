benchmark:
  sut: MobilityDB
  mixed: false
  nodes:
  - ''
  threads: 16
  test: false
  random_seed: 1500

# DuckDB dialect notes (added when a "duckdb:" query block was introduced below -- see the fuller
# version of this note in crossings_benchmark.yaml for the full research write-up; summarized here):
#   - "Distributed DuckDB" means DuckLake (Postgres-backed catalog + Parquet on shared object
#     storage) attached by multiple independent DuckDB engines. ATTACH is a one-time setup step,
#     not part of each query -- duckdb: blocks below are plain DuckDB SQL. This is shared storage
#     queried by independent single-node engines, not shared-nothing parallel query execution
#     (no cross-node shuffle/parallel join, unlike Sedona/Spark).
#   - GEOMETRY is a core DuckDB type (since 1.5.0); the "spatial" extension supplies
#     ST_Distance/ST_DWithin/ST_Buffer/ST_Intersects/ST_Contains etc. generically over geometry
#     type, including point-to-polygon distance.
#   - EXTRACT/date_trunc/INTERVAL/CTEs/window functions/GROUP BY-HAVING/COUNT(DISTINCT ...)/
#     standard DML all supported with Postgres-compatible syntax -- DuckDB's COUNT(DISTINCT ...)
#     is exact (like postgis/sedona), not an approximate estimator, so it needs no "uniqExact()"-
#     style fix the way ClickHouse's default uniq() did for a couple of queries below.
#   - Write consistency for the DuckLake configuration above is snapshot-isolated with a
#     documented (but still-maturing) retry-on-conflict mechanism for concurrent writers --
#     different from a single Postgres instance's immediate read-after-write.

queryConfigs:
- name: FirstAndLastActivityInPeriod #temporal
  use: true
  description: "Find the first and last activity of each user within a specified time period. This query retrieves the earliest and latest timestamps of user activities."
  type: temporal
  mobilitydb: |
    -- NOT IMPLEMENTED: left blank. Unlike the crossings/rides files, no trajectory-table
    -- equivalent (e.g. a "geolife_trajectories"/"users" table with a temporal "trip" column) is
    -- referenced anywhere else in this file, so there's no confident basis to fill this in.
  postgis: |
    SELECT id,
       MIN(timestamp) AS first_seen,
       MAX(timestamp) AS last_seen
    FROM geolife_points
    WHERE timestamp BETWEEN :period_medium
    GROUP BY id;
  sample_postgis: |
      SELECT id,
       MIN(timestamp) AS first_seen,
       MAX(timestamp) AS last_seen
      FROM geolife_points
      WHERE timestamp BETWEEN '2019-07-02 03:48:22' AND '2019-07-03 04:20:27'
      GROUP BY id;
  sedona: |
      SELECT id,
       MIN(timestamp) AS first_seen,
       MAX(timestamp) AS last_seen
      FROM geolife_points
      WHERE timestamp BETWEEN :period_medium
      GROUP BY id;
  spacetime: |
    SELECT user_id AS id,
     MIN(t) AS first_seen,
     MAX(t) AS last_seen
    FROM geolife_points
    -- FIX: confirmed live -- ":period_medium" substitutes to a bracketed-range STRING literal for
    -- spacetime ("'[t1, t2]'", see generateParameterVariations.py's period-specific substitution),
    -- and "<@" needs an actual EPOCHRANGE value on its right side to type-check against a
    -- timestamp column ("no matching overload for: '<@'" otherwise) -- same EPOCHRANGE cast the
    -- "&&"-based queries elsewhere in this file already apply.
    WHERE t <@ EPOCHRANGE :period_medium
    GROUP BY user_id;
  clickhouse: |
      SELECT id,
       MIN(timestamp) AS first_seen,
       MAX(timestamp) AS last_seen
      FROM geolife_points
      WHERE timestamp BETWEEN :period_medium
      GROUP BY id;
  duckdb: |
    SELECT id,
       MIN(timestamp) AS first_seen,
       MAX(timestamp) AS last_seen
    FROM geolife_points
    WHERE timestamp BETWEEN :period_medium
    GROUP BY id;
  repetition: 50
  parameters:
  - period_medium
- name: AverageDailyActivityPerUserInPeriod #temporal
  use: true
  description: "Find the average daily number of activities per user within a specified time period, specific to each user."
  type: temporal
  # EQUIVALENCE NOTE: clickhouse's default uniq() is an approximate (HyperLogLog) distinct count;
  # it was already fixed below to uniqExact() so it matches postgis/sedona's exact
  # COUNT(DISTINCT DATE(timestamp)). duckdb's COUNT(DISTINCT ...) is exact by default (see header
  # note), so no equivalent fix is needed there -- flagging only so it's clear this was a
  # deliberate non-issue for duckdb, not an overlooked one.
  # NOT IMPLEMENTED: left blank, same reasoning as FirstAndLastActivityInPeriod above.
  mobilitydb: |
  postgis: |
    SELECT
    id,
    COUNT(*)::float / COUNT(DISTINCT DATE(timestamp)) AS avg_points_per_day
    FROM geolife_points
    WHERE timestamp BETWEEN :period_medium
    GROUP BY id;
  sample_postgis: |
    SELECT
    id,
    COUNT(*)::float / COUNT(DISTINCT DATE(timestamp)) AS avg_points_per_day
    FROM geolife_points
    WHERE timestamp BETWEEN '2019-07-02 03:48:22' AND '2019-07-06 04:20:27'
    GROUP BY id;
  sedona: |
    SELECT
    id,
    COUNT(*)::float / COUNT(DISTINCT DATE(timestamp)) AS avg_points_per_day
    FROM geolife_points
    WHERE timestamp BETWEEN :period_medium
    GROUP BY id;
  spacetime: |
    WITH user_day_cnt AS (
      SELECT user_id, TS_DAYSTART(t) day, COUNT(*) AS day_cnt
      FROM geolife_points
      -- FIX: confirmed live -- ":period_medium" substitutes to a bracketed-range STRING literal for
    -- spacetime ("'[t1, t2]'", see generateParameterVariations.py's period-specific substitution),
    -- and "<@" needs an actual EPOCHRANGE value on its right side to type-check against a
    -- timestamp column ("no matching overload for: '<@'" otherwise) -- same EPOCHRANGE cast the
    -- "&&"-based queries elsewhere in this file already apply.
    WHERE t <@ EPOCHRANGE :period_medium
      GROUP BY user_id, day
    )
    SELECT user_id AS id, SUM(day_cnt)::f64 / COUNT(*) AS avg_points_per_day
    FROM user_day_cnt
    GROUP BY user_id;
  clickhouse: |
    -- FIX: uniq() is an APPROXIMATE distinct count in ClickHouse (HyperLogLog-based) -- it is not
    -- the same statistic as postgis/sedona's exact COUNT(DISTINCT DATE(timestamp)) above, so
    -- results could diverge between dialects. Switched to uniqExact() for a true equivalent.
    SELECT
    id,
    COUNT(*) / uniqExact(toDate(timestamp)) AS avg_points_per_day
    FROM geolife_points
    WHERE timestamp BETWEEN :period_medium
    GROUP BY id;
  duckdb: |
    SELECT
    id,
    COUNT(*)::float / COUNT(DISTINCT DATE(timestamp)) AS avg_points_per_day
    FROM geolife_points
    WHERE timestamp BETWEEN :period_medium
    GROUP BY id;
  repetition: 50
  parameters:
  - period_medium

- name: ClosestRestaurantToPoint #spatial
  use: true
  description: "Find the closest restaurant to a specified point using CheckInData. This query identifies the nearest restaurant based on spatial proximity. This query assumes that there is a restaurant within 5 km of the given point."
  type: spatial
  # FIX (2026-09-30): the great-circle-vs-planar mismatch previously noted here is fixed below
  # via webMercatorDistance -- see ais/config/combinedBenchConf.yaml's crossingsAroundHarbour
  # clickhouse block for the formula derivation and live verification.
  # NOT IMPLEMENTED: left blank in the source file.
  mobilitydb: |
  postgis: |
    SELECT *
    FROM geolife_points
    WHERE venue_type = 'Restaurant' AND ST_DWithin(geom, :point, 5000)
    ORDER BY ST_Distance(geom, :point)
    LIMIT 1;
  sample_postgis: |
    SELECT *
    FROM geolife_points
    WHERE venue_type = 'Restaurant' AND ST_DWithin(
        geom,
        ST_Transform(
            ST_SetSRID(ST_MakePoint(116.4074, 39.9042), 4326),
            3857
        ),
        5000
    )
    ORDER BY ST_Distance(
        geom,
        ST_Transform(
            ST_SetSRID(ST_MakePoint(116.4074, 39.9042), 4326),
            3857
        )
    )
    LIMIT 1;
  sedona: |
    SELECT *
    FROM geolife_points
    WHERE venue_type = 'Restaurant' AND ST_DWithin(geom, :point, 5000)
    ORDER BY ST_Distance(geom, :point)
    LIMIT 1;
  spacetime: |
    -- (2026-10-02) radius in EPSG:3857 units like every other dialect, converted to SpaceTime's
    -- local meters by :st_scale = cos(lat) * 0.99842 (see scripts/spacetime_units.py)
    SELECT *
    FROM geolife_points
    WHERE venue_type = 1 AND ST_DWithin(ST_Point(x, y), ST_ToGeom(:point::gpoint), 5000 * :st_scale)
    ORDER BY ST_Distance(ST_Point(x, y), ST_ToGeom(:point::gpoint))
    LIMIT 1;
  clickhouse: |
    -- (2026-10-07) H3: the h3 GLOBAL IN (...) condition lets ClickHouse use the table's H3 primary
    -- key (h3, timestamp, id) and read only the cells that can contain a match -- a superset built
    -- by the h3Cover* functions (scripts/clickhouse_functions.sql). The exact predicate below is
    -- unchanged and decides the result. The scan-only version is kept as clickhouse_scan (not run).
    -- NOTE: greatCircleDistance needs 4 scalar args (lon1, lat1, lon2, lat2).
    -- The original passed :point (a single packed geometry parameter, the same
    -- shape postgis/sedona use above) as if it were two scalars -- wrong arity,
    -- would not run. Fixed assuming decomposed :point_lon / :point_lat parameters,
    -- which are NOT currently in this query's shared `parameters:` list below --
    -- the harness needs to supply them for ClickHouse specifically.
    -- FIX (2026-09-30, metric parity): greatCircleDistance -> webMercatorDistance, a SQL UDF
    -- (created ON CLUSTER cluster_1 -- see scripts/clickhouse_functions.sql) that projects both points into Web
    -- Mercator (EPSG:3857) and takes the planar Euclidean distance, matching ST_DWithin/
    -- ST_Distance's metric exactly even at Beijing's latitude -- see
    -- ais/config/combinedBenchConf.yaml's crossingsAroundHarbour clickhouse block for the
    -- formula derivation and live verification.
    SELECT *
    FROM geolife_points
    WHERE h3 GLOBAL IN (SELECT arrayJoin(h3CoverPoint(:point_lon, :point_lat, 5000)))
      AND venue_type = 'Restaurant' AND sqrt(pow(x - 6378137. * radians(:point_lon), 2) + pow(y - 6378137. * log(tan(pi() / 4 + radians(:point_lat) / 2)), 2)) <= 5000
    ORDER BY sqrt(pow(x - 6378137. * radians(:point_lon), 2) + pow(y - 6378137. * log(tan(pi() / 4 + radians(:point_lat) / 2)), 2))
    LIMIT 1;
  clickhouse_scan: |
    -- NOTE: greatCircleDistance needs 4 scalar args (lon1, lat1, lon2, lat2).
    -- The original passed :point (a single packed geometry parameter, the same
    -- shape postgis/sedona use above) as if it were two scalars -- wrong arity,
    -- would not run. Fixed assuming decomposed :point_lon / :point_lat parameters,
    -- which are NOT currently in this query's shared `parameters:` list below --
    -- the harness needs to supply them for ClickHouse specifically.
    -- FIX (2026-09-30, metric parity): greatCircleDistance -> webMercatorDistance, a SQL UDF
    -- (created ON CLUSTER cluster_1 -- see scripts/clickhouse_functions.sql) that projects both points into Web
    -- Mercator (EPSG:3857) and takes the planar Euclidean distance, matching ST_DWithin/
    -- ST_Distance's metric exactly even at Beijing's latitude -- see
    -- ais/config/combinedBenchConf.yaml's crossingsAroundHarbour clickhouse block for the
    -- formula derivation and live verification.
    SELECT *
    FROM geolife_points
    WHERE venue_type = 'Restaurant' AND sqrt(pow(x - 6378137. * radians(:point_lon), 2) + pow(y - 6378137. * log(tan(pi() / 4 + radians(:point_lat) / 2)), 2)) <= 5000
    ORDER BY sqrt(pow(x - 6378137. * radians(:point_lon), 2) + pow(y - 6378137. * log(tan(pi() / 4 + radians(:point_lat) / 2)), 2))
    LIMIT 1;
  duckdb: |
    -- (2026-10-08) ST_Intersects_Extent(geom, <area's bounding box>) in front of the exact predicate: the point
    -- tables are stored in Hilbert order with a bounding box per row group, and this cheap box test lets
    -- DuckDB skip the row groups outside the area. The exact predicate is unchanged and decides the result.
    -- The previous version is kept as duckdb_scan (not run).
    SELECT *
    FROM geolife_points
    WHERE venue_type = 'Restaurant' AND ST_Intersects_Extent(geom, ST_MakeEnvelope(ST_XMin(:point) - 5000, ST_YMin(:point) - 5000, ST_XMax(:point) + 5000, ST_YMax(:point) + 5000)) AND ST_DWithin(geom, :point, 5000)
    ORDER BY ST_Distance(geom, :point)
    LIMIT 1;
  duckdb_scan: |
    SELECT *
    FROM geolife_points
    WHERE venue_type = 'Restaurant' AND ST_DWithin(geom, :point, 5000)
    ORDER BY ST_Distance(geom, :point)
    LIMIT 1;
  repetition: 50
  parameters:
  - point
- name: CountPOIsByTypeInRegion #spatial
  use: true
  description: "Count the number of points of interest (POIs) by type within a specified region. This query aggregates POIs based on their types, providing insights into the distribution of different categories of POIs within the defined spatial area."
  type: spatial
  mobilitydb: |
    -- NOT IMPLEMENTED: left blank in the source file.
  postgis: |
    SELECT venue_type, COUNT(DISTINCT venue_id) AS poi_count
    FROM geolife_points
    WHERE ST_Intersects(geom, :region_medium)
    GROUP BY venue_type;
  sample_postgis: |
    SELECT venue_type, COUNT(DISTINCT venue_id) AS poi_count
    FROM geolife_points
    WHERE ST_Intersects(
        geom,
        ST_Transform(
            ST_MakeEnvelope(
                116.38087376650985,
                39.84297123506521,
                116.48446967405202,
                39.89995452866296,
                4326
            ),
            3857
        )
    )
    GROUP BY venue_type;
  sedona: |
    SELECT venue_type, COUNT(DISTINCT venue_id) AS poi_count
    FROM geolife_points
    WHERE ST_Intersects(geom, :region_medium)
    GROUP BY venue_type;
  spacetime: |
    SELECT venue_type, COUNT(DISTINCT venue_id) AS poi_count
    FROM geolife_points
    WHERE ST_Intersects(ST_Point(x, y), ST_ToGeom(:region_medium::gpolygon))
    GROUP BY venue_type;
  clickhouse: |
    -- (2026-10-07) H3: the h3 GLOBAL IN (...) condition lets ClickHouse use the table's H3 primary
    -- key (h3, timestamp, id) and read only the cells that can contain a match -- a superset built
    -- by the h3Cover* functions (scripts/clickhouse_functions.sql). The exact predicate below is
    -- unchanged and decides the result. The scan-only version is kept as clickhouse_scan (not run).
    -- (2026-10-13) :region_medium decomposes into :region_medium_lon_min/_lat_min/_lon_max/_lat_max
    -- (ClickHouse has no ST_MakeEnvelope), rebuilt here into a polygon ring and tested with
    -- pointInPolygon like every other region in the ClickHouse queries -- not as a lon/lat BETWEEN
    -- box test, which would exploit that the generated regions happen to be rectangles.
    SELECT venue_type, COUNT(DISTINCT venue_id) AS poi_count
    FROM geolife_points
    WHERE h3 GLOBAL IN (SELECT arrayJoin(h3CoverRing([(:region_medium_lon_min, :region_medium_lat_min), (:region_medium_lon_max, :region_medium_lat_min), (:region_medium_lon_max, :region_medium_lat_max), (:region_medium_lon_min, :region_medium_lat_max)], 0)))
      AND pointInPolygon((lon, lat), [(:region_medium_lon_min, :region_medium_lat_min), (:region_medium_lon_max, :region_medium_lat_min), (:region_medium_lon_max, :region_medium_lat_max), (:region_medium_lon_min, :region_medium_lat_max)])
    GROUP BY venue_type;
  clickhouse_scan: |
    -- (2026-10-13) :region_medium decomposes into :region_medium_lon_min/_lat_min/_lon_max/_lat_max
    -- (ClickHouse has no ST_MakeEnvelope), rebuilt here into a polygon ring and tested with
    -- pointInPolygon like every other region in the ClickHouse queries -- not as a lon/lat BETWEEN
    -- box test, which would exploit that the generated regions happen to be rectangles.
    SELECT venue_type, COUNT(DISTINCT venue_id) AS poi_count
    FROM geolife_points
    WHERE pointInPolygon((lon, lat), [(:region_medium_lon_min, :region_medium_lat_min), (:region_medium_lon_max, :region_medium_lat_min), (:region_medium_lon_max, :region_medium_lat_max), (:region_medium_lon_min, :region_medium_lat_max)])
    GROUP BY venue_type;
  duckdb: |
    -- (2026-10-08) ST_Intersects_Extent(geom, <area's bounding box>) in front of the exact predicate: the point
    -- tables are stored in Hilbert order with a bounding box per row group, and this cheap box test lets
    -- DuckDB skip the row groups outside the area. The exact predicate is unchanged and decides the result.
    -- The previous version is kept as duckdb_scan (not run).
    SELECT venue_type, COUNT(DISTINCT venue_id) AS poi_count
    FROM geolife_points
    WHERE ST_Intersects_Extent(geom, :region_medium) AND ST_Intersects(geom, :region_medium)
    GROUP BY venue_type;
  duckdb_scan: |
    SELECT venue_type, COUNT(DISTINCT venue_id) AS poi_count
    FROM geolife_points
    WHERE ST_Intersects(geom, :region_medium)
    GROUP BY venue_type;
  repetition: 50
  parameters:
  - region_medium

- name: "SlidingWindowActivityInRegionPerMinuteWithNonZeroID" #spatiotemporal
  use: true
  description: "Counts the number of Non-Zero Venue_ID activities in a specified region for each minute within a given time period. For every minute, the query aggregates activities occurring within a 20-minute sliding window centered on that minute (10 minutes before and after), providing a smoothed view of activity patterns over time."
  type: spatiotemporal
  mobilitydb: |
    -- NOT IMPLEMENTED: left blank. This is a non-trivial windowed aggregation; no confident
    -- analogous template exists elsewhere in this benchmark to extrapolate from.
  postgis: |
   WITH minute_activity AS (
    SELECT
        date_trunc('minute', timestamp) AS minute,
        COUNT(*) FILTER (WHERE venue_id <> 0) AS venue_updates
    FROM geolife_points
    WHERE timestamp BETWEEN :period_short
      AND ST_Intersects(geom, :region_medium)
    GROUP BY date_trunc('minute', timestamp)
    ),
    minute_windows AS (
        SELECT
            minute,
            minute - INTERVAL '10 minutes' AS window_start,
            minute + INTERVAL '10 minutes' AS window_end
        FROM minute_activity
    )
    SELECT
        w.minute,
        SUM(m.venue_updates) AS updates_in_window
    FROM minute_windows w
    JOIN minute_activity m
        ON m.minute BETWEEN w.window_start AND w.window_end
    GROUP BY w.minute
    ORDER BY w.minute;
  sample_postgis: |
    WITH minute_activity AS (
        SELECT
            date_trunc('minute', timestamp) AS minute,
            COUNT(*) AS updates,
            COUNT(*) FILTER (WHERE venue_id <> 0) AS venue_updates
        FROM geolife_points
        WHERE timestamp BETWEEN '2019-07-02 03:48:22' AND '2019-07-03 04:20:27'
          AND ST_Intersects(
                geom,
                ST_Transform(
                    ST_MakeEnvelope(
                        116.38087376650985,
                        39.84297123506521,
                        116.48446967405202,
                        39.89995452866296,
                        4326
                    ),
                    3857
                )
            )
        GROUP BY 1
    )
    SELECT
        a.minute,
        SUM(b.venue_updates) AS updates_in_window
    FROM minute_activity a
    JOIN minute_activity b
        ON b.minute BETWEEN a.minute - interval '10 minutes'
                        AND a.minute + interval '10 minutes'
    GROUP BY a.minute
    ORDER BY a.minute;
  sedona: |
    WITH minute_activity AS (
    SELECT
        date_trunc('minute', timestamp) AS minute,
        COUNT(*) FILTER (WHERE venue_id <> 0) AS venue_updates
    FROM geolife_points
    WHERE timestamp BETWEEN :period_short
      AND ST_Intersects(geom, :region_medium)
    GROUP BY date_trunc('minute', timestamp)
    ),
    minute_windows AS (
        SELECT
            minute,
            minute - INTERVAL '10 minutes' AS window_start,
            minute + INTERVAL '10 minutes' AS window_end
        FROM minute_activity
    )
    SELECT
        w.minute,
        SUM(m.venue_updates) AS updates_in_window
    FROM minute_windows w
    JOIN minute_activity m
        ON m.minute BETWEEN w.window_start AND w.window_end
    GROUP BY w.minute
    ORDER BY w.minute;
  spacetime: |
    LET minute_activity =
      SELECT TS_TRUNC('minute', t) AS minute,
             COUNT(IF(venue_id <> 0, 1, NULL)) AS venue_updates
      FROM geolife_points
      -- FIX: same EPOCHRANGE cast as the other spacetime blocks in this file -- see
      -- FirstAndLastActivityInPeriod's mobilitydb block above for the full rationale.
      WHERE t <@ EPOCHRANGE :period_short
        AND ST_Intersects(ST_Point(x, y), ST_ToGeom(:region_medium::gpolygon))
      GROUP BY 1;
    SELECT a.minute, SUM(b.venue_updates) AS updates_in_window
    FROM minute_activity a
    JOIN minute_activity b ON b.minute BETWEEN a.minute - TP '10min' AND a.minute + TP '10min'
    GROUP BY a.minute
    ORDER BY a.minute;
  clickhouse: |
    -- (2026-10-07) H3: the h3 GLOBAL IN (...) condition lets ClickHouse use the table's H3 primary
    -- key (h3, timestamp, id) and read only the cells that can contain a match -- a superset built
    -- by the h3Cover* functions (scripts/clickhouse_functions.sql). The exact predicate below is
    -- unchanged and decides the result. The scan-only version is kept as clickhouse_scan (not run).
    -- FIX: "COUNTIf" -> "countIf". ClickHouse function names are case-sensitive; the built-in
    -- combinator is lowercase-c "countIf", not "COUNTIf" -- as written this would fail with an
    -- unknown-function error.
    -- (2026-10-13) :region_medium decomposes into :region_medium_lon_min/_lat_min/_lon_max/_lat_max
    -- (ClickHouse has no ST_MakeEnvelope), rebuilt here into a polygon ring and tested with
    -- pointInPolygon like every other region in the ClickHouse queries -- not as a lon/lat BETWEEN
    -- box test, which would exploit that the generated regions happen to be rectangles.
    WITH minute_activity AS (
        SELECT
            toStartOfMinute(timestamp) AS minute,
            COUNT(*) AS updates,
            countIf(venue_id <> 0) AS venue_updates
        FROM geolife_points
        WHERE h3 GLOBAL IN (SELECT arrayJoin(h3CoverRing([(:region_medium_lon_min, :region_medium_lat_min), (:region_medium_lon_max, :region_medium_lat_min), (:region_medium_lon_max, :region_medium_lat_max), (:region_medium_lon_min, :region_medium_lat_max)], 0)))
          AND timestamp BETWEEN :period_short
          AND pointInPolygon((lon, lat), [(:region_medium_lon_min, :region_medium_lat_min), (:region_medium_lon_max, :region_medium_lat_min), (:region_medium_lon_max, :region_medium_lat_max), (:region_medium_lon_min, :region_medium_lat_max)])
        GROUP BY minute
    ),
    minute_windows AS (
        SELECT
            minute,
            minute - INTERVAL 10 MINUTE AS window_start,
            minute + INTERVAL 10 MINUTE AS window_end
        FROM minute_activity
    )
    SELECT
        w.minute,
        SUM(m.venue_updates) AS updates_in_window
    FROM minute_windows w
    JOIN minute_activity m
        ON m.minute BETWEEN w.window_start AND w.window_end
    GROUP BY w.minute
    ORDER BY w.minute;
  clickhouse_scan: |
    -- FIX: "COUNTIf" -> "countIf". ClickHouse function names are case-sensitive; the built-in
    -- combinator is lowercase-c "countIf", not "COUNTIf" -- as written this would fail with an
    -- unknown-function error.
    -- (2026-10-13) :region_medium decomposes into :region_medium_lon_min/_lat_min/_lon_max/_lat_max
    -- (ClickHouse has no ST_MakeEnvelope), rebuilt here into a polygon ring and tested with
    -- pointInPolygon like every other region in the ClickHouse queries -- not as a lon/lat BETWEEN
    -- box test, which would exploit that the generated regions happen to be rectangles.
    WITH minute_activity AS (
        SELECT
            toStartOfMinute(timestamp) AS minute,
            COUNT(*) AS updates,
            countIf(venue_id <> 0) AS venue_updates
        FROM geolife_points
        WHERE timestamp BETWEEN :period_short
          AND pointInPolygon((lon, lat), [(:region_medium_lon_min, :region_medium_lat_min), (:region_medium_lon_max, :region_medium_lat_min), (:region_medium_lon_max, :region_medium_lat_max), (:region_medium_lon_min, :region_medium_lat_max)])
        GROUP BY minute
    ),
    minute_windows AS (
        SELECT
            minute,
            minute - INTERVAL 10 MINUTE AS window_start,
            minute + INTERVAL 10 MINUTE AS window_end
        FROM minute_activity
    )
    SELECT
        w.minute,
        SUM(m.venue_updates) AS updates_in_window
    FROM minute_windows w
    JOIN minute_activity m
        ON m.minute BETWEEN w.window_start AND w.window_end
    GROUP BY w.minute
    ORDER BY w.minute;
  duckdb: |
    -- (2026-10-08) ST_Intersects_Extent(geom, <area's bounding box>) in front of the exact predicate: the point
    -- tables are stored in Hilbert order with a bounding box per row group, and this cheap box test lets
    -- DuckDB skip the row groups outside the area. The exact predicate is unchanged and decides the result.
    -- The previous version is kept as duckdb_scan (not run).
    WITH minute_activity AS (
      SELECT
          date_trunc('minute', timestamp) AS minute,
          COUNT(*) FILTER (WHERE venue_id <> 0) AS venue_updates
      FROM geolife_points
      WHERE timestamp BETWEEN :period_short
        AND ST_Intersects_Extent(geom, :region_medium) AND ST_Intersects(geom, :region_medium)
      GROUP BY date_trunc('minute', timestamp)
    ),
    minute_windows AS (
        SELECT
            minute,
            minute - INTERVAL '10 minutes' AS window_start,
            minute + INTERVAL '10 minutes' AS window_end
        FROM minute_activity
    )
    SELECT
        w.minute,
        SUM(m.venue_updates) AS updates_in_window
    FROM minute_windows w
    JOIN minute_activity m
        ON m.minute BETWEEN w.window_start AND w.window_end
    GROUP BY w.minute
    ORDER BY w.minute;
  duckdb_scan: |
    WITH minute_activity AS (
      SELECT
          date_trunc('minute', timestamp) AS minute,
          COUNT(*) FILTER (WHERE venue_id <> 0) AS venue_updates
      FROM geolife_points
      WHERE timestamp BETWEEN :period_short
        AND ST_Intersects(geom, :region_medium)
      GROUP BY date_trunc('minute', timestamp)
    ),
    minute_windows AS (
        SELECT
            minute,
            minute - INTERVAL '10 minutes' AS window_start,
            minute + INTERVAL '10 minutes' AS window_end
        FROM minute_activity
    )
    SELECT
        w.minute,
        SUM(m.venue_updates) AS updates_in_window
    FROM minute_windows w
    JOIN minute_activity m
        ON m.minute BETWEEN w.window_start AND w.window_end
    GROUP BY w.minute
    ORDER BY w.minute;
  repetition: 50
  parameters:
  - period_short
  - region_medium


- name: UniqueUsersPerHourInRegionInPeriod #spatiotemporal
  use: true
  description: "Find the number of unique users in a specified region during a given time period, grouped by hour. This query counts distinct user IDs whose activities fall within the defined spatial area and temporal window, providing insights into user distribution and engagement."
  type: spatiotemporal
  # EQUIVALENCE NOTE: same approximate-vs-exact distinct count issue as
  # AverageDailyActivityPerUserInPeriod above -- clickhouse's uniqExact() (already fixed from
  # uniq()) matches postgis/sedona/duckdb's exact COUNT(DISTINCT id).
  # NOT IMPLEMENTED: left blank in the source file.
  mobilitydb: |
  postgis: |
    SELECT date_trunc('hour', timestamp) AS hour,
       COUNT(DISTINCT id) AS users
    FROM geolife_points
    WHERE ST_Intersects(geom, :region_medium)
      AND timestamp BETWEEN :period_medium
    GROUP BY hour
    ORDER BY hour;
  sample_postgis: |
    SELECT date_trunc('hour', timestamp) AS hour,
       COUNT(DISTINCT id) AS users
    FROM geolife_points
    WHERE ST_Intersects(geom, ST_Transform(ST_MakeEnvelope(
                116.38087376650985,
                39.84297123506521,
                116.48446967405202,
                39.89995452866296,
                4326
            ), 3857))
      AND timestamp BETWEEN '2019-07-02 03:48:22' AND '2019-07-03 04:20:27'
    GROUP BY hour
    ORDER BY hour;
  sedona: |
    SELECT date_trunc('hour', timestamp) AS hour,
       COUNT(DISTINCT id) AS users
    FROM geolife_points
    WHERE ST_Intersects(geom, :region_medium)
      AND timestamp BETWEEN :period_medium
    GROUP BY hour
    ORDER BY hour;
  spacetime: |
    WITH user_hour_activity AS (
      SELECT TS_TRUNC('hour', t) AS hour, user_id
      FROM geolife_points
      -- FIX: confirmed live -- ":period_medium" substitutes to a bracketed-range STRING literal for
    -- spacetime ("'[t1, t2]'", see generateParameterVariations.py's period-specific substitution),
    -- and "<@" needs an actual EPOCHRANGE value on its right side to type-check against a
    -- timestamp column ("no matching overload for: '<@'" otherwise) -- same EPOCHRANGE cast the
    -- "&&"-based queries elsewhere in this file already apply.
    WHERE t <@ EPOCHRANGE :period_medium AND ST_Intersects(ST_Point(x, y), ST_ToGeom(:region_medium::gpolygon))
      GROUP BY 1, 2
    )
    SELECT hour, COUNT(*) AS users
    FROM user_hour_activity
    GROUP BY hour
    ORDER BY hour;
  clickhouse: |
    -- (2026-10-07) H3: the h3 GLOBAL IN (...) condition lets ClickHouse use the table's H3 primary
    -- key (h3, timestamp, id) and read only the cells that can contain a match -- a superset built
    -- by the h3Cover* functions (scripts/clickhouse_functions.sql). The exact predicate below is
    -- unchanged and decides the result. The scan-only version is kept as clickhouse_scan (not run).
    -- FIX: uniq() is an APPROXIMATE distinct count in ClickHouse; switched to uniqExact() so
    -- this matches postgis/sedona's exact COUNT(DISTINCT id) above rather than an estimate.
    -- (2026-10-13) :region_medium decomposes into :region_medium_lon_min/_lat_min/_lon_max/_lat_max
    -- (ClickHouse has no ST_MakeEnvelope), rebuilt here into a polygon ring and tested with
    -- pointInPolygon like every other region in the ClickHouse queries -- not as a lon/lat BETWEEN
    -- box test, which would exploit that the generated regions happen to be rectangles.
    SELECT toStartOfHour(timestamp) AS hour,
       uniqExact(id) AS users
    FROM geolife_points
    WHERE h3 GLOBAL IN (SELECT arrayJoin(h3CoverRing([(:region_medium_lon_min, :region_medium_lat_min), (:region_medium_lon_max, :region_medium_lat_min), (:region_medium_lon_max, :region_medium_lat_max), (:region_medium_lon_min, :region_medium_lat_max)], 0)))
      AND pointInPolygon((lon, lat), [(:region_medium_lon_min, :region_medium_lat_min), (:region_medium_lon_max, :region_medium_lat_min), (:region_medium_lon_max, :region_medium_lat_max), (:region_medium_lon_min, :region_medium_lat_max)])
      AND timestamp BETWEEN :period_medium
    GROUP BY hour
    ORDER BY hour;
  clickhouse_scan: |
    -- FIX: uniq() is an APPROXIMATE distinct count in ClickHouse; switched to uniqExact() so
    -- this matches postgis/sedona's exact COUNT(DISTINCT id) above rather than an estimate.
    -- (2026-10-13) :region_medium decomposes into :region_medium_lon_min/_lat_min/_lon_max/_lat_max
    -- (ClickHouse has no ST_MakeEnvelope), rebuilt here into a polygon ring and tested with
    -- pointInPolygon like every other region in the ClickHouse queries -- not as a lon/lat BETWEEN
    -- box test, which would exploit that the generated regions happen to be rectangles.
    SELECT toStartOfHour(timestamp) AS hour,
       uniqExact(id) AS users
    FROM geolife_points
    WHERE pointInPolygon((lon, lat), [(:region_medium_lon_min, :region_medium_lat_min), (:region_medium_lon_max, :region_medium_lat_min), (:region_medium_lon_max, :region_medium_lat_max), (:region_medium_lon_min, :region_medium_lat_max)])
      AND timestamp BETWEEN :period_medium
    GROUP BY hour
    ORDER BY hour;
  duckdb: |
    -- (2026-10-08) ST_Intersects_Extent(geom, <area's bounding box>) in front of the exact predicate: the point
    -- tables are stored in Hilbert order with a bounding box per row group, and this cheap box test lets
    -- DuckDB skip the row groups outside the area. The exact predicate is unchanged and decides the result.
    -- The previous version is kept as duckdb_scan (not run).
    SELECT date_trunc('hour', timestamp) AS hour,
       COUNT(DISTINCT id) AS users
    FROM geolife_points
    WHERE ST_Intersects_Extent(geom, :region_medium) AND ST_Intersects(geom, :region_medium)
      AND timestamp BETWEEN :period_medium
    GROUP BY hour
    ORDER BY hour;
  duckdb_scan: |
    SELECT date_trunc('hour', timestamp) AS hour,
       COUNT(DISTINCT id) AS users
    FROM geolife_points
    WHERE ST_Intersects(geom, :region_medium)
      AND timestamp BETWEEN :period_medium
    GROUP BY hour
    ORDER BY hour;
  repetition: 50
  parameters:
  - region_medium
  - period_medium


#Write Operations

- name: insertSinglegeolifePoint
  use: true
  description: "Insert a single geolife point"
  type: insert
  mobilitydb: |
  postgis: |
    -- FIX: didn't write "venue_id"/"venue_type" -- see mobilitydb FIX note above.
    INSERT INTO geolife_points (id, geom, timestamp, venue_id, venue_type)
    VALUES (:id, :point, :instant, :venue_id, :venue_type);
  sedona: |
  spacetime: |

  # FIX: geolife_points has no "geom" column in ClickHouse (it stores lat/lon directly, with
  # Point/h3 as MATERIALIZED derivatives, same shape as flight_points -- see
  # insertSingleflightPoint's FIX note in aviation/config/combinedBenchConf.yaml) -- this would
  # have errored outright on an unknown column. Rewritten with the same :point_lon/:point_lat
  # decomposition generateParameterVariations.py already builds for other ClickHouse queries.
  # FIX: also didn't write "venue_id"/"venue_type" -- see mobilitydb FIX note above.
  clickhouse: |
    INSERT INTO geolife_points (id, timestamp, venue_id, venue_type, lat, lon)
    VALUES (:id, :instant, :venue_id, :venue_type, :point_lat, :point_lon);
  duckdb: |
    -- FIX: didn't write "venue_id"/"venue_type" -- see mobilitydb FIX note above.
    INSERT INTO geolife_points (id, geom, timestamp, venue_id, venue_type)
    VALUES (:id, :point, :instant, :venue_id, :venue_type);

  repetition: 23
  parameters:
  - id
  - point
  - instant
  - venue_id
  - venue_type

# NOTE: "id" is not unique in geolife_points -- it's the user trace's id, shared by every point
# of that trace, not a per-row key. updategeolifePoint/deletegeolifePoint (WHERE id = :id alone)
# were ambiguously named for an operation that (outside the benchmark's own scratch-id
# bookkeeping) touches every point of the trace, not "a geolife point" as the name implied. Split
# into an explicit "Mass" variant (unchanged: every point sharing :id) and a "Single" variant that
# also pins :instant (the exact timestamp of one specific point) so it targets exactly one row --
# same split as aviation/config/combinedBenchConf.yaml's flight_points queries.
- name: updategeolifePointMass
  use: true
  description: "Update location of every point belonging to a geolife trace id"
  type: update
  # EQUIVALENCE NOTE: write immediacy differs by system -- see the same note on
  # updateCrossingPointMass in ais/config/combinedBenchConf.yaml (clickhouse's UPDATE is an async
  # mutation; duckdb's write goes through DuckLake's snapshot-commit-with-possible-retry path;
  # sedona doesn't support live updates).
  # FIX: was blank -- filled in analogous to postgis below.
  mobilitydb: |
  postgis: |
    UPDATE geolife_points
    SET geom = :point
    WHERE id = :id;
  sedona: |
  spacetime: |
  # FIX: two more problems on top of "ClickHouse has no standalone UPDATE statement". (1) "geom"
  # isn't a ClickHouse column (see insertSinglegeolifePoint's FIX note); (2) even against the real
  # lat/lon columns, ALTER TABLE ... UPDATE against geolife_points (the Distributed table) fails
  # outright the same way flight_points' did -- lat/lon feed the MATERIALIZED h3 column, which is
  # part of the ORDER BY key, and ClickHouse forbids updating any column a key column derives
  # from, on top of Distributed tables not accepting mutations directly. Same re-INSERT
  # (self-referencing SELECT to keep each row's own venue_id/venue_type/timestamp) + DELETE
  # workaround as updateflightPointMass, targeting the underlying _local table on every shard
  # (ON CLUSTER). ClickHouseExecutor.java splits on ";" and runs each statement in turn to support
  # this.
  clickhouse: |
    INSERT INTO geolife_points (id, timestamp, venue_id, venue_type, lat, lon)
    SELECT id, timestamp, venue_id, venue_type, :point_lat, :point_lon FROM geolife_points WHERE id = :id;
    DELETE FROM geolife_points_local ON CLUSTER cluster_1 WHERE id = :id AND lat != :point_lat SETTINGS lightweight_delete_mode = 'lightweight_update';
  duckdb: |
    UPDATE geolife_points
    SET geom = :point
    WHERE id = :id;
  repetition: 10
  parameters:
  - id
  - point

- name: updategeolifePointSingle
  use: true
  description: "Update location of exactly one geolife point, identified by id and timestamp"
  type: update_single
  # Same EQUIVALENCE NOTE as updategeolifePointMass above.
  mobilitydb: |
  postgis: |
    UPDATE geolife_points
    SET geom = :point
    WHERE id = :id AND timestamp = :instant;
  sedona: |
  spacetime: |
  # Same re-INSERT + DELETE workaround as updategeolifePointMass (see its FIX note), scoped down
  # to the one point via "AND timestamp = :instant" on both statements.
  clickhouse: |
    INSERT INTO geolife_points (id, timestamp, venue_id, venue_type, lat, lon)
    SELECT id, timestamp, venue_id, venue_type, :point_lat, :point_lon FROM geolife_points WHERE id = :id AND timestamp = :instant;
    DELETE FROM geolife_points_local ON CLUSTER cluster_1 WHERE id = :id AND timestamp = :instant AND lat != :point_lat SETTINGS lightweight_delete_mode = 'lightweight_update';
  duckdb: |
    UPDATE geolife_points
    SET geom = :point
    WHERE id = :id AND timestamp = :instant;
  repetition: 10
  parameters:
  - id
  - point
  - instant

- name: deletegeolifePointMass
  use: false  # (2026-10-02) delete queries retired: benchmark writes are insert/update only, reset after each run
  description: "Delete every point belonging to a geolife trace id"
  type: delete
  mobilitydb: |
    -- FIX: was blank -- filled in analogous to postgis below.
    DELETE FROM geolife_points
    WHERE id = :id;
  postgis: |
    DELETE FROM geolife_points
    WHERE id = :id;
  sedona: |
  spacetime: |
  # FIX: this "lightweight delete" syntax fails outright against geolife_points -- confirmed live
  # for the equivalent flight_points query ("DELETE query is not supported for table
  # default.flight_points", a Distributed engine table; geolife_points is built the same way --
  # see insertSinglegeolifePoint's FIX note). Mutations have to target the underlying _local
  # table, on every shard (ON CLUSTER), same as updategeolifePointMass.
  clickhouse: |
    ALTER TABLE geolife_points_local ON CLUSTER cluster_1 DELETE WHERE id = :id;
  duckdb: |
    DELETE FROM geolife_points
    WHERE id = :id;
  repetition: 5
  parameters:
  - id

- name: deletegeolifePointSingle
  use: false  # (2026-10-02) delete queries retired: benchmark writes are insert/update only, reset after each run
  description: "Delete exactly one geolife point, identified by id and timestamp"
  type: delete_single
  mobilitydb: |
    DELETE FROM geolife_points
    WHERE id = :id AND timestamp = :instant;
  postgis: |
    DELETE FROM geolife_points
    WHERE id = :id AND timestamp = :instant;
  sedona: |
  spacetime: |
  clickhouse: |
    ALTER TABLE geolife_points_local ON CLUSTER cluster_1 DELETE WHERE id = :id AND timestamp = :instant;
  duckdb: |
    DELETE FROM geolife_points
    WHERE id = :id AND timestamp = :instant;
  repetition: 5
  parameters:
  - id
  - instant

- name: bulkInsertgeolifePoints
  use: true
  description: "Insert multiple points in one statement"
  type: bulk_insert
  mobilitydb: |
  postgis: |
    -- FIX: didn't write "venue_id"/"venue_type" -- see insertSinglegeolifePoint's FIX note.
    INSERT INTO geolife_points (id, geom, timestamp, venue_id, venue_type)
    VALUES :bulk_values;
  sedona: |
  spacetime: |
  # FIX: same "no geom column" problem as insertSinglegeolifePoint above --
  # :bulk_values_clickhouse is a ClickHouse-specific rebuild of the shared :bulk_values tuples
  # (see generateParameterVariations.py) as (id, timestamp, venue_id, venue_type, lat, lon),
  # matching the real columns. FIX: also didn't write "venue_id"/"venue_type" -- see
  # insertSinglegeolifePoint's FIX note.
  clickhouse: |
    INSERT INTO geolife_points (id, timestamp, venue_id, venue_type, lat, lon)
    VALUES :bulk_values_clickhouse;
  duckdb: |
    -- FIX: didn't write "venue_id"/"venue_type" -- see insertSinglegeolifePoint's FIX note.
    INSERT INTO geolife_points (id, geom, timestamp, venue_id, venue_type)
    VALUES :bulk_values;
  repetition: 12
  parameters:
  - bulk_values



- name: ClosestRestaurantToPoint
  type: spatial
  sql: "SELECT *\nFROM geolife_points\nWHERE venue_type = 'restaurant' AND ST_DWithin(geom,\
    \ ST_SetSRID(ST_Point(39.86081791295743, 116.54111717720164), 3857), 5000) \n\
    ORDER BY ST_Distance(geom, ST_SetSRID(ST_Point(39.86081791295743, 116.54111717720164),\
    \ 3857))\nLIMIT 1;\n"
  params:
  - ST_SetSRID(ST_Point(39.86081791295743, 116.54111717720164), 3857)
- name: UniqueUsersPerHourInRegionInPeriod
  type: spatiotemporal
  sql: |
    SELECT date_trunc('hour', timestamp) AS hour,
       COUNT(DISTINCT id) AS users
    FROM geolife_points
    WHERE ST_Intersects(geom, :region)
      AND timestamp BETWEEN :period
    GROUP BY hour
    ORDER BY hour;

- name: FirstAndLastActivityInPeriod
  type: temporal
  sql: |
    SELECT id,
       MIN(timestamp) AS first_seen,
       MAX(timestamp) AS last_seen
    FROM geolife_points
    WHERE timestamp BETWEEN ['2019-07-17 15:42:12', '2019-07-30 09:21:45']
    GROUP BY id;
  params:
  - - '2019-07-17 15:42:12'
    - '2019-07-30 09:21:45'
- name: SlidingWindowActivityInRegionPerMinuteWithNonZeroID
  type: spatiotemporal
  sql: |
    WITH minute_activity AS (
         SELECT
             date_trunc('minute', timestamp) AS minute,
             COUNT(*) AS updates,
             COUNT(*) FILTER (WHERE venue_id <> 0) AS venue_updates
         FROM geolife_points
         WHERE timestamp BETWEEN :period_short
           AND ST_Intersects(
                 geom,
                 ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.46621738191544, 39.83559028510321, 116.36262147437327, 39.89257357870096), 4326), 3857)
         )GROUP BY 1
     )
     SELECT
         a.minute,
         SUM(b.venue_updates) AS updates_in_window
     FROM minute_activity a
     JOIN minute_activity b
         ON b.minute BETWEEN a.minute - interval '10 minutes'
                         AND a.minute + interval '10 minutes'
     GROUP BY a.minute
     ORDER BY a.minute;
  params:
  - - '2019-07-07 10:20:17'
    - '2019-07-14 18:53:17'
  - ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.46621738191544, 39.83559028510321,
    116.36262147437327, 39.89257357870096), 4326), 3857)

- name: SlidingWindowActivityInRegionPerMinuteWithNonZeroID
  type: spatiotemporal
  sql: |
    WITH minute_activity AS (
         SELECT
             date_trunc('minute', timestamp) AS minute,
             COUNT(*) AS updates,
             COUNT(*) FILTER (WHERE venue_id <> 0) AS venue_updates
         FROM geolife_points
         WHERE timestamp BETWEEN :period_short
           AND ST_Intersects(
                 geom,
                 ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.4504260522814, 39.9053743963125, 116.34683014473923, 39.962357689910256), 4326), 3857)
         )GROUP BY 1
     )
     SELECT
         a.minute,
         SUM(b.venue_updates) AS updates_in_window
     FROM minute_activity a
     JOIN minute_activity b
         ON b.minute BETWEEN a.minute - interval '10 minutes'
                         AND a.minute + interval '10 minutes'
     GROUP BY a.minute
     ORDER BY a.minute;
  params:
  - - '2019-07-13 20:41:11'
    - '2019-07-20 17:05:18'
  - ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.4504260522814, 39.9053743963125, 116.34683014473923,
    39.962357689910256), 4326), 3857)

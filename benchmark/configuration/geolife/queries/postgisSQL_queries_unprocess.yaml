- name: UniqueUsersPerHourInRegionInPeriod
  type: spatiotemporal
  sql: |
    SELECT date_trunc('hour', timestamp) AS hour,
       COUNT(DISTINCT id) AS users
    FROM geolife_points
    WHERE ST_Intersects(geom, :region)
      AND timestamp BETWEEN :period
    GROUP BY hour
    ORDER BY hour;
  params:
  - ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.61353763736905, 39.89733154839962,
    116.50994172982688, 39.95431484199737), 4326), 3857)

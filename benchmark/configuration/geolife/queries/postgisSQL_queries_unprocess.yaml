- name: SlidingWindowActivityInRegionPerMinuteWithNonZeroID
  type: spatiotemporal
  sql: |
    WITH minute_activity AS (
         SELECT
             date_trunc('minute', timestamp) AS minute,
             COUNT(*) AS updates,
             COUNT(*) FILTER (WHERE venue_id <> 0) AS venue_updates
         FROM geolife_points
         WHERE timestamp BETWEEN :period_short
           AND ST_Intersects(
                 geom,
                 ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.40629677285244, 39.81883363622662, 116.30270086531027, 39.875816929824374), 4326), 3857)
         )GROUP BY 1
     )
     SELECT
         a.minute,
         SUM(b.venue_updates) AS updates_in_window
     FROM minute_activity a
     JOIN minute_activity b
         ON b.minute BETWEEN a.minute - interval '10 minutes'
                         AND a.minute + interval '10 minutes'
     GROUP BY a.minute
     ORDER BY a.minute;
  params:
  - - '2019-07-01 11:09:19'
    - '2019-07-11 18:43:01'
  - ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.40629677285244, 39.81883363622662,
    116.30270086531027, 39.875816929824374), 4326), 3857)

- name: SlidingWindowActivityInRegionPerMinuteWithNonZeroID
  type: spatiotemporal
  sql: |
    WITH minute_activity AS (
         SELECT
             date_trunc('minute', timestamp) AS minute,
             COUNT(*) AS updates,
             COUNT(*) FILTER (WHERE venue_id <> 0) AS venue_updates
         FROM geolife_points
         WHERE timestamp BETWEEN :period_short
           AND ST_Intersects(
                 geom,
                 ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.30099841234474, 39.8483832158476, 116.19740250480257, 39.90536650944535), 4326), 3857)
         )GROUP BY 1
     )
     SELECT
         a.minute,
         SUM(b.venue_updates) AS updates_in_window
     FROM minute_activity a
     JOIN minute_activity b
         ON b.minute BETWEEN a.minute - interval '10 minutes'
                         AND a.minute + interval '10 minutes'
     GROUP BY a.minute
     ORDER BY a.minute;
  params:
  - - '2019-07-27 20:36:46'
    - '2019-07-31 23:59:59'
  - ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.30099841234474, 39.8483832158476,
    116.19740250480257, 39.90536650944535), 4326), 3857)

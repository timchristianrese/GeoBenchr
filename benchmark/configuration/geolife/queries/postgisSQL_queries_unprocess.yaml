       MIN(timestamp) AS first_seen,
       MAX(timestamp) AS last_seen
    FROM geolife_points
    WHERE timestamp BETWEEN ['2019-07-16 00:36:56', '2019-07-21 18:14:14']
    GROUP BY id;

- name: AverageDailyActivityPerUserInPeriod
  type: temporal
  sql: "SELECT \nid,\nCOUNT(*)::float / COUNT(DISTINCT DATE(timestamp)) AS avg_points_per_day\n\
    FROM geolife_points\nWHERE timestamp BETWEEN :period_medium\nGROUP BY id;\n"
  params:
  - - '2019-07-04 12:52:18'
    - '2019-07-27 16:54:28'
- name: SlidingWindowActivityInRegionPerMinuteWithNonZeroID
  type: spatiotemporal
  sql: |
    WITH minute_activity AS (
         SELECT
             date_trunc('minute', timestamp) AS minute,
             COUNT(*) AS updates,
             COUNT(*) FILTER (WHERE venue_id <> 0) AS venue_updates
         FROM geolife_points
         WHERE timestamp BETWEEN :period_short
           AND ST_Intersects(
                 geom,
                 ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.28060198915479, 39.79565990243075, 116.17700608161262, 39.8526431960285), 4326), 3857)
         )GROUP BY 1
     )
     SELECT
         a.minute,
         SUM(b.venue_updates) AS updates_in_window
     FROM minute_activity a
     JOIN minute_activity b
         ON b.minute BETWEEN a.minute - interval '10 minutes'
                         AND a.minute + interval '10 minutes'
     GROUP BY a.minute
     ORDER BY a.minute;
  params:
  - - '2019-07-01 00:00:00'
    - '2019-07-04 08:39:44'
  - ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.28060198915479, 39.79565990243075,
    116.17700608161262, 39.8526431960285), 4326), 3857)

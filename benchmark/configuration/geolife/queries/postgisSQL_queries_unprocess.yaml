- name: SlidingWindowActivityInRegionPerMinuteWithNonZeroID
  type: spatiotemporal
  sql: |
    WITH minute_activity AS (
         SELECT
             date_trunc('minute', timestamp) AS minute,
             COUNT(*) AS updates,
             COUNT(*) FILTER (WHERE venue_id <> 0) AS venue_updates
         FROM geolife_points
         WHERE timestamp BETWEEN :period_short
           AND ST_Intersects(
                 geom,
                 ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.36816626802978, 39.80499883475341, 116.26457036048761, 39.861982128351165), 4326), 3857)
         )GROUP BY 1
     )
     SELECT
         a.minute,
         SUM(b.venue_updates) AS updates_in_window
     FROM minute_activity a
     JOIN minute_activity b
         ON b.minute BETWEEN a.minute - interval '10 minutes'
                         AND a.minute + interval '10 minutes'
     GROUP BY a.minute
     ORDER BY a.minute;
  params:
  - - '2019-07-01 00:00:00'
    - '2019-07-06 23:17:37'
  - ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.36816626802978, 39.80499883475341,
    116.26457036048761, 39.861982128351165), 4326), 3857)

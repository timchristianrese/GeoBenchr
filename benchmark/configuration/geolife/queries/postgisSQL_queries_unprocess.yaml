- name: UniqueUsersPerHourInRegionInPeriod
  type: spatiotemporal
  sql: |
    SELECT date_trunc('hour', timestamp) AS hour,
       COUNT(DISTINCT id) AS users
    FROM geolife_points
    WHERE ST_Intersects(geom, :region)
      AND timestamp BETWEEN :period
    GROUP BY hour
    ORDER BY hour;
  params:
  - ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.60076158272021, 39.78366917053864,
    116.49716567517804, 39.84065246413639), 4326), 3857)

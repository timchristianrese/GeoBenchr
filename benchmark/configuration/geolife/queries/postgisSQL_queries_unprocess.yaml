- name: ClosestRestaurantToPoint
  type: spatial
  sql: "SELECT *\nFROM geolife_points\nWHERE venue_type = 'restaurant' AND ST_DWithin(geom,\
    \ ST_SetSRID(ST_Point(39.80709380879235, 116.54992625026283), 3857), 5000) \n\
    ORDER BY ST_Distance(geom, ST_SetSRID(ST_Point(39.80709380879235, 116.54992625026283),\
    \ 3857))\nLIMIT 1;\n"
  params:
  - ST_SetSRID(ST_Point(39.80709380879235, 116.54992625026283), 3857)
- name: CountPOIsByTypeInRegion
  type: spatial
  sql: |
    SELECT venue_type, COUNT(*) AS poi_count
    FROM geolife_points
    WHERE ST_Intersects(geom, ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.4995555072364, 39.804987558270064, 116.39595959969422, 39.86197085186782), 4326), 3857))
    GROUP BY venue_type;
  params:
  - ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.4995555072364, 39.804987558270064,
    116.39595959969422, 39.86197085186782), 4326), 3857)
- name: AverageDailyActivityPerUserInPeriod
  type: temporal
  sql: "SELECT \nid,\nCOUNT(*)::float / COUNT(DISTINCT DATE(timestamp)) AS avg_points_per_day\n\
    FROM geolife_points\nWHERE timestamp BETWEEN :period_medium\nGROUP BY id;\n"
  params:
  - - '2019-07-09 19:27:51'
    - '2019-07-26 19:31:17'
- name: FirstAndLastActivityInPeriod
  type: temporal
  sql: |
    SELECT id,
       MIN(timestamp) AS first_seen,
       MAX(timestamp) AS last_seen
    FROM geolife_points
    WHERE timestamp BETWEEN ['2019-07-24 16:11:47', '2019-07-31 23:59:59']
    GROUP BY id;
  params:
  - - '2019-07-24 16:11:47'
    - '2019-07-31 23:59:59'

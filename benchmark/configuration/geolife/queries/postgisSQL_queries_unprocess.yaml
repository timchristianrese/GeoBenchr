  sql: |
    SELECT date_trunc('hour', timestamp) AS hour,
       COUNT(DISTINCT id) AS users
    FROM geolife_points
    WHERE ST_Intersects(geom, :region)
      AND timestamp BETWEEN :period
    GROUP BY hour
    ORDER BY hour;

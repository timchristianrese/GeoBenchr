- name: FirstAndLastActivityInPeriod
  type: temporal
  sql: |
    SELECT id,
       MIN(timestamp) AS first_seen,
       MAX(timestamp) AS last_seen
    FROM geolife_points
    WHERE timestamp BETWEEN ['2019-07-10 19:20:52', '2019-07-18 13:00:49']
    GROUP BY id;
  params:
  - - '2019-07-10 19:20:52'
    - '2019-07-18 13:00:49'
- name: UniqueUsersPerHourInRegionInPeriod
  type: spatiotemporal
  sql: |
    SELECT date_trunc('hour', timestamp) AS hour,
       COUNT(DISTINCT id) AS users
    FROM geolife_points
    WHERE ST_Intersects(geom, :region)
      AND timestamp BETWEEN :period
    GROUP BY hour
    ORDER BY hour;

  type: spatiotemporal
  sql: |
    LET minute_activity =
      SELECT TS_TRUNC('minute', t) AS minute,
             COUNT(IF(venue_id <> 0, 1, NULL)) AS venue_updates
      FROM geolife_points
      WHERE t <@ EPOCHRANGE '[2019-07-07 06:12:40, 2019-07-08 11:09:24]'

- name: SlidingWindowActivityInRegionPerMinuteWithNonZeroID
  type: spatiotemporal
  sql: |
    LET minute_activity =
      SELECT TS_TRUNC('minute', t) AS minute,
             COUNT(IF(venue_id <> 0, 1, NULL)) AS venue_updates
      FROM geolife_points
      WHERE t <@ EPOCHRANGE '[2019-07-06 14:18:04, 2019-07-07 21:04:16]'
        AND ST_Intersects(ST_Point(x, y), ST_ToGeom('POLYGON ((116.27924216793365 39.92712709175909, 116.38283807547582 39.92712709175909, 116.38283807547582 39.98411038535684, 116.27924216793365 39.98411038535684, 116.27924216793365 39.92712709175909))'::gpolygon))
      GROUP BY 1;
    SELECT a.minute, SUM(b.venue_updates) AS updates_in_window
    FROM minute_activity a
    JOIN minute_activity b ON b.minute BETWEEN a.minute - TP '10min' AND a.minute + TP '10min'
    GROUP BY a.minute
    ORDER BY a.minute;
  params:
  - '''2019-07-06 14:18:04'' AND ''2019-07-07 21:04:16'''
  - ST_Transform(ST_SetSRID(ST_MakeEnvelope(116.27924216793365, 39.92712709175909,
    116.38283807547582, 39.98411038535684), 4326), 3857)

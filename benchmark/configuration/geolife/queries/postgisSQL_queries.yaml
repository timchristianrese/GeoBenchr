    WITH minute_activity AS (
     SELECT
         date_trunc('minute', timestamp) AS minute,
         COUNT(*) FILTER (WHERE venue_id <> 0) AS venue_updates
     FROM geolife_points
     WHERE timestamp BETWEEN '2019-07-29 04:04:41' AND '2019-07-30 20:32:21'
       AND ST_Intersects(geom, ST_Transform(ST_SetSRID(ST_MakeEnvelope(39.880758545829174, 116.28420355744429, 39.82377525223142, 116.38779946498646), 4326), 3857))
     GROUP BY date_trunc('minute', timestamp)
     ),
     minute_windows AS (
         SELECT
             minute,
             minute - INTERVAL '10 minutes' AS window_start,
             minute + INTERVAL '10 minutes' AS window_end
         FROM minute_activity
     )
     SELECT
         w.minute,
         SUM(m.venue_updates) AS updates_in_window
     FROM minute_windows w
     JOIN minute_activity m
         ON m.minute BETWEEN w.window_start AND w.window_end
     GROUP BY w.minute
     ORDER BY w.minute;
  params:
  - '''2019-07-29 04:04:41'' AND ''2019-07-30 20:32:21'''
  - ST_Transform(ST_SetSRID(ST_MakeEnvelope(39.880758545829174, 116.28420355744429,

- name: bulkInsertridePoints
  use: true
  description: "Insert multiple points in one statement"
  type: bulk_insert
  # (2026-10-24) MobilityDB writes go to its trajectory table (scratch trajectories with negative ids), which its reads use;
  # the table is distributed by tile_key (a spatial tile of real trips): its shards hold the ranges 1-16: scratch trajectories get 1 + abs(id) % 16, spread over them
  mobilitydb: |
    INSERT INTO rides (id, tile_key, trip)
    SELECT v.id, (1 + abs(v.id) % 16)::int, tgeompoint(v.geom, v.ts AT TIME ZONE 'Europe/Berlin')
    FROM (VALUES :bulk_values) AS v(id, rider_id, geom, ts);
  postgis: |
    -- FIX: didn't write "rider_id" -- see insertSingleridePoint's FIX note.
    INSERT INTO ride_points (id, rider_id, geom, timestamp)
    VALUES :bulk_values;
  sedona: |
  spacetime: |
  # FIX: same "no geom column" problem as insertSingleridePoint above -- :bulk_values_clickhouse
  # is a ClickHouse-specific rebuild of the shared :bulk_values tuples (see
  # generateParameterVariations.py) as (id, rider_id, timestamp, lat, lon), matching the real

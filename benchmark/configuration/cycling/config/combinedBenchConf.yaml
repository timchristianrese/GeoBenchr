benchmark:
  sut:
    mobilitydb: true
    postgis: true
    sedona: true
    spacetime: true
    clickhouse: true
  mixed: false
  nodes:
  - ''
  threads: 16
  test: false
  random_seed: 1500

# DuckDB dialect notes (added when a "duckdb:" query block was introduced below -- see the fuller
# version of this note in crossings_benchmark.yaml for the full research write-up; summarized here):
#   - "Distributed DuckDB" means DuckLake (Postgres-backed catalog + Parquet on shared object
#     storage) attached by multiple independent DuckDB engines. ATTACH is a one-time setup step,
#     not part of each query -- duckdb: blocks below are plain DuckDB SQL. This is shared storage
#     queried by independent single-node engines, not shared-nothing parallel query execution
#     (no cross-node shuffle/parallel join, unlike Sedona/Spark).
#   - GEOMETRY is a core DuckDB type (since 1.5.0); the "spatial" extension supplies
#     ST_Distance/ST_DWithin/ST_Buffer/ST_Intersects/ST_Contains etc. generically over geometry
#     type, including point-to-polygon distance -- no CrateDB-style gap here.
#   - EXTRACT/date_trunc/INTERVAL/CTEs/GROUP BY-HAVING/COUNT(DISTINCT ...)/BOOL_AND()/BOOL_OR()/
#     standard DML all supported with Postgres-compatible syntax.
#   - The SQL:1999 OVERLAPS predicate has no confirmed DuckDB documentation -- queries elsewhere
#     using OVERLAPS are rewritten below as explicit start/end comparisons instead of assuming it
#     works, flagged inline.
#   - Write consistency for the DuckLake configuration above is snapshot-isolated with a
#     documented (but still-maturing) retry-on-conflict mechanism for concurrent writers --
#     different from a single Postgres instance's immediate read-after-write.

queryConfigs:

#USE
- name: RidesDuringRushHourInPeriod #temporal
  use: true
  description: "Find rides that occur during rush hours (7-10 AM and 4-7 PM) within a specified time period."
  type: temporal
  mobilitydb: |
    -- BEST-EFFORT FILL: was blank. Mirrors CrossingsActiveAtGivenHourOfDay's proven
    -- unnest(timestamps(atTime(...))) pattern from the crossings benchmark file, applied
    -- to the "rides" trajectory table (rides.trip is used elsewhere in this file, e.g.
    -- CountRidesFullyInDistrictRadius / countRideInDistrict). Not verified live.
    WITH ts_table AS (
      SELECT r.id, unnest(timestamps(atTime(r.trip, :period_short))) AS ts
      FROM rides r
      WHERE r.trip && :period_short
    )
    SELECT COUNT(DISTINCT id) AS ride_count
    FROM ts_table
    WHERE EXTRACT(HOUR FROM ts) BETWEEN 7 AND 9 OR EXTRACT(HOUR FROM ts) BETWEEN 16 AND 18;
  postgis: |
    SELECT COUNT(DISTINCT r.id) AS ride_count
    FROM ride_points r
    WHERE r.timestamp BETWEEN :period_short
      AND (EXTRACT(HOUR FROM r.timestamp) BETWEEN 7 AND 9 OR EXTRACT(HOUR FROM r.timestamp) BETWEEN 16 AND 18);
  sample_postgis: |
    SELECT COUNT(DISTINCT r.id) AS ride_count
    FROM ride_points r
    WHERE r.timestamp BETWEEN '2026-06-01 08:00:00' AND '2026-06-01 10:00:00'
    AND (EXTRACT(HOUR FROM r.timestamp) BETWEEN 7 AND 9 OR EXTRACT(HOUR FROM r.timestamp) BETWEEN 16 AND 18);
  sedona: |
    SELECT COUNT(DISTINCT r.id) AS ride_count
    FROM ride_points r
    WHERE r.timestamp BETWEEN :period_short
      AND (EXTRACT(HOUR FROM r.timestamp) BETWEEN 7 AND 9 OR EXTRACT(HOUR FROM r.timestamp) BETWEEN 16 AND 18);
  spacetime: |
    SELECT COUNT(DISTINCT trip_id) AS ride_count
    FROM ride_points
    WHERE EPOCHRANGE :period_short @> t
      AND (HOUR(t) BETWEEN 7 AND 9 OR HOUR(t) BETWEEN 16 AND 18)
  clickhouse: |
    SELECT COUNT(DISTINCT r.id) AS ride_count
    FROM ride_points r
    WHERE r.timestamp BETWEEN :period_short
      AND (toHour(r.timestamp) BETWEEN 7 AND 9 OR toHour(r.timestamp) BETWEEN 16 AND 18);
  duckdb: |
    SELECT COUNT(DISTINCT r.id) AS ride_count
    FROM ride_points r
    WHERE r.timestamp BETWEEN :period_short
      AND (EXTRACT(HOUR FROM r.timestamp) BETWEEN 7 AND 9 OR EXTRACT(HOUR FROM r.timestamp) BETWEEN 16 AND 18);

  repetition: 50
  parameters:
    - period_short

- name: RidesAcrossMultipleHours #temporal
  use: true
  description: "Find rides that span across multiple hours within a specified time period, i.e have ride points in more than one hour of the day."
  type: temporal
  mobilitydb: |
    -- BEST-EFFORT FILL: was blank. Same unnest(timestamps(atTime(...))) pattern as
    -- RidesDuringRushHourInPeriod above, grouped by ride id. Not verified live.
    WITH ts_table AS (
      SELECT r.id, unnest(timestamps(atTime(r.trip, :period_short))) AS ts
      FROM rides r
      WHERE r.trip && :period_short
    )
    SELECT id
    FROM ts_table
    GROUP BY id
    HAVING COUNT(DISTINCT EXTRACT(HOUR FROM ts)) > 1;
  postgis: |
    SELECT r.id
    FROM ride_points r
    WHERE r.timestamp BETWEEN :period_short
    GROUP BY r.id
    HAVING COUNT(DISTINCT EXTRACT(HOUR FROM r.timestamp)) > 1;
  sample_postgis: |
    SELECT r.id
    FROM ride_points r
    WHERE r.timestamp BETWEEN '2026-06-01 08:00:00' AND '2026-06-01 10:00:00'
    GROUP BY r.id
    HAVING COUNT(DISTINCT EXTRACT(HOUR FROM r.timestamp)) > 1;
  sedona: |
    SELECT r.id
    FROM ride_points r
    WHERE r.timestamp BETWEEN :period_short
    GROUP BY r.id
    HAVING COUNT(DISTINCT EXTRACT(HOUR FROM r.timestamp)) > 1;
  spacetime: |
    SELECT trip_id AS id FROM (
      SELECT r.trip_id, HOUR(r.t) h
      FROM ride_points r
      WHERE EPOCHRANGE :period_short @> r.t
      GROUP BY r.trip_id, h
    )
    GROUP BY trip_id
    HAVING COUNT(h) > 1
  clickhouse: |
    SELECT r.id
    FROM ride_points r
    WHERE r.timestamp BETWEEN :period_short
    GROUP BY r.id
    HAVING COUNT(DISTINCT toHour(r.timestamp)) > 1;
  duckdb: |
    SELECT r.id
    FROM ride_points r
    WHERE r.timestamp BETWEEN :period_short
    GROUP BY r.id
    HAVING COUNT(DISTINCT EXTRACT(HOUR FROM r.timestamp)) > 1;
  repetition: 50
  parameters:
    - period_short

- name: CountRidesFullyInDistrictRadius #spatial
  use: true
  description: "Find rides that are fully contained within a specified distance of the district's geometry."
  type: spatial
  # (2026-10-13) Every dialect first narrows the rides to those whose first and last point
  # (rides_summary.start_location / end_location) lie within :radius of the district -- a ride that
  # stays within :radius has both -- and then checks every point of only those rides. The SpaceTime
  # developers proposed this for SpaceTime (it needs less memory); it is applied to every system so
  # all of them get the same plan. ClickHouse runs the query too now: countIf(NOT cond) = 0 is its
  # per-group "all" aggregate (the earlier note here, that ClickHouse could not express it, was wrong).
  # MobilityDB keeps its trajectory form: one row per ride, adwithin() = "always within distance"
  # (rides.trip uses discrete interpolation, so this is BOOL_AND(ST_DWithin) over every point).
  mobilitydb: |
    -- (2026-10-14) the same first/last-point prefilter as every other dialect; IN (...) so Citus plans the
    -- candidate subquery first (rides is distributed by spatial tile, rides_summary by id)
    SELECT r.id
    FROM rides r
    JOIN berlin_districts d ON d.name = :district
    WHERE r.id IN (
      SELECT s.id
      FROM rides_summary s
      JOIN berlin_districts d2 ON d2.name = :district
      WHERE ST_DWithin(s.start_location, d2.geom, :radius)
        AND ST_DWithin(s.end_location, d2.geom, :radius)
    )
    GROUP BY r.id
    HAVING BOOL_AND(adwithin(r.trip, d.geom, :radius));
  postgis: |
    -- (2026-10-14) NOT MATERIALIZED: a CTE used twice is otherwise materialized as a Citus intermediate result
    -- estimated at 1,000 rows (it is one), which made the planner sort every shard on disk for a merge join
    WITH d AS NOT MATERIALIZED (
      SELECT geom
      FROM berlin_districts
      WHERE name = :district
    ),
    candidates AS NOT MATERIALIZED (
      SELECT s.id
      FROM rides_summary s, d
      WHERE ST_DWithin(s.start_location, d.geom, :radius)
        AND ST_DWithin(s.end_location, d.geom, :radius)
    )
    SELECT r.id
    FROM ride_points r
    JOIN candidates c ON r.id = c.id
    CROSS JOIN d
    GROUP BY r.id
    HAVING BOOL_AND(ST_DWithin(r.geom, d.geom, :radius));
  sedona: |
    WITH d AS (
      SELECT geom
      FROM berlin_districts
      WHERE name = :district
    ),
    candidates AS (
      SELECT s.id
      FROM rides_summary s, d
      WHERE ST_DWithin(s.start_location, d.geom, :radius)
        AND ST_DWithin(s.end_location, d.geom, :radius)
    )
    SELECT r.id
    FROM ride_points r
    JOIN candidates c ON r.id = c.id
    CROSS JOIN d
    GROUP BY r.id
    HAVING BOOL_AND(ST_DWithin(r.geom, d.geom, :radius));
  spacetime: |
    -- (2026-10-13) the SpaceTime developers' version (needs less memory); radius in EPSG:3857 units
    -- like every other dialect, converted to SpaceTime's local meters by :st_scale = cos(lat) * 0.99842
    -- (see scripts/spacetime_units.py)
    WITH d AS (
      SELECT geom
      FROM berlin_districts
      WHERE name = :district
    ),
    candidates AS (
      SELECT r.trip_id
      FROM rides r, d
      WHERE ST_DWithin(ST_Point(r.x0, r.y0), ST_ToGeom(d.geom::gpolygon), :radius * :st_scale)
        AND ST_DWithin(ST_Point(r.x1, r.y1), ST_ToGeom(d.geom::gpolygon), :radius * :st_scale)
    )
    SELECT r.trip_id AS id
    FROM ride_points r
    JOIN candidates c ON r.trip_id = c.trip_id
    CROSS JOIN d
    GROUP BY r.trip_id
    HAVING BOOL_AND(ST_DWithin(ST_Point(r.x, r.y), ST_ToGeom(d.geom::gpolygon), :radius * :st_scale));
  clickhouse: |
    -- (2026-10-13) countIf(NOT cond) = 0 is the per-group "all" aggregate (BOOL_AND elsewhere).
    -- Distances in EPSG:3857 like every other dialect: r.x/r.y are Web Mercator, the district's
    -- vertices (lon/lat) and the summary's start/end lon/lat are projected the same way. The H3 cells
    -- covering the district plus :radius decide nothing on their own: a point outside them is farther
    -- than :radius, so it fails the condition exactly as the distance test would.
    WITH candidates AS (
      SELECT s.id
      FROM rides_summary s
      GLOBAL JOIN berlin_districts d ON d.name = :district
      WHERE polygonsDistanceCartesian(array(array(tuple(6378137. * radians(s.start_lon), 6378137. * log(tan(pi() / 4 + radians(s.start_lat) / 2))))), arrayMap(ring -> arrayMap(pt -> tuple(6378137. * radians(pt.1), 6378137. * log(tan(pi() / 4 + radians(pt.2) / 2))), ring), d.geom.Polygon)) <= :radius
        AND polygonsDistanceCartesian(array(array(tuple(6378137. * radians(s.end_lon), 6378137. * log(tan(pi() / 4 + radians(s.end_lat) / 2))))), arrayMap(ring -> arrayMap(pt -> tuple(6378137. * radians(pt.1), 6378137. * log(tan(pi() / 4 + radians(pt.2) / 2))), ring), d.geom.Polygon)) <= :radius
    )
    SELECT r.id
    FROM ride_points r
    GLOBAL JOIN berlin_districts d ON d.name = :district
    WHERE r.id GLOBAL IN (SELECT id FROM candidates)
    GROUP BY r.id
    HAVING countIf(
      r.h3 GLOBAL NOT IN (SELECT arrayJoin(h3CoverRing(arrayElement(geom.Polygon, 1), :radius)) FROM berlin_districts WHERE name = :district)
      OR polygonsDistanceCartesian(array(array(tuple(r.x, r.y))), arrayMap(ring -> arrayMap(pt -> tuple(6378137. * radians(pt.1), 6378137. * log(tan(pi() / 4 + radians(pt.2) / 2))), ring), d.geom.Polygon)) > :radius
    ) = 0;
  duckdb: |
    WITH d AS (
      SELECT geom
      FROM berlin_districts
      WHERE name = :district
    ),
    candidates AS (
      SELECT s.id
      FROM rides_summary s, d
      WHERE ST_DWithin(s.start_location, d.geom, :radius)
        AND ST_DWithin(s.end_location, d.geom, :radius)
    )
    SELECT r.id
    FROM ride_points r
    JOIN candidates c ON r.id = c.id
    CROSS JOIN d
    GROUP BY r.id
    HAVING BOOL_AND(ST_DWithin(r.geom, d.geom, :radius));
  repetition: 50
  parameters:
  - district
  - radius

- name: countRideInDistrict #spatial
  use: true
  description: "Counts the number of rides within a specified district."
  type: spatial
  mobilitydb: |
    SELECT d.name, COUNT(DISTINCT r.id) AS ride_count FROM berlin_districts d JOIN rides r ON eintersects(r.trip, d.geom) WHERE d.name = :district GROUP BY d.name;
  postgis: |
    SELECT d.name, COUNT(DISTINCT r.id) AS ride_count FROM berlin_districts d JOIN ride_points r ON ST_Intersects(r.geom, d.geom) WHERE d.name = :district GROUP BY d.name;
  sample_postgis: |
    SELECT d.name, COUNT(DISTINCT r.id) AS ride_count FROM berlin_districts d JOIN ride_points r ON ST_Intersects(r.geom, d.geom) WHERE d.name = 'Reinickendorf' GROUP BY d.name;
  sedona: |
    SELECT d.name, COUNT(DISTINCT r.id) AS ride_count FROM berlin_districts d JOIN ride_points r ON ST_Intersects(r.geom, d.geom) WHERE d.name = :district GROUP BY d.name;
  spacetime: |
    SELECT :district AS name, COUNT(DISTINCT p.trip_id) AS ride_count
    FROM berlin_districts d
    JOIN ride_points p ON ST_Intersects(ST_ToGeom(d.geom::gpolygon), ST_Point(p.x, p.y))
    WHERE d.name = :district;
  clickhouse: |
    -- (2026-10-07) H3: the h3 GLOBAL IN (...) condition lets ClickHouse use the table's H3 primary
    -- key (h3, timestamp, id) and read only the cells that can contain a match -- a superset built
    -- by the h3Cover* functions (scripts/clickhouse_functions.sql). The exact predicate below is
    -- unchanged and decides the result. The scan-only version is kept as clickhouse_scan (not run).
    -- FIX: ride_points and berlin_districts are both ClickHouse Distributed tables -- a plain
    -- JOIN between two Distributed tables is rejected outright (Code 288
    -- DISTRIBUTED_IN_JOIN_SUBQUERY_DENIED). Rewritten as GLOBAL JOIN with the *small* table
    -- (berlin_districts, 12 rows) on the broadcast side, not the 1.17B-row fact table --
    -- broadcasting ride_points instead hits Code 241 MEMORY_LIMIT_EXCEEDED (confirmed live both
    -- ways). Verified working: 3.25s, correct row count.
    SELECT d.name, COUNT(DISTINCT r.id) AS ride_count
    FROM ride_points r
    GLOBAL JOIN berlin_districts d ON pointInPolygon((r.lon, r.lat), d.geom)
    WHERE d.name = :district
      AND r.h3 GLOBAL IN (SELECT arrayJoin(h3CoverRing(arrayElement(geom.Polygon, 1), 0)) FROM berlin_districts WHERE name = :district)
    GROUP BY d.name;
  clickhouse_scan: |
    -- FIX: ride_points and berlin_districts are both ClickHouse Distributed tables -- a plain
    -- JOIN between two Distributed tables is rejected outright (Code 288
    -- DISTRIBUTED_IN_JOIN_SUBQUERY_DENIED). Rewritten as GLOBAL JOIN with the *small* table
    -- (berlin_districts, 12 rows) on the broadcast side, not the 1.17B-row fact table --
    -- broadcasting ride_points instead hits Code 241 MEMORY_LIMIT_EXCEEDED (confirmed live both
    -- ways). Verified working: 3.25s, correct row count.
    SELECT d.name, COUNT(DISTINCT r.id) AS ride_count
    FROM ride_points r
    GLOBAL JOIN berlin_districts d ON pointInPolygon((r.lon, r.lat), d.geom)
    WHERE d.name = :district
    GROUP BY d.name;
  duckdb: |
    -- (2026-10-08) ST_Intersects_Extent(geom, <area's bounding box>) in front of the exact predicate: the point
    -- tables are stored in Hilbert order with a bounding box per row group, and this cheap box test lets
    -- DuckDB skip the row groups outside the area. The exact predicate is unchanged and decides the result.
    -- The previous version is kept as duckdb_scan (not run).
    SELECT d.name, COUNT(DISTINCT r.id) AS ride_count FROM berlin_districts d JOIN ride_points r ON ST_Intersects(r.geom, d.geom) WHERE d.name = :district AND ST_Intersects_Extent(r.geom, (SELECT ST_MakeEnvelope(ST_XMin(geom) - 0, ST_YMin(geom) - 0, ST_XMax(geom) + 0, ST_YMax(geom) + 0) FROM berlin_districts WHERE name = :district)) GROUP BY d.name;
  duckdb_scan: |
    SELECT d.name, COUNT(DISTINCT r.id) AS ride_count FROM berlin_districts d JOIN ride_points r ON ST_Intersects(r.geom, d.geom) WHERE d.name = :district GROUP BY d.name;
  repetition: 50
  parameters:
  - district


- name: AverageUpdatesPerRideInDistrictInPeriod #spatiotemporal
  use: true
  description: "Calculates the average number of updates (ride points) within a specified district and time period. Only the points within the district are counted, and only the rides that have at least one point in the district during the specified time period are considered."
  type: spatiotemporal
  mobilitydb: |
    -- FIX (2026-09-30): implemented using MobilityDB's documented restriction/accessor
    -- functions (docs.mobilitydb.com, ch05s06 "Restriction Functions" + apas03 "Functions and
    -- Operators for Temporal Types") -- atTime() restricts the trajectory to the period,
    -- instants() gets the set of tgeompoint instant sub-values within that restriction (each
    -- carrying both its point value and its timestamp, unlike timestamps() which only gets the
    -- timestamps), unnest() expands that set into rows, getValue() extracts each instant's
    -- point geometry so it can be spatially joined against the district polygon. Verified live
    -- against real data (avg_updates ~13.75, matching the postgis block's own live result for
    -- the same district/period to within normal random-parameter variance).
    WITH ts_table AS (
      SELECT r.id, unnest(instants(atTime(r.trip, :period_short))) AS inst
      FROM rides r
      WHERE r.trip && :period_short
    ),
    filtered AS (
      SELECT ts_table.id
      FROM ts_table
      JOIN berlin_districts d ON d.name = :district
      WHERE ST_Intersects(getValue(inst)::geometry, d.geom)
    )
    SELECT :district AS name, AVG(num_updates) AS avg_updates
    FROM (
      SELECT id, COUNT(*) AS num_updates
      FROM filtered
      GROUP BY id
    ) AS ri;
  postgis: |
    SELECT :district AS name, AVG(num_updates) AS avg_updates
    FROM (
      SELECT r.id, COUNT(*) AS num_updates
      FROM ride_points r
      JOIN berlin_districts d ON ST_Intersects(r.geom, d.geom)
      WHERE d.name = :district
        AND r.timestamp BETWEEN :period_short
      GROUP BY r.id
    ) AS ri;
  sample_postgis: |
    SELECT 'Reinickendorf', AVG(num_updates) AS avg_updates
    FROM (
      SELECT r.id, COUNT(*) AS num_updates
      FROM ride_points r
      JOIN berlin_districts d ON ST_Intersects(r.geom, d.geom)
      WHERE r.timestamp BETWEEN '2026-06-01 08:00:00' AND '2026-06-01 10:00:00'
        AND
       d.name = 'Reinickendorf'
      GROUP BY r.id
    ) AS ri;
  sedona: |
    -- FIX (2026-09-30): this is plain standard SQL (subquery, JOIN on ST_Intersects, GROUP BY,
    -- AVG) with no PostGIS-specific extension syntax -- Sedona/Spark SQL supports every piece
    -- of it directly (confirmed: other sedona: blocks in this file already use ST_Intersects/
    -- ST_DWithin as JOIN conditions the same way, e.g. CountRidesFullyInDistrictRadius above).
    -- Reused the postgis block verbatim rather than leaving it blank -- verified live via
    -- spark-sql against real HDFS data (avg_updates ~13.76, matching postgis's own live result
    -- to within normal random-parameter variance).
    SELECT :district AS name, AVG(num_updates) AS avg_updates
    FROM (
      SELECT r.id, COUNT(*) AS num_updates
      FROM ride_points r
      JOIN berlin_districts d ON ST_Intersects(r.geom, d.geom)
      WHERE d.name = :district
        AND r.timestamp BETWEEN :period_short
      GROUP BY r.id
    ) AS ri;
  spacetime: |
    WITH d AS (
      SELECT geom
      FROM berlin_districts
      WHERE name = :district
    )
    SELECT :district AS name, AVG(num_updates) AS avg_updates
    FROM (
      SELECT COUNT(*) AS num_updates
      FROM ride_points r, d
      WHERE EPOCHRANGE :period_short @> r.t
        AND ST_Intersects(ST_Point(r.x, r.y), ST_ToGeom(d.geom::gpolygon))
      GROUP BY r.trip_id
    )
  clickhouse: |
    -- (2026-10-07) H3: the h3 GLOBAL IN (...) condition lets ClickHouse use the table's H3 primary
    -- key (h3, timestamp, id) and read only the cells that can contain a match -- a superset built
    -- by the h3Cover* functions (scripts/clickhouse_functions.sql). The exact predicate below is
    -- unchanged and decides the result. The scan-only version is kept as clickhouse_scan (not run).
    -- FIX: same Distributed-JOIN issue as countRideInDistrict above -- added GLOBAL (ride_points
    -- is already the FROM/left table here, so no swap needed, unlike countRideInDistrict).
    SELECT :district AS name, AVG(num_updates) AS avg_updates
    FROM (
        SELECT r.id, COUNT(*) AS num_updates
        FROM ride_points r
        GLOBAL JOIN berlin_districts d ON pointInPolygon((r.lon, r.lat), d.geom)
        WHERE d.name = :district
          AND r.h3 GLOBAL IN (SELECT arrayJoin(h3CoverRing(arrayElement(geom.Polygon, 1), 0)) FROM berlin_districts WHERE name = :district)
          AND r.timestamp BETWEEN :period_short
        GROUP BY r.id
    ) AS ri;
  clickhouse_scan: |
    -- FIX: same Distributed-JOIN issue as countRideInDistrict above -- added GLOBAL (ride_points
    -- is already the FROM/left table here, so no swap needed, unlike countRideInDistrict).
    SELECT :district AS name, AVG(num_updates) AS avg_updates
    FROM (
        SELECT r.id, COUNT(*) AS num_updates
        FROM ride_points r
        GLOBAL JOIN berlin_districts d ON pointInPolygon((r.lon, r.lat), d.geom)
        WHERE d.name = :district
          AND r.timestamp BETWEEN :period_short
        GROUP BY r.id
    ) AS ri;
  duckdb: |
    -- (2026-10-08) ST_Intersects_Extent(geom, <area's bounding box>) in front of the exact predicate: the point
    -- tables are stored in Hilbert order with a bounding box per row group, and this cheap box test lets
    -- DuckDB skip the row groups outside the area. The exact predicate is unchanged and decides the result.
    -- The previous version is kept as duckdb_scan (not run).
    SELECT :district AS name, AVG(num_updates) AS avg_updates
    FROM (
      SELECT r.id, COUNT(*) AS num_updates
      FROM ride_points r
      JOIN berlin_districts d ON ST_Intersects(r.geom, d.geom)
      WHERE d.name = :district AND ST_Intersects_Extent(r.geom, (SELECT ST_MakeEnvelope(ST_XMin(geom) - 0, ST_YMin(geom) - 0, ST_XMax(geom) + 0, ST_YMax(geom) + 0) FROM berlin_districts WHERE name = :district))
        AND r.timestamp BETWEEN :period_short
      GROUP BY r.id
    ) AS ri;
  duckdb_scan: |
    SELECT :district AS name, AVG(num_updates) AS avg_updates
    FROM (
      SELECT r.id, COUNT(*) AS num_updates
      FROM ride_points r
      JOIN berlin_districts d ON ST_Intersects(r.geom, d.geom)
      WHERE d.name = :district
        AND r.timestamp BETWEEN :period_short
      GROUP BY r.id
    ) AS ri;

  repetition: 50
  parameters:
    - district
    - period_short

- name: RidesPastOrToUniversityInPeriod #spatiotemporal
  use: true
  description: "Find rides that pass by or go to a specified university within a certain distance and time period. Different to the RidesPastOrToUniversity query, this one also considers the time period and intermittent points instead of just the start and end points of the ride."
  type: spatiotemporal
  # FIX (2026-09-30): the great-circle-vs-planar mismatch previously noted here is fixed below
  # via polygonsDistanceCartesian + Web Mercator reprojection -- see the clickhouse block.
  # BEST-EFFORT FILL: was blank. Mirrors islandOrCoastLineCrossingsInPeriod's proven
  # edwithin(attime(trip, period), geom, distance) pattern from the crossings benchmark file.
  mobilitydb: |
    SELECT DISTINCT r.id
    FROM rides r
    JOIN universities u ON edwithin(attime(r.trip, :period_short), u.geom, :distance)
    WHERE u.name = :university AND r.trip && :period_short;
  postgis: |
    -- FIX: was "AND :period_short @> r.timestamp::timestamp" -- inconsistent with the BETWEEN-
    -- shaped :period_short substitution used everywhere else in this file (sedona below already
    -- uses BETWEEN for this same query); standardized to match.
    SELECT DISTINCT r.id
    from ride_points r
    JOIN universities u
      ON ST_DWithin(r.geom, u.geom, :distance)
    WHERE u.name = :university
      AND r.timestamp BETWEEN :period_short;
  sample_postgis: |
    SELECT DISTINCT r.id
    from ride_points r
    JOIN universities u
      ON ST_DWithin(r.geom, u.geom, 200)
    WHERE u.name = 'Humboldt-Universität-zu-Berlin'
      AND r.timestamp BETWEEN '2026-06-01 08:00:00' AND '2026-06-01 10:00:00';
  sedona: |
    SELECT DISTINCT r.id
    from ride_points r
    JOIN universities u
      ON ST_DWithin(r.geom, u.geom, :distance)
    WHERE u.name = :university
      AND r.timestamp BETWEEN :period_short;
  spacetime: |
    -- (2026-10-02) radius in EPSG:3857 units like every other dialect, converted to SpaceTime's
    -- local meters by :st_scale = cos(lat) * 0.99842 (see scripts/spacetime_units.py)
    SELECT DISTINCT r.trip_id AS id
    from ride_points r
    JOIN berlin_universities u
      ON ST_DWithin(ST_Point(x, y), ST_ToGeom(u.geom::gmpolygon), :distance * :st_scale)
    WHERE u.name = :university
      AND EPOCHRANGE :period_short @> r.t;
  clickhouse: |
    -- (2026-10-07) H3: the h3 GLOBAL IN (...) condition lets ClickHouse use the table's H3 primary
    -- key (h3, timestamp, id) and read only the cells that can contain a match -- a superset built
    -- by the h3Cover* functions (scripts/clickhouse_functions.sql). The exact predicate below is
    -- unchanged and decides the result. The scan-only version is kept as clickhouse_scan (not run).
    -- FIX (2026-09-30): the previous NOTE here said universities has no lon/lat and never can
    -- ("geom" is a real MultiPolygon campus footprint) and that a real fix needed either a
    -- verified ClickHouse point-to-polygon distance function or a schema change -- confirmed
    -- that polygonsDistanceCartesian(point, geom) works directly against the real geom column
    -- (a degenerate 1-vertex "ring" as the point operand, wrapped via array(array(tuple(...)))),
    -- no schema change needed.
    -- FIX (2026-09-30, metric parity): the point and polygon vertices must both be in the same
    -- metric as ST_DWithin/edwithin for the comparison to be meaningful. geom is stored raw in
    -- WGS84 degrees, so polygonsDistanceCartesian on it directly gives degree-space distance,
    -- not meters -- both operands are reprojected into Web Mercator (EPSG:3857) via the
    -- webMercatorX/webMercatorY UDFs (created ON CLUSTER cluster_1 -- see scripts/clickhouse_functions.sql)
    -- before the distance call, matching the metric PostGIS/Sedona's ST_DWithin uses under
    -- ST_Transform(...,3857). universities.geom is always MultiPolygon here (confirmed live,
    -- all 8 rows) -- unlike islands, no variantType dispatch is needed, so geom.MultiPolygon is
    -- extracted directly. Verified live against real data: Humboldt-Universität-zu-Berlin vs. a
    -- fixed test point returns 884,000.1604, matching postgis's ST_Distance(EPSG:3857) of
    -- 884,000.1597 to sub-millimeter precision.
    -- FIX: also added GLOBAL to the JOIN (same Distributed-JOIN issue as countRideInDistrict).
    SELECT DISTINCT r.id
    FROM ride_points r
    GLOBAL JOIN universities u ON u.name = :university
    WHERE r.h3 GLOBAL IN (SELECT arrayJoin(arrayFlatten(arrayMap(p -> h3CoverRing(arrayElement(p, 1), :distance), geom.MultiPolygon))) FROM universities WHERE name = :university)
      AND polygonsDistanceCartesian(
            array(array(tuple(r.x, r.y))),
            arrayMap(poly -> arrayMap(ring -> arrayMap(pt -> tuple(6378137. * radians(pt.1), 6378137. * log(tan(pi() / 4 + radians(pt.2) / 2))), ring), poly), u.geom.MultiPolygon)
          ) <= :distance
      AND r.timestamp BETWEEN :period_short;
  clickhouse_scan: |
    -- FIX (2026-09-30): the previous NOTE here said universities has no lon/lat and never can
    -- ("geom" is a real MultiPolygon campus footprint) and that a real fix needed either a
    -- verified ClickHouse point-to-polygon distance function or a schema change -- confirmed
    -- that polygonsDistanceCartesian(point, geom) works directly against the real geom column
    -- (a degenerate 1-vertex "ring" as the point operand, wrapped via array(array(tuple(...)))),
    -- no schema change needed.
    -- FIX (2026-09-30, metric parity): the point and polygon vertices must both be in the same
    -- metric as ST_DWithin/edwithin for the comparison to be meaningful. geom is stored raw in
    -- WGS84 degrees, so polygonsDistanceCartesian on it directly gives degree-space distance,
    -- not meters -- both operands are reprojected into Web Mercator (EPSG:3857) via the
    -- webMercatorX/webMercatorY UDFs (created ON CLUSTER cluster_1 -- see scripts/clickhouse_functions.sql)
    -- before the distance call, matching the metric PostGIS/Sedona's ST_DWithin uses under
    -- ST_Transform(...,3857). universities.geom is always MultiPolygon here (confirmed live,
    -- all 8 rows) -- unlike islands, no variantType dispatch is needed, so geom.MultiPolygon is
    -- extracted directly. Verified live against real data: Humboldt-Universität-zu-Berlin vs. a
    -- fixed test point returns 884,000.1604, matching postgis's ST_Distance(EPSG:3857) of
    -- 884,000.1597 to sub-millimeter precision.
    -- FIX: also added GLOBAL to the JOIN (same Distributed-JOIN issue as countRideInDistrict).
    SELECT DISTINCT r.id
    FROM ride_points r
    GLOBAL JOIN universities u ON u.name = :university
    WHERE polygonsDistanceCartesian(
            array(array(tuple(r.x, r.y))),
            arrayMap(poly -> arrayMap(ring -> arrayMap(pt -> tuple(6378137. * radians(pt.1), 6378137. * log(tan(pi() / 4 + radians(pt.2) / 2))), ring), poly), u.geom.MultiPolygon)
          ) <= :distance
      AND r.timestamp BETWEEN :period_short;
  duckdb: |
    -- (2026-10-08) ST_Intersects_Extent(geom, <area's bounding box>) in front of the exact predicate: the point
    -- tables are stored in Hilbert order with a bounding box per row group, and this cheap box test lets
    -- DuckDB skip the row groups outside the area. The exact predicate is unchanged and decides the result.
    -- The previous version is kept as duckdb_scan (not run).
    SELECT DISTINCT r.id
    from ride_points r
    JOIN universities u
      ON ST_DWithin(r.geom, u.geom, :distance)
    WHERE u.name = :university AND ST_Intersects_Extent(r.geom, (SELECT ST_MakeEnvelope(ST_XMin(geom) - :distance, ST_YMin(geom) - :distance, ST_XMax(geom) + :distance, ST_YMax(geom) + :distance) FROM universities WHERE name = :university))
      AND r.timestamp BETWEEN :period_short;
  duckdb_scan: |
    SELECT DISTINCT r.id
    from ride_points r
    JOIN universities u
      ON ST_DWithin(r.geom, u.geom, :distance)
    WHERE u.name = :university
      AND r.timestamp BETWEEN :period_short;


  repetition: 50
  parameters:
    - university
    - distance
    - period_short

# Trip Summary Table
- name: averageRideDurationToGoAtUniversityInPeriod #spatialtemporal
  use: false
  description: "Calculates the average duration of rides that go to a specified university within a certain distance (of the university) and time period (ride overlaps with the time period is enough as the criteria)"
  type: spatiotemporal
  # EQUIVALENCE NOTE: mobilitydb/postgis/sedona use the OVERLAPS predicate against the packed
  # :period_short parameter; clickhouse/duckdb have no OVERLAPS operator (duckdb's is
  # unconfirmed at best, see header note) -- both FIXED 2026-09-30 (decomposed
  # :period_short_start/:period_short_end, same as ais's countActiveCrossingsInPeriod) along
  # with a separate distance-metric fix and a missing GLOBAL on the clickhouse JOIN -- see the
  # clickhouse/duckdb blocks' own FIX comments below. This query is use: false (dormant); these
  # fixes make it correct if ever enabled, not enabled now.
  # FIX: original compared a period to a bare row constructor with the containment operator
  # ("@> (startTimestamp, endTimestamp)"), which isn't valid -- @> needs a range/timestamp on
  # the right, not an arbitrary two-tuple. The description also says overlap is the intended
  # criterion (not full containment), so switched to OVERLAPS to match sedona's existing
  # semantics for this query. NOTE: this still assumes :period_short can substitute into the
  # OVERLAPS right-hand side as "(start, end)" -- unverified, same open question noted on the
  # clickhouse block below.
  mobilitydb: |
    SELECT AVG(endTimestamp(r.trip) - startTimestamp(r.trip)) AS avg_duration FROM rides r JOIN universities u ON ST_DWithin(endValue(r.trip), u.geom::geometry, :distance) WHERE (startTimestamp(r.trip), endTimestamp(r.trip)) OVERLAPS :period_short AND u.name = :university;
  postgis: |
    -- FIX: same "@> (row)" type-mismatch as mobilitydb above; switched to OVERLAPS to match
    -- sedona's existing query for this same benchmark and the "overlap is enough" description.
    -- FIX (naming): was "ride_trajectories"/"r.destination_geom" -- the actual generic
    -- trip-summary table is "rides_summary" (see roles/duckdb+sedona/defaults/main.yml), whose
    -- end-of-trip geometry column is "end_location", not "destination_geom".
    SELECT
      AVG(r.end_time - r.start_time) AS avg_duration
    FROM rides_summary r
    JOIN universities u
      ON ST_DWithin(r.end_location, u.geom, :distance)
    WHERE
      (r.start_time, r.end_time) OVERLAPS :period_short
      AND u.name = :university;
  sedona: |
    -- FIX (naming): was a JOIN across "ride_trajectories_start"/"ride_trajectories_end" -- those
    -- split tables don't exist; the real export is a single "rides_summary" table (see
    -- sedona_export_reference_tables in roles/sedona/defaults/main.yml) with both start_time/
    -- end_time and start_location/end_location on one row, so no JOIN is needed at all.
    SELECT
      AVG(r.end_time - r.start_time) AS avg_duration
    FROM rides_summary r
    JOIN universities u
      ON ST_DWithin(r.end_location, u.geom, :distance)
    WHERE
      (r.start_time, r.end_time) OVERLAPS :period_short
      AND u.name = :university;
  spacetime: |
    SELECT AVG(@t) AS avg_duration
     FROM berlin_universities u
     JOIN rides r ON ST_DWithin(ST_Point(r.x1, r.y1), ST_ToGeom(u.geom::gmpolygon), :distance)
     WHERE r.t && EPOCHRANGE :period_short AND u.name = :university
  clickhouse: |
    -- FIX (2026-09-30): ClickHouse has no OVERLAPS operator -- generateParameterVariations.py
    -- now decomposes :period_short into :period_short_start/:period_short_end scalars (the
    -- harness change this NOTE used to say was needed), so this is rewritten as the standard
    -- interval-overlap boolean: [r.start_time, r.end_time] overlaps
    -- [period_short_start, period_short_end] iff r.start_time < period_short_end AND
    -- period_short_start < r.end_time. This query is use: false (dormant) but should now be
    -- correct if ever enabled.
    -- Distance part (u.lon/u.lat don't exist -- universities is (name, geom) in ClickHouse, geom
    -- being a real MultiPolygon campus footprint, not a point): fixed via
    -- polygonsDistanceCartesian(point, geom) directly against the real geom column, no schema
    -- change needed.
    -- FIX (2026-09-30, metric parity): both operands reprojected into Web Mercator (EPSG:3857)
    -- via the webMercatorX/webMercatorY UDFs before the distance call, matching ST_DWithin's
    -- metric -- see RidesPastOrToUniversityInPeriod's clickhouse block above for the formula and
    -- live verification (sub-millimeter match against postgis's ST_Distance(EPSG:3857)).
    -- FIX: also added GLOBAL to the JOIN -- without it, ClickHouse rejected the query outright
    -- with "Double-distributed IN/JOIN subqueries is denied" (confirmed live), the same
    -- Distributed-JOIN restriction already fixed on RidesPastOrToUniversityInPeriod's clickhouse
    -- block above; this one had just never been run far enough to hit it before today.
    SELECT AVG(r.end_time - r.start_time) AS avg_duration
    FROM rides_summary r
    GLOBAL JOIN universities u ON u.name = :university
    WHERE polygonsDistanceCartesian(
            array(array(tuple(webMercatorX(r.end_lon), webMercatorY(r.end_lat)))),
            arrayMap(poly -> arrayMap(ring -> arrayMap(pt -> tuple(6378137. * radians(pt.1), 6378137. * log(tan(pi() / 4 + radians(pt.2) / 2))), ring), poly), u.geom.MultiPolygon)
          ) <= :distance
      AND r.start_time < :period_short_end AND :period_short_start < r.end_time;
  duckdb: |
    -- FIX (2026-09-30): same OVERLAPS-support gap as clickhouse above (see header note) --
    -- generateParameterVariations.py now decomposes :period_short into
    -- :period_short_start/:period_short_end, so this no longer depends on DuckDB's unconfirmed
    -- OVERLAPS support at all, same rewrite as the clickhouse block above.
    -- FIX (naming): was "ride_trajectories"/"r.destination_geom" -- see postgis block above.
    SELECT
      AVG(r.end_time - r.start_time) AS avg_duration
    FROM rides_summary r
    JOIN universities u
      ON ST_DWithin(r.end_location, u.geom, :distance)
    WHERE
      r.start_time < :period_short_end AND :period_short_start < r.end_time
      AND u.name = :university;
  repetition: 50
  parameters:
  - period_short
  - university
  - distance

- name: averageRideDurationDuringDay #temporal
  use: false
  description: "Calculates the average duration of rides that occur (at least partially) during a specific day."
  type: temporal
  # EQUIVALENCE NOTE: mobilitydb/postgis/sedona/spacetime use OVERLAPS-shaped comparisons where
  # :day is substituted as an explicit literal scalar twice (not an opaque packed parameter), so
  # -- unlike averageRideDurationToGoAtUniversityInPeriod above -- this one CAN be rewritten
  # without a harness change. clickhouse was already fixed below to an explicit interval
  # comparison; duckdb is translated the same way rather than relying on unconfirmed OVERLAPS
  # support.
  # FIX: unqualified "trip" (should be r.trip, matching the WHERE clause's alias) and the
  # second DATE expression was missing the "::timestamp" cast the first one has.
  mobilitydb: |
    SELECT AVG(endTimestamp(r.trip)-startTimestamp(r.trip)) AS avg_duration FROM rides r WHERE r.trip && span(DATE :day::timestamp, DATE :day::timestamp + INTERVAL '1 day' - INTERVAL '1 second');
  postgis: |
    -- FIX (naming): was "ride_trajectories" -- see averageRideDurationToGoAtUniversityInPeriod
    -- above for the full rationale (real table is "rides_summary").
    SELECT
      AVG(r.end_time - r.start_time) AS avg_duration
    FROM rides_summary r
    WHERE (r.start_time, r.end_time)
          OVERLAPS (:day::timestamp, :day::timestamp + INTERVAL '1 day');
  sedona: |
    -- FIX (naming): was a JOIN across "ride_trajectories_start"/"ride_trajectories_end" -- see
    -- averageRideDurationToGoAtUniversityInPeriod above; single "rides_summary" table, no JOIN.
    SELECT AVG(r.end_time - r.start_time) AS avg_duration FROM rides_summary r WHERE (r.start_time, r.end_time) OVERLAPS (:day::timestamp, :day::timestamp + INTERVAL '1 day');
  spacetime: |
    SELECT AVG(@t) AS avg_duration FROM rides WHERE t && RANGE(EPOCH :day, (EPOCH :day) + tp '1d')
  clickhouse: |
    -- FIX: ClickHouse has no OVERLAPS operator, so the original would fail outright. Unlike the
    -- queries above, :day is used twice as an explicit scalar (not an opaque packed parameter),
    -- so this can be rewritten correctly without changing the parameter contract: interval
    -- [day, day+1) overlaps [start, end) iff start < day+1 AND end >= day.
    SELECT AVG(r.end_time - r.start_time) AS avg_duration
    FROM rides_summary r
    WHERE r.start_time < :day::timestamp + INTERVAL '1 day'
      AND r.end_time >= :day::timestamp;
  duckdb: |
    -- Same rewrite as clickhouse above, used instead of relying on unconfirmed OVERLAPS support
    -- (see header note): interval [day, day+1) overlaps [start, end) iff start < day+1 AND end >= day.
    -- FIX (naming): was "ride_trajectories" -- see averageRideDurationToGoAtUniversityInPeriod above.
    SELECT AVG(r.end_time - r.start_time) AS avg_duration
    FROM rides_summary r
    WHERE r.start_time < :day::timestamp + INTERVAL '1 day'
      AND r.end_time >= :day::timestamp;
  repetition: 50
  parameters:
  - day


# Write Operations


- name: insertSingleridePoint
  use: true
  description: "Insert a single ride point"
  type: insert
  # (2026-10-24) MobilityDB writes go to its trajectory table (scratch trajectories with negative ids), which its reads use;
  # the table is distributed by tile_key (a spatial tile of real trips): its shards hold the ranges 1-16: scratch trajectories get 1 + abs(id) % 16, spread over them
  mobilitydb: |
    INSERT INTO rides (id, tile_key, trip)
    VALUES (:id, (1 + abs(:id) % 16)::int, tgeompoint(:point, TIMESTAMP :instant AT TIME ZONE 'Europe/Berlin'));
  postgis: |
    -- FIX: didn't write "rider_id" -- see mobilitydb FIX note above.
    INSERT INTO ride_points (id, rider_id, geom, timestamp)
    VALUES (:id, :rider_id, :point, :instant);
  sedona: |
  spacetime: |

  # FIX: ride_points has no "geom" column in ClickHouse (it stores lat/lon directly, with
  # Point/h3 as MATERIALIZED derivatives, same shape as flight_points -- see
  # insertSingleflightPoint's FIX note in aviation/config/combinedBenchConf.yaml) -- this would
  # have errored outright on an unknown column. Rewritten with the same :point_lon/:point_lat
  # decomposition generateParameterVariations.py already builds for other ClickHouse queries.
  # FIX: also didn't write "rider_id" -- see mobilitydb FIX note above.
  clickhouse: |
    INSERT INTO ride_points (id, rider_id, timestamp, lat, lon)
    VALUES (:id, :rider_id, :instant, :point_lat, :point_lon);
  duckdb: |
    -- FIX: didn't write "rider_id" -- see mobilitydb FIX note above.
    INSERT INTO ride_points (id, rider_id, geom, timestamp)
    VALUES (:id, :rider_id, :point, :instant);

  repetition: 23
  parameters:
  - id
  - rider_id
  - point
  - instant

# NOTE: "id" is not unique in ride_points -- it's the ride's id, shared by every point of that
# ride, not a per-row key. updateridePoint/deleteridePoint (WHERE id = :id alone) were ambiguously
# named for an operation that (outside the benchmark's own scratch-id bookkeeping) touches every
# point of the ride, not "a ride point" as the name implied. Split into an explicit "Mass" variant
# (unchanged: every point sharing :id) and a "Single" variant that also pins :instant (the exact
# timestamp of one specific point) so it targets exactly one row -- same split as
# aviation/config/combinedBenchConf.yaml's flight_points queries.
- name: updateridePointMass
  use: true
  description: "Update location of every point belonging to a ride id"
  type: update
  # EQUIVALENCE NOTE: write immediacy differs by system -- see the same note on
  # updateCrossingPointMass in ais/config/combinedBenchConf.yaml (clickhouse's UPDATE is an async
  # mutation; duckdb's write goes through DuckLake's snapshot-commit-with-possible-retry path;
  # sedona doesn't support live updates).
  # FIX: was blank -- filled in analogous to postgis below.
  # (2026-10-24) MobilityDB writes go to its trajectory table (scratch trajectories with negative ids), which its reads use;
  # the table is distributed by tile_key (a spatial tile of real trips): its shards hold the ranges 1-16: scratch trajectories get 1 + abs(id) % 16, spread over them
  mobilitydb: |
    UPDATE rides
    SET trip = tgeompoint(:point, getTime(trip))
    WHERE id = :id;
  postgis: |
    UPDATE ride_points
    SET geom = :point
    WHERE id = :id;
  sedona: |
  spacetime: |
  # FIX: two more problems on top of "ClickHouse has no standalone UPDATE statement". (1) "geom"
  # isn't a ClickHouse column (see insertSingleridePoint's FIX note); (2) even against the real
  # lat/lon columns, ALTER TABLE ... UPDATE against ride_points (the Distributed table) fails
  # outright the same way flight_points' did -- lat/lon feed the MATERIALIZED h3 column, which is
  # part of the ORDER BY key, and ClickHouse forbids updating any column a key column derives
  # from, on top of Distributed tables not accepting mutations directly. Same re-INSERT
  # (self-referencing SELECT to keep each row's own rider_id/timestamp) + DELETE workaround as
  # updateflightPointMass, targeting the underlying _local table on every shard (ON CLUSTER).
  # ClickHouseExecutor.java splits on ";" and runs each statement in turn to support this.
  clickhouse: |
    INSERT INTO ride_points (id, rider_id, timestamp, lat, lon)
    SELECT id, rider_id, timestamp, :point_lat, :point_lon FROM ride_points WHERE id = toUInt64(:id);
    DELETE FROM ride_points_local ON CLUSTER cluster_1 WHERE id = toUInt64(:id) AND lat != :point_lat SETTINGS lightweight_delete_mode = 'lightweight_update';
  duckdb: |
    UPDATE ride_points
    SET geom = :point
    WHERE id = :id;
  repetition: 10
  parameters:
  - id
  - point

- name: updateridePointSingle
  use: true
  description: "Update location of exactly one ride point, identified by id and timestamp"
  type: update_single
  # Same EQUIVALENCE NOTE as updateridePointMass above.
  # (2026-10-24) MobilityDB writes go to its trajectory table (scratch trajectories with negative ids), which its reads use;
  # the table is distributed by tile_key (a spatial tile of real trips): its shards hold the ranges 1-16: scratch trajectories get 1 + abs(id) % 16, spread over them
  mobilitydb: |
    UPDATE rides
    SET trip = update(trip, tgeompoint(:point, TIMESTAMP :instant AT TIME ZONE 'Europe/Berlin'))
    WHERE id = :id AND (TIMESTAMP :instant AT TIME ZONE 'Europe/Berlin') <@ getTime(trip);
  postgis: |
    UPDATE ride_points
    SET geom = :point
    WHERE id = :id AND timestamp = :instant;
  sedona: |
  spacetime: |
  # Same re-INSERT + DELETE workaround as updateridePointMass (see its FIX note), scoped down to
  # the one point via "AND timestamp = :instant" on both statements.
  clickhouse: |
    INSERT INTO ride_points (id, rider_id, timestamp, lat, lon)
    SELECT id, rider_id, timestamp, :point_lat, :point_lon FROM ride_points WHERE id = toUInt64(:id) AND timestamp = :instant;
    DELETE FROM ride_points_local ON CLUSTER cluster_1 WHERE id = toUInt64(:id) AND timestamp = :instant AND lat != :point_lat SETTINGS lightweight_delete_mode = 'lightweight_update';
  duckdb: |
    UPDATE ride_points
    SET geom = :point
    WHERE id = :id AND timestamp = :instant;
  repetition: 10
  parameters:
  - id
  - point
  - instant

- name: deleteridePointMass
  use: false  # (2026-10-02) delete queries retired: benchmark writes are insert/update only, reset after each run
  description: "Delete every point belonging to a ride id"
  type: delete
  mobilitydb: |
    -- FIX: was blank -- filled in analogous to postgis below.
    DELETE FROM ride_points
    WHERE id = :id;
  postgis: |
    DELETE FROM ride_points
    WHERE id = :id;
  sedona: |
  spacetime: |
  # FIX: this "lightweight delete" syntax fails outright against ride_points -- confirmed live
  # for the equivalent flight_points query ("DELETE query is not supported for table
  # default.flight_points", a Distributed engine table; ride_points is built the same way -- see
  # insertSingleridePoint's FIX note). Mutations have to target the underlying _local table, on
  # every shard (ON CLUSTER), same as updateridePointMass.
  clickhouse: |
    ALTER TABLE ride_points_local ON CLUSTER cluster_1 DELETE WHERE id = toUInt64(:id);
  duckdb: |
    DELETE FROM ride_points
    WHERE id = :id;
  repetition: 5
  parameters:
  - id

- name: deleteridePointSingle
  use: false  # (2026-10-02) delete queries retired: benchmark writes are insert/update only, reset after each run
  description: "Delete exactly one ride point, identified by id and timestamp"

  sql: |
    SELECT COUNT(DISTINCT id) AS id_count
    FROM ride_points
    WHERE timestamp BETWEEN '2026-06-01 18:17:24' AND '2026-06-01 19:07:25'
      AND ST_Intersects(geom, ST_Transform(ST_SetSRID(ST_MakeEnvelope(8.46716535790451, 51.04118386106488, 8.867165319938902, 51.271183821576045), 4326), 3857));
  params:
  - '''2026-06-01 18:17:24'' AND ''2026-06-01 19:07:25'''
  - ST_Transform(ST_SetSRID(ST_MakeEnvelope(8.46716535790451, 51.04118386106488, 8.867165319938902,
    51.271183821576045), 4326), 3857)

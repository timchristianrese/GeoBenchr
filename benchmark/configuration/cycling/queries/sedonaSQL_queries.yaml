- name: AverageUpdatesPerRideInDistrictInPeriod
  type: spatiotemporal
  sql: |
    SELECT 'Pankow' AS name, AVG(num_updates) AS avg_updates
    FROM (
      SELECT r.id, COUNT(*) AS num_updates
      FROM ride_points r
      JOIN berlin_districts d ON ST_Intersects(r.geom, d.geom)
      WHERE d.name = 'Pankow'
        AND r.timestamp BETWEEN '2026-06-02 09:00:59' AND '2026-06-02 10:53:11'
      GROUP BY r.id

- name: AverageUpdatesPerRideInDistrictInPeriod
  type: spatiotemporal
  sql: |
    WITH ts_table AS (
      SELECT r.id, unnest(instants(atTime(r.trip, tstzspan '[2026-06-01 20:03:58, 2026-06-01 20:57:57]'))) AS inst
      FROM rides_adaptgrid r
      WHERE r.trip && tstzspan '[2026-06-01 20:03:58, 2026-06-01 20:57:57]'
    ),
    filtered AS (
      SELECT ts_table.id

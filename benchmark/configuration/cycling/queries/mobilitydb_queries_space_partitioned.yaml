- name: RidesAcrossMultipleHours
  type: temporal
  sql: |
    WITH ts_table AS (
      SELECT r.id, unnest(timestamps(atTime(r.trip, tstzspan '[2026-06-04 02:22:07, 2026-06-04 04:11:56]'))) AS ts
      FROM rides_adaptgrid r
      WHERE r.trip && tstzspan '[2026-06-04 02:22:07, 2026-06-04 04:11:56]'
    )
    SELECT id
    FROM ts_table
    GROUP BY id
    HAVING COUNT(DISTINCT EXTRACT(HOUR FROM ts)) > 1;
  params:
  - '''2026-06-04 02:22:07'' AND ''2026-06-04 04:11:56'''
- name: AverageUpdatesPerRideInDistrictInPeriod
  type: spatiotemporal
  sql: |
    WITH ts_table AS (
      SELECT r.id, unnest(instants(atTime(r.trip, tstzspan '[2026-06-03 23:58:57, 2026-06-04 01:42:18]'))) AS inst
      FROM rides_adaptgrid r
      WHERE r.trip && tstzspan '[2026-06-03 23:58:57, 2026-06-04 01:42:18]'
    ),
    filtered AS (
      SELECT ts_table.id
      FROM ts_table
      JOIN berlin_districts d ON d.name = 'Tempelhof-Schöneberg'
      WHERE ST_Intersects(getValue(inst)::geometry, d.geom)
    )
    SELECT 'Tempelhof-Schöneberg' AS name, AVG(num_updates) AS avg_updates
    FROM (
      SELECT id, COUNT(*) AS num_updates
      FROM filtered
      GROUP BY id
    ) AS ri;
  params:
  - Tempelhof-Schöneberg
  - '''2026-06-03 23:58:57'' AND ''2026-06-04 01:42:18'''

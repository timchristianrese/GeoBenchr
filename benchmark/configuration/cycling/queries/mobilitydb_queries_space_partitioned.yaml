- name: AverageUpdatesPerRideInDistrictInPeriod
  type: spatiotemporal
  sql: |
    WITH ts_table AS (
      SELECT r.id, unnest(instants(atTime(r.trip, tstzspan '[2026-06-03 16:01:37, 2026-06-03 17:59:12]'))) AS inst
      FROM rides_adaptgrid r
      WHERE r.trip && tstzspan '[2026-06-03 16:01:37, 2026-06-03 17:59:12]'
    ),
    filtered AS (
      SELECT ts_table.id
      FROM ts_table
      JOIN berlin_districts d ON d.name = 'Pankow'
      WHERE ST_Intersects(getValue(inst)::geometry, d.geom)
    )
    SELECT 'Pankow' AS name, AVG(num_updates) AS avg_updates
    FROM (
      SELECT id, COUNT(*) AS num_updates
      FROM filtered
      GROUP BY id
    ) AS ri;

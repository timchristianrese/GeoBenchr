- name: AverageUpdatesPerRideInDistrictInPeriod
  type: spatiotemporal
  sql: |
    WITH ts_table AS (
      SELECT r.id, unnest(instants(atTime(r.trip, tstzspan '[2026-06-01 23:33:26, 2026-06-02 00:05:10]'))) AS inst
      FROM rides_adaptgrid r
      WHERE r.trip && tstzspan '[2026-06-01 23:33:26, 2026-06-02 00:05:10]'
    ),
    filtered AS (
      SELECT ts_table.id
      FROM ts_table
      JOIN berlin_districts d ON d.name = 'Mitte'
      WHERE ST_Intersects(getValue(inst)::geometry, d.geom)
    )
    SELECT 'Mitte' AS name, AVG(num_updates) AS avg_updates

- name: RidesAcrossMultipleHours
  type: temporal
  sql: |
    WITH ts_table AS (
      SELECT r.id, unnest(timestamps(atTime(r.trip, tstzspan '[2026-06-02 06:38:59, 2026-06-02 08:38:47]'))) AS ts
      FROM rides_adaptgrid r
      WHERE r.trip && tstzspan '[2026-06-02 06:38:59, 2026-06-02 08:38:47]'
    )
    SELECT id
    FROM ts_table
    GROUP BY id
    HAVING COUNT(DISTINCT EXTRACT(HOUR FROM ts)) > 1;
  params:

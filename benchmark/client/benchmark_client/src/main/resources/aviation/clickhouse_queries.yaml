- name: CityActivityAtInstant
  type: spatiotemporal
  sql: |
    WITH filtered_flights AS (
      SELECT f.id, f.x, f.y
      FROM flight_points f
      WHERE f.h3 GLOBAL IN (SELECT arrayJoin(h3CoverPoint(lon, lat, 3976)) FROM cities WHERE name = 'Borgholzhausen')
        AND f.timestamp BETWEEN toDateTime('2024-01-30 07:13:06', 'UTC') - INTERVAL 10 SECOND AND toDateTime('2024-01-30 07:13:06', 'UTC') + INTERVAL 10 SECOND)
    SELECT COUNT(DISTINCT ff.id) AS flight_count
    FROM filtered_flights ff
    JOIN cities c ON sqrt(pow(ff.x - c.x, 2) + pow(ff.y - c.y, 2)) <= 3976
    WHERE c.name = 'Borgholzhausen';
  params:
  - Borgholzhausen
  - '2024-01-30 07:13:06'
  - 3976

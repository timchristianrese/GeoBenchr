- name: countFlightsInCounties
  type: spatial
  sql: |
    SELECT k.name, COUNT(DISTINCT f.id) as flight_count
    FROM flight_points f
    GLOBAL JOIN counties k ON pointInPolygon((f.lon, f.lat), k.geom)
    WHERE k.name = 'Krs Moenchengladbach'
      AND f.h3 GLOBAL IN (SELECT arrayJoin(h3CoverRing(arrayElement(geom.Polygon, 1), 0)) FROM counties WHERE name = 'Krs Moenchengladbach')
    GROUP BY k.name;
  params:
  - Krs Moenchengladbach

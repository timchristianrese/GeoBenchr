- name: CrossingsActiveAtGivenHourOfDay
  type: temporal
  sql: |
    SELECT COUNT(*) FROM (
      SELECT GREATEST(s.start_time, TIMESTAMP '2024-01-29 09:16:05') AS lo,
             LEAST(s.end_time, TIMESTAMP '2024-02-06 21:32:37') AS hi
      FROM crossings_summary s
      WHERE s.id > 0 AND s.id < 1000000000000
        AND s.start_time <= TIMESTAMP '2024-02-06 21:32:37' AND s.end_time >= TIMESTAMP '2024-01-29 09:16:05'
    ) w
    WHERE hi - lo >= INTERVAL '24 hours'
       OR (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (20 + 1) AND hi - date_trunc('day', hi) >= INTERVAL '1 hour' * 20)
       OR (date_trunc('day', lo) <> date_trunc('day', hi)
           AND (lo - date_trunc('day', lo) < INTERVAL '1 hour' * (20 + 1) OR hi - date_trunc('day', hi) >= INTERVAL '1 hour' * 20));
  params:
  - 20
  - - '2024-01-29 09:16:05'
    - '2024-02-06 21:32:37'

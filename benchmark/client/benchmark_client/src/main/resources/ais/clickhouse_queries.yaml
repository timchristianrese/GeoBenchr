- name: CrossingsActiveAtGivenHourOfDay
  type: temporal
  sql: |
    SELECT count() FROM (
      SELECT greatest(s.start_time, toDateTime('2025-05-31 18:16:39', 'UTC')) AS lo,
             least(s.end_time, toDateTime('2025-06-08 11:31:18', 'UTC')) AS hi
      FROM crossings_summary s
      WHERE s.id > 0 AND s.id < 1000000000000
        AND s.start_time <= toDateTime('2025-06-08 11:31:18', 'UTC') AND s.end_time >= toDateTime('2025-05-31 18:16:39', 'UTC')
    ) w
    WHERE dateDiff('second', lo, hi) >= 86400
       OR (dateDiff('second', toStartOfDay(lo), lo) < 3600 * (16 + 1) AND dateDiff('second', toStartOfDay(hi), hi) >= 3600 * 16)
       OR (toStartOfDay(lo) != toStartOfDay(hi)
           AND (dateDiff('second', toStartOfDay(lo), lo) < 3600 * (16 + 1) OR dateDiff('second', toStartOfDay(hi), hi) >= 3600 * 16));
  params:
  - 16
  - - '2025-05-31 18:16:39'
    - '2025-06-08 11:31:18'

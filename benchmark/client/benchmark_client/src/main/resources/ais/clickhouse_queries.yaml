- name: CrossingsActiveAtGivenHourOfDay
  type: temporal
  sql: |
    SELECT count() FROM (
      SELECT greatest(s.start_time, toDateTime('2024-10-07 12:45:48', 'UTC')) AS lo,
             least(s.end_time, toDateTime('2024-10-22 09:24:00', 'UTC')) AS hi
      FROM crossings_summary s
      WHERE s.id > 0 AND s.id < 1000000000000
        AND s.start_time <= toDateTime('2024-10-22 09:24:00', 'UTC') AND s.end_time >= toDateTime('2024-10-07 12:45:48', 'UTC')
    ) w
    WHERE dateDiff('second', lo, hi) >= 86400
       OR (dateDiff('second', toStartOfDay(lo), lo) < 3600 * (11 + 1) AND dateDiff('second', toStartOfDay(hi), hi) >= 3600 * 11)
       OR (toStartOfDay(lo) != toStartOfDay(hi)
           AND (dateDiff('second', toStartOfDay(lo), lo) < 3600 * (11 + 1) OR dateDiff('second', toStartOfDay(hi), hi) >= 3600 * 11));
  params:
  - 11
  - - '2024-10-07 12:45:48'
    - '2024-10-22 09:24:00'

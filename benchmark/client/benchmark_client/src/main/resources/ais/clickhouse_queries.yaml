- name: HarbourActivityInPeriod
  type: spatiotemporal
  sql: |
    SELECT h.name AS harbour_name, COUNT(DISTINCT c.id) AS unique_crossings_near_harbour
    FROM crossing_points c
    GLOBAL JOIN harbours h ON h.name = 'Jøssingfjord'
    WHERE c.h3 GLOBAL IN (SELECT arrayJoin(h3CoverPoint(lon, lat, 1804)) FROM harbours WHERE name = 'Jøssingfjord')
      AND sqrt(pow(c.x - h.x, 2) + pow(c.y - h.y, 2)) <= 1804
      AND c.timestamp BETWEEN '2024-03-19 01:05:29' AND '2024-03-30 16:50:43'
      AND c.id > 0 AND c.id < 1000000000000
    GROUP BY h.name;
  params:
  - - '2024-03-19 01:05:29'
    - '2024-03-30 16:50:43'
  - 1804
  - Jøssingfjord

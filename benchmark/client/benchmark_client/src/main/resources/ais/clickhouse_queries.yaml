                        range(toUInt32(dateDiff('day', toStartOfDay(toDateTime('2024-04-05 21:00:21', 'UTC')), toDateTime('2024-04-17 23:20:11', 'UTC')) + 1))) AS day
    WHERE s.id > 0 AND s.id < 1000000000000
      AND s.start_time <= toDateTime('2024-04-17 23:20:11', 'UTC') AND s.end_time >= toDateTime('2024-04-05 21:00:21', 'UTC')
      AND s.start_time < day + toIntervalDay(1) AND s.end_time >= day
    GROUP BY day
    ORDER BY unique_crossings DESC
    LIMIT 1;

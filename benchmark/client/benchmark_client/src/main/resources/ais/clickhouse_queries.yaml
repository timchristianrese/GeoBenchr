- name: CrossingsActiveAtGivenHourOfDay
  type: temporal
  sql: |
    SELECT count() FROM (
      SELECT greatest(s.start_time, toDateTime('2024-04-01 16:31:23', 'UTC')) AS lo,
             least(s.end_time, toDateTime('2024-04-13 02:37:37', 'UTC')) AS hi
      FROM crossings_summary s
      WHERE s.id > 0 AND s.id < 1000000000000
        AND s.start_time <= toDateTime('2024-04-13 02:37:37', 'UTC') AND s.end_time >= toDateTime('2024-04-01 16:31:23', 'UTC')
    ) w
    WHERE dateDiff('second', lo, hi) >= 86400
       OR (dateDiff('second', toStartOfDay(lo), lo) < 3600 * (20 + 1) AND dateDiff('second', toStartOfDay(hi), hi) >= 3600 * 20)
       OR (toStartOfDay(lo) != toStartOfDay(hi)
           AND (dateDiff('second', toStartOfDay(lo), lo) < 3600 * (20 + 1) OR dateDiff('second', toStartOfDay(hi), hi) >= 3600 * 20));
  params:
  - 20
  - - '2024-04-01 16:31:23'
    - '2024-04-13 02:37:37'
